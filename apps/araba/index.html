<!DOCTYPE html>
<html lang="tr" data-keep-dark>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Asfalt</title>
<meta name="theme-color" content="#0b0d14">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#F5F3EE;--ink2:#C9C7C2;--ink3:#A3A19C;--glass:rgba(14,16,24,.62);--line:rgba(255,255,255,.1);--acc:#FFB347;--good:#5BD39B;--bad:#FF5D5D;--font:'Geist',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0b0d14;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .gl{background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 0 0 1px var(--line),0 12px 40px -16px rgba(0,0,0,.6)}
  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
  body.play #hud{opacity:1}
  .hud-m{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;display:flex;align-items:center;gap:8px;pointer-events:auto}
  .money{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:12px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
  .money i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe08a,#e0a21c);box-shadow:inset 0 0 0 1.5px #b07a10}
  .ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:700}
  .ib:hover{background:rgba(255,255,255,.14)}
  .spd{position:absolute;right:22px;bottom:calc(20px + env(safe-area-inset-bottom));text-align:right;line-height:1}
  .spd b{display:block;font-size:64px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;text-shadow:0 2px 20px rgba(0,0,0,.5)}
  .spd small{font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.08em}
  .gear{display:inline-grid;place-items:center;width:26px;height:26px;margin-left:8px;border-radius:7px;background:rgba(255,255,255,.12);font-size:13px;font-weight:700;color:var(--ink)}
  #mm{position:absolute;left:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%}
  .chase{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;display:none}
  body.m-chase .chase{display:block}
  .chase .t{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 2px 16px rgba(0,0,0,.6)}
  .chase .h{width:180px;height:6px;margin:6px auto 0;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
  .chase .h i{display:block;height:100%;width:100%;background:var(--good);transition:width .25s,background .3s}
  .chase .n{margin-top:6px;font-size:13px;font-weight:600;color:var(--ink2)}
  #toasts{position:absolute;top:30%;left:50%;transform:translateX(-50%);display:grid;justify-items:center;gap:6px}
  .toast{padding:8px 14px;border-radius:999px;font-size:15px;font-weight:700;white-space:nowrap}
  .flash{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,40,40,.45));opacity:0;transition:opacity .25s}
  /* dokunmatik */
  #touch{position:fixed;inset:auto 0 0 0;height:190px;display:none;pointer-events:none}
  body.touch.play #touch{display:block}
  .tb{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;pointer-events:auto;touch-action:none}
  .tb.on{background:rgba(255,255,255,.3)}
  #tL{left:18px}#tR{left:106px}#tG{right:18px;width:86px;height:86px;bottom:calc(60px + env(safe-area-inset-bottom))}#tB{right:112px}#tH{right:112px;bottom:calc(108px + env(safe-area-inset-bottom));width:60px;height:60px;font-size:13px}
  body.touch #mm{left:auto;right:12px;bottom:auto;top:calc(64px + env(safe-area-inset-top));width:104px;height:104px}
  body.touch .spd{right:auto;left:16px;bottom:auto;top:calc(14px + env(safe-area-inset-top));text-align:left}
  body.touch .spd b{font-size:40px}
  /* menüler */
  .ov{position:fixed;inset:0;display:flex;align-items:center;padding:40px clamp(20px,6vw,80px);background:linear-gradient(90deg,rgba(6,8,14,.78),rgba(6,8,14,.25) 55%,transparent);opacity:1;transition:opacity .35s}
  .ov[hidden]{display:none}
  .panel{width:min(440px,100%);display:grid;gap:14px}
  .brand{font-size:clamp(54px,8vw,92px);font-weight:800;letter-spacing:-.05em;line-height:.9}
  .brand em{font-style:normal;color:var(--acc)}
  .tag{font-size:17px;color:var(--ink2);margin-bottom:12px}
  .btn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:0 20px;border-radius:16px;font-size:18px;font-weight:700;text-align:left;transition:background .2s,transform .2s}
  .btn small{font-size:13px;font-weight:600;color:var(--ink2)}
  .btn:hover{background:rgba(255,255,255,.16)}
  .btn.pri{background:var(--acc);color:#1a1004}.btn.pri small{color:rgba(26,16,4,.7)}.btn.pri:hover{background:#ffc46e}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .row>span{font-size:13px;font-weight:600;color:var(--ink3);width:64px}
  .seg{display:inline-flex;padding:3px;border-radius:12px;background:rgba(255,255,255,.08)}
  .seg button{min-height:36px;padding:0 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2)}
  .seg button[aria-pressed=true]{background:rgba(255,255,255,.9);color:#111}
  .help{font-size:13px;color:var(--ink3);line-height:1.6;margin-top:8px}
  .help kbd{font:600 12px/1 var(--font);padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.12);color:var(--ink)}
  /* garaj */
  #garage{justify-content:flex-end;background:linear-gradient(270deg,rgba(6,8,14,.82),rgba(6,8,14,.2) 55%,transparent)}
  .gar{width:min(420px,100%);max-height:calc(100vh - 80px);display:flex;flex-direction:column;gap:12px}
  .gar h2{font-size:34px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;justify-content:space-between}
  .gl-list{overflow:auto;display:grid;gap:8px;padding-right:4px;scrollbar-width:thin}
  .car{display:grid;gap:8px;padding:14px 16px;border-radius:16px;text-align:left;transition:background .2s}
  .car:hover{background:rgba(255,255,255,.14)}.car.sel{box-shadow:0 0 0 2px var(--acc),0 12px 40px -16px rgba(0,0,0,.6)}
  .car header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.car b{font-size:18px}.car header span{font-size:13px;font-weight:600;color:var(--ink2)}
  .stats{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--ink2)}
  .stats i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}.stats i::after{content:'';display:block;height:100%;width:var(--v);background:var(--ink)}
  .sw{display:flex;gap:8px}
  .sw button{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}.sw button[aria-pressed=true]{box-shadow:0 0 0 2px #fff,inset 0 0 0 2px rgba(0,0,0,.3)}
  .gact{display:flex;gap:8px}.gact .btn{flex:1;justify-content:center;min-height:52px;font-size:16px}
  .lock{color:var(--bad)}
  /* bitiş */
  #over{justify-content:center;background:rgba(6,8,14,.55)}
  #over .panel{text-align:center;justify-items:center}
  #over h2{font-size:clamp(44px,7vw,72px);font-weight:800;letter-spacing:-.04em}
  .res{display:flex;gap:28px;justify-content:center;margin:6px 0 14px}.res div{display:grid;gap:2px}.res b{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}.res span{font-size:13px;color:var(--ink3);font-weight:600}
  #over .btn{min-width:240px;justify-content:center}
  #load{position:fixed;inset:0;display:grid;place-items:center;background:#0b0d14;font-size:15px;color:var(--ink2);transition:opacity .5s}
  @media (max-width:700px){.ov{align-items:flex-end;padding:24px 18px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(6,8,14,.9),rgba(6,8,14,.35) 60%,transparent)}
    .brand{font-size:56px}.btn{min-height:54px}.help{display:none}#garage{align-items:flex-end}.gar{max-height:72vh}.gar h2{font-size:26px}
    .chase .t{font-size:26px}.chase .h{width:130px}.seg button{min-height:40px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="c" aria-label="Oyun alanı"></canvas>
<div id="hud" aria-live="polite">

  <div class="chase"><div class="t" id="cT">00:00</div><div class="h" aria-label="Araç sağlığı"><i id="cH"></i></div><div class="n" id="cN"></div></div>

</div>

<div class="ov" id="menu"><div class="panel">
  <h1 class="brand">Asfalt<em>.</em></h1><p class="tag">Şehirde sür, peşindekilerden kaç, garajını doldur.</p>
  <button class="btn pri" data-go="drive">Sür<small>serbest sürüş</small></button>
  <button class="btn gl" data-go="chase">Kaçış<small id="bestTxt">bütün şehir peşinde</small></button>
  <button class="btn gl" data-go="garage">Garaj<small id="garTxt"></small></button>
  <div class="row"><span>Saat</span><div class="seg" role="group" aria-label="Günün saati"><button data-tod="dusk">Gün batımı</button><button data-tod="day">Gündüz</button><button data-tod="night">Gece</button></div></div>
  <div class="row"><span>Grafik</span><div class="seg" role="group" aria-label="Grafik kalitesi"><button data-q="low">Hafif</button><button data-q="high">Güzel</button></div>
    <div class="seg" role="group" aria-label="Ses"><button data-snd="1">Ses açık</button><button data-snd="0">Sessiz</button></div></div>
  <p class="help"><kbd>W A S D</kbd> / oklar sür · <kbd>Boşluk</kbd> el freni (drift) · <kbd>C</kbd> kamera · <kbd>R</kbd> yola dön · <kbd>Esc</kbd> duraklat</p>
</div></div>
<div class="ov" id="pause" hidden><div class="panel"><h2 class="brand" style="font-size:56px">Duraklatıldı</h2>
  <button class="btn pri" data-go="resume">Devam</button><button class="btn gl" data-go="garage">Garaj</button><button class="btn gl" data-go="menu">Ana menü</button></div></div>
<div class="ov" id="garage" hidden><div class="gar">
  <h2>Garaj <span class="money gl"><i aria-hidden="true"></i><span id="gMoney">0</span></span></h2>
  <div class="gl-list" id="gList"></div>
  <div class="gact"><button class="btn gl" data-go="back">Geri</button><button class="btn pri" data-go="garDrive">Bununla sür</button></div>
</div></div>
<div class="ov" id="over" hidden><div class="panel"><h2>Yakalandın</h2>
  <div class="res"><div><b id="oT">0:00</b><span>Süre</span></div><div><b id="oW">0</b><span>Kaza ettirdin</span></div><div><b id="oM">+0</b><span>Kazanç</span></div></div>
  <p class="tag" id="oBest"></p>
  <button class="btn pri" data-go="chase">Tekrar</button><button class="btn gl" data-go="menu">Ana menü</button></div></div>
<div id="load">Şehir kuruluyor…</div>

<script type="module">
import * as THREE from './vendor/three.module.min.js';
import RAPIER from './vendor/rapier.mjs';
/* ════════════════════════════════════════════════════════════════════════
   ASFALT — üçüncü şahıs şehir sürüşü (Three.js, tek dosya)
   Örnek alınanlar: Slow Roads (sade arayüz, atmosfer), Art of Rally (az poligon + güzel ışık/sis),
   Smashy Road (herkes peşinde kaçış + parayla araba), GTA (canlı şehir trafiği), Forza Horizon (keyifli, kaydırılabilir sürüş).
   Kayıt: localStorage asfalt:v1 {money, owned[], sel, col{}, best, tod, q, snd, cam}
   Şehir: tohumlu rastgele (hep aynı şehir) · binalar tek birleşik geometri (1 çizim) · ağaç/lamba/para örnekli (instanced)
   Trafik: kavşak ağı üzerinde Bezier şeritler (sağdan akış) · Kaçış: trafik sırayla “avcı”ya döner, fizikle seni kovalar
   ════════════════════════════════════════════════════════════════════════ */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const lsg=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},lss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const TOUCH=matchMedia('(pointer:coarse)').matches;
const SV=Object.assign({money:0,owned:['serce'],sel:'serce',col:{},best:0,tod:'dusk',q:TOUCH||innerWidth<800?'low':'high',snd:1,cam:0},lsg('asfalt:v1',{}));
const save=()=>lss('asfalt:v1',SV);
const HI=SV.q==='high';
if(TOUCH)document.body.classList.add('touch');
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,wrapA=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a};
let seed=20261128;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const R=(a,b)=>a+rnd()*(b-a),pick=a=>a[Math.floor(rnd()*a.length)];

/* ── araçlar ── */
const CARS=[
  {k:'serce',n:'Serçe',d:'Küçük, çevik şehir arabası',price:0,len:3.9,w:1.75,h:1.5,max:155,acc:8,grip:7.5,mass:1,shape:'hatch',cols:[0x4fa3ff,0xf2efe8,0xe8604c,0x2f3640]},
  {k:'kartal',n:'Kartal',d:'Rahat sedan, dengeli',price:1500,len:4.6,w:1.8,h:1.45,max:180,acc:9.5,grip:8,mass:1.15,shape:'sedan',cols:[0xe8e4da,0x1f4e79,0x2b2f36,0x8a1c1c]},
  {k:'bozkir',n:'Bozkır',d:'Ağır kamyonet, çarpışmada sağlam',price:2800,len:5.2,w:1.95,h:1.75,max:165,acc:8.5,grip:7,mass:1.7,shape:'pickup',cols:[0xc9583a,0x3c5a40,0xd8d2c4,0x223344]},
  {k:'dagci',n:'Dağcı',d:'Yüksek SUV, yol tutuşu iyi',price:4200,len:4.7,w:1.95,h:1.75,max:185,acc:10.5,grip:8.8,mass:1.55,shape:'suv',cols:[0x3c5a40,0x101215,0xb9b4a8,0x6b3fa0]},
  {k:'toros',n:'Toros GT',d:'Kaba güç, kaymayı sever',price:6500,len:4.8,w:1.9,h:1.35,max:215,acc:13,grip:7.2,mass:1.35,shape:'muscle',cols:[0xd9a520,0x111111,0xc0392b,0x2e86de]},
  {k:'simsek',n:'Şimşek',d:'Spor araba, keskin virajlar',price:11000,len:4.4,w:1.9,h:1.2,max:250,acc:16,grip:10,mass:1.1,shape:'sport',cols:[0xe63946,0xf4f1ea,0x00b4d8,0x1b1b1f]},
  {k:'yildiz',n:'Kuyruklu Yıldız',d:'Süper araba — şehrin en hızlısı',price:24000,len:4.6,w:2,h:1.1,max:295,acc:20,grip:11,mass:1.05,shape:'super',cols:[0x9b5de5,0xffd166,0x06d6a0,0xf8f9fa]}];
const carSpec=k=>CARS.find(c=>c.k===k)||CARS[0];
const TRAF_COLS=[0xe8e4da,0x2b2f36,0x8a1c1c,0x1f4e79,0xc8c8c8,0x3c5a40,0xd9a520,0x5a5f6a,0x6b3fa0,0xc96b2c,0xf2efe8,0x2f3640];

/* ── sahne ── */
const cv=$('#c');
const rr=new THREE.WebGLRenderer({canvas:cv,antialias:HI,powerPreference:'high-performance'});
rr.setPixelRatio(Math.min(devicePixelRatio,HI?1.75:1));rr.toneMapping=THREE.ACESFilmicToneMapping;rr.outputColorSpace=THREE.SRGBColorSpace;
rr.shadowMap.enabled=HI;rr.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x000000,60,500);
const cam=new THREE.PerspectiveCamera(62,1,0.3,2600);
const hemi=new THREE.HemisphereLight(0xffffff,0x333333,1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2);sun.castShadow=HI;
if(HI){sun.shadow.mapSize.set(2048,2048);const sc=sun.shadow.camera;sc.left=-75;sc.right=75;sc.top=75;sc.bottom=-75;sc.near=1;sc.far=420;sun.shadow.bias=-0.0005;sun.shadow.normalBias=0.5}
scene.add(sun,sun.target);
const head=new THREE.SpotLight(0xfff1d6,0,90,0.55,0.55,1.1);scene.add(head,head.target);
const skyU={top:{value:new THREE.Color()},hor:{value:new THREE.Color()},sunC:{value:new THREE.Color()},sunD:{value:new THREE.Vector3(0,1,0)}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(2000,32,16),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top,hor,sunC,sunD;varying vec3 vD;void main(){vec3 d=normalize(vD);float h=max(d.y,0.);vec3 c=mix(hor,top,pow(h,.5));float s=max(dot(d,normalize(sunD)),0.);c+=sunC*(pow(s,900.)*3.+pow(s,10.)*.32);if(d.y<0.)c=hor;gl_FragColor=vec4(c,1.);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n}'}));
sky.renderOrder=-1;scene.add(sky);
/* araç boyası/camı için ortam yansıması: gökyüzünden (günün saatine göre yeniden) */
const pmrem=new THREE.PMREMGenerator(rr),envScene=new THREE.Scene(),envGround=new THREE.Mesh(new THREE.CircleGeometry(30,24),new THREE.MeshBasicMaterial({color:0x202226}));
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10,32,16),sky.material));envGround.rotation.x=-Math.PI/2;envGround.position.y=-1.2;envScene.add(envGround);
let ENV=null;
function makeEnv(){const old=ENV;ENV=pmrem.fromScene(envScene,.02).texture;for(const m of CARMATS){m.envMap=ENV;m.needsUpdate=true}if(old)old.dispose()}

/* ── şehir ölçüleri: N×N blok, yollar ızgara çizgilerinde ── */
const N=9,CELL=76,ROAD=14,LANE=3.4,SWK=3,HALF=N*CELL/2,EDGE=HALF+ROAD/2;
const rc=i=>-HALF+i*CELL; /* i. yolun merkezi */
const COL=[],HASH=new Map(),HC=16;
function addCol(c){const x0=c.r?c.x-c.r:c.x0,x1=c.r?c.x+c.r:c.x1,z0=c.r?c.z-c.r:c.z0,z1=c.r?c.z+c.r:c.z1;COL.push(c);
  for(let i=Math.floor(x0/HC);i<=Math.floor(x1/HC);i++)for(let j=Math.floor(z0/HC);j<=Math.floor(z1/HC);j++){const k=i+','+j;(HASH.get(k)||HASH.set(k,[]).get(k)).push(c)}}
function near(x,z,r,cb){const seen=new Set();for(let i=Math.floor((x-r)/HC);i<=Math.floor((x+r)/HC);i++)for(let j=Math.floor((z-r)/HC);j<=Math.floor((z+r)/HC);j++){const L=HASH.get(i+','+j);if(L)for(const c of L)if(!seen.has(c)){seen.add(c);cb(c)}}}
function solidAt(x,z){let s=false;near(x,z,0.1,c=>{if(c.r?((x-c.x)**2+(z-c.z)**2<c.r*c.r):(x>c.x0&&x<c.x1&&z>c.z0&&z<c.z1))s=true});return s}

function turnHunter(fresh){let c=null;
  if(!fresh){let bd=1e9;for(const o of cars){if(o.kind!=='traffic'||o.lost>0)continue;const d=Math.hypot(o.x-P.x,o.z-P.z);if(d>55&&d<bd){bd=d;c=o}}}
  if(!c){const sp=pick(CARS.slice(1,5));c=new Car(sp,0x15171c,'traffic');c.cruise=12;cars.push(c);for(let t=0;t<6;t++)if(placeTraffic(c,110))break}
  const nH=cars.filter(o=>o.kind==='hunter').length;c.kind='hunter';c.role=nH%3===2?'cut':'chase';c.m.bar.visible=true;
  c.maxF=clamp(P.s.max/c.s.max*.9,.8,1.4);c.s={...c.s,acc:Math.max(c.s.acc,P.s.acc*.85),grip:Math.max(c.s.grip,8.5)};c.tune();c.stuck=0;c.rev=0;c.thk=0;c.route=null;c.hp=100;c.in={thr:0,steer:0,hb:false}}
const nodeOf=(x,z)=>({i:clamp(Math.round((x+HALF)/CELL),0,N),j:clamp(Math.round((z+HALF)/CELL),0,N)});
function bfs(a,b){const K=N+1,A=a.i*K+a.j,Bn=b.i*K+b.j,prev=new Int16Array(K*K).fill(-1),q=[A];prev[A]=A;
  for(let h=0;h<q.length;h++){const u=q[h];if(u===Bn)break;const i=(u/K)|0,j=u%K;for(const[di,dj]of NB){const ni=i+di,nj=j+dj;if(!inGrid(ni,nj))continue;const w=ni*K+nj;if(prev[w]<0){prev[w]=u;q.push(w)}}}
  const out=[];let u=Bn;if(prev[u]<0)return out;while(u!==A){out.push({i:(u/K)|0,j:u%K});u=prev[u]}return out.reverse()}
function aheadNode(k){const n=nodeOf(P.x,P.z);
  if(Math.abs(P.fx)>Math.abs(P.fz)){const s=Math.sign(P.fx)||1;const i=(s>0?Math.ceil((P.x+HALF)/CELL):Math.floor((P.x+HALF)/CELL))+s*(k-1);return{i:clamp(i,0,N),j:n.j}}
  const s=Math.sign(P.fz)||1;const j=(s>0?Math.ceil((P.z+HALF)/CELL):Math.floor((P.z+HALF)/CELL))+s*(k-1);return{i:n.i,j:clamp(j,0,N)}}
function los(x0,z0,x1,z1){const d=Math.hypot(x1-x0,z1-z0),n=Math.ceil(d/5);for(let k=1;k<n;k++){const t=k/n;if(solidAt(lerp(x0,x1,t),lerp(z0,z1,t)))return false}return true}
function hunterAI(c,dt){
  if(c.up<.35){c.flip=(c.flip||0)+dt;c.in={thr:0,steer:0,hb:true};if(c.flip>1.3)wreck(c,'Devirdin');return}c.flip=0;
  const dx=P.x-c.x,dz=P.z-c.z,dist=Math.hypot(dx,dz),v=Math.abs(c.spd);
  c.thk-=dt;if(c.thk<=0){c.thk=.35+rnd()*.25;c.see=dist<30||(dist<160&&los(c.x,c.z,P.x,P.z));const cut=c.role==='cut'&&dist>45;
    if(!c.see||cut){const a=nodeOf(c.x+c.fx*CELL*.45,c.z+c.fz*CELL*.45);c.route=[a,...bfs(a,cut?aheadNode(Math.abs(P.spd)>16?2:1):nodeOf(P.x,P.z))]}else c.route=null}
  let tx,tz;
  let vmax=99;
  if(c.route){const sw=8+v*.3;while(c.route.length>1&&Math.hypot(rc(c.route[0].i)-c.x,rc(c.route[0].j)-c.z)<sw)c.route.shift();
    if(c.route.length>1){const n0=c.route[0],n1=c.route[1],ax=rc(n1.i)-rc(n0.i),az=rc(n1.j)-rc(n0.j),bx=rc(n0.i)-c.x,bz=rc(n0.j)-c.z,d=Math.hypot(bx,bz)||1;if((ax*bx+az*bz)/(Math.hypot(ax,az)*d)<.7)vmax=Math.sqrt(144+14*Math.max(0,d-sw))}
   const n=c.route[0];tx=rc(n.i);tz=rc(n.j);if(c.route.length===1&&Math.hypot(tx-c.x,tz-c.z)<11){tx=P.x;tz=P.z}}
  else{const t=clamp(dist/Math.max(10,v+4),0,1.4);tx=P.x+P.vx*t;tz=P.z+P.vz*t;
    if(dist<12){const lx=Math.cos(P.h),lz=-Math.sin(P.h),side=Math.sign(-dx*lx-dz*lz)||1;if(-dx*P.fx-dz*P.fz<0){tx=P.x-P.fx*P.len*.32+lx*side*.95+P.vx*.2;tz=P.z-P.fz*P.len*.32+lz*side*.95+P.vz*.2}}}
  const want=Math.atan2(tx-c.x,tz-c.z),look=6+v*.7;let best=0,bs=-1e9,bfree=look;
  for(let k=-4;k<=4;k++){const a=c.h+k*.22;let sc=Math.cos(wrapA(want-a))-Math.abs(k)*.015,free=look;
    for(const fr of[.2,.4,.6,.8,1])if(solidAt(c.x+Math.sin(a)*look*fr,c.z+Math.cos(a)*look*fr)){free=look*fr;sc-=2.4*(1.2-fr);break}
    const qx=c.x+Math.sin(a)*7,qz=c.z+Math.cos(a)*7;for(const o of cars){if(o===c||o.kind!=='hunter'||o.dead)continue;const ox=qx-o.x,oz=qz-o.z;if(ox*ox+oz*oz<10)sc-=.45}
    if(sc>bs){bs=sc;best=k*.22;bfree=free}}
  vmax=Math.min(vmax,Math.sqrt(16*Math.max(0,bfree-3.5))+2);
  const diff=wrapA(want-c.h),aim=Math.abs(diff)<.3&&bs>.5?diff:best;let steer=clamp(aim*2.6,-1,1),thr=1,hb=false;
  if(Math.abs(aim)>.65&&v>17)thr=-.6;if(v>vmax+1)thr=-1;else if(v>vmax-1)thr=Math.min(thr,0);if(Math.abs(diff)>1.15&&v>10&&dist<80)hb=true;if(Math.abs(diff)>2.4&&v>8)thr=-1;
  if(c.rev>0){c.rev-=dt;thr=-1;steer=-c.revS;hb=false}else if(v<1.5&&dist>6){c.stuck+=dt;if(c.stuck>1){c.rev=1.1;c.revS=steer||1;c.stuck=0}}else c.stuck=Math.max(0,c.stuck-dt);
  c.in={thr,steer,hb}}

/* ── ana döngü ── */
let last=performance.now(),nearCdAll=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(document.hidden)return;update(dt,now);rr.render(scene,cam)}
function update(dt,now){
  const playing=state==='play';
  if(playing&&mode==='chase'&&CH.slow>0){CH.slow-=dt;dt*=.3;if(CH.slow<=0)gameOver()}
  let inp={thr:0,steer:0,hb:false};
  if(playing){inp=input(dt);P.in=inp;P.inv=(P.inv||0)-dt}else if(P)P.in={thr:0,steer:0,hb:true};
  // trafik + avcılar → fizik adımı → çarpışmalar
  let hunterD=999;
  if(state!=='pause'){SIG.t+=dt;const V=P?[P,...cars]:cars;
    for(const c of cars){
      if(c.kind==='hunter'){if(c.dead){c.in={thr:0,steer:0,hb:true};continue}
        if(playing&&mode==='chase'){hunterAI(c,dt);hunterD=Math.min(hunterD,Math.hypot(c.x-P.x,c.z-P.z))}else c.in={thr:0,steer:0,hb:true}}
      else trafficAI(c,dt,V)}
    const blink=(now/120|0)%2;M.red.emissiveIntensity=blink?3:0;M.blue.emissiveIntensity=blink?0:3;
    physStep(dt);impacts();paintSignals();
    for(let k=cars.length-1;k>=0;k--){const c=cars[k];if(c.kind!=='hunter'||!c.dead)continue;c.dead-=dt;if(c.dead<=0){c.remove();cars.splice(k,1);if(mode==='chase'&&playing)turnHunter(true)}}
    for(const c of cars)c.m.mats[4]=c.tB?M.dead:(c.in.a!=null?c.in.a<-1.2:c.brake)?M.tailOn:M.tail}
  // oyun mantığı
  if(playing){
    const kmh=Math.abs(P.spd)*3.6,skidAmt=!P.air&&kmh>12?clamp((Math.abs(P.vr)-2.2)/5,0,1)+(inp.hb&&kmh>15?.4:0):0;if(skidAmt>.15)skidMark(P,dt);
    if(P.air)P.avy=Math.min(P.avy||0,P.vy);else{if(P.avy<-6)land(-P.avy);P.avy=0}
    if(!P.tB)P.m.mats[4]=(inp.thr<0&&P.spd>1)||inp.hb?M.tailOn:M.tail;
    // ters döndüysen: ipucu, birkaç saniye sonra kendiliğinden düzel
    if(P.up<.3&&Math.abs(P.spd)<3){P.flipT=(P.flipT||0)+dt;if(P.flipT>.8&&!P.flipHint){P.flipHint=1;toast('Ters döndün — R ile düzelt')}if(P.flipT>3.5){upright(P);P.flipT=0;P.flipHint=0}}else{P.flipT=0;P.flipHint=0}
    if(mode==='chase'&&P.hp<35){P.smk=(P.smk||0)-dt;if(P.smk<=0){P.smk=.28;puff(P)}}
    // paralar
    for(const c of COINS){if(!c.on){c.t-=dt;if(c.t<=0)c.on=true;continue}if(Math.hypot(c.x-P.x,c.z-P.z)<2.6&&P.y<2){c.on=false;c.t=40;if(c.kit){P.hp=Math.min(100,P.hp+30);toast('Tamir +30','#5BD39B')}else{SV.money+=10;CH.earn+=10;toast('+10')}ding();save()}}
    // kıl payı
    nearCdAll-=dt;for(const c of cars){c.nearCd=(c.nearCd||0)-dt;if(c.nearCd>0)continue;const d=Math.hypot(c.x-P.x,c.z-P.z),rv=Math.hypot(c.vx-P.vx,c.vz-P.vz);
      if(d<P.rad+c.rad+1.6&&d>P.rad+c.rad+.35&&rv>15&&nearCdAll<=0){c.nearCd=3;nearCdAll=.8;SV.money+=5;CH.earn+=5;toast('Kıl payı +5');save()}}
    if(mode==='chase'&&!CH.over){CH.t+=dt;CH.next-=dt;CH.spawn-=dt;
      if(CH.next<=0){CH.next=Math.max(2.5,6-CH.t/60);if(cars.some(c=>c.kind==='traffic'))turnHunter()}
      if(CH.spawn<=0){CH.spawn=18;if(cars.filter(c=>c.kind==='hunter').length<(TOUCH?10:16))turnHunter(true);if(!COINS.some(c=>c.kit&&c.on)){const s=coinSpots(1)[0];if(s){s.kit=true;COINS.push(s)}}}
      for(const c of cars)if(c.kind==='hunter')c.maxF=clamp(P.s.max/c.s.max*(.88+Math.min(.14,CH.t/900)),.8,1.45);
      if(Math.floor(CH.t)!==Math.floor(CH.t-dt)){SV.money+=2;CH.earn+=2}
      if(P.hp<=0){CH.over=true;CH.slow=1;thud(1);shake=1}}
    audioTick(inp.thr,skidAmt,hunterD);P.sync(dt);camFollow(dt);paintHud();mmDraw()}
  else if(state==='garage'&&PV){PV.h+=dt*.35;PV.h0=PV.h;PV.sync(0);const nar=innerWidth<700;cam.position.set(SHOW.x+7.4,nar?3.4:2.9,SHOW.z+8.6);if(nar)cam.lookAt(SHOW.x,-1.6,SHOW.z);else cam.lookAt(SHOW.x+2.6,.7,SHOW.z-2.2);cam.fov=nar?58:46;cam.updateProjectionMatrix();audioTick(0,0,999)}
  else if(state==='pause'&&P){P.sync(0)}
  else{camOrbit(dt,0,0,250,95,10);audioTick(0,0,999)}
  if(P&&!playing&&state!=='pause')P.sync(0);
  for(const c of cars)c.sync(state==='pause'?0:dt);for(const c of PK)c.sync(0);
  for(const p of WP.values())if(p.dirty){p.t.instanceMatrix.needsUpdate=p.r.instanceMatrix.needsUpdate=true;p.dirty=false}
  // paraların dönüşü
  if(coinMesh){const o=new THREE.Object3D();let i=0,j=0;for(const c of COINS){if(c.kit){o.position.set(c.x,c.on?1.3+Math.sin(now/300)*.15:-50,c.z);o.rotation.set(0,now/600,0);o.scale.set(1,1,1);o.updateMatrix();if(j<kitMesh.count)kitMesh.setMatrixAt(j++,o.matrix);continue}
      o.position.set(c.x,c.on&&(state==='play')?1.1+Math.sin(now/300+c.x)*.15:-50,c.z);o.rotation.set(Math.PI/2,0,now/400+c.z);o.updateMatrix();if(i<coinMesh.count)coinMesh.setMatrixAt(i++,o.matrix)}
    for(;i<coinMesh.count;i++){o.position.set(0,-50,0);o.updateMatrix();coinMesh.setMatrixAt(i,o.matrix)}for(;j<kitMesh.count;j++){o.position.set(0,-50,0);o.updateMatrix();kitMesh.setMatrixAt(j,o.matrix)}
    coinMesh.instanceMatrix.needsUpdate=kitMesh.instanceMatrix.needsUpdate=true}
  for(let k=SMK.length-1;k>=0;k--){const m=SMK[k];m.userData.t+=dt;m.position.y+=m.userData.vy*dt;m.scale.setScalar(1+m.userData.t*1.4);m.material.opacity=Math.max(0,.5-m.userData.t*.14);if(m.userData.t>3.5){scene.remove(m);SMK.splice(k,1)}}
  // ışıklar oyuncuyu izler
  const fx=P?P.x:0,fz=P?P.z:0;sun.position.set(fx+TD.dir[0]*160,TD.dir[1]*160+20,fz+TD.dir[2]*160);sun.target.position.set(fx,0,fz);sky.position.copy(cam.position);
  if(P&&TD.head){head.position.set(P.x+Math.sin(P.h)*2,P.y+1.1,P.z+Math.cos(P.h)*2);head.target.position.set(P.x+Math.sin(P.h)*30,0,P.z+Math.cos(P.h)*30)}}
function gameOver(){state='over';const t=CH.t;if(t>SV.best){SV.best=t;$('#oBest').textContent='Yeni rekor!'}else $('#oBest').textContent=`En iyi: ${fmtT(SV.best)}`;save();
  $('#oT').textContent=fmtT(t);$('#oW').textContent=CH.wrecks;$('#oM').textContent='+'+CH.earn;show('over');audioVol();for(const c of cars)if(c.kind==='hunter')c.dead=0.01}

/* ── kur ── */
function resize(){const w=innerWidth,h=innerHeight;rr.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame()});
try{
  await RAPIER.init();world=new RAPIER.World({x:0,y:-9.81,z:0});world.timestep=STEP;EQ=new RAPIER.EventQueue(true);
  buildCity();physCity();makeParked();mmInit();applyTod();resize();
  coinMesh=new THREE.InstancedMesh(new THREE.CylinderGeometry(.7,.7,.16,18),new THREE.MeshStandardMaterial({color:0xffc94a,emissive:0x8a5a00,emissiveIntensity:.6,metalness:.8,roughness:.25}),90);
  kitMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1.2,1.2,1.2),new THREE.MeshStandardMaterial({color:0x5bd39b,emissive:0x1f7a4f,emissiveIntensity:.8}),6);
  coinMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);kitMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(coinMesh,kitMesh);
  spawnPlayer();makeTraffic(TOUCH?24:(HI?44:32));paintMenu();show('menu');
  requestAnimationFrame(t=>{last=t;frame(t)});$('#load').style.opacity=0;setTimeout(()=>$('#load').remove(),600);
  /* test kancası: çizmeden zamanı ileri sar (denetim betikleri için) */
  window.__asfalt={get P(){return P},get cars(){return cars},get state(){return state},PK,SIG,cam,CH,SV,start,keys,sim:(sec,inp)=>{let t=performance.now();for(let k=0;k<sec*60;k++){if(inp)Object.assign(keys,inp(k/60));t+=1000/60;update(1/60,t)}}};
}catch(e){console.error(e);$('#load').textContent='Bu cihazda 3B açılamadı: '+e.message}
