<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Warfront</title>
<meta name="description" content="ChatGPT, Gemini ve Claude'un yönettiği üç ada ülkesi: sanal bir siber güvenlik strateji simülasyonu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.motion=JSON.parse(localStorage.getItem('appshell:motion'))||'full'}catch{}</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#04070D;--panel:rgba(10,15,26,.78);--ink:#EAF0FA;--ink2:#B4BED2;--ink3:#8893A8;--line:rgba(150,175,220,.10);--line2:rgba(150,175,220,.18);
  --gold:#F2C14E;--bad:#FF5A65;--ok:#3DDC97;--warn:#F5B84B;--cyan:#7FE3FF;
  --font:'Geist',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.3,1.4,.5,1);color-scheme:dark}
html,body{height:100%;background:var(--bg)}
body{font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.i{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%;height:100dvh}

/* üst komuta çubuğu */
.top{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line);background:rgba(4,7,13,.82);backdrop-filter:blur(14px);position:relative;z-index:5;min-width:0}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#2b3a5c,#0b1220);box-shadow:inset 0 0 0 1px var(--line2)}
.mark svg{width:20px;height:20px}
.brand b{display:block;font-size:15.5px;font-weight:750;letter-spacing:.04em}.brand small{display:block;font-size:12px;color:var(--ink3)}
.phase{display:flex;align-items:center;gap:12px;margin:0 auto;padding:4px 6px 4px 14px;border-radius:14px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.ph-n{font:700 12px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);white-space:nowrap}.ph-n.war{color:#FF7A82}.ph-n.over{color:var(--ok)}
.ph-t{font:700 20px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:66px}
.ph-bar{width:120px;height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}.ph-bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s linear}
.ctl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;transition:background .2s,transform .25s var(--spring)}
.b:hover{background:rgba(255,255,255,.12)}.b:active{transform:scale(.96)}.b:disabled{opacity:.4;pointer-events:none}
.b.ic{width:36px;padding:0}.b.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.b.go{background-color:#F2C14E;background-image:linear-gradient(135deg,#F2C14E,#F59E3B);color:#1A1205;box-shadow:0 8px 24px -10px rgba(245,170,60,.7)}.b.go:hover{filter:brightness(1.07)}
.b.on{background:var(--ink);color:#05070C}
.spd{display:flex;align-items:center;height:36px;border-radius:10px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line)}
.spd button{width:30px;height:36px;font-weight:700;color:var(--ink2)}.spd button:hover{color:var(--ink)}.spd b{min-width:34px;text-align:center;font:600 13px var(--mono)}
.mode{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.mode.demo{color:#F7D58A;background:rgba(242,193,78,.1);box-shadow:inset 0 0 0 1px rgba(242,193,78,.3)}.mode.live{color:#9FF3C9;background:rgba(61,220,151,.1);box-shadow:inset 0 0 0 1px rgba(61,220,151,.3)}
.mode i{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ana yerleşim: harita odak */
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:minmax(0,1fr) 232px;gap:10px;padding:10px;min-height:0}
.glass{border-radius:16px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);backdrop-filter:blur(16px);min-height:0;overflow:hidden}
.map{position:relative;grid-row:1;grid-column:1;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);background:#050a14;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}#cv.drag{cursor:grabbing}
#ovl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hud{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:min(460px,60%)}
.hud .k{font:700 11.5px var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.hud .t{font-size:18px;font-weight:700;letter-spacing:-.01em;text-shadow:0 2px 12px #000}
.demo-n[hidden]{display:none}.demo-n{display:inline-flex;align-items:flex-start;gap:7px;padding:7px 10px;border-radius:10px;font-size:12px;color:#F7D58A;background:rgba(20,15,2,.7);box-shadow:inset 0 0 0 1px rgba(242,193,78,.25);pointer-events:auto}
.tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.tools .b{background:rgba(6,10,18,.75);backdrop-filter:blur(8px)}.tools .b.on{background:var(--ink);color:#05070C}
.intens{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:rgba(6,10,18,.75);font-size:12px;color:var(--ink2);pointer-events:none}
.intens span{width:90px;height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}.intens i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--bad));transition:width .6s}
.legend{position:absolute;left:14px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px 12px;max-width:62%;font-size:12px;color:var(--ink3);pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend svg,.legend img{width:14px;height:14px}
/* ada rozetleri */
.badge{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:auto;cursor:pointer;will-change:transform}
.bg-n{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border-radius:999px;background:rgba(5,9,16,.82);box-shadow:inset 0 0 0 1px var(--c),0 6px 20px -8px #000;font-size:13px;font-weight:700;white-space:nowrap}
.fl{width:20px;height:20px;border-radius:50%;background:var(--c);display:grid;place-items:center;flex-shrink:0}.fl svg{width:12px;height:12px}
.bg-n small{font:600 12px var(--mono);color:var(--ink2)}
.st{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font:700 12px var(--font);letter-spacing:.02em;white-space:nowrap;background:rgba(5,9,16,.85)}
.st i{width:6px;height:6px;border-radius:50%;background:currentColor}
.st.normal{color:#B4BED2}.st.def{color:var(--cyan)}.st.atk{color:var(--warn)}.st.lost{color:#FF9AA1}.st.crit{color:#fff;background:#C8243A;animation:blink 1s steps(2) infinite}.st.win{color:#1A1205;background:var(--gold)}.st.out{color:#9AA3B5;text-decoration:line-through}.st.think{color:#C9B8FF}
@keyframes blink{50%{background:#7A1020}}
.bubble{position:absolute;left:0;top:0;width:250px;padding:9px 12px;border-radius:13px;background:rgba(8,12,22,.94);box-shadow:inset 0 0 0 1px var(--c),0 12px 34px -12px #000;font-size:13px;line-height:1.45;pointer-events:auto;will-change:transform;animation:fade .45s var(--out)}
.bubble.bad{box-shadow:inset 0 0 0 1.5px #FF5A65,0 0 30px -8px rgba(255,90,101,.6)}.bubble.good{box-shadow:inset 0 0 0 1.5px #3DDC97,0 0 30px -10px rgba(61,220,151,.5)}
.bubble b{display:block;margin-bottom:3px;font-size:12px;color:var(--c);letter-spacing:.02em}.bubble em{font-style:normal;font-size:12px;color:var(--ink3);font-weight:500}
.bubble.out{opacity:0;transition:opacity .4s}
.tip{position:absolute;left:0;top:0;z-index:3;pointer-events:none;min-width:210px;padding:10px 12px;border-radius:12px;background:rgba(6,10,18,.94);box-shadow:inset 0 0 0 1px var(--line2),0 14px 40px -12px #000;font-size:12.5px;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}.tip b{display:block;font-size:13.5px;margin-bottom:4px}.tip div{display:flex;justify-content:space-between;gap:14px;color:var(--ink2)}.tip div span:last-child{color:var(--ink);font-family:var(--mono)}
/* başlangıç kartı */
.start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 28px));padding:22px;border-radius:20px;background:rgba(6,10,18,.9);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px var(--line2),0 30px 80px -20px #000;text-align:center;animation:fade .5s var(--out);z-index:2}
.start h1{font-size:24px;letter-spacing:-.02em}.start>p{margin:6px auto 16px;max-width:420px;color:var(--ink2);font-size:13.5px}
.start .row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}.start .row>span{width:110px;text-align:right;font-size:12.5px;color:var(--ink3)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:rgba(255,255,255,.05);gap:2px}.seg button{min-width:44px;height:30px;padding:0 9px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink2)}.seg button.on{background:var(--ink);color:#05070C}
.start .go{margin-top:8px;height:44px;padding:0 22px;font-size:15px}

/* günlük */
.log{grid-row:1/3;grid-column:2;display:flex;flex-direction:column}
.lh{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}.lh h2{font-size:14px;margin-right:auto}
.chips{display:flex;gap:4px;padding:0 12px 8px;flex-wrap:wrap}.chip{height:28px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink2);background:rgba(255,255,255,.05)}.chip.on{background:var(--ink);color:#05070C}
.ll{flex:1;overflow-y:auto;padding:0 8px 12px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent;overscroll-behavior:contain}
.ev{display:grid;grid-template-columns:auto 1fr;gap:2px 9px;width:100%;padding:7px 8px;border-radius:10px;text-align:left;font-size:13px;line-height:1.4;animation:evin .4s var(--out)}
.ev:hover{background:rgba(255,255,255,.05)}@keyframes evin{from{opacity:0;transform:translateY(-4px)}}
.ev time{font:500 12px var(--mono);color:var(--ink3);padding-top:1px}.ev span{color:var(--ink2)}
.ev.bad span{color:#FFB3B8}.ev.good span{color:#A8F0CE}.ev.crit{background:rgba(200,36,58,.14)}.ev.crit span{color:#FFD5D8}.ev.react span{color:var(--ink);font-style:italic}.ev.sys span{color:var(--ink3)}
.who{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c,#888)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100%;padding:20px;text-align:center;color:var(--ink3);font-size:13px}.empty b{color:var(--ink2);font-size:14px}

/* ülke panelleri */
.nations{grid-row:2;grid-column:1;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px;min-height:0}
.na{position:relative;display:flex;flex-direction:column;--c:#888;transition:box-shadow .3s}
.na::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.na.crit{box-shadow:inset 0 0 0 1.5px #C8243A,0 0 30px -10px rgba(255,60,80,.6)}.na.out{opacity:.6;filter:saturate(.3)}.na.win{box-shadow:inset 0 0 0 1.5px var(--gold),0 0 40px -12px rgba(242,193,78,.6)}
.nh{display:flex;align-items:center;gap:10px;padding:11px 12px 6px}
.nf{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--c);flex-shrink:0}.nf svg{width:18px;height:18px}
.nn{min-width:0;flex:1}.nn b{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:750}.nn small{display:block;font:500 12px var(--mono);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn{font:700 12px var(--font);letter-spacing:.06em;padding:2px 6px;border-radius:5px}.conn.demo{color:#F7D58A;background:rgba(242,193,78,.12)}.conn.live{color:#9FF3C9;background:rgba(61,220,151,.12)}.conn.off{color:#FF9AA1;background:rgba(255,90,101,.12)}
.nsc{text-align:right}.nsc b{display:block;font:700 22px/1 var(--mono);color:var(--c);font-variant-numeric:tabular-nums}.nsc small{font-size:12px;color:var(--ink3)}
.nst{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:6px;padding:2px 12px 6px}
.nst>div{font-size:12px;color:var(--ink3)}.nst>div>b{display:block;font:600 13.5px var(--mono);color:var(--ink)}
.rb{height:4px;width:70px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:3px}.rb i{display:block;height:100%;background:var(--c);transition:width .6s var(--out)}
.nstr{margin:0 12px;padding:6px 9px;border-radius:9px;background:rgba(255,255,255,.035);font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nstr b{color:var(--ink);font-weight:600}
.nal{margin:6px 12px 0;padding:6px 9px;border-radius:9px;font-size:12.5px;font-weight:600;animation:evin .4s var(--out)}
.nal.bad{color:#fff;background:#B0263A}.nal.good{color:#04130C;background:var(--ok)}.nal.crit{color:#fff;background:#C8243A;animation:blink 1s steps(2) infinite}.nal.info{background:rgba(255,255,255,.08)}
.nfd{flex:1;overflow-y:auto;padding:6px 12px 10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.nfd li{list-style:none;display:flex;gap:7px;padding:3px 0;font-size:12.5px;color:var(--ink2);line-height:1.4}
.nfd li::before{content:"";flex-shrink:0;width:5px;height:5px;margin-top:7px;border-radius:50%;background:var(--ink3)}
.nfd li.act::before{background:var(--c)}.nfd li.bad{color:#FFB3B8}.nfd li.bad::before{background:var(--bad)}.nfd li.good{color:#A8F0CE}.nfd li.good::before{background:var(--ok)}.nfd li.react{color:var(--ink);font-style:italic}.nfd li.react::before{background:var(--gold)}
.think{display:inline-flex;gap:3px;vertical-align:middle}.think i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:dot 1s infinite}.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.2}}

/* çekmece & modallar */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(440px,100%);display:flex;flex-direction:column;background:#0A0F1A;box-shadow:-30px 0 80px -20px #000,inset 1px 0 0 var(--line2);transform:translateX(102%);transition:transform .45s var(--out);visibility:hidden}
.drawer.on{transform:none;visibility:visible}
.dh{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}.dh h2{font-size:17px;margin-right:auto}
.db{flex:1;overflow-y:auto;padding:14px 18px 30px}
.sec{margin-bottom:20px}.sec>h3{font:700 12px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:9px}
.fr{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;color:var(--ink2)}
.in{width:100%;height:34px;padding:0 10px;border:0;border-radius:9px;outline:0;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line2);font-size:13px}
.in:focus{box-shadow:inset 0 0 0 1.5px var(--gold)}select.in option{background:#0F1522}
.box{padding:11px;border-radius:12px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px;color:var(--ink2);line-height:1.5}
.box code{font-family:var(--mono);font-size:12px;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.07)}
.pv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pv span{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;font-size:12px;background:rgba(255,255,255,.05)}
.pv span i{width:7px;height:7px;border-radius:50%;background:var(--bad)}.pv span.ok i{background:var(--ok)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px;font-size:13px;color:var(--ink2)}
.sw{position:relative;width:42px;height:24px;border-radius:12px;background:rgba(255,255,255,.14);flex-shrink:0}.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s var(--spring)}
.sw[aria-checked=true]{background:var(--ok)}.sw[aria-checked=true]::after{transform:translateX(18px)}
.muted{font-size:12.5px;color:var(--ink3)}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:rgba(2,4,8,.72);backdrop-filter:blur(8px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.mb{width:min(920px,100%);max-height:calc(100dvh - 36px);overflow:auto;border-radius:20px;background:#0A0F1A;box-shadow:0 40px 120px -30px #000,inset 0 0 0 1px var(--line2);animation:pop .5s var(--out)}
.mb.sm{width:min(580px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}.mh h2{font-size:18px;margin-right:auto}
.mbd{padding:18px 20px 24px}
.dl{display:grid;grid-template-columns:110px 1fr;gap:7px 12px;font-size:13px}.dl dt{color:var(--ink3)}.dl dd{color:var(--ink)}
.claim{margin-top:14px;padding:12px;border-radius:12px;background:rgba(124,140,255,.07);box-shadow:inset 0 0 0 1px rgba(124,140,255,.25);font-size:13px}
.verdict{margin-top:10px;padding:12px;border-radius:12px;background:rgba(242,193,78,.06);box-shadow:inset 0 0 0 1px rgba(242,193,78,.25);font-size:13px}
.claim h4,.verdict h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.calc{font-family:var(--mono);font-size:12.5px;color:var(--ink2);line-height:1.7}
.res{display:inline-flex;height:24px;align-items:center;padding:0 9px;border-radius:6px;font:700 12px var(--font);letter-spacing:.04em}.res.ok{background:var(--ok);color:#04130C}.res.bad{background:#C8243A;color:#fff}.res.mid{background:var(--warn);color:#1A1205}
.pod{display:grid;grid-template-columns:repeat(var(--n,3),1fr);align-items:end;gap:12px;margin:4px 0 20px}
.pd{display:flex;flex-direction:column;align-items:center;gap:6px;--c:#888}.pd .nf{width:48px;height:48px;border-radius:14px}.pd .nf svg{width:24px;height:24px}
.pd b{font-size:15px}.pd .pts{font:700 26px var(--mono);color:var(--c)}.pd .blk{width:100%;border-radius:12px 12px 4px 4px;display:grid;place-items:center;font:800 30px var(--mono);color:rgba(255,255,255,.55);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 32%,transparent),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 var(--c)}
.pd.out .blk{background:rgba(255,255,255,.03);box-shadow:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{padding:8px 9px;text-align:left;border-top:1px solid var(--line)}.tbl th{font-size:12px;color:var(--ink3);font-weight:600}.tbl td.n{font-family:var(--mono);text-align:right}.tbl td.w{color:var(--gold);font-weight:700}

  body{overflow:auto}.app{height:auto;min-height:100dvh}.top{flex-wrap:wrap}.phase{order:5;width:100%;margin:0;justify-content:center}.ctl{flex-wrap:wrap}
  .main{display:flex;flex-direction:column}.map{height:64vh;min-height:400px}.log{height:340px}

  .legend{display:none}.hud{max-width:calc(100% - 70px)}.hud .t{font-size:15px}.start .row>span{width:100%;text-align:center}.fr{grid-template-columns:1fr}.dl{grid-template-columns:1fr}.why summary{min-height:40px}.ev{min-height:40px}.bubble{width:220px}.intens{display:none}}

<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#F2C14E" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/><circle cx="12" cy="12" r="2.2" fill="#F2C14E"/></svg></span><span><b>AI WARFRONT</b><small>Üç yapay zekâ ülkesi · sanal siber strateji</small></span></div>
    <div class="phase" id="phase"><span class="ph-n" id="phN">Hazırlık bekleniyor</span><span class="ph-t" id="phT">--:--</span><span class="ph-bar"><i id="phB"></i></span></div>
    <div class="ctl">
      <button class="mode demo" id="modeB" title="Çalışma modu"><i></i><span id="modeT">Demo</span></button>
      <button class="b go" id="runB" title="Başlat / duraklat (Boşluk)"><svg class="i" viewBox="0 0 16 16"><path d="M5 3.5v9l7.5-4.5z" fill="currentColor"/></svg><span class="lbl">Başlat</span></button>
      <button class="b" id="prepB" title="+2 dakika hazırlık süresi (savaştaysa saldırılar durur)"><svg class="i" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg><span class="lbl">2 dk hazırlık</span></button>
      <button class="b ic" id="endB" title="Aşamayı bitir (E)" aria-label="Aşamayı bitir"><svg class="i" viewBox="0 0 16 16"><path d="M3.5 3.5v9l6-4.5zM12 3.5v9"/></svg></button>
      <div class="spd" title="Oyun hızı (− / +)"><button id="slowB" aria-label="Yavaşlat">−</button><b id="spdT">1×</b><button id="fastB" aria-label="Hızlandır">+</button></div>
      <button class="b ic" id="resetB" title="Yeniden başlat" aria-label="Yeniden başlat"><svg class="i" viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.5-3.6M3 2.5v3h3"/></svg></button>
      <button class="b ic" id="histB" title="Geçmiş savaşlar (H)" aria-label="Geçmiş savaşlar"><svg class="i" viewBox="0 0 16 16"><path d="M2.5 3.5h11v9h-11zM2.5 6.5h11M6 9h4"/></svg></button>
      <button class="b ic" id="setB" title="Oyun yöneticisi ayarları (P)" aria-label="Ayarlar"><svg class="i" viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h10"/><circle cx="6" cy="4.5" r="1.3" fill="#04070D"/><circle cx="10.5" cy="8" r="1.3" fill="#04070D"/><circle cx="5" cy="11.5" r="1.3" fill="#04070D"/></svg></button>
    </div>
  </header>
  <main class="main">
    <section class="map" id="map" aria-label="Savaş haritası">
      <canvas id="cv" aria-label="Okyanus ve üç ada: bölgeler, tesisler, savunmalar"></canvas><div id="ovl"></div>
      <div class="hud"><span class="k" id="hudK">Okyanus</span><span class="t" id="hudT">Üç ada, üç yapay zekâ</span><span class="demo-n" id="demoN" hidden><svg class="i" viewBox="0 0 16 16"><path d="M8 2l6.5 11.5h-13z"/><path d="M8 6.5v3M8 11.6v.1"/></svg><span>DEMO: Ülkeleri yerel kural motoru yönetiyor, gerçek yapay zekâ değil. Gerçek modeller için Ayarlar → Gerçek API.</span></span></div>
      <div class="tools"><button class="b ic" id="fitB" title="Haritayı sığdır (F)" aria-label="Haritayı sığdır"><svg class="i" viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button><button class="b ic on" id="folB" title="Kamera kritik olayları takip etsin" aria-label="Kamera takibi" aria-pressed="true"><svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3"/></svg></button><button class="b ic" id="zinB" aria-label="Yakınlaştır" title="Yakınlaştır">+</button><button class="b ic" id="zoutB" aria-label="Uzaklaştır" title="Uzaklaştır">−</button></div>
      <div class="legend" id="legend"></div>
      <div class="intens" title="Savaşın yoğunluğu (son saldırılar)">Yoğunluk<span><i id="intI"></i></span></div>

    </section>
    <aside class="glass log" aria-label="Savaş günlüğü"><div class="lh"><h2>Savaş günlüğü</h2><button class="b sm ic" id="dlB" title="Dışa aktar" aria-label="Savaşı dışa aktar"><svg class="i" viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10"/></svg></button></div><div class="chips" id="lchips"></div><div class="ll" id="log" aria-live="polite"></div></aside>
    <section class="nations" id="nations" aria-label="Ülkeler"></section>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Oyun yöneticisi"></aside>
<div id="toasts"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════
   AI WARFRONT — üç katman:
   A) AI LAYER   (ai.*)    gerçek modeller: yerel sunucu (server/arena-server.mjs) · DEMO: kural motoru (açıkça etiketli)
   B) ENGINE     (eng.*)   kaynak, bölge, savunma, sanal eylemler ve sonuçları — tek gerçek kaynak
   C) VIS        (vis.*)   harita, kamera, animasyonlar, rozetler, tepkiler
   AI haritayı doğrudan değiştiremez: yapılandırılmış eylem önerir → motor kuralları kontrol eder ve sonucu hesaplar → görsel motor gösterir.
   Saldırılar yalnızca bu oyundaki sanal ada/bölge/tesislere yöneliktir; gerçek sistem, kod veya exploit yoktur.
   ═══════════════════════════════════════════════════════════════════ */
const $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsg=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},lss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}};
const motion=()=>!matchMedia('(prefers-reduced-motion: reduce)').matches&&document.documentElement.dataset.motion!=='off';
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const low=s=>String(s).toLocaleLowerCase('tr');
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3400)}
function mkRng(s){s=[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,2166136261)||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

/* ───────── sabitler ───────── */
const PROV={openai:{n:'ChatGPT',c:'#19C37D'},gemini:{n:'Gemini',c:'#7C8CFF'},claude:{n:'Claude',c:'#E58A60'}};
const ALT=['#3DD6D0','#F2C14E','#FF7AB6'],LET='ABC';
const FLAG='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M6 21V4M6 4h11l-2 4 2 4H6"/></svg>';
const KINDS={cap:{n:'Başkent',s:'Ana üs'},def:{n:'Savunma merkezi',s:'Savunma'},energy:{n:'Enerji tesisi',s:'Enerji'},data:{n:'Veri merkezi',s:'Veri'},comm:{n:'İletişim kulesi',s:'İletişim'},soc:{n:'Güvenlik merkezi',s:'Güvenlik'},res:{n:'Kaynak merkezi',s:'Kaynak'},strat:{n:'Stratejik bölge',s:'Stratejik'}};
const KSET={4:['def','energy','data','comm'],6:['def','energy','data','comm','soc','res'],8:['def','energy','data','comm','soc','res','strat','energy']};
const DIRS=['Kuzey','Kuzeydoğu','Doğu','Güneydoğu','Güney','Güneybatı','Batı','Kuzeybatı'];
const MAPS={kucuk:{n:4,R:132,l:'Küçük'},orta:{n:6,R:158,l:'Orta'},buyuk:{n:8,R:186,l:'Büyük'}};
const DIFF={kolay:{dmg:18,inc:1.25,rnd:3,l:'Kolay'},normal:{dmg:26,inc:1,rnd:3,l:'Normal'},zor:{dmg:36,inc:.8,rnd:4,l:'Zor'}};
/* eylem kataloğu — maliyetler motorun tek kaynağı */
const ACT={
  fortify:{n:'Güçlendir',d:'Bölgenin savunma seviyesini artırır (miktar 1–3)',cost:a=>6*clamp(a.miktar|0||1,1,3),own:1},
  shield:{n:'Kalkan',d:'Bir saldırıyı tamamen emen kalkan katmanı (bölge başına en fazla 2)',cost:()=>12,own:1},
  backup:{n:'Yedek sistem',d:'Bölge düşmek üzereyken bir kez kurtarır',cost:()=>14,own:1},
  repair:{n:'Onar',d:'Bölge bütünlüğünü +35 artırır',cost:()=>8,own:1},
  probe:{n:'Zayıflık taraması',d:'Rakip bölgenin savunmasını görünür yapar, sonraki teste +2',cost:()=>4,war:1},
  pressure:{n:'Kaynak baskısı',d:'Rakip ülkenin kaynaklarını tüketir',cost:()=>8,war:1,nation:1},
  disrupt:{n:'İletişim kesintisi',d:'Rakibin iletişim kulesini 30 sn çevrimdışı bırakır',cost:()=>10,war:1},
  decoy:{n:'Yanıltma',d:'30 sn boyunca saldırılarına +2 (rakibin savunması şaşırır)',cost:()=>6,war:1,nation:1},
  assault:{n:'Ele geçirme testi',d:'Rakip bölgenin savunmasını sınar (güç 1–5); başarılıysa bütünlük düşer, sıfırlanırsa bölge el değiştirir',cost:a=>8+3*clamp(a.guc|0||3,1,5),war:1}};
const ALIAS={guclendir:'fortify','güçlendir':'fortify',kalkan:'shield',yedek:'backup',onar:'repair',tarama:'probe',kesif:'probe','keşif':'probe',baski:'pressure','baskı':'pressure',kesinti:'disrupt',yaniltma:'decoy','yanıltma':'decoy',saldiri:'assault','saldırı':'assault',test:'assault'};

/* ───────── yönetici ayarları ───────── */
const DEF_CFG={mode:'demo',url:'http://127.0.0.1:8787',token:'',count:3,slots:[{p:'openai',m:''},{p:'gemini',m:''},{p:'claude',m:''}],prep:5,war:8,res:100,def:3,size:'orta',diff:'normal',capElim:true,backups:true,decoys:true,fog:true,speed:1};
const cfg=Object.assign(structuredClone(DEF_CFG),lsg('warfront:cfg',{}));const saveCfg=()=>lss('warfront:cfg',cfg);

/* ═════════════════════ B) SIMULATION ENGINE ═════════════════════ */
let G=null,RUN=0;
const eng={
  newGame(){const c=structuredClone(cfg),seed=uid(),M=MAPS[c.size],used={};
    const nations=c.slots.slice(0,c.count).map((s,i)=>{used[s.p]=(used[s.p]||0)+1;const dup=used[s.p]>1;
      return{i,prov:s.p,model:s.m,name:PROV[s.p].n+(dup?' II':''),color:dup?ALT[i]:PROV[s.p].c,res:c.res,alive:true,conn:c.mode==='demo'?'demo':'live',
        intel:{},decoy:{},commOff:0,attackedAt:-99,lostAt:-99,capAt:-99,defAt:-99,wonAt:-99,strategy:'',reason:'',feed:[],alert:null,pending:[],thinking:false,
        st:{spent:0,wasted:0,valid:0,invalid:0,atk:0,atkOk:0,caps:0,recv:0,blk:0,lost:0,gained:0,blkAfter:0,recvAfter:0,firstLoss:null},evalText:''}});
    const regions=[];nations.forEach((n,i)=>{const L=LET[i],rng=mkRng(seed+i),ks=KSET[M.n].map(k=>[k,rng()]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
      regions.push({id:L+'0',home:i,owner:i,kind:'cap',cap:true,k:-1,name:'Başkent',def:c.def+2,shield:0,backup:false,integ:100,off:0,sweep:0,prev:i});
      for(let k=0;k<M.n;k++){const ang=-90+k*360/M.n,dir=DIRS[Math.round(((ang+90)%360+360)%360/45)%8];regions.push({id:L+(k+1),home:i,owner:i,kind:ks[k],cap:false,k,name:dir,def:c.def,shield:0,backup:false,integ:100,off:0,sweep:0,prev:i})}});
    G={id:seed,seed,created:Date.now(),cfg:c,phase:'setup',status:'idle',clock:0,left:c.prep*60,total:c.prep*60,warLeft:c.war*60,nations,regions,log:[],intensity:0,winner:null,scores:null,rnd:mkRng(seed+'e')};
    return G},
  R:id=>G.regions.find(r=>r.id===String(id||'').toUpperCase().trim()),
  own:n=>G.regions.filter(r=>r.owner===n.i),
  N:x=>{if(x==null||x==='')return null;if(typeof x==='number')return G.nations[x]||null;const s=low(x).trim();return G.nations.find(n=>low(n.name)===s||low(LET[n.i])===s||low(PROV[n.prov].n)===s)||G.nations.find(n=>s.includes(low(n.name)))||null},
  label:r=>r.cap?`${G.nations[r.home].name} başkenti`:`${r.name} ${low(KINDS[r.kind].n)}`,
  online:r=>r.off<=G.clock,
  commOff:n=>n.commOff>G.clock,
  adj(r){const N=MAPS[G.cfg.size].n,L=r.id[0];if(r.cap)return G.regions.filter(x=>x.id[0]===L&&!x.cap);return G.regions.filter(x=>x.id[0]===L&&(x.cap||x.k===(r.k+1)%N||x.k===(r.k+N-1)%N))},
  income(n){let v=0;for(const r of eng.own(n)){if(!eng.online(r))continue;v+=r.cap?3:r.kind==='energy'||r.kind==='res'?4:1}return Math.round(v*DIFF[G.cfg.diff].inc*(eng.commOff(n)?.5:1))},
  costOf(n,a){const s=ACT[a.tur];return s?Math.ceil(s.cost(a)*(eng.commOff(n)?1.3:1)):0},
  /* kurallara uygunluk — sadece geçerli eylemler maliyet öder */
  validate(n,a){const s=ACT[a.tur];if(!s)return'Tanımsız eylem';if(!n.alive)return'Ülke elendi';
    if(s.war&&G.phase!=='war')return'Hazırlık aşamasında saldırı eylemi yapılamaz';
    if(a.tur==='backup'&&!G.cfg.backups)return'Yedek sistemler bu savaşta kapalı';if(a.tur==='decoy'&&!G.cfg.decoys)return'Yanıltma bu savaşta kapalı';
    if(s.nation){const t=eng.N(a.hedef);if(!t||t===n)return'Geçersiz hedef ülke';if(!t.alive)return'Hedef ülke elendi'}
    else{const r=eng.R(a.bolge);if(!r)return`“${a.bolge||'?'}” diye bir bölge yok`;
      if(s.own&&r.owner!==n.i)return`${r.id} senin bölgen değil`;if(!s.own&&r.owner===n.i)return`${r.id} zaten senin`;
      if(a.tur==='fortify'&&r.def>=(r.cap?14:10))return`${r.id} en üst savunma seviyesinde`;if(a.tur==='shield'&&r.shield>=2)return`${r.id} zaten 2 kalkanlı`;
      if(a.tur==='backup'&&r.backup)return`${r.id} zaten yedekli`;if(a.tur==='repair'&&r.integ>=100)return`${r.id} hasarsız`;
      if(a.tur==='disrupt'&&r.kind!=='comm')return'İletişim kesintisi sadece iletişim kulesine yapılabilir'}
    if(eng.costOf(n,a)>n.res)return`Kaynak yetersiz (${eng.costOf(n,a)} gerekli, ${Math.floor(n.res)} var)`;return''},
  /* kendi bölgesine yapılan eylemler: anında */
  applyOwn(n,a){const r=eng.R(a.bolge),c=eng.costOf(n,a);n.res-=c;n.st.spent+=c;n.defAt=G.clock;let t='';
    if(a.tur==='fortify'){const b=r.def;r.def=Math.min(r.cap?14:10,r.def+clamp(a.miktar|0||1,1,3));t=`${eng.label(r)} güçlendirildi (savunma ${b}→${r.def})`}
    else if(a.tur==='shield'){r.shield++;t=`${eng.label(r)} için kalkan kuruldu (${r.shield}/2)`}
    else if(a.tur==='backup'){r.backup=true;t=`${eng.label(r)} için yedek sistem kuruldu`}
    else if(a.tur==='repair'){const b=r.integ;r.integ=Math.min(100,r.integ+35);t=`${eng.label(r)} onarıldı (bütünlük %${Math.round(b)}→%${Math.round(r.integ)})`}
    return{type:a.tur,by:n.i,region:r.id,text:t,cost:c}},
  /* rakibe yönelik eylemler: sonucu çarpma anında motor hesaplar */
  resolve(n,a,cost){const D=DIFF[G.cfg.diff],rnd=G.rnd,ev={type:a.tur,by:n.i,cost};
    if(a.tur==='pressure'||a.tur==='decoy'){const t=eng.N(a.hedef);ev.to=t.i;const soc=eng.own(t).some(r=>r.kind==='soc'&&eng.online(r));
      if(a.tur==='pressure'){const drain=Math.max(4,Math.round(10+2*eng.own(n).filter(r=>r.kind==='res').length-(soc?5:0)));const b=t.res;t.res=Math.max(0,t.res-drain);ev.ok=true;ev.amount=Math.round(b-t.res);
        ev.calc=`Tüketim = 10 + 2×kaynak merkezi${soc?' − 5 (güvenlik merkezi)':''} = ${drain}`;ev.text=`${n.name}, ${t.name} ülkesine kaynak baskısı uyguladı: −${ev.amount} kaynak`}
      else{const exposed=soc&&rnd()<.5;ev.ok=!exposed;if(!exposed)n.decoy[t.i]=G.clock+30;ev.calc=soc?`Güvenlik merkezi var → %50 fark edilme şansı: ${exposed?'fark edildi':'fark edilmedi'}`:'Hedefte güvenlik merkezi yok → fark edilmedi';
        ev.text=exposed?`${t.name}'in güvenlik merkezi ${n.name}'in yanıltma girişimini fark etti`:`${n.name} yanıltma senaryosu başlattı: 30 sn boyunca ${t.name}'e karşı +2`}
      if(!ev.ok)n.st.wasted+=cost;return ev}
    const r=eng.R(a.bolge),t=G.nations[r.owner];ev.to=t.i;ev.region=r.id;
    if(r.owner===n.i){ev.ok=false;ev.text=`${r.id} hedefi bu arada zaten ${n.name}'e geçmişti`;return ev}
    if(a.tur==='probe'){const soc=eng.own(t).some(x=>x.kind==='soc'&&eng.online(x));n.intel[r.id]=G.clock+60;ev.ok=true;ev.detected=soc&&rnd()<.3;
      ev.calc=`Görülen: savunma ${r.def}, kalkan ${r.shield}, bütünlük %${Math.round(r.integ)}${ev.detected?' · tarama güvenlik merkezince fark edildi':''}`;ev.text=`${n.name}, ${t.name}'in ${eng.label(r)} bölgesini taradı (savunma ${r.def})`;if(ev.detected)t.attackedAt=G.clock;return ev}

const waiters=new Set();

    if(n.conn==='off'){await waitGame(6,run);continue}
    const kind=n.urgent?'emergency':G.phase;n.urgent=false;n.thinking=true;paintNation(n);let d=null;
    try{if(n.conn==='demo'){await sleep(400+Math.random()*600);d=ai.demo(n,kind)}
      else{const raw=await ai.chat(n,ai.system(n),ai.user(n,kind));d=ai.norm(ai.parse(raw));if(!d){n.st.invalid++;note(n,'Model cevabı okunamadı (JSON değil) — tur atlandı','bad');logSys(`${n.name} anlaşılır bir karar göndermedi`)}n.errs=0}}
    catch(e){n.thinking=false;if(run!==RUN)return;n.errs=(n.errs||0)+1;note(n,`Bağlantı sorunu: ${e.message}`,'bad');logSys(`${n.name}: ${e.message} — ${n.errs>2?20:8} sn sonra yeniden denenecek`);await waitGame(n.errs>2?20:8,run);continue}
    n.thinking=false;if(run!==RUN||!n.alive)return;
    if(d)await execute(n,d,run);
    await waitGame((G.phase==='prep'?9:7)*(eng.commOff(n)?1.5:1)*(.8+Math.random()*.4),run,n)}
  n.thinking=false;paintNation(n)}

    vis.bubble(n,d.react,bad?'bad':top.res?'good':'');feed(n,'“'+d.react+'”','react');log({type:'react',by:n.i,text:`${n.name}: “${d.react}”`,cls:'react',detail:{react:d.react,events:evs.map(e=>e.text)}})}
  if(!d.acts.length){feed(n,'Bu turda eylem yok — kaynak biriktiriyor');return}

    if(why){n.st.invalid++;feed(n,`Geçersiz karar: ${actText(a)} — ${why}`,'bad');log({type:'invalid',by:n.i,text:`${n.name} geçersiz karar: ${actText(a)} (${why})`,cls:'sys',detail:{decision:a,reason:n.reason,engine:{verdict:'REDDEDİLDİ',why}}});continue}
    n.st.valid++;

    else{const c=eng.costOf(n,a);n.res-=c;n.st.spent+=c;feed(n,`${actText(a)} başlatıldı`,'act');paintNation(n);
      await new Promise(res=>vis.launch(n,a,()=>{if(G.phase==='over'){res();return}const ev=eng.resolve(n,a,c);onResult(n,a,ev);res()}))}}}
function onResult(n,a,ev){const t=ev.to!=null?G.nations[ev.to]:null,r=ev.region&&eng.R(ev.region);
  const verdict={blocked:'ENGELLENDİ',shield:'KALKAN EMDİ',hit:'AÇIK BULUNDU',backup:'YEDEK KURTARDI',capture:'BÖLGE EL DEĞİŞTİRDİ'}[ev.res]||(ev.ok?'BAŞARILI':'BAŞARISIZ');
  log({type:a.tur,by:n.i,to:ev.to,region:ev.region,res:ev.res,text:ev.text,cls:a.tur==='probe'?'':ev.res==='capture'?'crit':ev.ok?'bad':'good',detail:{decision:a,reason:n.reason,engine:{verdict,why:ev.why||'',calc:ev.calc}}});

    if(ev.elim!=null){note(t,'Başkent düştü — ülke elendi','crit');log({type:'elim',by:n.i,to:t.i,text:`${t.name} elendi: başkenti ${n.name}'in kontrolüne geçti`,cls:'crit'})}vis.focus(r,ev.elim!=null?1.5:1.25,3200)}
  else if(ev.res==='blocked'||ev.res==='shield'){note(t,`Savunma başarılı: ${n.name}'in ${r.cap?'başkent':low(r.name)} testi durduruldu`,'good');feed(n,`${r.id} testi sonuç vermedi (${ev.why})`,'bad');t.pending.push(ev);n.pending.push(ev)}
  else if(ev.res==='hit'||ev.res==='backup'){note(t,`${r.cap?'KRİTİK: başkent':r.name+' bölgesi'} hasar aldı (%${Math.round(r.integ)})`,r.cap?'crit':'bad');feed(n,ev.text,'good');t.pending.push(ev);n.pending.push(ev);t.urgent=true;if(r.cap)vis.focus(r,1.45,2600)}

async function begin(){if(cfg.mode==='live'){if(!srv.ok)await ai.health();if(!srv.ok){toast('Yerel sunucuya bağlanılamadı — Ayarlar → Bağlan ve test et, ya da Demo modu');openDrawer();return}}

  <h3 style="margin:18px 0 6px;font-size:14px">Savaş sonrası değerlendirmeler</h3><div class="eval">${g.nations.map(n=>`<div style="--c:${n.color}"><b>${E(n.name)}</b> <span class="conn ${n.conn}">${n.conn==='demo'?'DEMO':n.conn==='live'?'MODEL':'—'}</span><p style="margin-top:4px">${E(n.evalText||'Değerlendirme bekleniyor…')}</p></div>`).join('')}</div>
  <h3 style="margin:18px 0 6px;font-size:14px">Neden bu puanlar?</h3>${g.nations.map(n=>`<details class="why"><summary style="color:${n.color}">${E(n.name)} — puan dökümü</summary><div class="ldg">${sc[n.i].L.map(([k,v,w])=>`<div><b class="${v>0?'p':'n'}">${v>0?'+':''}${v.toFixed(1)}</b><span><b style="color:var(--ink);font-family:var(--font)">${CRIT[k][0]}</b> — ${E(w)}</span></div>`).join('')}</div></details>`).join('')}
  <p class="muted" style="margin-top:12px">${g.cfg.mode==='demo'?'Demo savaşı: ülkeleri kural motoru yönetti; sonuçlar gerçek modellerin başarısını göstermez.':'Gerçek modeller; kazananı modellerin iddiası değil, oyun motoru belirledi.'}</p></div>`}
function openFinal(){if(!G?.scores)return;const m=modal(finalHTML());m.addEventListener('click',e=>{if(e.target.closest('[data-exp]'))exportG();if(e.target.closest('[data-new]')){m.remove();restart()}})}
function archive(){if(!G||!G.log.length)return;const H=lsg('warfront:hist',[]),meta={id:G.id,at:Date.now(),mode:G.cfg.mode,names:G.nations.map(n=>n.name),winner:G.winner!=null&&G.phase==='over'?G.nations[G.winner].name:null,n:G.log.length};
  const i=H.findIndex(h=>h.id===G.id);if(i>=0)H[i]=meta;else H.unshift(meta);while(H.length>20){const x=H.pop();localStorage.removeItem('warfront:s:'+x.id)}lss('warfront:hist',H);lss('warfront:s:'+G.id,snap(G))}
function openHist(){archive();const H=lsg('warfront:hist',[]);const m=modal(`<div class="mh"><h2>Geçmiş savaşlar</h2>${X}</div><div class="mbd">${H.length?`<div class="hist">${H.map(h=>`<div class="hi"><b>${E(h.names.join(' · '))}${h.id===G.id?' <span class="conn demo">şu an</span>':''}</b><small>${new Date(h.at).toLocaleString('tr-TR',{dateStyle:'medium',timeStyle:'short'})} · ${h.mode==='demo'?'demo':'gerçek API'} · ${h.n} olay · ${h.winner?'kazanan '+E(h.winner):'yarım kaldı'}</small><div class="acts"><button class="b sm" data-hv="${h.id}">İncele</button><button class="b sm ic" data-hx="${h.id}" aria-label="Dışa aktar" title="Dışa aktar"><svg class="i" viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10"/></svg></button>${h.id!==G.id?`<button class="b sm ic" data-hd="${h.id}" aria-label="Sil" title="Sil"><svg class="i" viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 9h5.8l.6-9"/></svg></button>`:''}</div></div>`).join('')}</div>`:'<div class="empty"><b>Henüz savaş yok</b>Savaşlar otomatik kaydedilir.</div>'}</div>`);
  m.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const g=k=>k===G.id?G:lsg('warfront:s:'+k,null);
    if(t.dataset.hv){const s=g(t.dataset.hv);if(!s)return toast('Kayıt bulunamadı');const mm=modal((s.scores?finalHTML(s,true):`<div class="mh"><h2>${E(s.nations.map(n=>n.name).join(' · '))}</h2>${X}</div>`)+`<div class="mbd" style="padding-top:0"><h3 style="font-size:14px;margin-bottom:6px">Savaş günlüğü</h3>${s.log.slice().reverse().map(e=>evHTML(e,s)).join('')}</div>`);
      mm.addEventListener('click',ev=>{const b=ev.target.closest('[data-ev]');if(b)openEvent(b.dataset.ev,s)})}
    if(t.dataset.hx){const s=g(t.dataset.hx);if(s)exportG(s)}
    if(t.dataset.hd){localStorage.removeItem('warfront:s:'+t.dataset.hd);lss('warfront:hist',lsg('warfront:hist',[]).filter(h=>h.id!==t.dataset.hd));openHist()}})}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function exportG(g=G){const base=`warfront-${new Date(g.created).toISOString().slice(0,16).replace(/[:T]/g,'-')}`;dl(base+'.json',JSON.stringify(g===G?snap(g):g,null,1),'application/json');
  const md=`# AI Warfront — ${g.nations.map(n=>n.name).join(' vs ')}\n\nMod: ${g.cfg.mode==='demo'?'demo (kural motoru)':'gerçek API'} · Harita: ${MAPS[g.cfg.size].l} · Zorluk: ${DIFF[g.cfg.diff].l}\n\n`+(g.scores?`## Sonuç (oyun motoru)\n\n| Ölçüt | ${g.nations.map(n=>n.name).join(' | ')} |\n|---|${g.nations.map(()=>'---').join('|')}|\n${Object.entries(CRIT).map(([k,[l]])=>`| ${l} | ${g.nations.map(n=>(g.scores[n.i].C[k]||0).toFixed(1)).join(' | ')} |`).join('\n')}\n| **Toplam** | ${g.nations.map(n=>g.scores[n.i].total.toFixed(1)).join(' | ')} |\n\n## Değerlendirmeler\n\n${g.nations.map(n=>`- **${n.name}:** ${n.evalText}`).join('\n')}\n\n`:'')+`## Savaş günlüğü\n\n${g.log.map(e=>`- [${fmt(e.t)}] ${e.text}${e.detail?.engine?.calc?` _(${e.detail.engine.calc.replace(/\n/g,' · ')})_`:''}`).join('\n')}\n`;
  dl(base+'.md',md,'text/markdown');toast('JSON ve Markdown olarak indirildi')}

/* ───────── olaylar ───────── */
$('#runB').onclick=toggleRun;$('#prepB').onclick=extendPrep;$('#endB').onclick=endPhase;$('#resetB').onclick=()=>{if(G.log.length&&G.phase!=='over'&&G.phase!=='setup'&&!confirm('Bu savaş geçmişe kaydedilip yeniden başlatılsın mı?'))return;restart()};
$('#slowB').onclick=()=>setSpeed(-1);$('#fastB').onclick=()=>setSpeed(1);$('#histB').onclick=openHist;$('#setB').onclick=openDrawer;$('#scrim').onclick=closeDrawer;$('#dlB').onclick=()=>exportG();$('#modeB').onclick=openDrawer;
$('#fitB').onclick=()=>{cam.user=0;vis.fit()};$('#zinB').onclick=()=>{cam.tz=clamp(cam.tz*1.3,.2,3.2);cam.user=performance.now()+8000;cam.hold=0};$('#zoutB').onclick=()=>{cam.tz=clamp(cam.tz/1.3,.2,3.2);cam.user=performance.now()+8000;cam.hold=0};
$('#folB').onclick=e=>{cam.follow=!cam.follow;e.currentTarget.classList.toggle('on',cam.follow);e.currentTarget.setAttribute('aria-pressed',cam.follow);toast(cam.follow?'Kamera kritik olayları takip edecek':'Kamera takibi kapalı')};
$('#lchips').onclick=e=>{const b=e.target.closest('[data-lf]');if(b){lfilt=b.dataset.lf;logPaint()}};$('#log').onclick=e=>{const b=e.target.closest('[data-ev]');if(b)openEvent(b.dataset.ev)};
const SPD=[.5,1,2,4];function setSpeed(d){const i=SPD.indexOf(cfg.speed);cfg.speed=SPD[clamp((i<0?1:i)+d,0,SPD.length-1)];saveCfg();hudPaint();toast(`Oyun hızı ${cfg.speed}×`)}
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('.modal'))return $('.modal').remove();if($('#drawer.on'))return closeDrawer()}
  if(e.target.closest?.('input,select,textarea')||e.metaKey||e.ctrlKey||e.altKey||$('.modal')||$('#drawer.on'))return;const k=e.key.toLowerCase();
  if(k===' '){if(e.target.closest?.('button'))return;e.preventDefault();toggleRun()}else if(k==='e')endPhase();else if(k==='+'||k==='=')setSpeed(1);else if(k==='-')setSpeed(-1);else if(k==='f'){cam.user=0;vis.fit()}else if(k==='p')openDrawer();else if(k==='h')openHist();
  else if(['1','2','3'].includes(k)&&G.nations[+k-1]){cam.user=0;vis.focus(G.regions.find(x=>x.id===LET[+k-1]+'0'),1.2,0);cam.user=performance.now()+6000}});
addEventListener('resize',()=>vis.resize());addEventListener('beforeunload',()=>{if(G&&G.status==='running')G.status='paused';persist()});
document.addEventListener('visibilitychange',()=>{lastT=performance.now()});

/* ───────── başlangıç: kayıtlı savaş varsa duraklatılmış olarak geri yükle ───────── */
(function boot(){const s=lsg('warfront:cur',null);
  if(s&&s.nations&&s.regions&&s.cfg&&(s.phase==='prep'||s.phase==='war'||s.phase==='over')){G=s;G.rnd=mkRng(G.seed+'e'+G.log.length);if(G.status==='running')G.status='paused';G._restored=true;G.nations.forEach(n=>{n.thinking=false;n.pending=n.pending||[]});G.regions.forEach(r=>{r.sweep=0;r.prev=r.owner})}
  else eng.newGame();
  vis.build();vis.resize();legendPaint();logPaint();paint();showStart();if(cfg.mode==='live')ai.health().then(paint);requestAnimationFrame(frame)})();
</script>
</body>
