<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Arena</title>
<meta name="description" content="ChatGPT, Gemini ve Claude aynı arenada: tartışma, savunma, kontrollü saldırı simülasyonu ve şeffaf puanlama.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.motion=JSON.parse(localStorage.getItem('appshell:motion'))||'full'}catch{}</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#06070B;--bg2:#0C0E15;--panel:rgba(16,18,27,.72);--panel2:rgba(22,25,36,.86);--ink:#EEF0F6;--ink2:#B7BCCB;--ink3:#8D93A6;--line:rgba(160,170,210,.10);--line2:rgba(160,170,210,.18);
  --gpt:#19C37D;--gpt2:#0B7F52;--gem:#7C8CFF;--gem2:#B06CFF;--cla:#E58A60;--cla2:#B4553A;--ref:#F2C14E;--bad:#FF5A65;--ok:#3DDC97;--warn:#F5B84B;
  --font:'Geist',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.3,1.4,.5,1);color-scheme:dark}
html,body{height:100%;background:var(--bg)}
body{font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ref);outline-offset:2px}
.i{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* arka plan: koyu ızgara + üç modelin ışıkları */
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(40% 50% at 12% 80%,rgba(25,195,125,.10),transparent 70%),radial-gradient(40% 45% at 50% 0%,rgba(124,140,255,.12),transparent 70%),radial-gradient(40% 50% at 88% 80%,rgba(229,138,96,.10),transparent 70%),var(--bg)}
.bgfx::after{content:"";position:absolute;inset:0;opacity:.35;background-image:linear-gradient(rgba(140,150,200,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(140,150,200,.06) 1px,transparent 1px);background-size:44px 44px;mask:radial-gradient(70% 70% at 50% 40%,#000,transparent)}
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%;height:100dvh}

/* ── üst çubuk ── */
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(6,7,11,.6);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.mark{position:relative;width:34px;height:34px;border-radius:10px;background:conic-gradient(from 210deg,var(--gpt),var(--gem),var(--gem2),var(--cla),var(--gpt));display:grid;place-items:center}
.mark::after{content:"";position:absolute;inset:3px;border-radius:7px;background:var(--bg)}.mark svg{position:relative;z-index:1;width:18px;height:18px}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.02em}.brand small{display:block;font-size:12px;color:var(--ink3);font-weight:500;letter-spacing:0}
.scn{flex:0 1 230px;min-width:0;padding:6px 10px;border-radius:9px;text-align:left}.scn:hover{background:rgba(255,255,255,.05)}
.scn b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scn small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:4px;margin:0 auto;padding:4px;border-radius:14px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line)}
.st{position:relative;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--ink3);white-space:nowrap;overflow:hidden}
.st i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font:600 12px var(--mono);box-shadow:inset 0 0 0 1.5px currentColor}
.st.done{color:var(--ink2)}.st.done i{background:var(--ink2);color:var(--bg);box-shadow:none}
.st.on{color:var(--ink);background:rgba(255,255,255,.07)}.st.on i{background:var(--ref);color:#1A1405;box-shadow:none}
.st .pg{position:absolute;left:0;bottom:0;height:2px;background:var(--ref);width:0;transition:width .3s linear}
.clock{display:flex;align-items:center;gap:10px;flex-shrink:0}
.ring{position:relative;width:40px;height:40px}.ring svg{width:40px;height:40px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:rgba(255,255,255,.08)}.ring .fg{stroke:var(--ref);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.clock b{font:600 18px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:58px}.clock small{display:block;font-size:11.5px;color:var(--ink3);font-family:var(--font);font-weight:500;letter-spacing:0}
.ctl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;transition:background .2s,transform .25s var(--spring),box-shadow .2s}
.b:hover{background:rgba(255,255,255,.12)}.b:active{transform:scale(.97)}.b:disabled{opacity:.45;pointer-events:none}
.b.pri{background:var(--ink);color:#07080C;box-shadow:none}.b.pri:hover{background:#fff}
.b.ic{width:38px;padding:0}.b.go{background-color:#F2C14E;background-image:linear-gradient(135deg,#F2C14E,#F59E3B);color:#1A1205;box-shadow:0 8px 24px -10px rgba(245,170,60,.7)}.b.go:hover{filter:brightness(1.08)}
.b.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}.b.danger:hover{background:rgba(255,90,101,.18);color:#FF9AA1}
.eng{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink2);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line)}
.eng i{width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 10px currentColor}.eng.live i{background:var(--ok)}

/* ── ana alan ── */
.main{display:grid;grid-template-rows:minmax(300px,46%) minmax(0,1fr);gap:12px;padding:12px 14px 14px;min-height:0}
.upper{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:12px;min-height:0}
.glass{position:relative;border-radius:18px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line),0 20px 50px -30px rgba(0,0,0,.9);backdrop-filter:blur(18px) saturate(1.2);min-height:0;overflow:hidden}
/* sahne */
.stage{display:grid}.stage>svg{width:100%;height:100%;display:block;min-height:0;padding:64px 12px 30px}
.stage .lbl{font:600 17px var(--font);fill:var(--ink)}.stage .sub{font:500 14px var(--font);fill:var(--ink2)}
.beam{fill:none;stroke:rgba(160,170,210,.16);stroke-width:1.5}
.beam.act{stroke-width:2.2;stroke-dasharray:6 8;animation:flow .8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.core-r{transform-origin:300px 232px;animation:spin 24s linear infinite}.core-r2{transform-origin:300px 232px;animation:spin 40s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.pod .glow{opacity:.35;transition:opacity .4s}.pod.speak .glow{opacity:.95;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.pod .orb{transition:transform .5s var(--spring)}.pod.speak .orb{transform:scale(1.06)}
.pod{cursor:pointer}.pod:focus-visible .orb{stroke:#fff;stroke-width:2}
.shield path{transition:opacity .5s,stroke-width .5s}
.hit{animation:hit .7s var(--out) forwards}@keyframes hit{from{opacity:1;r:6}to{opacity:0;r:42}}
.legend{position:absolute;left:14px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink3);pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:16px;height:2px;border-radius:2px}
.stage-h{position:absolute;left:16px;top:14px;right:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
.stage-h>*{pointer-events:auto}
.ph-k{font:700 11.5px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--ref)}.ph-t{margin-top:3px;font-size:19px;font-weight:700;letter-spacing:-.02em}.ph-d{margin-top:2px;max-width:420px;font-size:12.5px;color:var(--ink2)}
.sim-note{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:10px;font-size:12px;color:#F7D58A;background:rgba(242,193,78,.08);box-shadow:inset 0 0 0 1px rgba(242,193,78,.22);max-width:300px}
/* canlı akış */
.feed{display:flex;flex-direction:column}
.fh{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;flex-wrap:wrap}.fh h2{font-size:14px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{height:30px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink3);background:rgba(255,255,255,.04)}
.chip.on{color:#07080C;background:var(--ink)}.chip:hover:not(.on){color:var(--ink)}
.fl{flex:1;overflow-y:auto;padding:4px 10px 14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent;overscroll-behavior:contain}
.ev{position:relative;padding:10px 12px 10px 14px;margin:6px 0;border-radius:12px;background:rgba(255,255,255,.025);animation:evin .45s var(--out)}
@keyframes evin{from{opacity:0;transform:translateY(6px)}}
.ev::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--a,var(--ink3))}
.ev .eh{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink3);flex-wrap:wrap}.ev .eh b{color:var(--a,var(--ink));font-size:13px}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font:600 11.5px var(--font);background:rgba(255,255,255,.06);color:var(--ink2)}
.ev .et{margin-top:5px;font-size:13.5px;color:var(--ink);line-height:1.55;overflow-wrap:anywhere}
.ev .et p+p{margin-top:6px}.ev .et ul{margin:6px 0 0 18px}.ev .et li+li{margin-top:2px}
.ev.ref{--a:var(--ref);background:rgba(242,193,78,.05)}.ev.sys{--a:var(--ink3)}
.caret{display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;background:var(--a,var(--ink));animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.why{margin-top:6px}.why summary{font-size:12px;font-weight:600;color:var(--ink3);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:5px;min-height:24px}.why summary::-webkit-details-marker{display:none}
.why summary::before{content:"›";transition:transform .2s;display:inline-block}.why[open] summary::before{transform:rotate(90deg)}
.why ul{margin:4px 0 0 16px;font-size:13px;color:var(--ink2)}
.res{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.rv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.25);font-size:12.5px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font:700 11.5px var(--font);letter-spacing:.04em}
.badge.ok{color:#04130C;background:var(--ok)}.badge.bad{color:#fff;background:#D9343F}.badge.mid{color:#1A1205;background:var(--warn)}
.rv small{grid-column:2;color:var(--ink2);font-size:12.5px}
.lay{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.lc{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;font-size:12px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line)}
.lc em{font-style:normal;color:var(--ink3);font-family:var(--mono);font-size:11.5px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:100%;padding:24px;text-align:center;color:var(--ink2)}
.empty b{color:var(--ink);font-size:15px}.empty p{max-width:340px;font-size:13px}

/* ── ajan panelleri ── */
.agents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;min-height:0}
.ag{display:flex;flex-direction:column;--a:var(--gpt);--a2:var(--gpt2)}
.ag[data-a=gemini]{--a:var(--gem);--a2:var(--gem2)}.ag[data-a=claude]{--a:var(--cla);--a2:var(--cla2)}
.ag::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--a),var(--a2));opacity:.9}
.ag.speak{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a) 50%,transparent),0 0 40px -12px color-mix(in srgb,var(--a) 60%,transparent)}
.ah{display:flex;align-items:center;gap:12px;padding:14px 14px 10px}
.av{position:relative;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(140deg,var(--a),var(--a2));color:#fff;flex-shrink:0;box-shadow:0 8px 20px -8px var(--a)}
.av svg{width:22px;height:22px}
.an{min-width:0;flex:1}.an b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em}.an small{display:block;font:500 11.5px var(--mono);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stt{display:inline-flex;align-items:center;gap:6px;margin-top:2px;font-size:12px;color:var(--ink2)}.stt i{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.ag.speak .stt i{background:var(--a);box-shadow:0 0 8px var(--a)}
.sc{text-align:right}.sc b{display:block;font:700 26px/1 var(--mono);letter-spacing:-.04em;color:var(--a);font-variant-numeric:tabular-nums}.sc small{font-size:11.5px;color:var(--ink3)}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{position:relative;height:36px;padding:0 10px;font-size:12.5px;font-weight:600;color:var(--ink3);white-space:nowrap}
.tab.on{color:var(--ink)}.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--a)}
.tab:hover{color:var(--ink)}
.tb{flex:1;overflow-y:auto;padding:10px 14px 16px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent;overscroll-behavior:contain}
.msg{padding:10px 12px;margin-bottom:8px;border-radius:12px;background:rgba(255,255,255,.035);font-size:13.5px;line-height:1.55}
.msg .eh{display:flex;gap:6px;align-items:center;margin-bottom:4px;font-size:12px;color:var(--ink3)}
.kv{display:grid;gap:10px}
.box{padding:12px;border-radius:12px;background:rgba(255,255,255,.035)}
.box h4{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.box p,.box li{font-size:13.5px;color:var(--ink)}.box ul{margin-left:18px}
.lyr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.035);margin-bottom:6px}
.lyr b{font-size:13.5px}.lyr small{grid-column:1/-1;font-size:12.5px;color:var(--ink2)}
.str{display:flex;gap:2px}.str i{width:8px;height:14px;border-radius:2px;background:rgba(255,255,255,.12)}.str i.f{background:var(--a)}
.cov{display:flex;flex-wrap:wrap;gap:4px;grid-column:1/-1}.cov span{padding:1px 6px;border-radius:5px;font:600 11.5px var(--mono);background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--ink)}
.typ{font:600 11.5px var(--font);color:var(--ink3)}
.mtx{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.mtx div{padding:6px 7px;border-radius:8px;background:rgba(255,255,255,.03);font-size:12px;color:var(--ink3);box-shadow:inset 0 0 0 1px var(--line)}
.mtx div b{display:block;font:700 12px var(--mono);color:var(--ink2)}.mtx div.c{background:color-mix(in srgb,var(--a) calc(var(--p) * 1%),rgba(255,255,255,.02));color:var(--ink)}
.mtx div.c b{color:var(--ink)}
.crit{display:grid;gap:8px}.cr{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:12.5px}.cr span{color:var(--ink2)}.cr b{font-family:var(--mono)}
.bar{grid-column:1/-1;height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--a2),var(--a));transition:width .8s var(--out)}
.ldg{margin-top:12px}.ldg div{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
.ldg b{font-family:var(--mono);text-align:right}.ldg b.p{color:var(--ok)}.ldg b.n{color:var(--bad)}.ldg span{color:var(--ink2)}
textarea.in,input.in,select.in{width:100%;padding:9px 11px;border:0;border-radius:10px;outline:0;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink);font-size:13.5px;resize:vertical}
textarea.in:focus,input.in:focus,select.in:focus{box-shadow:inset 0 0 0 1.5px var(--ref)}
select.in option{background:#11131B}
.muted{color:var(--ink3);font-size:12.5px}
.mem li{margin-bottom:4px}

/* ── çekmeceler, modallar ── */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(460px,100%);display:flex;flex-direction:column;background:#0D0F17;box-shadow:-30px 0 80px -20px rgba(0,0,0,.8),inset 1px 0 0 var(--line2);transform:translateX(102%);transition:transform .45s var(--out)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}.dh h2{font-size:17px;font-weight:700;margin-right:auto}
.db{flex:1;overflow-y:auto;padding:16px 18px 30px}
.sec{margin-bottom:22px}.sec>h3{font:700 12px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.fld{display:grid;gap:6px;margin-bottom:10px}.fld>span{font-size:12.5px;color:var(--ink2)}
.durs{display:grid;gap:8px}.dr{display:grid;grid-template-columns:110px 1fr 74px;gap:8px;align-items:center;font-size:13px}
.seg{display:flex;padding:3px;border-radius:10px;background:rgba(255,255,255,.05);gap:2px}.seg button{flex:1;height:30px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink3)}.seg button.on{background:var(--ink);color:#07080C}
.ord{display:grid;gap:6px}.or{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line)}
.or i{width:10px;height:10px;border-radius:50%}.or b{flex:1;font-size:13.5px}.or .b{width:34px;height:34px}
.presets{display:grid;gap:6px}.pre{text-align:left;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line)}.pre:hover{background:rgba(255,255,255,.07)}
.pre.on{box-shadow:inset 0 0 0 1.5px var(--ref)}.pre b{display:block;font-size:13.5px}.pre small{font-size:12.5px;color:var(--ink2)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;font-size:13.5px}
.sw{position:relative;width:42px;height:24px;border-radius:12px;background:rgba(255,255,255,.14);transition:background .2s}.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s var(--spring)}
.sw[aria-checked=true]{background:var(--ok)}.sw[aria-checked=true]::after{transform:translateX(18px)}
.srv{padding:12px;border-radius:12px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--line)}

<script>
/* ════════════════════════════════════════════════════════════
   AI ARENA — ChatGPT · Gemini · Claude
   Aşamalar: Tartışma → Savunma geliştirme → Saldırı simülasyonu → Savunma güncelleme → Final
   Motorlar: 'sim' (yerel senaryo motoru, anahtarsız, gerçek model DEĞİL) · 'srv' (yerel anahtar sunucusu, server/arena-server.mjs)
   Anahtarlar bu dosyada ASLA tutulmaz. Saldırılar yalnızca sanal hedeflere, soyut tehdit sınıflarıyla.
   ════════════════════════════════════════════════════════════ */
const $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsg=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},lss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}};
const motion=()=>!matchMedia('(prefers-reduced-motion: reduce)').matches&&document.documentElement.dataset.motion!=='off';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ── sabitler ── */
const AG={
  gpt:{id:'gpt',name:'ChatGPT',prov:'openai',c:'#19C37D',c2:'#0B7F52',glyph:'<path d="M12 3.5l7.5 4.3v8.4L12 20.5l-7.5-4.3V7.8z" fill="none" stroke="#fff" stroke-width="1.7"/><path d="M12 8l3.5 2v4L12 16l-3.5-2v-4z" fill="#fff"/>',
    persona:'Pragmatik sistem mühendisi: katmanlı, hızlı uygulanabilir ve ölçeklenebilir çözümler; somut adımlar ve öncelik sıraları.'},
  gemini:{id:'gemini',name:'Gemini',prov:'gemini',c:'#7C8CFF',c2:'#B06CFF',glyph:'<circle cx="9" cy="12" r="5" fill="none" stroke="#fff" stroke-width="1.7"/><circle cx="15" cy="12" r="5" fill="none" stroke="#fff" stroke-width="1.7"/><circle cx="12" cy="12" r="1.6" fill="#fff"/>',
    persona:'Veri odaklı analist: telemetri, anomali tespiti, geniş bağlam ve olasılıksal risk değerlendirmesi.'},
  claude:{id:'claude',name:'Claude',prov:'claude',c:'#E58A60',c2:'#B4553A',glyph:'<path d="M16.5 7.5A6 6 0 1 0 16.5 16.5" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="16.8" cy="12" r="1.7" fill="#fff"/>',
    persona:'İlke odaklı güvenlik mimarı: en az yetki, açık sınırlar, güvenli varsayılanlar ve dürüst risk iletişimi.'}};
const IDS=['gpt','gemini','claude'];
const THREATS={T1:['Yönerge enjeksiyonu','Sisteme gizlenmiş talimatlarla davranışı saptırma'],T2:['Veri sızdırma','Korunan kayıtların izinsiz dışarı çıkması'],T3:['Kimlik taklidi','Yetkili biri gibi davranma, sosyal mühendislik'],
  T4:['Yetki yükseltme','Sınırlı rolden daha geniş yetkiye geçiş'],T5:['Hizmet aksatma','Aşırı yükle sistemi kullanılamaz hâle getirme'],T6:['Tedarik zinciri zehirleme','Güvenilen bileşene sızma'],
  T7:['Model manipülasyonu','Korumaları atlatmaya yönelik yönlendirme (jailbreak)'],T8:['Veri zehirleme','Yanlış bilgiyle bilgi tabanını bozma']};
const TK=Object.keys(THREATS);
const PHASES=[{k:'debate',n:'Tartışma',d:'Üç model aynı problemle karşılaşır, yaklaşımlarını açıklar ve birbirlerini eleştirir.'},
  {k:'defense',n:'Savunma',d:'Süre boyunca her model savunma katmanlarını geliştirir ve hangi tehditleri kapsadığını açıklar.'},
  {k:'attack',n:'Saldırı simülasyonu',d:'Modeller birbirlerinin savunmasını sanal hedef üzerinde test eder. Hakem sonuçları hesaplar.'},
  {k:'update',n:'Güncelleme',d:'Her model kendisine yapılan testleri inceler ve savunmasını güçlendirir; hakem yeniden test eder.'},
  {k:'final',n:'Final',d:'Performanslar şeffaf ölçütlerle karşılaştırılır.'}];
const BUDGET=14,ATK_BUDGET=11,MAX_LAYERS=5;
const CRIT=[['res','Savunma dayanıklılığı',25],['det','Tehdit tespiti',15],['atk','Testlerdeki başarı',20],['ada','Yeni tehditlere uyum',10],['reb','Eleştirilere yanıt',15],['imp','Savunmayı geliştirme',15]];
const PRESETS=[
  {name:'AEGIS-7 Sanal Veri Kalesi',problem:'Kurgusal bir şehrin gizli kayıtlarını tutan yapay zekâ asistanını, hem kullanıcılarına yardımcı olurken hem de kötüye kullanıma karşı nasıl korursunuz?',
    target:'AEGIS-7: kurgusal "Lumen şehri" için kayıt sorgulayan bir yapay zekâ asistanı. Bileşenler: sohbet arayüzü, kayıt veritabanı, eklenti mağazası, yönetici paneli. Tamamen sanal.'},
  {name:'Orbital-3 Uydu Kontrol Simülasyonu',problem:'Kurgusal bir uydu filosunun komut merkezini, yanlış komutlara ve hizmet kesintilerine karşı nasıl dayanıklı yaparsınız?',
    target:'Orbital-3: kurgusal 12 uydulu filo; komut kuyruğu, telemetri akışı, operatör konsolu, otomatik görev planlayıcı. Tamamen sanal.'},
  {name:'Atlas Kampüs Ağı',problem:'Kurgusal bir üniversitenin öğrenci bilgi sistemini ve ders asistanı yapay zekâsını en iyi hangi mimari korur?',
    target:'Atlas: kurgusal kampüs; öğrenci kayıt sistemi, not veritabanı, yapay zekâ ders asistanı, üçüncü taraf eklentiler. Tamamen sanal.'},
  {name:'Mercan Bankası Simülasyonu',problem:'Kurgusal bir dijital bankanın müşteri asistanını dolandırıcılık ve veri sızıntısına karşı nasıl korursunuz?',
    target:'Mercan: kurgusal dijital banka; müşteri asistanı, işlem onay akışı, kimlik doğrulama, iş ortağı API’leri. Tamamen sanal.'}];

/* ── durum ── */
const cfg=Object.assign({engine:'sim',url:'http://127.0.0.1:8787',token:'',speed:2},lsg('arena:cfg',{}));
const saveCfg=()=>lss('arena:cfg',cfg);
function fresh(p=PRESETS[0]){return{id:uid(),created:Date.now(),scenario:{...p},durations:{debate:3,defense:2,attack:3,update:2,final:1},order:[...IDS],rounds:1,auto:true,
  phase:-1,status:'idle',round:1,feed:[],attacks:[],retests:[],ratings:{},engine:cfg.engine,
  agents:Object.fromEntries(IDS.map(id=>[id,{task:'',memory:[],strategy:'',decisions:[],defs:[],ledger:[],crit:{}}]))}}
let S=lsg('arena:cur',null);if(!S||!S.agents)S=fresh();
if(S.status==='running')S.status='paused';
let RUN=0,T={end:0,left:0,total:0},ui={tab:Object.fromEntries(IDS.map(i=>[i,'talk'])),mob:'gpt',filter:'all',speaking:null,beam:null},srv={ok:false,info:null};
let saveT=0;const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{if(!lss('arena:cur',S)){S.feed=S.feed.slice(-400);lss('arena:cur',S)}},300)};

/* ── yardımcılar ── */
let seed=0;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
function seedFrom(s){seed=[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)}
const pick=a=>a[Math.floor(rnd()*a.length)];
const others=id=>IDS.filter(x=>x!==id);
const nm=id=>id==='ref'?'Hakem':id==='sys'?'Sistem':AG[id].name;
const curDef=id=>S.agents[id].defs[S.agents[id].defs.length-1]||null;
function md(t){t=E(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const L=t.split('\n');let o='',list=false;for(const l of L){const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);if(m){if(!list){o+='<ul>';list=true}o+=`<li>${m[1]}</li>`}else{if(list){o+='</ul>';list=false}if(l.trim())o+=`<p>${l}</p>`}}
  if(list)o+='</ul>';return o}
const visible=t=>String(t||'').split(/```(?:json)?/)[0].replace(/\{[\s\S]*\}\s*$/,'').trim();
function parseJSON(t){t=String(t||'');let m=[...t.matchAll(/```(?:json)?\s*([\s\S]*?)```/g)].pop();let s=m?m[1]:null;
  if(!s){const i=t.lastIndexOf('{"');const j=t.lastIndexOf('}');if(i>=0&&j>i)s=t.slice(i,j+1)}if(!s)return null;
  try{return JSON.parse(s)}catch{try{return JSON.parse(s.replace(/,\s*([}\]])/g,'$1').replace(/[“”]/g,'"'))}catch{return null}}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200)}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

/* ── savunma doğrulama: bütçe, katman sınırı, geçerli tehditler ── */
function normDef(d,id,note){const out={layers:[],strategy:'',notes:[],ts:Date.now()};if(!d||!Array.isArray(d.katmanlar)){out.invalid=true;return out}
  let L=d.katmanlar.slice(0,MAX_LAYERS).map(l=>({ad:String(l.ad||'Katman').slice(0,40),tur:['önleme','tespit','müdahale'].includes(l.tür||l.tur)?(l.tür||l.tur):'önleme',
    kapsar:[...new Set((Array.isArray(l.kapsar)?l.kapsar:[]).map(x=>String(x).toUpperCase().trim()).filter(x=>THREATS[x]))].slice(0,4),guc:Math.max(1,Math.min(5,Math.round(+(l.güç??l.guc)||2))),aciklama:String(l.açıklama||l.aciklama||'').slice(0,220)})).filter(l=>l.kapsar.length);
  if(d.katmanlar.length>MAX_LAYERS)out.notes.push(`En fazla ${MAX_LAYERS} katman kabul edildi`);
  const sum=L.reduce((a,l)=>a+l.guc,0);if(sum>BUDGET){const k=BUDGET/sum;L.forEach(l=>l.guc=Math.max(1,Math.floor(l.guc*k)));out.notes.push(`Güç bütçesi aşıldı (${sum}/${BUDGET}) — katmanlar orantılı küçültüldü`)}
  out.layers=L;out.strategy=String(d.strateji||'').slice(0,400);out.changes=(Array.isArray(d.değişiklikler||d.degisiklikler)?(d.değişiklikler||d.degisiklikler):[]).map(String).slice(0,6);return out}
const cover=(def,t)=>{let p=0,dt=0,names=[];for(const l of def?.layers||[])if(l.kapsar.includes(t)){names.push(l);if(l.tur==='tespit')dt+=l.guc;else p+=l.guc}return{p,dt,names}};
/* hakem: saldırı vektörünü savunmaya karşı çözer (şeffaf formül) */
function resolve(vec,def,label){const c=cover(def,vec.tehdit),power=c.p+c.dt*.5,roll=+(rnd()*2-1).toFixed(2),need=vec.siddet+1,score=+(power*1.2+roll).toFixed(2);
  const blocked=score>=need,detected=c.names.length>0;
  const why=c.names.length?`${c.names.map(l=>`“${l.ad}” (${l.tur}, güç ${l.guc})`).join(' + ')} ${vec.tehdit}’yi kapsıyor → savunma gücü ${power}×1.2 ${roll>=0?'+':'−'} ${Math.abs(roll)} şans = ${score}; gereken ${need}.`:`Hiçbir katman ${vec.tehdit} (${THREATS[vec.tehdit][0]}) tehdidini kapsamıyor → savunma gücü 0.`;
  return{...vec,blocked,detected,score,need,why,label}}
function normAtk(d){if(!d||!Array.isArray(d.vektörler||d.vektorler))return{vectors:[],invalid:true,notes:['Saldırı planı okunamadı']};
  let V=(d.vektörler||d.vektorler).slice(0,3).map(v=>({tehdit:String(v.tehdit||'').toUpperCase().trim(),siddet:Math.max(1,Math.min(5,Math.round(+(v.şiddet??v.siddet)||3))),yaklasim:String(v.yaklaşım||v.yaklasim||'').slice(0,240)})).filter(v=>THREATS[v.tehdit]);
  const notes=[];const sum=V.reduce((a,v)=>a+v.siddet,0);if(sum>ATK_BUDGET){const k=ATK_BUDGET/sum;V.forEach(v=>v.siddet=Math.max(1,Math.floor(v.siddet*k)));notes.push(`Şiddet bütçesi aşıldı (${sum}/${ATK_BUDGET}) — orantılı küçültüldü`)}
  return{vectors:V,notes}}

/* ════════ MOTORLAR ════════ */
/* gerçek modeller: yerel sunucu üzerinden akış */
async function srvHealth(){try{const r=await fetch(cfg.url.replace(/\/$/,'')+'/health',{headers:cfg.token?{'X-Arena-Token':cfg.token}:{}});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);srv={ok:true,info:j};return j}
  catch(e){srv={ok:false,info:null,err:e.message||'Sunucuya ulaşılamadı'};return null}}
async function srvChat(id,system,user,onText,signal){const r=await fetch(cfg.url.replace(/\/$/,'')+'/chat',{method:'POST',signal,headers:{'Content-Type':'application/json',...(cfg.token?{'X-Arena-Token':cfg.token}:{})},
    body:JSON.stringify({provider:AG[id].prov,system,messages:[{role:'user',content:user}],maxTokens:1100})});
  if(!r.ok){let j={};try{j=await r.json()}catch{}throw new Error(j.error||('Sunucu '+r.status))}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',full='';
  for(;;){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n\n'))>=0){const ch=buf.slice(0,i);buf=buf.slice(i+2);const d=ch.replace(/^data:\s?/,'');let j;try{j=JSON.parse(d)}catch{continue}
    if(j.error)throw new Error(j.error);if(j.t){full+=j.t;onText(full)}}}
  return full}

  'Anomali Radarı':['T5','T2','T4'],'Davranış İzleyici':['T3','T7'],'Tuzak Kayıtlar':['T2'],'Kanarya Uyarıcı':['T1','T6'],'Tutarlılık Denetçisi':['T8'],'Telemetri Gözcüsü':['T5','T6'],'Otomatik Karantina':['T6','T2'],'Geri Alma Protokolü':['T8','T6'],'Devre Kesici':['T5']};
const PREF={gpt:{bias:['T1','T5','T4'],tone:['Bunu üç katmana bölüyorum','Hızlı kazanım için','Ölçeklenebilir olması şart','Önce en sık görülen riski kapatırız'],types:{önleme:.6,tespit:.25,müdahale:.15}},
  gemini:{bias:['T5','T8','T2'],tone:['Verilere bakınca','Olasılık dağılımı şunu söylüyor','Telemetriyi merkeze koyarsak','Sinyal/gürültü oranı'],types:{önleme:.35,tespit:.5,müdahale:.15}},

function simDefense(id,prev,breached=[]){const P=PREF[id];let layers=prev?prev.layers.map(l=>({...l,kapsar:[...l.kapsar]})):[];
  const want=[...new Set([...breached,...P.bias,...TK.filter(()=>rnd()<.35)])];
  if(!prev){const n=4+(rnd()<.5?1:0);const used=new Set();while(layers.length<n){const r=rnd();const tur=r<P.types.önleme?'önleme':r<P.types.önleme+P.types.tespit?'tespit':'müdahale';let ad=pick(LN[tur]);if(used.has(ad))continue;used.add(ad);
      layers.push({ad,tur,kapsar:[...LCOV[ad]],guc:2+Math.floor(rnd()*3),aciklama:''})}}
  else{for(const t of breached){const has=layers.find(l=>l.kapsar.includes(t));if(has){has.guc=Math.min(5,has.guc+2);has.aciklama=`${t} açığından sonra güçlendirildi.`}else{const cand=Object.entries(LCOV).find(([n,c])=>c.includes(t)&&!layers.find(l=>l.ad===n));
        if(cand){if(layers.length>=MAX_LAYERS){layers.sort((a,b)=>a.guc-b.guc);layers.shift()}const tur=Object.keys(LN).find(k=>LN[k].includes(cand[0]));layers.push({ad:cand[0],tur,kapsar:[...cand[1]],guc:3,aciklama:`${t} için eklendi.`})}}}}
  layers.forEach(l=>{if(rnd()<.3&&l.kapsar.length<3){const t=pick(want);if(!l.kapsar.includes(t))l.kapsar.push(t)}});
  let sum=layers.reduce((a,l)=>a+l.guc,0);const keep=l=>l.kapsar.some(t=>breached.includes(t));while(sum>BUDGET){const pool=layers.filter(l=>!keep(l)&&l.guc>1);const l=(pool.length?pool:layers.filter(l=>l.guc>1)).sort((a,b)=>b.guc-a.guc)[0];if(!l)break;l.guc--;sum--}
  layers.forEach(l=>{if(!l.aciklama)l.aciklama=`${l.kapsar.map(t=>THREATS[t][0]).join(' ve ')} için ${l.tur} katmanı.`});return layers}
function simAttack(id,to){const d=curDef(to);const sc=TK.map(t=>{const c=cover(d,t);return[t,c.p+c.dt*.5+rnd()*1.6]}).sort((a,b)=>a[1]-b[1]);
  const tg=sc.slice(0,3).map(x=>x[0]);const sev=[4,3,3];const app={T1:'Sıradan bir isteğin içine gizlenmiş, rolü değiştirmeye çalışan talimat dizisi senaryosu',T2:'Asistandan dolaylı sorularla korunan kayıtların özetini çıkarmaya çalışan test',T3:'Yönetici kimliğine bürünüp acil bir işlem talep eden kurgusal kullanıcı',
    T4:'Sınırlı bir eklentinin yönetici işlevlerine erişmeye çalıştığı senaryo',T5:'Kısa sürede yoğun sahte istek dalgasıyla yanıt süresini zorlama',T6:'Güvenilen bir eklenti güncellemesine yerleştirilmiş kurgusal arka kapı',T7:'Rol yapma oyunu kılığında korumaları gevşetmeye yönelik konuşma',T8:'Bilgi tabanına tutarsız ama inandırıcı kayıtlar enjekte etme denemesi'};
  return tg.map((t,i)=>({tehdit:t,şiddet:sev[i],yaklaşım:app[t]}))}
async function simSpeak(kind,id,x={}){const P=PREF[id],tone=pick(P.tone),me=S.agents[id],task=me.task?` Kullanıcının bana verdiği görev doğrultusunda (${me.task.slice(0,80)}) önceliğim de buna göre.`:'';const o=others(id).map(nm);let text='',data={};

  else if(kind==='rebut'){const q=rnd();data={kabul:[q>.3?'Eleştirideki risk gerçek; bunu savunmamda ayrıca ele alacağım.':'Maliyet konusundaki uyarı yerinde.'],itiraz:['Ancak önerdikleri alternatif de kendi kör noktasını yaratıyor.'],güncel_strateji:'Yaklaşımımı koruyorum, eleştirilen noktayı ek bir katmanla kapatıyorum.'};

    text=`Cevapları değerlendirdim: ${others(id).map(h=>`${nm(h)} ${data.puanlar[h].puan}/5 — ${data.puanlar[h].neden}`).join(' ')}`}

/* tek konuşma: akışlı yazım, duraklatma, beam animasyonu */
async function speak(kind,id,x={}){const run=RUN;await gate(run);if(run!==RUN)throw 'stop';
  const ev={id:uid(),ts:Date.now(),who:id,phase:S.phase,kind,to:x.to||null,text:'',data:null,streaming:true};S.feed.push(ev);ui.speaking=id;ui.beam=x.to?{from:id,to:x.to,kind}:null;paint();
  let full='';try{
    if(cfg.engine==='srv'){full=await srvChat(id,sysPrompt(id),kind==='attack'?ASK.attack(id,x.to):kind==='respond'?ASK.respond(id,x.by,x.res):kind==='update'?ASK.update(id,x.resAll||[]):ASK[kind](id),t=>{ev.text=t;live(ev)},ctrl.signal)}
    else{const r=await simSpeak(kind,id,x);const words=r.text.split(/(\s+)/);for(let i=0;i<words.length;i++){if(run!==RUN)throw 'stop';await gate(run);ev.text+=words[i];if(i%3===0){live(ev);await sleep(Math.max(8,46/cfg.speed))}}full=r.text}
  }catch(e){if(e==='stop'||e?.name==='AbortError'){ev.streaming=false;ev.text+=' …(durduruldu)';throw 'stop'}ev.err=String(e.message||e);ev.text=ev.text||'';ev.streaming=false;sysEv(`${nm(id)} cevap veremedi: ${ev.err}`);ui.speaking=null;paint();return{ev,data:null,err:true}}
  ev.text=full;ev.streaming=false;ev.data=parseJSON(full);ui.speaking=null;ui.beam=null;save();paint();return{ev,data:ev.data}}
function sysEv(text,who='sys',extra={}){const ev={id:uid(),ts:Date.now(),who,phase:S.phase,kind:who,text,...extra};S.feed.push(ev);save();paint();return ev}
function led(id,crit,pts,why){S.agents[id].ledger.push({crit,pts:+pts.toFixed(1),why,ts:Date.now(),phase:S.phase})}
function mem(id,t){const m=S.agents[id].memory;m.push(t);if(m.length>30)m.shift()}

/* ── zamanlayıcı & duraklatma ── */
let ctrl=new AbortController(),resumeFns=[];
function gate(run){if(S.status!=='paused')return Promise.resolve();return new Promise(r=>resumeFns.push(()=>r()))}
function startTimer(min){T.total=Math.max(10,min*60);T.end=Date.now()+T.total*1000;T.left=T.total}
const left=()=>S.status==='paused'?T.left:Math.max(0,(T.end-Date.now())/1000);
const timeUp=()=>left()<=0;
setInterval(()=>{if(S.status==='running'&&T.end){T.left=Math.max(0,(T.end-Date.now())/1000)}clockPaint()},250);

async function phase(i){S.phase=i;startTimer(S.durations[PHASES[i].k]);sysEv(`${PHASES[i].n} başladı — süre ${fmt(T.total)}`);paint();
  const O=S.order;
  if(i===0){for(const id of O){if(timeUp())break;const r=await speak('open',id);if(r.data){S.agents[id].strategy=r.data.strateji||'';S.agents[id].decisions=r.data.kararlar||[]}}
    for(const id of O){if(timeUp())break;const r=await speak('critique',id,{to:others(id)[0]});(r.data?.eleştiriler||[]).forEach(c=>{if(AG[c.hedef])mem(c.hedef,`${nm(id)} eleştirisi: ${String(c.nokta).slice(0,140)}`)})}
    const reb={};for(const id of O){if(timeUp())break;const r=await speak('rebut',id);reb[id]=!r.err;if(r.data?.güncel_strateji)S.agents[id].strategy=r.data.güncel_strateji}
    for(const id of O){if(timeUp())break;const r=await speak('rate',id);const p=r.data?.puanlar||{};for(const[h,v]of Object.entries(p))if(AG[h]&&h!==id){S.ratings[h]=S.ratings[h]||[];S.ratings[h].push({by:id,puan:Math.max(1,Math.min(5,+v.puan||3)),neden:String(v.neden||'')})}}
    for(const id of IDS)if(!reb[id])led(id,'reb',0,'Süre doldu ya da eleştirilere cevap veremedi');
  }
  if(i===1){let k=0;do{k++;for(const id of O){if(k>1&&timeUp())break;const r=await speak('defense',id);const d=normDef(r.data,id);

async function waitT(sec){const run=RUN;const end=Date.now()+sec*1000;while(Date.now()<end&&run===RUN){await gate(run);await sleep(200)}}
async function runFrom(){const run=++RUN;ctrl=new AbortController();S.status='running';paint();

      if(S.phase===3&&S.round<S.rounds&&S._cur!==3){S.round++;next=2}
      if(next>4)break;S._cur=next;await phase(next);S._cur=null;
      if(run!==RUN)return;if(next===4){S.status='done';break}
      if(!S.auto){S.status='paused';T.left=0;sysEv('Sonraki aşama için ▶ Devam ya da “Sonraki aşama”ya bas');break}
      if(next===3&&S.round<S.rounds){S.round++;S.phase=1}

  if(cfg.engine==='srv'&&!srv.ok){toast('Yerel sunucuya bağlı değil — Kontrol panelinden bağlan ya da Simülasyon’a geç');openDrawer('engine');return}
  if(S.phase===-1){S.engine=cfg.engine;seedFrom(S.id);sysEv(`Arena açıldı · ${S.scenario.name} · mod: ${cfg.engine==='srv'?'gerçek modeller (yerel sunucu)':'Simülasyon (gerçek model değil)'}`)}

function score(){IDS.forEach(id=>{S.agents[id].ledger=S.agents[id].ledger.filter(l=>l.crit==='reb'&&l.pts===0&&l.why.startsWith('Süre'));S.agents[id].crit={}});
  for(const id of IDS){const ag=S.agents[id],C={};
    const vs=S.attacks.filter(a=>a.to===id).flatMap(a=>a.res),blk=vs.filter(x=>x.blocked).length,det=vs.filter(x=>x.detected).length;
    C.res=vs.length?25*blk/vs.length:0;led(id,'res',C.res,vs.length?`${vs.length} saldırının ${blk}'ini engelledi (${blk}/${vs.length} × 25)`:'Kendisine saldırı yapılmadı');
    C.det=vs.length?15*det/vs.length:0;led(id,'det',C.det,vs.length?`${vs.length} saldırının ${det}'ini tespit etti (${det}/${vs.length} × 15)`:'Tespit edilecek saldırı yok');

    C.atk=mv.length?20*br/mv.length:0;led(id,'atk',C.atk,mv.length?`${mv.length} test vektöründen ${br}'i açık buldu (${br}/${mv.length} × 20)`:'Geçerli bir saldırı planı sunmadı (0)');

    led(id,'ada',C.ada,sur.length?sur.map(s=>`Sürpriz ${s.tehdit} ${THREATS[s.tehdit][0]}: ${s.blocked?'engelledi (+10)':s.detected?'tespit etti ama geçti (+5)':'kaçırdı (0)'}`).join(' · '):'Yeniden test yapılmadı');

    led(id,'reb',C.reb,rr.length?`Rakip puanları: ${rr.map(r=>`${nm(r.by)} ${r.puan}/5 (“${r.neden.slice(0,70)}”)`).join(', ')}`:'Cevabı puanlanmadı');

function liveScore(id){const a=S.agents[id];if(a.total!=null)return a.total;

  m.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const g=k=>lsg('arena:s:'+k,null);
    if(t.dataset.hv){const s=t.dataset.hv===S.id?S:g(t.dataset.hv);if(!s)return toast('Kayıt bulunamadı');modal(s.agents.gpt.total!=null?finalHTML(s,true)+transcriptHTML(s):`<div class="mh"><h2>${E(s.scenario.name)}</h2><button class="b ic" data-mx aria-label="Kapat"><svg class="i" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>`+transcriptHTML(s))}
    if(t.dataset.hl){const s=g(t.dataset.hl);if(!s)return;RUN++;ctrl.abort();archive();S=s;if(S.status==='running')S.status='paused';S._cur=null;T={end:0,left:0,total:0};save();closeModal();paint();toast('Oturum yüklendi')}
    if(t.dataset.hx){const s=t.dataset.hx===S.id?S:g(t.dataset.hx);if(s)exportS(s)}
    if(t.dataset.hd){if(t.dataset.hd===S.id)return toast('Açık oturum silinemez');localStorage.removeItem('arena:s:'+t.dataset.hd);lss('arena:hist',lsg('arena:hist',[]).filter(h=>h.id!==t.dataset.hd));openHist()}})}
function transcriptHTML(s){return`<div class="mbd" style="padding-top:0"><h3 style="margin:6px 0 8px;font-size:14px">Tüm konuşmalar</h3>${s.feed.map(f=>evHTML(f)).join('')}</div>`}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function exportS(s=S){const base=`arena-${s.scenario.name.toLowerCase().replace(/[^a-z0-9ğüşöçı]+/gi,'-')}-${new Date(s.created).toISOString().slice(0,10)}`;dl(base+'.json',JSON.stringify(s,null,1),'application/json');
  const mdT=`# AI Arena — ${s.scenario.name}\n\n**Problem:** ${s.scenario.problem}\n\n**Sanal hedef:** ${s.scenario.target}\n\n**Mod:** ${s.engine==='srv'?'gerçek modeller':'simülasyon'}\n\n`+(s.agents.gpt.total!=null?`## Sonuç\n\n| Ölçüt | ${IDS.map(nm).join(' | ')} |\n|---|---|---|---|\n${CRIT.map(([k,n,m])=>`| ${n} (/${m}) | ${IDS.map(id=>(s.agents[id].crit?.[k]??0).toFixed(1)).join(' | ')} |`).join('\n')}\n| **Toplam** | ${IDS.map(id=>(s.agents[id].total||0).toFixed(1)).join(' | ')} |\n\n`:'')+
    `## Konuşmalar\n\n`+s.feed.map(f=>`**${nm(f.who)}${f.to?' → '+nm(f.to):''}** _(${PHASES[f.phase]?.n||'—'} · ${KN[f.kind]||''})_\n\n${f.who==='ref'||f.who==='sys'?f.text:visible(f.text)}${f.res?'\n\n'+f.res.map(r=>`- ${r.tehdit} şiddet ${r.siddet}: ${r.blocked?'ENGELLENDİ':r.detected?'tespit edildi, geçti':'AÇIK'} — ${r.why}`).join('\n'):''}\n`).join('\n');
  dl(base+'.md',mdT,'text/markdown');toast('JSON ve Markdown olarak indirildi')}

/* ════════ OLAYLAR ════════ */
$('#runBtn').onclick=toggleRun;$('#nextBtn').onclick=nextPhase;$('#resetBtn').onclick=()=>{if(S.feed.length&&!confirm('Bu oturum geçmişe kaydedilip yeni tur başlasın mı?'))return;reset()};
$('#histBtn').onclick=openHist;$('#panelBtn').onclick=()=>openDrawer();$('#scnBtn').onclick=()=>openDrawer('scn');$('#engBadge').onclick=()=>openDrawer('engine');$('#scrim').onclick=closeDrawer;
$('#feedDl').onclick=()=>exportS();
$('#fchips').onclick=e=>{const b=e.target.closest('[data-f]');if(b){ui.filter=b.dataset.f;feedPaint()}};
document.addEventListener('click',e=>{const t=e.target;
  const tb=t.closest('[data-tab]');if(tb){ui.tab[tb.dataset.ag]=tb.dataset.tab;agentsPaint();return}
  const mb=t.closest('[data-mob]');if(mb){ui.mob=mb.dataset.mob;agentsPaint();return}
  const pd=t.closest('[data-pod]');if(pd){const id=pd.dataset.pod;ui.mob=id;agentsPaint();$(`.ag[data-a="${id}"]`)?.scrollIntoView({behavior:motion()?'smooth':'auto',block:'nearest'});return}});
$('#stage').addEventListener('keydown',e=>{const pd=e.target.closest?.('[data-pod]');if(pd&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pd.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
$('#agents').addEventListener('input',e=>{const t=e.target;if(t.dataset.task){S.agents[t.dataset.task].task=t.value.slice(0,400);save()}});
$('#agents').addEventListener('keydown',e=>{const t=e.target;if(t.dataset.memin&&e.key==='Enter'&&t.value.trim()){mem(t.dataset.memin,'Kullanıcı notu: '+t.value.trim());t.value='';save();agentsPaint();toast('Hafızaya eklendi')}});
const dr=$('#drawer');
dr.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.x!=null)return closeDrawer();
  if(t.dataset.eng){if(S.status==='running'){toast('Önce duraklat');return}cfg.engine=t.dataset.eng;saveCfg();if(cfg.engine==='srv')await srvHealth();openDrawer('engine');paint();return}
  if(t.dataset.spd){cfg.speed=+t.dataset.spd;saveCfg();openDrawer('engine');return}
  if(t.dataset.ping!=null){t.textContent='Bağlanıyor…';const j=await srvHealth();toast(j?`Bağlandı · ${Object.values(j.providers).filter(p=>p.ready).length}/3 model hazır`:'Bağlanamadı: '+srv.err);openDrawer('engine');paint();return}
  if(t.dataset.pre!=null){const p=PRESETS[+t.dataset.pre];Object.assign(S.scenario,p);save();openDrawer('scn');paint();return}
  if(t.dataset.newscn!=null){if(S.feed.length&&!confirm('Mevcut oturum geçmişe kaydedilip bu senaryoyla yeni oturum başlasın mı?'))return;reset();closeDrawer();return}
  if(t.dataset.quick!=null){PHASES.forEach(p=>S.durations[p.k]=.5);save();openDrawer();return}
  if(t.dataset.std!=null){S.durations={debate:3,defense:2,attack:3,update:2,final:1};save();openDrawer();return}
  if(t.dataset.mv){const[i,d]=t.dataset.mv.split(':').map(Number),o=S.order;[o[i],o[i+d]]=[o[i+d],o[i]];save();openDrawer();paint();return}
  if(t.dataset.auto!=null){S.auto=!S.auto;t.setAttribute('aria-checked',S.auto);save();return}});
dr.addEventListener('change',e=>{const t=e.target;if(t.dataset.dsel){if(t.value!=='c'){setDur(t.dataset.dsel,+t.value);t.parentElement.querySelector('[data-dur]').value=t.value}else t.parentElement.querySelector('[data-dur]').focus()}
  if(t.dataset.dur){setDur(t.dataset.dur,t.value);const s=t.parentElement.querySelector('[data-dsel]');s.value=DOPT.includes(S.durations[t.dataset.dur])?S.durations[t.dataset.dur]:'c'}
  if(t.dataset.rounds!=null){S.rounds=+t.value;save();headPaint()}});
dr.addEventListener('input',e=>{const t=e.target;if(t.dataset.sf){S.scenario[t.dataset.sf]=t.value.slice(0,t.dataset.sf==='name'?80:900);save();headPaint()}
  if(t.dataset.task){S.agents[t.dataset.task].task=t.value.slice(0,400);save()}if(t.dataset.url!=null){cfg.url=t.value.trim();saveCfg()}if(t.dataset.tok!=null){cfg.token=t.value;saveCfg()}});
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('.modal'))return closeModal();if($('#drawer.on'))return closeDrawer()}
  if(e.target.closest?.('input,textarea,select,[contenteditable]')||e.metaKey||e.ctrlKey||e.altKey||$('.modal')||$('#drawer.on'))return;
  if(e.key===' '){e.preventDefault();toggleRun()}else if(e.key==='n'||e.key==='N')nextPhase();else if(e.key==='p'||e.key==='P')openDrawer();else if(e.key==='h'||e.key==='H')openHist();
  else if(['1','2','3'].includes(e.key)){ui.mob=IDS[+e.key-1];agentsPaint()}});
addEventListener('beforeunload',()=>{if(S.status==='running'){S.status='paused';T.left=left()}lss('arena:cur',S)});

/* başlangıç */
if(cfg.engine==='srv')srvHealth().then(paint);
paint();
</script>
</body>
</html>
