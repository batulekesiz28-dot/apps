<style>

.gate[hidden],.spin[hidden],.gbtn[hidden],.lnk[hidden]{display:none}.gate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:var(--bg)}.gate-c{display:grid;justify-items:center;gap:12px;text-align:center;width:min(320px,100%)}
.gbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2);font-weight:600}

<body>
<div class="wrap">
  <header class="top">
    <div><h1>İstatistik merkezi</h1><p class="sub" id="sub">Notlar, Study Log ve Kütüphane'deki gerçek verilerin</p></div>
    <div class="filters">
      <div class="seg" id="rng" role="radiogroup" aria-label="Zaman aralığı"></div>
      <span class="dates" id="dates"><input type="date" id="d0" aria-label="Başlangıç"><span>–</span><input type="date" id="d1" aria-label="Bitiş"></span>
      <button class="ib" id="refresh" title="Verileri yenile" aria-label="Verileri yenile"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg></button>
    </div>

<div class="gate" id="gate" hidden role="dialog" aria-modal="true" aria-label="Giriş"><div class="gate-c"><h1 style="font-size:22px">İstatistik</h1><p id="gMsg" class="sub"></p><span class="spin" id="gSpin"></span><button class="gbtn" id="gBtn" hidden>Google ile giriş yap</button><button class="lnk" id="gOut" hidden>Başka hesapla dene</button></div></div>
<script>
'use strict';
/* ════════════════════════════════════════════════════════════
   İstatistik merkezi — sadece gerçek veri. Kaynaklar:
   Notlar  hub/notes/pages   (yerel: notlar:v1)  → sayfalar, yapılacaklar, oluşturma/düzenleme
   Study   hub/studylog (+sessions) (yerel: studylog:v1) → çalışma dakikaları, dersler, görevler
   Kütüphane hub/kb/items    (yerel: kb:v1)      → içerikler, türler, durumlar
   Veri yoksa sıfır / boş durum gösterilir; hiçbir sayı uydurulmaz.
   ════════════════════════════════════════════════════════════ */
const $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsg=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const FB={apiKey:'AIzaSyDpJc9g4XDBq32T9Pf1UKbuhzRmnx__mak',authDomain:'apps-f1cfd.firebaseapp.com',projectId:'apps-f1cfd'};
const OWNER='batulekesiz28@gmail.com',CLOUD=/^https?:$/.test(location.protocol)&&!new URLSearchParams(location.search).has('local');
const DAY=864e5,MON=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'],WD=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const dk=d=>{d=new Date(d);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},sod=d=>{d=new Date(d);d.setHours(0,0,0,0);return d};
const plain=h=>{const d=document.createElement('div');d.innerHTML=String(h||'');return d.textContent||''};
const fmtAx=v=>v>=60?String(Math.round(v/6)/10).replace('.',',')+' sa':Math.round(v)+' dk';
const fm=m=>{m=Math.round(m);return m<60?m+' dk':Math.floor(m/60)+' sa'+(m%60?' '+m%60+' dk':'')};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const MEDIA={movie:'Film',series:'Dizi',anime:'Anime',game:'Oyun'},READ={book:'Kitap',pdf:'PDF',article:'Makale',research:'Araştırma',doc:'Belge'},WATCH={youtube:'Video',course:'Eğitim'};
const TYPEN={...MEDIA,...READ,...WATCH,web:'Web sitesi',image:'Görsel',file:'Dosya'};

/* ── veri ── */
const D={pages:[],sessions:[],study:{subjects:[],tasks:[]},items:[],acts:[],src:''};
async function loadLocal(){D.pages=lsg('notlar:v1',[])||[];const s=lsg('studylog:v1',null);D.sessions=s?.sessions||[];D.study={subjects:s?.set?.subjects||[],tasks:s?.set?.tasks||[]};D.items=lsg('kb:v1',{})?.items||[];D.acts=lsg('time:v1',{})?.acts||[];D.src='Bu tarayıcıdaki yerel veriler'}
async function loadCloud(fs){const [p,st,ss,it,ac]=await Promise.all([fs.collection('hub').doc('notes').collection('pages').get(),fs.collection('hub').doc('studylog').get(),fs.collection('hub').doc('studylog').collection('sessions').get(),fs.collection('hub').doc('kb').collection('items').get(),fs.collection('hub').doc('time').collection('acts').get().catch(()=>({docs:[]}))]);D.acts=ac.docs.map(d=>d.data());
  D.pages=p.docs.map(d=>d.data());const v=st.data()||{};D.study={subjects:v.subjects||[],tasks:v.tasks||[]};D.sessions=ss.docs.map(d=>d.data());D.items=it.docs.map(d=>d.data());D.src='Buluttaki veriler (Firestore)'}
let FS=null;async function load(){if(FS)await loadCloud(FS);else await loadLocal();derive();render()}

/* türetilmiş olaylar: her biri gerçek bir kayıttan */
let EV=[],TODOS=[],PROJ=[];
function derive(){EV=[];TODOS=[];
  for(const p of D.pages){const t=p.title||'Adsız sayfa';if(p.created)EV.push({at:+p.created,src:'note',t:`Sayfa oluşturuldu: ${t}`,id:p.id});if(p.updated&&p.updated-(p.created||0)>60e3)EV.push({at:+p.updated,src:'note',t:`Sayfa düzenlendi: ${t}`,id:p.id,edit:1});
    for(const b of p.blocks||[])if(b.t==='todo'&&plain(b.h).trim())TODOS.push({text:plain(b.h).trim(),done:!!b.c,page:t,at:+p.updated||0,src:'note'})}
  for(const t of D.study.tasks||[]){TODOS.push({text:t.text,done:!!t.done,page:'Study Log',at:+t.at||0,src:'study'});if(t.done&&t.doneAt)EV.push({at:+t.doneAt,src:'task',t:`Görev tamamlandı: ${t.text}`})}
  for(const s of D.sessions){const at=s.start?+s.start:new Date(s.date+'T12:00').getTime();if(!isNaN(at))EV.push({at,src:'study',t:`Çalışma: ${subjName(s.subj)}${s.topic?' · '+s.topic:''} (${fm(s.min||0)})`,min:s.min||0,subj:s.subj,date:s.date})}
  for(const i of D.items){if(i.added)EV.push({at:+i.added,src:'lib',t:`Kütüphaneye eklendi: ${i.title}`,type:i.type})}
  for(const a of D.acts){const at=new Date(a.date+'T'+(a.start||'12:00')).getTime();if(!isNaN(at))EV.push({at,src:'act',t:`Aktivite: ${a.title}${a.dur?' ('+fm(a.dur)+')':''}${a.status==='done'?'':' · planlandı'}`,min:a.dur||0})}
  const kids={};for(const p of D.pages)if(p.parent)kids[p.parent]=(kids[p.parent]||0)+1;PROJ=D.pages.filter(p=>!p.parent&&kids[p.id]&&Date.now()-(+p.updated||0)<30*DAY).map(p=>({...p,kids:kids[p.id]}))}
const subjName=id=>D.study.subjects.find(s=>s.id===id)?.name||'Ders';
const subjCol=id=>D.study.subjects.find(s=>s.id===id)?.color||css('--s1');
const SRC={note:['Notlar','--s1'],study:['Çalışma','--s2'],lib:['Kütüphane','--s3'],task:['Görev','--s4'],act:['Aktivite','--s5']};

/* ── aralık ── */
const R={k:'week',a:null,b:null};
const RANGES=[['day','Gün'],['week','Hafta'],['month','Ay'],['year','Yıl'],['custom','Özel']];
function range(){const now=new Date(),t=sod(now);let a,b=new Date(+t+DAY);
  if(R.k==='day')a=t;else if(R.k==='week')a=new Date(+t-6*DAY);else if(R.k==='month')a=new Date(+t-29*DAY);else if(R.k==='year')a=new Date(+t-364*DAY);
  else{a=R.a?sod(R.a):new Date(+t-29*DAY);b=R.b?new Date(+sod(R.b)+DAY):b}return{a:+a,b:+b,days:Math.max(1,Math.round((b-a)/DAY))}}
const inR=(at,r)=>at>=r.a&&at<r.b;
const prevR=r=>({a:r.a-(r.b-r.a),b:r.a,days:r.days});

/* ── görselleştirme yardımcıları ── */
const tip=$('#tip');function showTip(html,e){tip.innerHTML=html;tip.classList.add('on');const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8),y=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-8);tip.style.transform=`translate(${x}px,${y}px)`}
function hideTip(){tip.classList.remove('on')}
const axMax=(v,min=1)=>{v=Math.max(v,min);const st=min===60?([15,30,60,90,120,180,240,360,480,600,900,1200,1800,2400,3000].find(x=>x>=v/4)||nice(v/4)):v/4<=1?1:nice(v/4);return st*4};
const nice=v=>{if(v<=0)return 1;const p=10**Math.floor(Math.log10(v)),f=v/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p};
/* yığılmış dikey sütun grafiği — tek eksen, ince sütunlar, 2px boşluk, yuvarlak üst uç */
function colChart(id,rows,keys,o={}){const W=Math.min(720,Math.max(320,innerWidth-64)),H=o.h||200,P={l:36,r:6,t:10,b:24},iw=W-P.l-P.r,ih=H-P.t-P.b;const tot=rows.map(r=>keys.reduce((s,k)=>s+(r[k[0]]||0),0)),mx=axMax(Math.max(...tot,0),o.fmt?60:1);
  const n=rows.length,bw=Math.max(2,Math.min(28,iw/n*.62)),step=iw/n;let g='';
  for(let i=0;i<=4;i++){const y=P.t+ih-ih*i/4;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${P.l-6}" y="${y+4}" text-anchor="end">${o.fmt?o.fmt(mx*i/4):Math.round(mx*i/4)}</text>`}
  const lab=Math.ceil(n/12);rows.forEach((r,i)=>{const x=P.l+step*i+(step-bw)/2;let y=P.t+ih;const segs=keys.filter(k=>r[k[0]]>0);
    segs.forEach((k,j)=>{const h=ih*r[k[0]]/mx,last=j===segs.length-1,gap=j?2:0;y-=h;const hh=Math.max(0,h-gap);

/* çizgi grafiği — 2px çizgi, artı imleç ve ipucu */
function lineChart(id,rows,key,o={}){const W=Math.min(520,Math.max(320,innerWidth-64)),H=o.h||180,P={l:40,r:10,t:12,b:24},iw=W-P.l-P.r,ih=H-P.t-P.b,mx=axMax(Math.max(...rows.map(r=>r[key]),0),o.fmt?60:1),n=rows.length;

function buckets(r){const out=[];if(r.days<=1){for(let h=0;h<24;h++)out.push({a:r.a+h*36e5,b:r.a+(h+1)*36e5,label:h+'',full:`${h}:00–${h+1}:00`});return out}
  if(r.days<=62){for(let t=r.a;t<r.b;t+=DAY){const d=new Date(t);out.push({a:t,b:t+DAY,label:r.days<=8?WD[(d.getDay()+6)%7]:d.getDate()+'',full:d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'short'})})}return out}
  if(r.days<=200){let t=r.a;while(t<r.b){const d=new Date(t);out.push({a:t,b:Math.min(r.b,t+7*DAY),label:d.getDate()+' '+MON[d.getMonth()],full:`${d.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})} haftası`});t+=7*DAY}return out}

  if(key==='todo')return openDet('Görevler',TODOS.slice().sort((a,b)=>a.done-b.done).map(t=>({t:(t.done?'✓ ':'○ ')+t.text,r:t.page,c:t.done?'var(--s3)':'var(--ink4)'})),`${TODOS.filter(t=>t.done).length} tamamlandı, ${TODOS.filter(t=>!t.done).length} açık`);

  if(k==='bar'){const b=extra;const L=EV.filter(e=>e.at>=b.a&&e.at<b.b&&(!b.src||e.src===b.src)).sort((x,y)=>y.at-x.at);return openDet(b.full,L.map(evItem),`${L.length} kayıt`)}}

/* ── etkileşim ── */
document.addEventListener('pointerover',e=>{const h=e.target.closest('.hit');if(h){const c=CH[h.dataset.c],r=c.rows[+h.dataset.i];showTip(`<b>${E(r.full||r.label)}</b>${c.keys.filter(k=>c.keys.length===1||r[k[0]]).map(k=>`<div class="r"><i style="background:${k[2]}"></i>${E(k[1])}: ${c.o.fmt?c.o.fmt(r[k[0]]||0):r[k[0]]||0}</div>`).join('')||'<div>Kayıt yok</div>'}`,e);return}
  const d=e.target.closest('[data-day]');if(d){showTip(`<b>${new Date(d.dataset.day+'T12:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})}</b><div>${(EV.filter(x=>dk(x.at)===d.dataset.day)).length} aktivite</div>`,e);return}hideTip()});
document.addEventListener('pointermove',e=>{if(tip.classList.contains('on')&&(e.target.closest('.hit')||e.target.closest('[data-day]'))){const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8),y=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-8);tip.style.transform=`translate(${x}px,${y}px)`}});
document.addEventListener('click',e=>{const t=e.target;
  const rb=t.closest('[data-r]');if(rb){R.k=rb.dataset.r;if(R.k==='custom'&&!R.a){const r=range();$('#d0').value=dk(r.a);$('#d1').value=dk(r.b-DAY)}render();return}
  const h=t.closest('.hit');if(h){const c=CH[h.dataset.c],r=c.rows[+h.dataset.i];if(h.dataset.c==='act'||h.dataset.c==='study'||h.dataset.c==='trend')det('bar',{a:r.a,b:r.b,full:r.full,src:h.dataset.c==='act'?null:'study'});return}
  const d=t.closest('[data-day]');if(d)return det('day:'+d.dataset.day);const k=t.closest('[data-det]');if(k)return det(k.dataset.det);
  const tb=t.closest('[data-tbl]');if(tb){const cb=tb.closest('.card').querySelector('.cb'),on=tb.classList.toggle('on');tb.setAttribute('aria-pressed',on);tb.textContent=on?'Grafik':'Tablo';if(on){cb.dataset.svg=cb.innerHTML;cb.innerHTML=tableOf(tb.dataset.tbl)}else cb.innerHTML=cb.dataset.svg;return}
  if(t.closest('[data-x]')||t.id==='scrim')closeDet()});
$('#d0').onchange=e=>{R.a=e.target.value;render()};$('#d1').onchange=e=>{R.b=e.target.value;render()};
$('#refresh').onclick=async e=>{e.currentTarget.animate?.([{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{duration:600});await load()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeDet()});
addEventListener('storage',e=>{if(!FS&&['notlar:v1','studylog:v1','kb:v1'].includes(e.key))load();if(e.key==='notlar:theme'){try{document.documentElement.dataset.theme=JSON.parse(e.newValue)}catch{}render()}});
let rT=0;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(render,200)});

/* ── giriş ── */
function gate(st,msg){const g=$('#gate');g.hidden=false;$('#gSpin').hidden=st!=='loading';$('#gBtn').hidden=!(st==='signin'||st==='error');$('#gOut').hidden=st!=='denied';$('#gMsg').innerHTML=msg??(st==='loading'?'Bağlanıyor…':'Devam etmek için giriş yap.')}
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
$('#gBtn').onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});try{await firebase.auth().signInWithPopup(p)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code))return firebase.auth().signInWithRedirect(p);if(e.code!=='auth/popup-closed-by-user')gate('error','Giriş başarısız: '+(e.code||e.message))}};
$('#gOut').onclick=()=>firebase.auth().signOut();
(async()=>{if(!CLOUD){await load();return}
  gate('loading');try{const b='https://www.gstatic.com/firebasejs/10.12.2/';if(!window.firebase?.firestore){await loadScript(b+'firebase-app-compat.js');await Promise.all([loadScript(b+'firebase-auth-compat.js'),loadScript(b+'firebase-firestore-compat.js')])}}catch{return gate('error','Firebase yüklenemedi. İnternet bağlantını kontrol et.')}
  if(!firebase.apps.length)firebase.initializeApp(FB);const fs=firebase.firestore();try{await fs.enablePersistence({synchronizeTabs:true})}catch{}
  firebase.auth().onAuthStateChanged(async u=>{if(!u)return gate('signin');if((u.email||'').toLowerCase()!==OWNER)return gate('denied',`<b>${E(u.email)}</b> bu alana erişemez.`);
    gate('loading','Veriler okunuyor…');FS=fs;try{await load()}catch(e){$('#main').innerHTML=empty('Veriler okunamadı',E(e.message))}$('#gate').hidden=true})})();
</script>
</body>
</html>
