<!DOCTYPE html>
<html lang="tr" data-keep-dark>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jarvis</title>
<meta name="description" content="Sesli kişisel asistan: bilgisayarını kullanır, işleri yapar, yaptığını gösterir.">
<style>
/* Jarvis — hep koyu, sakin; ortada konuşan küre, üstünde sohbet. Kendi renkleri (--j-*), temadan bağımsız. */
:root{--j-bg:#07080C;--j-bg2:#0E1017;--j-card:rgba(255,255,255,.05);--j-line:rgba(255,255,255,.09);--j-ink:#EEF0F6;--j-ink2:rgba(238,240,246,.72);--j-ink3:rgba(238,240,246,.58);
  --j-acc:#6EC1FF;--j-acc2:#9B8CFF;--j-ok:#4ADE80;--j-err:#F87171;--j-warn:#FBBF24;--font:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--j-bg)!important;color:var(--j-ink)!important;color-scheme:dark!important;font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--j-acc);outline-offset:2px}
.bgfx{position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 50% 100%,color-mix(in srgb,var(--j-acc) 14%,transparent),transparent 70%),radial-gradient(40% 40% at 85% 0%,color-mix(in srgb,var(--j-acc2) 10%,transparent),transparent 70%)}
/* üst çubuk */
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;padding-top:env(safe-area-inset-top)}
.wm{font-size:15px;font-weight:700;letter-spacing:.42em;padding-left:.42em}
.st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--j-ink2)}.st i{width:8px;height:8px;border-radius:50%;background:var(--j-ink3)}
.st[data-s=on] i{background:var(--j-ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--j-ok) 18%,transparent)}.st[data-s=try] i{background:var(--j-warn)}
.top .sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--j-ink2);transition:background .2s,color .2s}.ib:hover{background:var(--j-card);color:var(--j-ink)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.ib[aria-pressed=true]{color:var(--j-acc)}
/* sohbet */
.log{position:fixed;left:0;right:0;top:56px;bottom:230px;overflow-y:auto;padding:12px 18px 40px;scrollbar-width:thin;-webkit-mask-image:linear-gradient(transparent,#000 24px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(transparent,#000 24px,#000 calc(100% - 40px),transparent)}
.lw{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.u{align-self:flex-end;max-width:85%;padding:10px 14px;border-radius:18px 18px 6px 18px;background:var(--j-card);box-shadow:inset 0 0 0 1px var(--j-line);font-size:15px;line-height:1.45;white-space:pre-wrap}
.j{display:flex;flex-direction:column;gap:8px;max-width:92%}
.j .tx{font-size:17px;line-height:1.55;white-space:pre-wrap}.j .tx:empty{display:none}
.steps{display:flex;flex-direction:column;gap:2px}
.sx{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--j-ink2);min-height:24px}
.sx b{width:16px;height:16px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;font-size:10px}
.sx[data-s=run] b{border:2px solid color-mix(in srgb,var(--j-acc) 30%,transparent);border-top-color:var(--j-acc);animation:spin .8s linear infinite}
.sx[data-s=ok] b{background:color-mix(in srgb,var(--j-ok) 20%,transparent);color:var(--j-ok)}.sx[data-s=ok] b::after{content:'✓'}
.sx[data-s=err] b{background:color-mix(in srgb,var(--j-err) 20%,transparent);color:var(--j-err)}.sx[data-s=err] b::after{content:'!'}
.sx.note{font-style:italic;color:var(--j-ink3)}.sx.note b{background:none;color:var(--j-acc2)}.sx.note b::after{content:'✦'}
.sx.qk{color:var(--j-acc)}.sx.qk b{background:color-mix(in srgb,var(--j-acc) 18%,transparent);color:var(--j-acc)}.sx.qk b::after{content:'⚡'}
.sx span{overflow:hidden;text-overflow:ellipsis}
@keyframes spin{to{transform:rotate(360deg)}}
.ask{padding:14px;border-radius:16px;background:color-mix(in srgb,var(--j-warn) 8%,var(--j-bg2));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--j-warn) 30%,transparent)}
.ask h3{font-size:15px;font-weight:650}.ask pre{margin:8px 0 12px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.35);font:12.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--j-ink2);max-height:180px;overflow:auto}
.ask .row{display:flex;gap:8px;flex-wrap:wrap}.ask.dn{background:var(--j-bg2);box-shadow:inset 0 0 0 1px var(--j-line)}.ask.dn pre{max-height:60px}.ask.dn .row{display:none}.ask .res{font-size:13px;color:var(--j-ink2);margin-top:6px}
.b{height:38px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:600;background:var(--j-card);box-shadow:inset 0 0 0 1px var(--j-line);transition:background .2s}.b:hover{background:rgba(255,255,255,.09)}
.b.pri{background:var(--j-ink);color:var(--j-bg);box-shadow:none}.b.pri:hover{opacity:.9}
.err{font-size:14px;color:var(--j-err)}
.empty{margin:auto;text-align:center;color:var(--j-ink2);padding-top:8vh}.empty h1{font-size:28px;font-weight:650;letter-spacing:-.01em;color:var(--j-ink)}.empty p{margin-top:8px;font-size:15px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}.chips button{height:36px;padding:0 14px;border-radius:999px;font-size:13.5px;color:var(--j-ink2);background:var(--j-card);box-shadow:inset 0 0 0 1px var(--j-line)}.chips button:hover{color:var(--j-ink)}
/* alt: küre + yazı */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 18px calc(18px + env(safe-area-inset-bottom))}
.live{min-height:22px;max-width:640px;text-align:center;font-size:15px;color:var(--j-ink2)}
.orb{position:relative;width:96px;height:96px;border-radius:50%;--lv:0}
.orb .c{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#BFE6FF 10%,var(--j-acc) 38%,#3B3FD8 72%,#120F3A 100%);box-shadow:0 0 calc(30px + var(--lv)*60px) color-mix(in srgb,var(--j-acc) 55%,transparent),inset 0 -8px 20px rgba(0,0,0,.45);
  scale:calc(1 + var(--lv)*.18);transition:scale .12s,filter .4s,opacity .4s}
.orb .r{position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(from 0deg,transparent,color-mix(in srgb,var(--j-acc2) 70%,transparent),transparent 40%,color-mix(in srgb,var(--j-acc) 60%,transparent),transparent 75%);
  -webkit-mask:radial-gradient(closest-side,transparent 78%,#000 80%,#000 92%,transparent 94%);mask:radial-gradient(closest-side,transparent 78%,#000 80%,#000 92%,transparent 94%);opacity:0;transition:opacity .4s}
.orb[data-s=idle] .c{animation:br 4.5s ease-in-out infinite}
.orb[data-s=listen] .r{opacity:1;animation:spin 3s linear infinite}
.orb[data-s=think] .r{opacity:1;animation:spin 1.1s linear infinite}.orb[data-s=think] .c{filter:hue-rotate(40deg) saturate(1.2)}
.orb[data-s=speak] .c{animation:pl .9s ease-in-out infinite}
.orb[data-s=off] .c{filter:grayscale(1) brightness(.5);box-shadow:none}
@keyframes br{50%{scale:1.05}}@keyframes pl{50%{scale:1.1}}
.ob{position:absolute;inset:0;border-radius:50%;z-index:2}
.bar{width:100%;max-width:640px;display:flex;align-items:center;gap:8px;height:52px;padding:0 6px 0 16px;border-radius:26px;background:var(--j-bg2);box-shadow:inset 0 0 0 1px var(--j-line)}
.bar input{flex:1;min-width:0;align-self:stretch;border:0;outline:0;background:none;font:inherit;font-size:15.5px;color:var(--j-ink)}.bar input::placeholder{color:var(--j-ink3)}
.bar .send{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--j-ink);color:var(--j-bg)}.bar .send svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar .send.stop{background:var(--j-err);color:#fff}
.hint{font-size:12px;color:var(--j-ink3)}
/* bağlantı / kurulum / ayarlar */
.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}.sheet[hidden]{display:none}
.card{width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:22px;border-radius:22px;background:var(--j-bg2);box-shadow:0 0 0 1px var(--j-line),0 30px 80px -20px rgba(0,0,0,.8)}
.card h2{font-size:20px;font-weight:650}.card p{margin-top:8px;font-size:14px;line-height:1.55;color:var(--j-ink2)}
.card ol{margin:14px 0 0 20px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.5;color:var(--j-ink2)}.card ol b{color:var(--j-ink)}
.card code{font:13px var(--mono);padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--j-ink)}
.card a{color:var(--j-acc)}
.code{display:flex;gap:8px;margin-top:16px}.code input{flex:1;min-width:0;height:48px;padding:0 14px;border-radius:12px;border:0;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--j-line);font:600 22px var(--mono);letter-spacing:.3em;text-align:center;color:var(--j-ink);outline:0}
.code input:focus{box-shadow:inset 0 0 0 2px var(--j-acc)}.code .b{height:48px}
.fld{margin-top:16px}.fld>span{display:flex;align-items:baseline;gap:6px;font-size:12.5px;font-weight:600;color:var(--j-ink3);margin-bottom:6px}
.fld input[type=password]{width:100%;height:42px;padding:0 12px;border-radius:10px;border:0;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--j-line);font:13px var(--mono);color:var(--j-ink);outline:0}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.06)}.seg button{height:34px;padding:0 14px;border-radius:9px;font-size:13.5px;color:var(--j-ink2)}.seg button[aria-pressed=true]{background:var(--j-ink);color:var(--j-bg)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:14px}.tg small{display:block;color:var(--j-ink3);font-size:12.5px;margin-top:2px}
.sw{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.14);position:relative;flex-shrink:0;transition:background .2s}.sw::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:translate .25s cubic-bezier(.3,1.3,.5,1)}
.sw[aria-checked=true]{background:var(--j-ok)}.sw[aria-checked=true]::after{translate:18px 0}
.card .end{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.kc{display:flex;gap:8px;align-items:center;margin-top:8px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--j-bg2);box-shadow:inset 0 0 0 1px var(--j-line)}
.kc code{flex:1;min-width:0;padding:0;background:none;font-size:12px;line-height:1.5;word-break:break-all;user-select:all}
.kc .b{flex:none}
.seg.pv{display:grid;grid-template-columns:repeat(4,1fr);width:100%}.seg.pv button{height:auto;min-height:46px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.2}
.seg.pv small{font-size:12px;font-weight:500;opacity:.75}
.kerr{margin-top:10px;font-size:13.5px;line-height:1.5}
.pvi{display:block;margin:8px 0 6px;font-size:12.5px;line-height:1.5;color:var(--j-ink3)}
.ka{margin:-6px -8px -6px auto;padding:0 8px;min-height:32px;display:inline-flex;align-items:center;border-radius:8px;font-weight:500;color:var(--j-acc);text-decoration:none}.ka:hover{text-decoration:underline}
.note2{margin-top:12px;font-size:12.5px;color:var(--j-ink3);line-height:1.5}
@media (max-width:600px){.ib{width:44px;height:44px}.ka{min-height:40px;margin:-8px -8px -8px auto}.log{bottom:214px;padding:10px 14px 40px}.top{padding:0 12px}.j .tx{font-size:16px}.b,.chips button{height:42px}.seg button{height:40px}.orb{width:84px;height:84px}}
@media (prefers-reduced-motion:reduce){.orb .c,.orb .r,.sx[data-s=run] b{animation:none!important}.sw::after{transition:none}}
html[data-motion=off] :is(.orb .c,.orb .r,.sx[data-s=run] b){animation:none!important}
/* küçük mod: hub'ın her yerinden açılan Jarvis paneli (?mini=1) */
html.mini .top{height:48px;padding:0 10px 0 16px}html.mini .wm{font-size:13px}html.mini .log{top:48px;bottom:168px;padding:8px 14px 30px}
html.mini .orb{width:64px;height:64px}html.mini .hint{display:none}html.mini .dock{gap:10px;padding-bottom:14px}html.mini .bar{height:46px}
html.mini .empty h1{font-size:22px}html.mini .empty p{font-size:14px}html.mini .chips button{font-size:13px}html.mini .bgfx{opacity:.6}
</style>

<body>
<div class="bgfx" aria-hidden="true"></div>
<header class="top"><span class="wm">JARVIS</span><span class="st" id="st" data-s="off" role="status"><i></i><span>Bağlı değil</span></span><span class="sp"></span>
  <button class="ib" id="wakeB" aria-pressed="false" title="“Jarvis” deyince dinle" aria-label="Uyandırma kelimesi"><svg viewBox="0 0 20 20"><path d="M10 2.5a2.5 2.5 0 0 1 2.5 2.5v5a2.5 2.5 0 0 1-5 0V5A2.5 2.5 0 0 1 10 2.5z"/><path d="M5 9.5a5 5 0 0 0 10 0M10 14.5v3"/></svg></button>
  <button class="ib" id="voiceB" aria-pressed="true" title="Jarvis sesli konuşsun" aria-label="Sesli yanıt"><svg viewBox="0 0 20 20"><path d="M3.5 8v4h3l4 3.5v-11L6.5 8z"/><path d="M13.5 7.5a3.5 3.5 0 0 1 0 5M15.5 5.5a6.5 6.5 0 0 1 0 9"/></svg></button>
  <button class="ib" id="closeB" title="Kapat (Esc)" aria-label="Paneli kapat" hidden><svg viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg></button>
  <button class="ib" id="setB" title="Ayarlar" aria-label="Ayarlar"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg></button></header>
<main class="log" id="log" aria-live="polite" data-nomotion><div class="lw" id="lw"></div></main>
<div class="dock"><p class="live" id="live" aria-live="polite"></p>
  <div class="orb" id="orb" data-s="off"><i class="r"></i><i class="c"></i><button class="ob" id="orbB" aria-label="Konuş (Boşluk)" title="Konuşmak için dokun · Boşluk"></button></div>
  <form class="bar" id="f"><input id="q" placeholder="Yaz ya da küreye dokunup konuş…" autocomplete="off" aria-label="Komut"><button class="send" id="sendB" type="submit" aria-label="Gönder"><svg viewBox="0 0 20 20"><path d="M10 15.5V4.5M5 9l5-4.5L15 9"/></svg></button></form>
  <span class="hint" id="hint">Boşluk: konuş · Esc: durdur</span></div>

<div class="sheet" id="conn" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="cT"></div></div>
<div class="sheet" id="sets" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="sT"></div></div>

<script>
/* JARVIS ekranı — çekirdeğe (bilgisayarda çalışan jarvis/jarvis.py) yerel WebSocket ile bağlanır.
   Ses: tarayıcının Türkçe konuşma tanıması + Türkçe sesi (kurulum yok). Yanıt cümle cümle okunur (ilk cümle gelir gelmez).
   Kayıt (bu cihaz): jarvis:token (eşleştirme), jarvis:voice, jarvis:wake, jarvis:log (son konuşmalar). */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsg=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},lss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches||document.documentElement.dataset.motion==='off';
const URL_WS='ws://127.0.0.1:8765';
const MINI=new URLSearchParams(location.search).has('mini');if(MINI){document.documentElement.classList.add('mini')}
const toHub=m=>{if(MINI&&parent!==window)try{parent.postMessage({jarvis:1,...m},'*')}catch{}};
let ws=null,ok=false,cfg={},busy=null,retry=0,retryT=0,pairBad=false;
const RUN={};  // id → {el, tx, steps, text}

/* ── bağlantı ── */
function connect(){clearTimeout(retryT);try{ws=new WebSocket(URL_WS)}catch{return later()}
  setSt('try','Bağlanıyor…');
  ws.onopen=()=>{retry=0};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}on(m)};
  ws.onclose=()=>{ok=false;setSt('off','Bağlı değil');orb('off');if(busy)endRun(busy,'Bağlantı koptu');later();showConn()};
  ws.onerror=()=>{}}
function later(){clearTimeout(retryT);retryT=setTimeout(connect,Math.min(8000,1500+retry++*1000))}
const send=m=>{if(ws&&ws.readyState===1){ws.send(JSON.stringify(m));return true}return false};
const NEED='2026.11.26a',OLDMSG='Bilgisayarındaki Jarvis programı eski sürüm, Gemini’yi tanımıyor. Jarvis’in siyah penceresini kapat, masaüstündeki Jarvis’e çift tıkla: kendini güncelleyip açılır.';let updAsked=0,pendKey=0;
function setSt(s,t){const e=$('#st');e.dataset.s=s;e.querySelector('span').textContent=t}

let lastMsg=Date.now();
function on(m){lastMsg=Date.now();
  if(m.t==='hello'){const tk=lsg('jarvis:token','');if(tk)send({t:'auth',token:tk});else send({t:'auth',token:''})}
  else if(m.t==='need_pair'){pairBad=!!m.bad;lss('jarvis:token','');showConn('pair')}
  else if(m.t==='paired'){lss('jarvis:token',m.token)}
  else if(m.t==='ready'){ok=true;cfg=m;cfg.old=!('provider' in m);setSt('on',m.mock?'Bağlı · sahte mod':cfg.old?'Bağlı · güncelleme gerekli':'Bağlı');if(!cfg.old&&m.v&&m.v<NEED&&!updAsked){updAsked=1;send({t:'update'})}if(cfg.old)showSets();if(pendKey){const kc=(m.kcheck||{})[m.provider];if(!kc||kc[0]!=='wait'){pendKey=0;if(!kc||kc[0]==='ok')$('#sets').hidden=true}}$('#conn').hidden=true;orb(busy?'think':'idle');if(!m.has_key)showSets(true);paintSets()}
  else if(m.t==='quick'){const r=run(m.id);addStep(r,'qk',m.text+(m.ms!=null?` · ${m.ms} ms`:''),'ok');say(m.text);endRun(m.id)}
  else if(m.t==='note'){const r=run(m.id);let n=r.notes[m.nid??'n'];if(!n){n=r.notes[m.nid??'n']=addStep(r,'note','','')}n.querySelector('span').textContent=m.text}
  else if(m.t==='step'){const r=run(m.id);let s=r.steps[m.sid];if(!s){s=r.steps[m.sid]=addStep(r,'',m.label,m.state)}else{s.dataset.s=m.state;s.querySelector('span').textContent=m.label}}
  else if(m.t==='delta'){const r=run(m.id);r.text+=m.text;r.tx.textContent=r.text;speakStream(m.id,r.text);scroll()}
  else if(m.t==='ask'){askCard(run(m.id),m)}
  else if(m.t==='askgone'){const c=document.querySelector(`[data-aid="${m.aid}"]`);if(c){c.classList.add('dn');c.querySelector('.res').textContent='Süre doldu; yapılmadı.'}}
  else if(m.t==='remind'){remind(run(m.id),m)}
  else if(m.t==='updating'){setSt('',`Güncelleniyor (${m.v})…`)}
  else if(m.t==='error'){const r=run(m.id);const e=document.createElement('p');e.className='err';e.textContent=cfg.old?OLDMSG:m.msg;r.el.appendChild(e);say(m.msg);scroll()}
  else if(m.t==='done'){speakStream(m.id,(RUN[m.id]?.text||''),true);endRun(m.id,m.r==='stopped'?'Durduruldu':'')}}

/* ── konuşma kaydı ── */
const lw=$('#lw');
function scroll(){const l=$('#log');l.scrollTop=l.scrollHeight}
function userMsg(t){lw.querySelector('.empty')?.remove();const d=document.createElement('div');d.className='u';d.textContent=t;lw.appendChild(d);scroll();keepLog('u',t)}
function run(id){if(RUN[id])return RUN[id];lw.querySelector('.empty')?.remove();const el=document.createElement('div');el.className='j';el.innerHTML='<div class="steps"></div><div class="tx"></div>';lw.appendChild(el);
  return RUN[id]={el,st:el.querySelector('.steps'),tx:el.querySelector('.tx'),steps:{},notes:{},text:''}}
function addStep(r,cls,label,state){const s=document.createElement('div');s.className='sx'+(cls?' '+cls:'');s.dataset.s=state||'';s.innerHTML='<b aria-hidden="true"></b><span></span>';s.querySelector('span').textContent=label;r.st.appendChild(s);
  if(!RM())s.animate([{opacity:0,translate:'0 6px'},{opacity:1,translate:'0 0'}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'});scroll();return s}
function endRun(id,why){const r=RUN[id];if(r){if(why){const e=document.createElement('p');e.className='err';e.style.color='var(--j-ink3)';e.textContent=why;r.el.appendChild(e)}
    r.el.querySelectorAll('.sx[data-s=run]').forEach(s=>s.dataset.s=why?'err':'ok');if(r.text)keepLog('j',r.text)}
  if(busy===id){busy=null;setBusy(false)}orb(ok?(speaking()?'speak':'idle'):'off')}
function askCard(r,m){const c=document.createElement('div');c.className='ask';c.dataset.aid=m.aid;c.innerHTML=`<h3>${esc(m.title)}</h3>${m.detail?`<pre>${esc(m.detail)}</pre>`:''}<div class="row"><button class="b pri" data-ok="1">Onayla</button><button class="b" data-ok="0">Vazgeç</button>${/komut/i.test(m.title)?'<button class="b" data-ok="always">Bu oturum hep izin ver</button>':''}</div><p class="res" aria-live="polite"></p>`;
  r.el.appendChild(c);scroll();say(m.title.replace(/[“”]/g,'')+(voiceOn&&SR?' Evet mi, hayır mı?':''));c.querySelector('[data-ok="1"]').focus({preventScroll:true});if(voiceOn&&SR)yesNo(c);
  c.addEventListener('click',e=>{const b=e.target.closest('[data-ok]');if(!b)return;const v=b.dataset.ok;send({t:'approve',aid:m.aid,ok:v!=='0',always:v==='always'});c.classList.add('dn');c.querySelector('.res').textContent=v==='0'?'Vazgeçildi.':'Onaylandı.'})}
/* onayı sesle de ver: soru okunduktan sonra bir kez “evet/hayır” dinler (eskiden ekrana bakmazsan Jarvis donmuş gibi bekliyordu) */
function yesNo(c){let n=0;const go=()=>{if(c.classList.contains('dn')||listening)return;if(speaking()){if(++n<60)setTimeout(go,300);return}
    try{wakeRec?.abort()}catch{}const r=new SR();r.lang='tr-TR';r.interimResults=false;listening=true;orb('listen');$('#live').textContent='“Evet” ya da “hayır” de…';
    r.onresult=e=>{const t=e.results[0][0].transcript.toLocaleLowerCase('tr');if(/\b(evet|onay|onayla|tamam|yap|gönder|olur|tabii)\b/.test(t))c.querySelector('[data-ok="1"]').click();else if(/\b(hayır|hayir|vazgeç|iptal|dur|yapma|olmaz)\b/.test(t))c.querySelector('[data-ok="0"]').click()};
    r.onend=()=>{listening=false;$('#live').textContent='';orb(busy?'think':ok?'idle':'off');if(wake)wakeStart()};r.onerror=()=>{};
    setTimeout(()=>{try{r.start()}catch{listening=false}},250)};setTimeout(go,500)}
function remind(r,m){const at=Date.parse(m.when);let done=false;try{const N=parent!==window&&parent.Notify;if(N?.add){N.add(m.text,isNaN(at)?Date.now()+6e4:at);done=true}}catch{}
  addStep(r,'',done?`Hatırlatıcı kuruldu: ${m.text} · ${isNaN(at)?'':new Date(at).toLocaleString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}`:'Hatırlatıcı için Jarvis\'i AppShell içinden aç',done?'ok':'err')}
function keepLog(k,t){const L=lsg('jarvis:log',[]);L.push([k,t.slice(0,600),Date.now()]);lss('jarvis:log',L.slice(-40))}
function restoreLog(){const L=lsg('jarvis:log',[]).filter(x=>Date.now()-x[2]<12*36e5);if(!L.length)return empty();
  for(const[k,t]of L){if(k==='u'){const d=document.createElement('div');d.className='u';d.textContent=t;lw.appendChild(d)}else{const el=document.createElement('div');el.className='j';el.innerHTML='<div class="tx"></div>';el.firstChild.textContent=t;lw.appendChild(el)}}scroll()}
function empty(){lw.innerHTML=`<div class="empty"><h1>Merhaba, ben Jarvis.</h1><p>Bilgisayarında senin yerine iş yaparım. Konuş ya da yaz.</p>
  <div class="chips">${['Google aç','YouTube\'da lofi aç','Yarın 9\'da spor hatırlat','Bugün hava nasıl?','YouTube Music\'te son dinlediğim şarkıya yorum bırak'].map(c=>`<button data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>`}
lw.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c)ask(c.dataset.c)});

/* ── komut gönder ── */
function ask(text){text=text.trim();if(!text)return;if(!ok){showConn();return}
  hush();userMsg(text);const id=Math.random().toString(36).slice(2,9);busy=id;run(id);setBusy(true);orb('think');send({t:'say',id,text})}
function stop(){if(busy){send({t:'stop'})}hush()}
setInterval(()=>{if(!busy||!RUN[busy]||RUN[busy].slow||Date.now()-lastMsg<40000)return;RUN[busy].slow=1;addStep(RUN[busy],'note','Hâlâ çalışıyor… Çok uzarsa Durdur’a bas ya da “dur” de.','')},5000);
function setBusy(b){const s=$('#sendB');s.classList.toggle('stop',b);s.setAttribute('aria-label',b?'Durdur':'Gönder');s.type=b?'button':'submit';
  s.innerHTML=b?'<svg viewBox="0 0 20 20"><rect x="6" y="6" width="8" height="8" rx="1.5" fill="currentColor" stroke="none"/></svg>':'<svg viewBox="0 0 20 20"><path d="M10 15.5V4.5M5 9l5-4.5L15 9"/></svg>'}
$('#f').addEventListener('submit',e=>{e.preventDefault();const v=$('#q').value;$('#q').value='';ask(v)});
$('#sendB').addEventListener('click',e=>{if(busy){e.preventDefault();stop()}});

/* ── ses: konuşma (TTS) — cümle cümle ── */
let voiceOn=lsg('jarvis:voice',true),spoken={},trVoice=null;
const pickVoice=()=>{const V=speechSynthesis?.getVoices?.()||[];trVoice=V.find(v=>/tr(-|_)TR/i.test(v.lang)&&/Google|Natural|Online/i.test(v.name))||V.find(v=>/^tr/i.test(v.lang))||null};
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
const speaking=()=>'speechSynthesis' in window&&(speechSynthesis.speaking||speechSynthesis.pending);
function say(t){if(!voiceOn||!('speechSynthesis' in window)||!t)return;const u=new SpeechSynthesisUtterance(t.replace(/[*_#`>]/g,''));u.lang='tr-TR';if(trVoice)u.voice=trVoice;u.rate=1.08;
  u.onstart=()=>orb('speak');u.onend=()=>{if(!speaking())orb(busy?'think':ok?'idle':'off')};speechSynthesis.speak(u)}
function speakStream(id,text,final){const done=spoken[id]||0,rest=text.slice(done);const m=final?rest:(rest.match(/^[\s\S]*?[.!?…](\s|$)/)||[''])[0];
  if(m.trim()){spoken[id]=done+m.length;say(m.trim());if(!final)speakStream(id,text,false)}}
function hush(){if('speechSynthesis' in window)speechSynthesis.cancel()}
$('#voiceB').setAttribute('aria-pressed',voiceOn);$('#voiceB').addEventListener('click',()=>{voiceOn=!voiceOn;lss('jarvis:voice',voiceOn);$('#voiceB').setAttribute('aria-pressed',voiceOn);if(!voiceOn)hush()});

/* ── ses: dinleme (STT) + uyandırma kelimesi ── */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,listening=false,wake=lsg('jarvis:wake',false),wakeRec=null;
function listen(){if(!SR){$('#live').textContent='Bu tarayıcı konuşma tanımayı desteklemiyor (Chrome ya da Edge kullan).';return}
  if(listening){rec?.stop();return}hush();rec=new SR();rec.lang='tr-TR';rec.interimResults=true;rec.continuous=false;listening=true;orb('listen');$('#live').textContent='Dinliyorum…';
  let fin='';rec.onresult=e=>{let t='';for(const r of e.results){t+=r[0].transcript;if(r.isFinal)fin=t}$('#live').textContent=t};
  rec.onerror=e=>{$('#live').textContent=e.error==='not-allowed'?'Mikrofona izin verilmedi (adres çubuğundaki kilitten aç).':e.error==='no-speech'?'Ses gelmedi.':''};
  rec.onend=()=>{listening=false;orb(busy?'think':ok?'idle':'off');if(fin.trim()){$('#live').textContent='';ask(fin)}else setTimeout(()=>{if(!listening)$('#live').textContent=''},1800);if(wake)wakeStart()};
  const st=k=>{try{rec.start()}catch{if(k<3)setTimeout(()=>st(k+1),250);else{listening=false;orb(busy?'think':ok?'idle':'off');$('#live').textContent='Mikrofon başlatılamadı, tekrar dokun.'}}};
  if(wakeRec){try{wakeRec.abort()}catch{}setTimeout(()=>st(0),200)}else st(0)
  levels()}
function wakeStart(){if(!SR||!wake||listening)return;try{wakeRec?.abort()}catch{}wakeRec=new SR();wakeRec.lang='tr-TR';wakeRec.continuous=true;wakeRec.interimResults=true;
  wakeRec.onresult=e=>{const r=e.results[e.results.length-1],t=r[0].transcript.toLowerCase();const i=t.search(/\b(jarvis|carvis|cervis|jarvıs)\b/);if(i<0)return;
    const after=t.slice(i).replace(/^\S+\s*/,'');toHub({open:1});if(r.isFinal&&after.trim().length>2){try{wakeRec.abort()}catch{}ask(after)}else if(r.isFinal){try{wakeRec.abort()}catch{}setTimeout(listen,300)}};
  wakeRec.onend=()=>{if(wake&&!listening)setTimeout(wakeStart,400)};wakeRec.onerror=e=>{if(e.error==='not-allowed'){wake=false;lss('jarvis:wake',false);$('#wakeB').setAttribute('aria-pressed',false);$('#live').textContent='Mikrofona izin verilmedi.'}};
  try{wakeRec.start()}catch{}}
$('#wakeB').setAttribute('aria-pressed',wake);$('#wakeB').addEventListener('click',()=>{wake=!wake;lss('jarvis:wake',wake);$('#wakeB').setAttribute('aria-pressed',wake);if(wake){wakeStart();$('#live').textContent='“Jarvis” dediğinde dinliyorum.'}else{try{wakeRec?.abort()}catch{}$('#live').textContent=''}});
$('#orbB').addEventListener('click',()=>{if(busy&&!listening){stop();return}listen()});
// mikrofon seviyesi → küre büyür (sadece dinlerken)
let an=null;async function levels(){if(RM())return;try{if(!an){const s=await navigator.mediaDevices.getUserMedia({audio:true});const ctx=new AudioContext();const src=ctx.createMediaStreamSource(s);an=ctx.createAnalyser();an.fftSize=256;src.connect(an)}}catch{return}
  const d=new Uint8Array(an.frequencyBinCount),o=$('#orb');const f=()=>{if(!listening){o.style.setProperty('--lv',0);return}an.getByteFrequencyData(d);let v=0;for(const x of d)v+=x;o.style.setProperty('--lv',Math.min(1,v/d.length/90).toFixed(3));requestAnimationFrame(f)};f()}
function orb(s){$('#orb').dataset.s=s;toHub({s})}

/* ── klavye ── */
addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.code==='Space'&&$('#conn').hidden&&$('#sets').hidden&&!e.target.closest('button')){e.preventDefault();listen()}
  else if(e.key==='Escape'){stop()}});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';stop()}});

/* ── bağlantı ekranı: kurulum + eşleştirme ── */
const KUR=`py -c "import urllib.request as u;exec(u.urlopen('https://batulekesiz28-dot.github.io/apps/jarvis/kur.py').read())"`;
function showConn(mode){const c=$('#conn .card');if(mode==='pair'){c.innerHTML=`<h2 id="cT">Bilgisayarınla eşleştir</h2><p>Jarvis penceresinde yazan <b>6 haneli kodu</b> gir. Bir kez yeterli; bu cihaz hatırlanır.</p>
    <form class="code" id="pf"><input id="pc" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-label="Eşleştirme kodu" placeholder="••••••"><button class="b pri">Eşleştir</button></form>${pairBad?'<p class="err" style="margin-top:10px">Kod tutmadı, tekrar dene.</p>':''}`;
    $('#conn').hidden=false;setTimeout(()=>$('#pc')?.focus(),40);$('#pf').onsubmit=e=>{e.preventDefault();send({t:'pair',code:$('#pc').value.trim()})};return}
  if(ok||(ws&&ws.readyState===1&&!$('#conn').hidden))return;c.innerHTML=`<h2 id="cT">Jarvis'i bilgisayarında başlat</h2><p>Jarvis'in bilgisayarını kullanabilmesi için küçük bir program çalışmalı. Ek paket kurmaz; Windows'un Akıllı Uygulama Denetimi açıkken de çalışır.</p>
    <ol><li><b>Python</b> kur: <a href="https://www.python.org/downloads/" target="_blank" rel="noopener">python.org</a> (kurarken “Add python.exe to PATH” kutusunu işaretle). Zaten varsa geç.</li>
    <li><b>Win+R</b>'ye bas, bunu yapıştır, Enter:<div class="kc"><code id="kcT">${KUR}</code><button class="b" id="kcB">Kopyala</button></div></li>
    <li>Açılan pencerede yazan <b>6 haneli kodu</b> burada gir. Sonraki seferlerde masaüstündeki <b>Jarvis</b>'e çift tıkla.</li></ol>
    <p class="note2"><b>Anahtar nereye girilir?</b> Program açılıp bağlanınca sağ üstteki dişliden (Ayarlar) Gemini/Groq/Claude anahtarını girersin; anahtar o programda saklanır.</p>
    <p class="note2">Mac/Linux: Terminal'de aynı komutu <code>py</code> yerine <code>python3</code> ile çalıştır. Program sadece bu bilgisayardan ve sadece AppShell'den bağlantı kabul eder. Tarayıcı “yerel ağa erişim” izni sorarsa İzin ver de.</p>
    <div class="end"><button class="b" id="cX">Sonra</button><button class="b pri" id="cR">Tekrar dene</button></div>`;
  $('#conn').hidden=false;$('#kcB').onclick=async()=>{try{await navigator.clipboard.writeText(KUR)}catch{getSelection().selectAllChildren($('#kcT'));document.execCommand('copy')}$('#kcB').textContent='Kopyalandı'};$('#cR').onclick=()=>{retry=0;connect()};$('#cX').onclick=()=>{$('#conn').hidden=true}}

/* ── ayarlar ── */
function showSets(firstKey){$('#sets').hidden=false;paintSets(firstKey)}
$('#setB').addEventListener('click',()=>{if(!ok)return showConn();$('#sets').hidden?showSets():($('#sets').hidden=true)});
const PV={gemini:{n:'Gemini',tag:'ücretsiz',key:'https://aistudio.google.com/apikey',ph:'AIza… ya da AQ.…',info:'Ücretsiz; Google hesabı yeter, kart istemez. Ekranı görebilir. Ücretsiz kullanımda Google konuşmaları ürünlerini geliştirmek için kullanabilir.'},
  groq:{n:'Groq',tag:'ücretsiz',key:'https://console.groq.com/keys',ph:'gsk_…',info:'Ücretsiz ve çok hızlı. Ekranı göremez; dakikalık sınırı düşük, uzun işlerde bekleyebilir.'},
  openrouter:{n:'OpenRouter',tag:'ücretsiz',key:'https://openrouter.ai/keys',ph:'sk-or-…',info:'Ücretsiz modeller arasından uygun olanı seçer; hız ve kalite değişken.'},
  claude:{n:'Claude',tag:'ücretli',key:'https://console.anthropic.com/settings/keys',ph:'sk-ant-…',info:'En akıllısı; karmaşık işlerde en iyisi. Kullandıkça ücret alır.'}};
function paintSets(firstKey){const c=$('#sets .card');if($('#sets').hidden)return;let nk='';try{nk=lsg('netlestir:key','')}catch{}
  const p=cfg.provider||'gemini',P=PV[p],has=cfg.keys?cfg.keys[p]:cfg.has_key,kc=(cfg.kcheck||{})[p];
  const kst=!has?'':!kc?' · kayıtlı ✓':kc[0]==='wait'?' · deneniyor…':kc[0]==='ok'?' · doğrulandı ✓':kc[0]==='bad'?' · reddedildi':' · kayıtlı';
  c.innerHTML=`<h2 id="sT">Ayarlar</h2>${cfg.old?`<p class="err oldv">${OLDMSG}</p>`:''}${firstKey&&!cfg.old?'<p>Jarvis\'in düşünmesi için bir yapay zekâ anahtarı gerekir. En kolayı <b>ücretsiz Gemini</b>: Google hesabınla anahtar al, buraya yapıştır.</p>':''}
    <div class="fld"><span>Yapay zekâ</span><div class="seg pv" role="group" aria-label="Yapay zekâ">${Object.entries(PV).map(([k,v])=>`<button data-pv="${k}" aria-pressed="${p===k}">${v.n}<small>${v.tag}</small></button>`).join('')}</div><small class="pvi">${P.info}${cfg.model&&p!=='claude'?` Şu an: ${esc(cfg.model)}.`:''}</small></div>
    <label class="fld"><span>${P.n} anahtarı${kst}<a href="${P.key}" target="_blank" rel="noopener" class="ka">${p==='claude'?'Anahtar al':'Ücretsiz anahtar al'} ↗</a></span><input type="password" id="kIn" placeholder="${has?'değiştirmek için yeni anahtarı yapıştır':P.ph}" autocomplete="off"></label>
    ${kc&&kc[0]==='bad'?`<p class="err kerr">${P.n} bu anahtarı kabul etmedi: ${esc(kc[1]||'geçersiz anahtar')}. Anahtarı yeniden kopyalayıp yapıştır (başında/sonunda boşluk kalmasın) ya da yeni anahtar oluştur.</p>`:kc&&kc[0]==='?'?`<p class="pvi">Anahtar kaydedildi ama şu an denenemedi (${esc(kc[1])}). Bir şey sorunca tekrar denenir.</p>`:''}
    ${p==='claude'&&nk&&!has?'<button class="b" id="kN" style="margin-top:8px">Netleştir’deki anahtarı kullan</button>':''}
    <div class="fld"><span>Düşünme</span><div class="seg" role="group" aria-label="Düşünme derinliği">${[['low','Hızlı'],['medium','Dengeli'],['high','Derin']].map(([k,l])=>`<button data-ef="${k}" aria-pressed="${cfg.effort===k}">${l}</button>`).join('')}</div></div>
    ${p==='claude'?`<div class="tg"><span>Hızlı mod<small>Claude yaklaşık 2 kat hızlı yazar, ücreti 2 katı.</small></span><button class="sw" id="fS" role="switch" aria-checked="${!!cfg.fast}" aria-label="Hızlı mod"></button></div>`:''}
    <div class="tg"><span>Yeni konuşma<small>Jarvis'in bu konuşmadaki hafızasını temizler.</small></span><button class="b" id="nw">Temizle</button></div>
    <div class="end"><button class="b pri" id="sOk">Tamam</button></div>`;
  $('#kN')?.addEventListener('click',()=>{send({t:'set',kp:'claude',key:nk})});
  c.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>{const v=$('#kIn').value.trim();if(v)send({t:'set',kp:p,key:v});send({t:'set',provider:b.dataset.pv})});
  c.querySelectorAll('[data-ef]').forEach(b=>b.onclick=()=>send({t:'set',effort:b.dataset.ef}));
  $('#fS')?.addEventListener('click',()=>send({t:'set',fast:!cfg.fast}));
  $('#nw').onclick=()=>{send({t:'new'});lss('jarvis:log',[]);empty();$('#sets').hidden=true};
  $('#sOk').onclick=()=>{const k=$('#kIn').value.trim();if(/^(AIza|AQ\.)/.test(k))lss('ai:gemini',k);/* Galeri'nin otomatik etiketi de aynı ücretsiz anahtarı kullansın (sadece bu tarayıcıda) */if(k&&!cfg.old&&cfg.kcheck){pendKey=1;$('#sOk').textContent='Deneniyor…';send({t:'set',kp:p,key:k})}else{if(k)send({t:'set',kp:p,key:k});$('#sets').hidden=true}}}
for(const id of['#conn','#sets'])$(id).addEventListener('click',e=>{if(e.target.id===id.slice(1)&&ok)$(id).hidden=true});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#sets').hidden){$('#sets').hidden=true;e.stopImmediatePropagation()}else if(!$('#conn').hidden&&ok){$('#conn').hidden=true}}},true);

restoreLog();connect();setTimeout(()=>{if(!ok&&!(ws&&ws.readyState===1))showConn()},2500); /* bağlıysa (eşleştirme bekliyorsa) kod kutusunun yerine kurulum ekranı gelmesin */if(wake)wakeStart();
/* hub paneli (küçük mod): kapat düğmesi, Esc, hub'dan gelen “odaklan / dinle” */
if(MINI){$('#closeB').hidden=false;$('#closeB').onclick=()=>toHub({close:1});
  addEventListener('keydown',e=>{if(e.altKey&&e.code==='KeyJ'){e.preventDefault();toHub({close:1});return}if(e.key==='Escape'&&!busy&&!listening&&$('#sets').hidden&&$('#conn').hidden&&!e.defaultPrevented)toHub({close:1})});
  addEventListener('message',e=>{const m=e.data;if(!m||m.jarvisHub!==1||e.source!==parent)return;if(m.cmd==='focus')$('#q').focus();else if(m.cmd==='listen')listen()})}
</script>
</body>
</html>
