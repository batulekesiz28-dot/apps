<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Münazara Arenası</title>
<!--
  Münazara Arenası — bir konu seç; iki yapay zekâyı izle ya da sen bir tarafı savun.
  Düzen (gerçek münazara gibi): Açılış → Çürütme → Kapanış. Sonunda hakem: kriterlere göre puan, kazanan, gerekçe;
  sen tartıştıysan kişisel geri bildirim (güçlü yanın, geliştir, mantık hataları alıntılı, “şöyle daha güçlü olurdu”).
  Yapay zekâ: Netleştir'deki Claude anahtarın varsa o (netlestir:key, netlestir:cfg.model), yoksa ücretsiz Pollinations.
  Anahtar sadece bu tarayıcıda durur; dosyaya yazılmaz. Kayıt: munazara:hist (son 30), munazara:cfg.
-->
<style>
  :root{--bg:#FAFAF8;--card:#FFFFFF;--ink:#17171A;--ink2:#56565E;--ink3:#6B6B74;--line:rgba(0,0,0,.08);--hover:rgba(0,0,0,.045);
    --pro:#1D6FD8;--pro-bg:rgba(29,111,216,.07);--con:#C2364B;--con-bg:rgba(194,54,75,.07);--ok:#1D7447;--warn:#B45309;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--serif:"Iowan Old Style","Charter",Georgia,serif}
  [data-theme=dark]{--bg:#0F0F11;--card:#17171A;--ink:#EDEDEF;--ink2:#A6A6AF;--ink3:#9393A0;--line:rgba(255,255,255,.08);--hover:rgba(255,255,255,.06);
    --pro:#7DB2FF;--pro-bg:rgba(125,178,255,.08);--con:#FF8A9B;--con-bg:rgba(255,138,155,.08);--ok:#6BD49A;--warn:#FCD34D;color-scheme:dark}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  button,input,textarea,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
  .wrap{max-width:820px;margin:0 auto;padding:40px 24px 120px}
  h1{font-family:var(--serif);font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
  .sub{margin-top:8px;font-size:15px;line-height:1.5;color:var(--ink2);max-width:62ch}
  .k{margin:24px 0 8px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
  .motion{display:flex;gap:8px;align-items:stretch}
  .motion textarea{flex:1;min-height:56px;padding:15px 16px;border:0;border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--line),0 10px 30px -20px rgba(0,0,0,.3);font-size:17px;line-height:1.4;resize:none;outline:none}
  .motion textarea:focus{box-shadow:0 0 0 2px var(--ink)}
  .ib{display:inline-grid;place-items:center;width:56px;flex-shrink:0;border-radius:16px;background:var(--hover);color:var(--ink2)}.ib:hover{color:var(--ink)}
  .ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5}.ib svg circle{fill:currentColor;stroke:none}
  .seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:14px;background:var(--hover)}
  .seg button{min-height:36px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink2)}
  .seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .row{display:flex;flex-wrap:wrap;gap:12px 28px}.row>div{min-width:0}
  .go{margin-top:28px;height:50px;padding:0 26px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:650}
  .go:disabled{opacity:.4;cursor:default}
  .eng{margin-top:14px;font-size:13px;color:var(--ink3)}.eng a{display:inline-flex;align-items:center;min-height:32px;color:inherit;text-decoration:underline;text-underline-offset:3px}
  @media (max-width:640px){.eng a{min-height:40px}}
  /* münazara */
  .bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -24px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .bar b{font-family:var(--serif);font-size:18px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bar .x{flex-shrink:0;min-height:36px;padding:0 12px;border-radius:10px;background:var(--hover);font-size:13.5px;font-weight:600}
  .steps{display:flex;gap:6px;margin:16px 0 4px;font-size:12.5px;color:var(--ink3)}.steps span{padding:4px 10px;border-radius:999px;background:var(--hover)}.steps span.on{background:var(--ink);color:var(--bg)}.steps span.ok{color:var(--ink2)}
  .sp{margin-top:18px;padding:16px 18px;border-radius:18px;border-left:3px solid;animation:in .45s cubic-bezier(.16,1,.3,1)}
  @keyframes in{from{opacity:0;transform:translateY(8px)}}
  .sp.pro{background:var(--pro-bg);border-color:var(--pro)}.sp.con{background:var(--con-bg);border-color:var(--con)}
  .sp h3{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .sp.pro h3{color:var(--pro)}.sp.con h3{color:var(--con)}.sp h3 em{font-style:normal;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink3)}
  .sp p{font-size:15.5px;line-height:1.65;white-space:pre-wrap;max-width:68ch}
  .dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4;animation:dt 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes dt{40%{opacity:1;transform:translateY(-2px)}}
  .you{margin-top:18px;padding:16px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
  .you h3{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
  .you textarea{width:100%;min-height:150px;padding:12px;border:0;border-radius:12px;background:var(--hover);font-size:15.5px;line-height:1.6;resize:vertical;outline:none}
  .you textarea:focus{box-shadow:0 0 0 2px var(--ink)}
  .you .ft{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:13px;color:var(--ink3)}
  .you .ft div{display:flex;gap:8px}
  .mb{min-height:40px;padding:0 16px;border-radius:11px;background:var(--hover);font-size:14px;font-weight:600}.mb.pri{background:var(--ink);color:var(--bg)}.mb:disabled{opacity:.4;cursor:default}
  .hint{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--hover);font-size:14px;line-height:1.55;color:var(--ink2)}
  .err{margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--hover);font-size:14.5px;line-height:1.5;color:var(--ink2)}
  /* hakem */
  .vd{margin-top:28px;padding:22px 20px;border-radius:22px;background:var(--card);box-shadow:0 0 0 1px var(--line),0 20px 50px -30px rgba(0,0,0,.4);animation:in .5s cubic-bezier(.16,1,.3,1)}
  .vd .kk{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
  .vd h2{margin-top:4px;font-family:var(--serif);font-size:28px;line-height:1.2}
  .vd h2.pro{color:var(--pro)}.vd h2.con{color:var(--con)}
  .sc{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 16px;align-items:center;margin-top:16px;font-size:14px}
  .sc .h{font-size:12px;font-weight:700;color:var(--ink3)}.sc .p{color:var(--pro);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}.sc .c{color:var(--con);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .sc .t{font-weight:700;border-top:1px solid var(--line);padding-top:8px}
  .why{margin-top:16px;font-size:15px;line-height:1.6;color:var(--ink2);max-width:68ch}
  .fb{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.fb h4{margin:14px 0 6px;font-size:13px;font-weight:700}
  .fb ul{padding-left:20px;font-size:14.5px;line-height:1.6;color:var(--ink2)}.fb li+li{margin-top:4px}
  .fb q{font-style:italic;color:var(--ink)}.fb .ty{display:inline-block;margin-right:6px;padding:1px 8px;border-radius:999px;background:var(--hover);font-size:12px;font-weight:650;color:var(--warn)}
  .fb .ex{padding:12px 14px;border-radius:12px;background:var(--hover);font-size:14.5px;line-height:1.6}
  .after{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  /* geçmiş */
  .hist{margin-top:40px}.hist li{list-style:none}
  .hi{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
  .hi:hover b{text-decoration:underline;text-underline-offset:3px}
  .hi b{flex:1;min-width:0;font-size:15px;font-weight:550;overflow-wrap:anywhere}.hi small{flex-shrink:0;font-size:12.5px;color:var(--ink3)}
  .wtag{flex-shrink:0;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:650}.wtag.pro{background:var(--pro-bg);color:var(--pro)}.wtag.con{background:var(--con-bg);color:var(--con)}.wtag.eq{background:var(--hover);color:var(--ink2)}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (max-width:640px){.wrap{padding:24px 16px 100px}h1{font-size:30px}.bar{margin:0 -16px;padding:10px 16px}.seg button{min-height:40px}.ib{width:52px}.motion textarea{font-size:16px}
    .sc{gap:8px 12px}.mb{min-height:44px}.hi{min-height:56px}}
  @media (prefers-reduced-motion:reduce){.sp,.vd{animation:none}.dots i{animation:none;opacity:.7}}
  html[data-motion=off] .sp,html[data-motion=off] .vd{animation:none}
</style>

<body>
<main class="wrap" id="app"></main>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const TOPICS={tr:['Sosyal medya gençlere zarardan çok fayda sağlar.','Okullarda telefon tamamen yasaklanmalı.','Yapay zekâ ödevlerde serbestçe kullanılabilmeli.','Üniversite eğitimi herkese ücretsiz olmalı.','Video oyunları sanat sayılmalı.','Ev ödevi kaldırılmalı.','Uzaktan çalışma ofisten daha verimlidir.','Hayvanat bahçeleri kapatılmalı.','Uzay araştırmalarına daha çok para ayrılmalı.','Sınav notları başarıyı ölçmenin en adil yoludur.'],
  en:['Social media does more good than harm for teenagers.','Phones should be banned in schools.','Students should be allowed to use AI for homework.','College education should be free for everyone.','Video games should be considered art.','Homework should be abolished.','Remote work is more productive than office work.','Zoos should be closed.','Governments should spend more on space exploration.','Standardized tests are the fairest measure of ability.']};
const PH={tr:[['open','Açılış'],['reb','Çürütme'],['close','Kapanış']],en:[['open','Opening'],['reb','Rebuttal'],['close','Closing']]};
const SIDE={tr:{pro:'Lehte',con:'Aleyhte'},en:{pro:'For',con:'Against'}};
let cfg=Object.assign({mode:'watch',side:'pro',lang:'tr',lvl:'mid'},ls.get('munazara:cfg',{})),D=null,busy=false;
const save=()=>ls.set('munazara:cfg',cfg);
const key=()=>ls.get('netlestir:key','')||'',model=()=>(ls.get('netlestir:cfg',{})||{}).model||'claude-sonnet-5-5';

/* ── yapay zekâ: Claude anahtarın (Netleştir'den) → ücretsiz Pollinations ── */
async function ai(system,user,json){if(key()){const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:model(),max_tokens:json?1800:700,system,messages:[{role:'user',content:user}]})});const j=await r.json().catch(()=>({}));if(r.ok)return(j.content||[]).map(c=>c.text||'').join('').trim();
    console.warn('Claude',j?.error?.message)}
  const body=JSON.stringify({model:'openai',messages:[{role:'system',content:system},{role:'user',content:user}],...(json?{response_format:{type:'json_object'}}:{})});
  for(const u of['https://text.pollinations.ai/openai','https://gen.pollinations.ai/v1/chat/completions']){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),60000);const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body,signal:c.signal});clearTimeout(t);if(!r.ok)continue;const j=await r.json();const s=j?.choices?.[0]?.message?.content;if(s)return s.trim()}catch{}}
  throw new Error('Yapay zekâ şu an cevap vermedi')}
const L=()=>D.lang,T=(tr,en)=>L()==='en'?en:tr;
function speakerSys(side,ph){const s=SIDE[L()][side],p=PH[L()].find(x=>x[0]===ph)[1],lvl={easy:T('Basit ve anlaşılır argümanlar kur; bazen zayıf bir nokta bırak.','Use simple arguments; occasionally leave a weak spot.'),mid:'',hard:T('Çok keskin ol: rakibin en zayıf noktasını bul ve oraya yüklen.','Be razor sharp: find the opponent’s weakest point and press on it.')}[D.lvl]||'';
  return T(`Sen bir münazara yarışmacısısın. Konu (önerge): "${D.motion}". Tarafın: ${s.toUpperCase()}. Şimdiki aşama: ${p}.
Kurallar: en fazla 140 kelime; 2–3 net argüman; somut örnek ver; ${ph==='reb'?'rakibin son konuşmasındaki iddiaları tek tek çürüt; ':''}${ph==='close'?'tartışmanın özetini yap ve neden kazandığını söyle; ':''}uydurma istatistik verme (emin değilsen "tahminen" de); saygılı ol. ${lvl}
Sadece konuşma metnini yaz; başlık, madde işareti ya da kendi adını ekleme. Dil: Türkçe.`,
`You are a debater. Motion: "${D.motion}". Your side: ${s.toUpperCase()}. Current stage: ${p}.
Rules: at most 140 words; 2–3 clear arguments; give concrete examples; ${ph==='reb'?'rebut the opponent’s last speech point by point; ':''}${ph==='close'?'summarize the debate and say why your side won; ':''}do not invent statistics (say "roughly" if unsure); be respectful. ${lvl}
Write only the speech text — no headings, bullet points or your name. Language: English.`)}
const transcript=()=>D.sp.map(x=>`[${SIDE[L()][x.side]} · ${PH[L()].find(p=>p[0]===x.ph)[1]}${x.you?T(' · insan',' · human'):''}]\n${x.text}`).join('\n\n')||T('(henüz konuşma yok)','(no speeches yet)');

/* ── akış: her aşamada lehte, sonra aleyhte; kapanışta aleyhte önce (son söz lehtenin) ── */
const ORDER=[['open','pro'],['open','con'],['reb','pro'],['reb','con'],['close','con'],['close','pro']];
async function next(){if(!D||busy)return;const i=D.sp.length;if(i>=ORDER.length)return judge();const[ph,side]=ORDER[i];
  if(D.mode==='you'&&side===D.side){paint();$('#yt')?.focus();return}
  busy=true;D.err='';paint();
  try{const t=await ai(speakerSys(side,ph),T('Şu ana kadarki münazara:\n\n','Debate so far:\n\n')+transcript()+T('\n\nŞimdi senin konuşman:','\n\nNow your speech:'));D.sp.push({ph,side,text:clean(t)});persist()}
  catch(e){D.err=e.message}busy=false;paint();if(!D.err)setTimeout(next,calm()?0:450)}
const clean=t=>String(t||'').replace(/^\s*(\*\*|#+)?\s*(lehte|aleyhte|for|against|açılış|opening)[^\n]*\n/i,'').trim();
const calm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches||document.documentElement.dataset.motion==='off';
async function judge(){if(D.verdict||busy)return;busy=true;D.err='';paint();
  const you=D.mode==='you'?T(`İnsan katılımcı ${SIDE.tr[D.side].toUpperCase()} tarafındaydı; ona özel geri bildirim de ver.`,`The human debated for the ${SIDE.en[D.side].toUpperCase()} side; give them personal feedback too.`):'';
  const sys=T(`Sen tarafsız ve deneyimli bir münazara hakemisin. Konuşmaları şu kriterlere göre 1–10 puanla: arguman (argümanın gücü), kanit (örnek/kanıt), curutme (rakibe cevap), aciklik (açık ve düzenli anlatım). ${you}
SADECE şu JSON'u döndür: {"kazanan":"lehte|aleyhte|berabere","puan":{"lehte":{"arguman":0,"kanit":0,"curutme":0,"aciklik":0},"aleyhte":{"arguman":0,"kanit":0,"curutme":0,"aciklik":0}},"gerekce":"2-3 cümle","kullanici":{"guclu":["..."],"gelistir":["..."],"hatalar":[{"alinti":"konuşmadan birebir kısa alıntı","tur":"mantık hatasının adı","aciklama":"neden hata"}],"ornek":"kullanıcının bir cümlesinin daha güçlü yazılmış hali"}}${D.mode==='you'?'':' (kullanici alanını boş bırak)'}`,
  `You are a fair, experienced debate judge. Score each side 1–10 on: arguman (argument strength), kanit (evidence/examples), curutme (rebuttal), aciklik (clarity). ${you}
Return ONLY this JSON (keep the keys as written; write values in English): {"kazanan":"lehte|aleyhte|berabere","puan":{"lehte":{"arguman":0,"kanit":0,"curutme":0,"aciklik":0},"aleyhte":{"arguman":0,"kanit":0,"curutme":0,"aciklik":0}},"gerekce":"2-3 sentences","kullanici":{"guclu":["..."],"gelistir":["..."],"hatalar":[{"alinti":"short exact quote","tur":"fallacy name","aciklama":"why"}],"ornek":"a stronger rewrite of one of the human's sentences"}}${D.mode==='you'?'':' (leave kullanici empty)'}`);
  try{const t=await ai(sys,T('Konu: ','Motion: ')+D.motion+'\n\n'+transcript(),true),a=t.indexOf('{'),b=t.lastIndexOf('}');const o=JSON.parse(t.slice(a,b+1));
    const n=x=>Math.max(0,Math.min(10,Math.round(+x||0))),P=s=>({arguman:n(o.puan?.[s]?.arguman),kanit:n(o.puan?.[s]?.kanit),curutme:n(o.puan?.[s]?.curutme),aciklik:n(o.puan?.[s]?.aciklik)});
    const v={kazanan:['lehte','aleyhte','berabere'].includes(o.kazanan)?o.kazanan:'berabere',p:{pro:P('lehte'),con:P('aleyhte')},gerekce:String(o.gerekce||''),u:o.kullanici&&D.mode==='you'?{guclu:(o.kullanici.guclu||[]).slice(0,4).map(String),gelistir:(o.kullanici.gelistir||[]).slice(0,4).map(String),hatalar:(o.kullanici.hatalar||[]).slice(0,4).filter(h=>h&&h.tur),ornek:String(o.kullanici.ornek||'')}:null};
    D.verdict=v;persist()}catch(e){D.err=T('Hakem kararı alınamadı: ','Could not get the verdict: ')+e.message}busy=false;paint();$('.vd')?.scrollIntoView({behavior:calm()?'auto':'smooth',block:'start'})}
async function hint(){if(busy)return;const btn=$('[data-hint]');btn.disabled=true;btn.textContent='…';
  try{const[ph]=ORDER[D.sp.length];const t=await ai(T('Sen bir münazara koçusun. Kullanıcının bir sonraki konuşması için 3 kısa madde halinde fikir ver (her biri en çok 15 kelime). Konuşmayı onun yerine yazma.','You are a debate coach. Give the user 3 short bullet ideas (max 15 words each) for their next speech. Do not write the speech for them.'),
      T(`Konu: ${D.motion}\nKullanıcının tarafı: ${SIDE.tr[D.side]}\nAşama: ${PH.tr.find(p=>p[0]===ph)[1]}\n\n`,`Motion: ${D.motion}\nUser side: ${SIDE.en[D.side]}\nStage: ${PH.en.find(p=>p[0]===ph)[1]}\n\n`)+transcript());
    D.hint=t;paint()}catch(e){D.hint=e.message;paint()}}
function sendYou(){const v=$('#yt').value.trim();if(v.split(/\s+/).length<8)return $('#yt').focus();const[ph,side]=ORDER[D.sp.length];D.sp.push({ph,side,text:v,you:true});D.hint='';D.draft='';persist();paint();setTimeout(next,calm()?0:300)}
function persist(){const h=ls.get('munazara:hist',[]).filter(x=>x.id!==D.id);h.unshift({...D,err:undefined,hint:undefined});ls.set('munazara:hist',h.slice(0,30))}

/* ── çizim ── */
const DICE='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="8.5" cy="8.5" r="1.3"/><circle cx="15.5" cy="8.5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="8.5" cy="15.5" r="1.3"/><circle cx="15.5" cy="15.5" r="1.3"/></svg>';
const segBtn=(k,v,n)=>`<button data-set="${k}:${v}" aria-pressed="${cfg[k]===v}">${n}</button>`;
function setup(){const h=ls.get('munazara:hist',[]);const winTag=x=>{const w=x.verdict?.kazanan;return w?`<span class="wtag ${w==='lehte'?'pro':w==='aleyhte'?'con':'eq'}">${w==='lehte'?'Lehte kazandı':w==='aleyhte'?'Aleyhte kazandı':'Berabere'}</span>`:'<span class="wtag eq">Yarım</span>'};
  return`<h1>Münazara Arenası</h1><p class="sub">Bir konu seç; iki yapay zekâyı tartıştır ya da bir tarafı sen savun. Açılış, çürütme ve kapanıştan sonra hakem puan verir ve sana nerede güçlü, nerede zayıf olduğunu söyler.</p>
    <p class="k">Konu (önerge)</p><div class="motion"><label class="sr" for="mt">Münazara konusu</label><textarea id="mt" rows="2" maxlength="220" placeholder="ör. Okullarda telefon tamamen yasaklanmalı.">${esc(cfg.motion||'')}</textarea><button class="ib" data-rand title="Rastgele konu öner" aria-label="Rastgele konu öner">${DICE}</button></div>
    <div class="row"><div><p class="k">Nasıl?</p><div class="seg" role="group" aria-label="Mod">${segBtn('mode','watch','İzle · iki yapay zekâ')}${segBtn('mode','you','Ben tartışacağım')}</div></div>
      ${cfg.mode==='you'?`<div><p class="k">Tarafın</p><div class="seg" role="group" aria-label="Taraf">${segBtn('side','pro','Lehte')}${segBtn('side','con','Aleyhte')}</div></div>
      <div><p class="k">Rakip</p><div class="seg" role="group" aria-label="Rakip zorluğu">${segBtn('lvl','easy','Kolay')}${segBtn('lvl','mid','Orta')}${segBtn('lvl','hard','Zor')}</div></div>`:''}
      <div><p class="k">Dil</p><div class="seg" role="group" aria-label="Dil">${segBtn('lang','tr','Türkçe')}${segBtn('lang','en','English')}</div></div></div>
    <button class="go" data-start>Münazarayı başlat</button>
    <p class="eng">Yapay zekâ: ${key()?'Claude (Netleştir’deki anahtarın)':'ücretsiz model'} · <a href="../netlestir/">${key()?'değiştir':'Claude anahtarı ekle'}</a></p>
    ${h.length?`<section class="hist"><p class="k">Geçmiş münazaralar</p><ul>${h.map(x=>`<li><button class="hi" data-open="${esc(x.id)}"><b>${esc(x.motion)}</b>${winTag(x)}<small>${new Date(x.at).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}</small></button></li>`).join('')}</ul></section>`:''}`}
function debate(){const done=D.sp.length,cur=ORDER[done],ph=PH[L()];const stepOn=cur?cur[0]:'verdict';
  const sp=D.sp.map(x=>`<article class="sp ${x.side}"><h3>${SIDE[L()][x.side]} · ${ph.find(p=>p[0]===x.ph)[1]}${x.you?`<em>${T('sen','you')}</em>`:''}</h3><p>${esc(x.text)}</p></article>`).join('');
  const waitingYou=!D.verdict&&cur&&D.mode==='you'&&cur[1]===D.side&&!busy;
  const thinking=busy?`<article class="sp ${cur?cur[1]:'pro'}" aria-live="polite"><h3>${cur?SIDE[L()][cur[1]]+' · '+ph.find(p=>p[0]===cur[0])[1]:T('Hakem','Judge')}</h3><p><span class="dots"><i></i><i></i><i></i></span> ${cur?T('düşünüyor…','thinking…'):T('karar veriyor…','deciding…')}</p></article>`:'';
  const you=waitingYou?`<section class="you"><h3>${T('Senin sıran','Your turn')} · ${SIDE[L()][D.side]} · ${ph.find(p=>p[0]===cur[0])[1]}</h3>
      <label class="sr" for="yt">${T('Konuşman','Your speech')}</label><textarea id="yt" placeholder="${cur[0]==='open'?T('Tarafını 2–3 güçlü argümanla savun…','Defend your side with 2–3 strong arguments…'):cur[0]==='reb'?T('Rakibin iddialarını tek tek çürüt…','Rebut your opponent point by point…'):T('Tartışmayı özetle, neden kazandığını söyle…','Sum up and say why you won…')}">${esc(D.draft||'')}</textarea>
      <div class="ft"><span id="wc">0 ${T('kelime · hedef 80–150','words · aim for 80–150')}</span><div><button class="mb" data-hint>${T('İpucu','Hint')}</button><button class="mb pri" data-send>${T('Gönder','Send')}</button></div></div>${D.hint?`<div class="hint">${esc(D.hint).replace(/\n/g,'<br>')}</div>`:''}</section>`:'';
  const v=D.verdict,tot=s=>Object.values(v.p[s]).reduce((a,b)=>a+b,0);
  const vd=v?`<section class="vd" aria-label="${T('Hakem kararı','Verdict')}"><p class="kk">${T('Hakem kararı','Verdict')}</p><h2 class="${v.kazanan==='lehte'?'pro':v.kazanan==='aleyhte'?'con':''}">${v.kazanan==='berabere'?T('Berabere','Tie'):`${SIDE[L()][v.kazanan==='lehte'?'pro':'con']} ${T('kazandı','wins')}${D.mode==='you'?(((v.kazanan==='lehte')===(D.side==='pro'))?T(' — sen kazandın!',' — you won!'):T(' — bu sefer rakip',' — opponent this time')):''}`}</h2>
      <div class="sc" role="table" aria-label="${T('Puanlar','Scores')}"><span class="h">${T('Ölçüt','Criterion')}</span><span class="h p">${SIDE[L()].pro}</span><span class="h c">${SIDE[L()].con}</span>
        ${[['arguman',T('Argüman gücü','Argument')],['kanit',T('Kanıt ve örnek','Evidence')],['curutme',T('Çürütme','Rebuttal')],['aciklik',T('Açıklık','Clarity')]].map(([k,n])=>`<span>${n}</span><span class="p">${v.p.pro[k]}</span><span class="c">${v.p.con[k]}</span>`).join('')}
        <span class="t">${T('Toplam','Total')}</span><span class="p t">${tot('pro')}</span><span class="c t">${tot('con')}</span></div>
      ${v.gerekce?`<p class="why">${esc(v.gerekce)}</p>`:''}
      ${v.u?`<div class="fb"><p class="kk">${T('Sana geri bildirim','Feedback for you')}</p>
        ${v.u.guclu.length?`<h4>${T('Güçlü yanların','What worked')}</h4><ul>${v.u.guclu.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
        ${v.u.gelistir.length?`<h4>${T('Geliştir','To improve')}</h4><ul>${v.u.gelistir.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
        ${v.u.hatalar.length?`<h4>${T('Mantık hataları','Logical fallacies')}</h4><ul>${v.u.hatalar.map(h=>`<li><span class="ty">${esc(h.tur)}</span>${h.alinti?`<q>${esc(h.alinti)}</q> — `:''}${esc(h.aciklama||'')}</li>`).join('')}</ul>`:''}
        ${v.u.ornek?`<h4>${T('Şöyle daha güçlü olurdu','A stronger version')}</h4><p class="ex">${esc(v.u.ornek)}</p>`:''}</div>`:''}
      <div class="after"><button class="mb pri" data-again>${T('Aynı konuda tekrar','Same motion again')}</button>${D.mode==='you'?`<button class="mb" data-swap>${T('Diğer tarafı savun','Switch sides')}</button>`:''}<button class="mb" data-new>${T('Yeni konu','New motion')}</button></div></section>`:'';
  const err=D.err?`<div class="err">${esc(D.err)} <button class="mb" data-retry>${T('Tekrar dene','Retry')}</button></div>`:'';
  const stage=['open','reb','close','verdict'].map((k,i)=>{const n=[ph[0][1],ph[1][1],ph[2][1],T('Hakem','Judge')][i];const ix=['open','reb','close','verdict'].indexOf(stepOn);return`<span class="${k===stepOn&&!D.verdict?'on':i<ix||D.verdict?'ok':''}">${n}</span>`}).join('');
  return`<div class="bar"><b>${esc(D.motion)}</b><button class="x" data-new>${T('Yeni münazara','New debate')}</button></div><div class="steps" aria-label="${T('Aşamalar','Stages')}">${stage}</div>${sp}${thinking}${you}${err}${vd}`}
function paint(){const a=$('#app'),f=document.activeElement?.id,draft=$('#yt')?.value;if(D&&draft!=null)D.draft=draft;a.innerHTML=D?debate():setup();
  if(f==='yt'||(D&&$('#yt')&&!busy)){const t=$('#yt');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);wc()}}}
function wc(){const t=$('#yt');if(!t)return;const n=(t.value.trim().match(/\S+/g)||[]).length;$('#wc').textContent=`${n} ${T('kelime · hedef 80–150','words · aim for 80–150')}`}
function start(motion){cfg.motion=motion;save();D={id:'D'+Date.now().toString(36),at:Date.now(),motion,mode:cfg.mode,side:cfg.side,lang:cfg.lang,lvl:cfg.lvl,sp:[],verdict:null};paint();scrollTo(0,0);next()}

/* ── olaylar ── */
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.set){const[k,v]=b.dataset.set.split(':');cfg[k]=v;cfg.motion=$('#mt')?.value??cfg.motion;save();paint();return}
  if(b.matches('[data-rand]')){const l=TOPICS[cfg.lang],cur=$('#mt').value;let t;do{t=l[Math.floor(Math.random()*l.length)]}while(t===cur&&l.length>1);$('#mt').value=t;cfg.motion=t;save();return}
  if(b.matches('[data-start]')){const m=$('#mt').value.trim();if(m.length<6){$('#mt').focus();$('#mt').placeholder='Önce bir konu yaz ya da zara bas';return}start(m);return}
  if(b.matches('[data-send]'))return sendYou();
  if(b.matches('[data-hint]'))return hint();
  if(b.matches('[data-retry]')){D.err='';D.sp.length>=ORDER.length?judge():next();return}
  if(b.matches('[data-again]'))return start(D.motion);
  if(b.matches('[data-swap]')){cfg.side=D.side==='pro'?'con':'pro';save();return start(D.motion)}
  if(b.matches('[data-new]')){D=null;paint();scrollTo(0,0);return}
  if(b.dataset.open){const x=ls.get('munazara:hist',[]).find(y=>y.id===b.dataset.open);if(x){D={...x};paint();scrollTo(0,0);if(!D.verdict)next()}}});
document.addEventListener('input',e=>{if(e.target.id==='yt'){wc();D.draft=e.target.value}if(e.target.id==='mt'){cfg.motion=e.target.value;save()}});
document.addEventListener('keydown',e=>{if(e.target.id==='yt'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();sendYou()}if(e.target.id==='mt'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('[data-start]')?.click()}});
addEventListener('storage',e=>{if(e.key==='notlar:theme'){try{document.documentElement.dataset.theme=JSON.parse(e.newValue)}catch{}}});
paint();
</script>
</body>
</html>
