<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FBFBFA;--panel:#F6F6F4;--card:#FFFFFF;--ink:#1F1F1D;--ink2:#5E5D5A;--ink3:#6F6E69;--ink4:#CFCEC9;
  --line:rgba(20,20,10,.07);--line2:rgba(20,20,10,.11);--hover:rgba(20,20,10,.045);--hover2:rgba(20,20,10,.07);
  --sel:rgba(35,131,226,.16);--accent:#2383E2;--tint:#F3F2EF;--warn:#D9480F;
  --font:'Geist',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--serif:'Newsreader',Georgia,'Times New Roman',serif;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --out:cubic-bezier(.16,1,.3,1);--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.4,.5,1);
  --shadow:0 0 0 .5px rgba(0,0,0,.08),0 12px 32px -10px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.03);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#191918;--panel:#1F1F1E;--card:#232322;--ink:#ECEBE8;--ink2:#A6A5A0;--ink3:#8E8D88;--ink4:#474744;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.11);--hover:rgba(255,255,255,.05);--hover2:rgba(255,255,255,.08);
  --sel:rgba(35,131,226,.3);--tint:#262625;
  --shadow:0 0 0 .5px rgba(255,255,255,.1),0 16px 40px -10px rgba(0,0,0,.55);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .35s var(--ease),color .35s var(--ease)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--sel)}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
kbd{font:500 10.5px/1 var(--mono);color:var(--ink3);padding:3px 5px;border-radius:5px;box-shadow:inset 0 0 0 .5px var(--line2)}

/* ── App layout ───────────────────────────────────── */
.app{display:grid;grid-template-columns:252px 1fr;height:100%}
.side{position:relative;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:.5px solid var(--line);transition:background .35s var(--ease)}
.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}

/* ── Sidebar ──────────────────────────────────────── */
.ws{display:flex;align-items:center;gap:9px;padding:14px 12px 8px 16px}
.ws-mark{width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 12px/1 var(--serif);font-style:italic}
.ws-name{font-weight:600;font-size:13.5px;letter-spacing:-.01em;flex:1}
.me{width:24px;height:24px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--ink2);box-shadow:inset 0 0 0 .5px var(--line2)}
.me img{width:100%;height:100%;object-fit:cover}
.srch{display:flex;align-items:center;gap:8px;margin:4px 10px 8px;height:30px;padding:0 8px;border-radius:8px;color:var(--ink3);font-size:13px;transition:background .15s,color .15s}
.srch:hover{background:var(--hover);color:var(--ink2)}
.srch span{flex:1;text-align:left}
.nav{position:relative;flex:1;overflow-y:auto;padding:2px 8px 12px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.hl{position:absolute;left:8px;right:8px;top:0;height:30px;border-radius:7px;background:var(--hover);opacity:0;pointer-events:none;transition:transform .32s var(--out),height .32s var(--out),opacity .18s var(--ease)}
.ni{position:relative;z-index:1;display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border-radius:7px;font-size:13.5px;color:var(--ink2);text-align:left;text-decoration:none;user-select:none}
.ni .ic{width:18px;text-align:center;font-size:14px;line-height:1;flex-shrink:0;color:var(--ink3)}
.ni .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni.on{background:var(--hover2);color:var(--ink);font-weight:500}
.ni.on .ic{color:var(--ink)}
.ni .more{opacity:0;width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--ink3);transition:opacity .15s}
.ni:hover .more{opacity:1}.ni .more:hover{background:var(--hover2);color:var(--ink)}
.ni .cnt{font:500 10.5px var(--mono);color:var(--ink3)}
.grp{display:flex;align-items:center;justify-content:space-between;padding:18px 8px 4px;font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.grp button{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;opacity:.7}
.grp button:hover{background:var(--hover2);opacity:1}
.empty-s{padding:6px 10px;font-size:12.5px;color:var(--ink3)}
.side-f{display:flex;gap:4px;padding:8px 10px 12px;border-top:.5px solid var(--line)}
.side-f .new{flex:1;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--ink2);transition:background .15s,color .15s}
.side-f .new:hover{background:var(--hover);color:var(--ink)}
.sq{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink3);transition:background .15s,color .15s,transform .35s var(--spring)}
.sq:hover{background:var(--hover);color:var(--ink)}.sq:active{transform:scale(.9)}

/* ── Topbar ───────────────────────────────────────── */
.top{position:relative;z-index:5;display:flex;align-items:center;gap:6px;height:46px;padding:0 12px 0 14px;flex-shrink:0}
.top::after{content:'';position:absolute;left:0;right:0;bottom:0;height:.5px;background:var(--line);opacity:var(--topline,0);transition:opacity .25s}
.tb.burger{display:none}
.crumb{display:flex;align-items:center;gap:7px;min-width:0;flex:1;font-size:13px;color:var(--ink2)}
.crumb .ic{font-size:14px}
.crumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{font:500 10.5px var(--mono);color:var(--ink3);letter-spacing:.03em;transition:opacity .3s}
.saved i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#3FB950;margin-right:6px;vertical-align:1px;transition:background .2s}
.saved.busy i{background:#D29922}
.saved.err i{background:#F85149}
.tb{height:28px;min-width:28px;padding:0 7px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink3);font-size:12.5px;transition:background .15s,color .15s,transform .35s var(--spring)}
.tb:hover{background:var(--hover);color:var(--ink)}.tb:active{transform:scale(.92)}
.tb.on{color:#E3A008}
.tb.on svg{fill:#E3A008;stroke:#E3A008}

/* ── View container ───────────────────────────────── */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:auto;-webkit-overflow-scrolling:touch}
.view{padding:0 56px 30vh}
.wrap{max-width:740px;margin:0 auto}
.wide{max-width:1080px;margin:0 auto}

/* ── Page editor ──────────────────────────────────── */
.pg-head{padding-top:8vh}
.pg-ic{display:inline-grid;place-items:center;font-size:56px;line-height:1;width:72px;height:72px;margin:0 0 6px -8px;border-radius:12px;transition:background .15s,transform .45s var(--spring);user-select:none;cursor:pointer}
.pg-ic:hover{background:var(--hover)}.pg-ic:active{transform:scale(.92)}
.pg-tools{display:flex;gap:2px;height:28px;margin:0 0 4px -8px;opacity:0;transition:opacity .2s}
.pg-head:hover .pg-tools{opacity:1}
.pg-tools button{height:28px;padding:0 8px;border-radius:6px;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3)}
.pg-tools button:hover{background:var(--hover);color:var(--ink2)}
.pg-title{font-family:var(--serif);font-size:42px;line-height:1.15;font-weight:500;letter-spacing:-.015em;outline:0;word-break:break-word;padding:2px 0;font-optical-sizing:auto}
.pg-title:empty::before{content:attr(data-ph);color:var(--ink4)}
.pg-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0 22px;padding-bottom:18px;border-bottom:.5px solid var(--line)}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;font-size:12.5px;color:var(--ink2);box-shadow:inset 0 0 0 .5px var(--line2);transition:background .15s,color .15s,transform .35s var(--spring)}
.chip:hover{background:var(--hover);color:var(--ink)}.chip:active{transform:scale(.96)}
.chip.ghost{box-shadow:none;color:var(--ink3)}
.chip .x{display:grid;place-items:center;width:14px;height:14px;border-radius:4px;margin-right:-4px;opacity:.6}
.chip .x:hover{background:var(--hover2);opacity:1}
.chip input{position:absolute;inset:0;opacity:0;pointer-events:none}
.muted{font:500 10.5px var(--mono);color:var(--ink3);letter-spacing:.03em;margin-left:auto}

.blocks{position:relative}
.blk{position:relative;display:flex;align-items:flex-start;gap:4px;margin-left:-30px;padding-left:30px;border-radius:6px}
.blk.pick{background:var(--sel)}
.hd{position:absolute;left:3px;top:4px;width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--ink4);opacity:0;transition:opacity .12s,background .12s,color .12s;cursor:grab;touch-action:none}
.blk:hover .hd{opacity:1}.hd:hover{background:var(--hover2);color:var(--ink2)}
.hd svg{width:10px;height:14px;fill:currentColor;stroke:none}
.txt{flex:1;min-width:0;outline:0;white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.7;padding:3px 2px;caret-color:var(--ink)}
.txt:empty::before{content:attr(data-ph);color:var(--ink4);pointer-events:none}
.blk[data-t=p] .txt:not(:focus):empty::before{content:''}
.txt a{color:inherit;text-decoration:underline;text-decoration-color:var(--ink4);text-underline-offset:3px;transition:text-decoration-color .15s}
.txt a:hover{text-decoration-color:var(--ink2)}
.txt a[href^="#p/"]{text-decoration:none;border-bottom:.5px solid var(--ink4);cursor:pointer}
.txt code{font:13.5px var(--mono);padding:2px 5px;border-radius:5px;background:var(--hover2);color:var(--warn)}
.txt mark{background:rgba(250,204,21,.32);color:inherit;border-radius:3px;padding:0 1px}
.txt b,.txt strong{font-weight:600}

.blk[data-t=h1]{margin-top:26px}.blk[data-t=h1] .txt{font-family:var(--serif);font-size:30px;line-height:1.25;font-weight:500;letter-spacing:-.01em}
.blk[data-t=h2]{margin-top:20px}.blk[data-t=h2] .txt{font-family:var(--serif);font-size:23px;line-height:1.3;font-weight:500}
.blk[data-t=h3]{margin-top:12px}.blk[data-t=h3] .txt{font-size:17px;font-weight:600;letter-spacing:-.01em}
.blk[data-t^=h] .hd{top:calc(.5em + 2px)}
.blk[data-t=h1] .hd{top:12px}
.chk{width:24px;height:24px;border:3px solid transparent;background-clip:padding-box;margin:4px 3px -3px -1px;border-radius:5px;flex-shrink:0;display:grid;place-items:center;box-shadow:inset 0 0 0 1.2px var(--ink4);transition:background .25s var(--ease),box-shadow .25s,transform .4s var(--spring)}
.chk:hover{box-shadow:inset 0 0 0 1.2px var(--ink3)}
.chk:active{transform:scale(.85)}
.chk svg{width:12px;height:12px;fill:none;stroke:var(--bg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset .35s var(--out) .05s}
.chk.on{background:var(--ink);box-shadow:inset 0 0 0 1.2px var(--ink)}
.chk.on svg{stroke-dashoffset:0}
.blk.done .txt{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--ink4);text-decoration-thickness:1px}
.bul{width:5px;height:5px;border-radius:50%;background:var(--ink2);margin:13px 9px 0 8px;flex-shrink:0}
.num{min-width:22px;padding:3px 4px 0 2px;text-align:right;font-size:15px;line-height:1.7;color:var(--ink2);font-variant-numeric:tabular-nums;flex-shrink:0}
.blk[data-t=quote] .txt{border-left:2px solid var(--ink);padding:2px 0 2px 16px;margin:4px 0;font-family:var(--serif);font-size:19px;line-height:1.55;font-style:italic;color:var(--ink2)}
.blk[data-t=callout]{margin:6px 0 6px -30px}
.blk[data-t=callout] .cw{flex:1;display:flex;gap:10px;padding:13px 16px 13px 14px;border-radius:10px;background:var(--tint)}
.blk[data-t=callout] .co{font-size:18px;line-height:1.55;cursor:pointer;user-select:none}
.blk[data-t=callout] .txt{padding:0;font-size:15px;line-height:1.65}
.blk[data-t=code] .txt{font:13.5px/1.65 var(--mono);background:var(--tint);border-radius:9px;padding:14px 16px;margin:6px 0;tab-size:2}
.blk[data-t=divider]{padding-top:12px;padding-bottom:12px}
.div{flex:1;border:0;height:.5px;background:var(--line2);outline:0;margin-top:2px}
.div:focus{background:var(--accent)}
.blk[data-t=divider] .hd{top:2px}
.kv{flex:1;display:grid;grid-template-columns:minmax(110px,180px) 1fr;gap:12px;border-radius:6px}
.kv .k{font-size:14px;color:var(--ink3);padding-top:4px}
.kv .v{font-size:15px}
.blk[data-t=kv]+.blk[data-t=kv]{margin-top:-2px}

/* ── Floating UI ──────────────────────────────────── */
.pop{position:fixed;z-index:200;min-width:220px;max-width:300px;padding:5px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);transform-origin:var(--ox,0) var(--oy,0)}
.pop.scroll-y{max-height:min(380px,60vh);overflow-y:auto;scrollbar-width:thin}
.pop-h{padding:7px 9px 5px;font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:32px;padding:4px 9px;border-radius:7px;text-align:left;font-size:13px;color:var(--ink);transition:background .08s}
.mi:hover,.mi.act{background:var(--hover)}
.mi .bi{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;background:var(--card);box-shadow:inset 0 0 0 .5px var(--line2);font:500 12px var(--font);color:var(--ink2)}
.mi .bi svg{width:15px;height:15px}
.mi .tx{flex:1;min-width:0}
.mi .tx small{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px}
.mi .k{font:10.5px var(--mono);color:var(--ink3)}
.mi.danger{color:var(--warn)}
.mi.confirm{background:var(--warn);color:#fff}
.sep{height:.5px;background:var(--line);margin:4px 6px}
.types{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:2px 3px 3px}
.types button{height:30px;border-radius:6px;display:grid;place-items:center;font:500 11.5px var(--font);color:var(--ink2)}
.types button:hover{background:var(--hover);color:var(--ink)}
.types button svg{width:15px;height:15px}

.fmt{position:fixed;z-index:210;display:flex;gap:1px;padding:3px;border-radius:9px;background:var(--ink);box-shadow:0 10px 30px -8px rgba(0,0,0,.35);transform-origin:50% 100%}
.fmt button{width:30px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--bg);opacity:.75;font-size:13px}
.fmt button:hover,.fmt button.on{opacity:1;background:rgba(127,127,127,.25)}
.fmt b{font-weight:700}.fmt i{font-family:var(--serif);font-size:15px}.fmt u{text-underline-offset:2px}

.emoji{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:4px}
.emoji button{width:34px;height:34px;border-radius:7px;font-size:19px;line-height:1;transition:background .1s,transform .3s var(--spring)}
.emoji button:hover{background:var(--hover);transform:scale(1.12)}

/* ── Command palette ──────────────────────────────── */
.pal-bg{position:fixed;inset:0;z-index:300;background:rgba(15,15,12,.18);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:14vh 16px 16px}
[data-theme=dark] .pal-bg{background:rgba(0,0,0,.45)}
.pal{width:min(620px,100%);max-height:62vh;display:flex;flex-direction:column;border-radius:14px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-bottom:.5px solid var(--line)}
.pal-in input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink)}
.pal-in input::placeholder{color:var(--ink3)}
.pal-l{overflow-y:auto;padding:6px;scrollbar-width:thin}
.pal-l .mi{min-height:38px}
.pal-l .ic{width:22px;text-align:center;font-size:15px;color:var(--ink3)}
.pal-f{display:flex;gap:14px;padding:8px 16px;border-top:.5px solid var(--line);font-size:11.5px;color:var(--ink3)}
.pal-e{padding:28px;text-align:center;color:var(--ink3);font-size:13px}

/* ── Home ─────────────────────────────────────────── */
.hello{padding-top:9vh}
.hello h1{font-family:var(--serif);font-weight:400;font-size:44px;letter-spacing:-.02em;line-height:1.1}
.hello h1 em{font-style:italic;color:var(--ink3)}
.hello p{margin-top:10px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:34px 0 44px}
.qa{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:22px;padding:16px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 .5px var(--line2);text-align:left;transition:transform .5s var(--spring),box-shadow .3s}
.qa:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 .5px var(--line2),0 12px 28px -14px rgba(0,0,0,.18)}
.qa:active{transform:scale(.98)}
.qa .e{font-size:22px;line-height:1}
.qa b{display:block;font-weight:500;font-size:14px}
.qa small{display:block;color:var(--ink3);font-size:12.5px;margin-top:2px}
.sh{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font:500 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.sh .rule{flex:1;height:.5px;background:var(--line);align-self:center}
.sh a{color:var(--ink3);text-decoration:none;cursor:pointer}.sh a:hover{color:var(--ink)}
.agenda{display:grid;gap:2px;margin-bottom:44px}
.ag{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:10px 4px;border-bottom:.5px solid var(--line)}
.ag:last-child{border-bottom:0}
.ag .d{font:500 11px/1.9 var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.ag .d.today{color:var(--accent)}
.ag .its{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;border-radius:7px;background:var(--hover);font-size:13px;color:var(--ink);cursor:pointer;transition:background .15s,transform .4s var(--spring)}
.pill:hover{background:var(--hover2)}.pill:active{transform:scale(.96)}
.hint{padding:18px;border-radius:12px;box-shadow:inset 0 0 0 .5px var(--line2);color:var(--ink3);font-size:13px}
.hint a{color:var(--ink2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--ink4);text-underline-offset:3px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:44px}
.card{display:flex;flex-direction:column;gap:6px;min-height:120px;padding:14px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 .5px var(--line2);text-align:left;cursor:pointer;transition:transform .5s var(--spring),box-shadow .3s}
.card:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 .5px var(--line2),0 12px 28px -14px rgba(0,0,0,.18)}
.card:active{transform:scale(.98)}
.card .e{font-size:20px;line-height:1.2;height:24px}
.card b{font-weight:500;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p{font-size:12.5px;color:var(--ink3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.card small{font:500 10.5px var(--mono);color:var(--ink3);letter-spacing:.03em}
.trow{display:flex;gap:8px;flex-wrap:wrap}

/* ── Templates ────────────────────────────────────── */
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px;margin-top:28px}
.tc{display:flex;flex-direction:column;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 .5px var(--line2);overflow:hidden;text-align:left;cursor:pointer;transition:transform .55s var(--spring),box-shadow .3s}
.tc:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 .5px var(--line2),0 18px 36px -18px rgba(0,0,0,.22)}
.tc:active{transform:scale(.98)}
.tc .pv{height:132px;padding:16px 18px;background:var(--tint);display:flex;flex-direction:column;gap:7px;overflow:hidden;position:relative}
.tc .pv::after{content:'';position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--tint))}
.tc .pv .ln{display:flex;align-items:center;gap:6px;height:7px}
.tc .pv .ln i{height:5px;border-radius:3px;background:var(--ink4);opacity:.75}
.tc .pv .ln.h i{height:8px;background:var(--ink3);opacity:.6}
.tc .pv .ln .bx{width:7px;height:7px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--ink4);background:none}
.tc .pv .ln .dt{width:4px;height:4px;border-radius:50%}
.tc .pv .ln.q{border-left:2px solid var(--ink3);padding-left:6px}
.tc .pv .ln.c{height:16px;padding:0 6px;border-radius:4px;background:rgba(127,127,127,.12)}
.tc .bd{display:flex;gap:12px;align-items:flex-start;padding:14px 16px 16px}
.tc .bd .e{font-size:22px;line-height:1.1}
.tc .bd b{display:block;font-weight:500;font-size:14px}
.tc .bd small{display:block;color:var(--ink3);font-size:12.5px;margin-top:2px}
.ttl{padding-top:8vh}
.ttl h1{font-family:var(--serif);font-weight:400;font-size:40px;letter-spacing:-.02em}
.ttl p{margin-top:8px;color:var(--ink3);font-size:14px}

/* ── Calendar ─────────────────────────────────────── */
.cal{display:grid;grid-template-columns:1fr 300px;gap:28px;padding-top:5vh}
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:16px}
.cal-h h1{font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:-.02em;flex:1}
.cal-h h1 em{font-style:normal;color:var(--ink3)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);padding:0 0 8px;font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.dow span{padding-left:10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:.5px solid var(--line);border-left:.5px solid var(--line)}
.cd{position:relative;min-height:104px;padding:6px 6px 8px;border-right:.5px solid var(--line);border-bottom:.5px solid var(--line);cursor:pointer;transition:background .15s;display:flex;flex-direction:column;gap:3px;min-width:0}
.cd:hover{background:var(--hover)}
.cd.out .dn{color:var(--ink4)}
.cd.wk{background:rgba(127,127,127,.025)}
.cd .dn{display:inline-grid;place-items:center;align-self:flex-start;min-width:24px;height:24px;padding:0 6px;border-radius:12px;font:500 12px var(--mono);color:var(--ink2);transition:background .25s,color .25s}
.cd.today .dn{background:var(--accent);color:var(--on-accent,#fff)}
.cd.sel{background:var(--hover)}
.cd.sel::after{content:'';position:absolute;inset:-.5px;box-shadow:inset 0 0 0 1px var(--ink);pointer-events:none;border-radius:2px}
.cd.over{background:var(--sel)}
.c2{display:flex;align-items:center;gap:5px;height:22px;padding:0 6px;border-radius:5px;background:var(--card);box-shadow:inset 0 0 0 .5px var(--line2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .35s var(--spring),box-shadow .2s;cursor:grab}
.c2:hover{box-shadow:inset 0 0 0 .5px var(--ink4)}
.c2.dragging{opacity:.4}
.c2 span{overflow:hidden;text-overflow:ellipsis}
.cd .more{font:500 10.5px var(--mono);color:var(--ink3);padding-left:6px}
.dp{position:sticky;top:12px;align-self:start}
.dp h2{font-family:var(--serif);font-weight:400;font-size:28px;letter-spacing:-.01em;line-height:1.1}
.dp .wd{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-top:6px}
.dp .lst{display:grid;gap:4px;margin:18px 0 22px}
.dp .row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;background:var(--card);box-shadow:inset 0 0 0 .5px var(--line2);cursor:pointer;transition:transform .45s var(--spring),box-shadow .2s;text-align:left;width:100%}
.dp .row:hover{box-shadow:inset 0 0 0 .5px var(--ink4)}
.dp .row:active{transform:scale(.98)}
.dp .row .e{font-size:16px}
.dp .row b{font-weight:500;font-size:13.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp .row small{font:500 10.5px var(--mono);color:var(--ink3)}
.dp .none{color:var(--ink3);font-size:13px;padding:6px 2px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}

/* ── Gate / toast / misc ──────────────────────────── */
.gate{position:fixed;inset:0;z-index:900;display:grid;place-items:center;padding:24px;background:var(--bg)}
.gate-c{width:min(340px,100%);display:grid;justify-items:center;gap:14px;text-align:center}
.gate .ws-mark{width:40px;height:40px;border-radius:11px;font-size:22px}
.gate h1{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:-.02em}
.gate p{color:var(--ink2);font-size:13px;line-height:1.55;min-height:20px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:42px;border-radius:11px;background:var(--card);font-size:13.5px;font-weight:500;box-shadow:inset 0 0 0 .5px var(--line2),0 1px 2px rgba(0,0,0,.04);transition:transform .35s var(--spring),box-shadow .2s}
.gbtn:hover{box-shadow:inset 0 0 0 .5px var(--ink4),0 6px 16px -8px rgba(0,0,0,.18)}.gbtn:active{transform:scale(.97)}
.spin{width:16px;height:16px;border-radius:50%;border:1px solid var(--line2);border-top-color:var(--ink);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lnk{font-size:12.5px;color:var(--ink3);text-decoration:underline;text-underline-offset:3px}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:950;display:grid;gap:6px;justify-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:500;box-shadow:0 10px 30px -8px rgba(0,0,0,.3)}
.scrim{display:none}

/* ── Responsive ───────────────────────────────────── */
@media (max-width:1000px){.cal{grid-template-columns:1fr}.dp{position:static}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);z-index:400;transform:translateX(-102%);transition:transform .45s var(--out),background .35s;box-shadow:none}
  .app.drawer .side{transform:none;box-shadow:20px 0 60px -20px rgba(0,0,0,.25)}
  .scrim{display:block;position:fixed;inset:0;z-index:390;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
  .app.drawer .scrim{opacity:1;pointer-events:auto}
  .tb.burger{display:inline-flex}
  .view{padding:0 20px 30vh}
  .blk{margin-left:-6px;padding-left:6px}.hd{display:none}
  .blk[data-t=callout]{margin-left:-6px}
  .pg-title{font-size:34px}.hello h1{font-size:34px}
  .quick{grid-template-columns:1fr}
  .cd{min-height:64px;padding:4px}.c2{font-size:0;padding:0;height:6px;width:6px;border-radius:50%;background:var(--ink3);box-shadow:none}
  .c2 span{display:none}.cd .more{display:none}
  .cd .chips{display:flex;gap:3px;flex-wrap:wrap}
  .ag{grid-template-columns:1fr;gap:6px}
  .kv{grid-template-columns:110px 1fr}
}

  const walk=n=>{[...n.childNodes].forEach(c=>{
    if(c.nodeType===3)return;if(c.nodeType!==1){c.remove();return}
    walk(c);
    if(!OK_TAGS.has(c.tagName)){c.replaceWith(...c.childNodes);return}
    [...c.attributes].forEach(a=>{if(!(c.tagName==='A'&&a.name==='href'))c.removeAttribute(a.name)});

      if(/^(https?:|mailto:)/i.test(h)){c.setAttribute('target','_blank');c.setAttribute('rel','noopener')}else c.removeAttribute('href')}
  })};
  walk(t.content);return t.innerHTML;
}

      this.unsub=this.col.onSnapshot(snap=>{
        if(first){snap.docs.forEach(d=>{const p=norm(d.data());pages.set(p.id,p)});first=false;res();return}
        let changed=false,openChanged=false;
        snap.docChanges().forEach(ch=>{
          if(ch.doc.metadata?.hasPendingWrites)return;
          const p=norm(ch.doc.data());
          if(ch.type==='removed'){if(pages.delete(p.id)){changed=true;if(p.id===openId)openChanged=true}return}
          const cur=pages.get(p.id);if(cur&&cur.updated>=p.updated)return;

          pages.set(p.id,p);changed=true;if(p.id===openId)openChanged=true;

  stop(){try{this.unsub?.()}catch{}this.unsub=null},
  put(p){return this.col.doc(p.id).set(p)},

const timers=new Map();

function setSaved(s){const el=$('#saved');el.className='saved'+(s==='busy'?' busy':s==='err'?' err':'');

function save(p,now){
  clearTimeout(timers.get(p.id));setSaved('busy');
  const f=()=>{timers.delete(p.id);S.put(snapshot(p)).then(()=>{if(!timers.size)setSaved('ok')},e=>{setSaved('err');toast('Kaydedilemedi: '+(e.code||e.message))})};
  if(now)f();else timers.set(p.id,setTimeout(f,450));

function route(){
  const h=decodeURIComponent(location.hash.slice(1))||'home';const[v,id]=h.split('/');
  if(v==='today'||v==='day'){const d=v==='day'&&/^\d{4}-\d{2}-\d{2}$/.test(id||'')?id:today();let p=dailyOf(d);if(!p){p=newPage({tpl:'daily',date:d});FRESH.add(p.id)}location.replace('#p/'+p.id);return}
  sweepFresh(v==='p'?id:null);
  if(v==='p'&&pages.has(id)){view='page';openId=id}
  else if(v==='timeline'){view='timeline';openId=null}
  else if(v==='cal'){view='cal';openId=null}
  else if(v==='tpl'){view='tpl';openId=null}
  else{view='home';openId=null}

}

/* ════════════════════════════════════════════════════════════
   GÜNLER — Workflowy tarzı takvim: her güne bir günlük not,
   her yerdeki tarihli satırlar o günde “Bulunan tarihler” olarak görünür,
   30 günlük zaman çizelgesinde sürükle-bırak ile planlanır.
   ════════════════════════════════════════════════════════════ */
const TRM=['ocak','şubat','mart','nisan','mayıs','haziran','temmuz','ağustos','eylül','ekim','kasım','aralık'];
const TRW=['pazartesi','salı','çarşamba','perşembe','cuma','cumartesi','pazar'];
const lo=s=>String(s||'').toLocaleLowerCase('tr').trim();
const dowOf=s=>(pd(s).getDay()+6)%7;
function mkDate(y,m,d){const x=new Date(y,m,d);return x.getMonth()===m&&x.getDate()===d?ymd(x):null}
function guessYear(m,d){const t=new Date(),y=t.getFullYear(),c=mkDate(y,m,d);if(!c)return null;return(pd(c)-t)/864e5<-60?mkDate(y+1,m,d):c}
// natural language → YYYY-MM-DD (Turkish): bugün, yarın, öbür gün, dün, 3 gün sonra, 2 hafta sonra, gelecek hafta, cuma, gelecek salı, 15 kasım, 15.11.2026, 2026-11-15, ay sonu
function parseTR(q){q=lo(q).replace(/[’']/g,'').replace(/\s+/g,' ');if(!q)return null;const t=today();
  if(/^(bugün|bugun|today)$/.test(q))return t;
  if(/^(yarın|yarin|tomorrow)$/.test(q))return addDays(t,1);
  if(/^(öbür gün|obur gun|öbürgün|ertesi gün)$/.test(q))return addDays(t,2);
  if(/^(dün|dun|yesterday)$/.test(q))return addDays(t,-1);
  let m=q.match(/^(\d{1,3}) (gün|gun|hafta|ay) (sonra|sonraya|içinde|önce|once)$/);
  if(m){const n=+m[1]*(m[2]==='hafta'?7:1),s=/önce|once/.test(m[3])?-1:1;if(m[2]==='ay'){const d=pd(t);d.setMonth(d.getMonth()+s*+m[1]);return ymd(d)}return addDays(t,s*n)}
  if(/^(gelecek|önümüzdeki|haftaya) hafta$|^haftaya$/.test(q))return addDays(t,7-dowOf(t));
  if(/^(ay sonu|ay sonunda)$/.test(q)){const d=pd(t);return ymd(new Date(d.getFullYear(),d.getMonth()+1,0))}

  if(m){const w=TRW.findIndex(x=>x.normalize('NFD').replace(/[̀-ͯ]/g,'').replace('ı','i')===m[2].normalize('NFD').replace(/[̀-ͯ]/g,'').replace('ı','i'));
    let d=(w-dowOf(t)+7)%7;if(d===0)d=7;if(m[1]&&/gelecek|önümüzdeki|haftaya/.test(m[1])&&d<7)d+=dowOf(t)<w?7:0;return addDays(t,d)}

const RX_DATE=new RegExp(`\\b(\\d{1,2}) (${TRM.join('|')})(?: (\\d{4}))?|\\b(\\d{1,2})[./](\\d{1,2})[./](\\d{4})\\b|\\b(\\d{4})-(\\d{2})-(\\d{2})\\b`,'gi');

/* Caret helpers */
const textLen=el=>el.textContent.length;
function caretOff(el){const s=getSelection();if(!s.rangeCount)return 0;const r=s.getRangeAt(0);if(!el.contains(r.endContainer)&&r.endContainer!==el)return 0;const pre=document.createRange();pre.selectNodeContents(el);pre.setEnd(r.endContainer,r.endOffset);return pre.toString().length}
function rangeAt(el,a,b=a){const r=document.createRange(),tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let pos=0,n,sN=null,sO=0,eN=null,eO=0;
  while((n=tw.nextNode())){const len=n.nodeValue.length;if(!sN&&a<=pos+len){sN=n;sO=a-pos}if(sN&&!eN&&b<=pos+len){eN=n;eO=b-pos;break}pos+=len}
  if(!sN){r.selectNodeContents(el);r.collapse(false);return r}r.setStart(sN,sO);if(eN)r.setEnd(eN,eO);else r.setEnd(el,el.childNodes.length);return r}
function setCaret(el,off){if(!el)return;el.focus({preventScroll:true});const s=getSelection();let r;
  if(off==null||off>=textLen(el)){r=document.createRange();r.selectNodeContents(el);r.collapse(false)}else{r=rangeAt(el,off);r.collapse(true)}
  s.removeAllRanges();s.addRange(r);keepVisible(el)}
const focusEnd=el=>setCaret(el,null);
function keepVisible(el){const r=el.getBoundingClientRect(),sr=sc.getBoundingClientRect();if(r.bottom>sr.bottom-60)sc.scrollBy({top:r.bottom-sr.bottom+120,behavior:'smooth'});else if(r.top<sr.top+60)sc.scrollBy({top:r.top-sr.top-120,behavior:'smooth'})}
const collapsed=()=>{const s=getSelection();return s.rangeCount&&s.getRangeAt(0).collapsed};
function caretRect(){const s=getSelection();if(!s.rangeCount)return null;const r=s.getRangeAt(0).cloneRange();r.collapse(true);const rs=r.getClientRects();return rs[0]||null}

function onLastLine(el){const c=caretRect();if(!c)return true;const lh=parseFloat(getComputedStyle(el).lineHeight)||24;return el.getBoundingClientRect().bottom-c.bottom<lh*.85}
function focusBlock(b,off,f){if(!b)return;if(b.t==='divider'){nodeOf(b)?.querySelector('.div')?.focus();return}if(b.t==='page'){nodeOf(b)?.querySelector('.pgb')?.focus();return}setCaret(txtOf(b,f||(b.t==='kv'&&off==null?'v':'h')),off)}

/* Block ops */

function insertAfter(b,nb,off=0){const i=b?idx(b):-1;P.blocks.splice(i+1,0,nb);const tmp=document.createElement('div');tmp.innerHTML=blockHTML(nb);const node=tmp.firstChild;
  if(b)nodeOf(b).after(node);else $('#blocks').prepend(node);animIn(node);renumber();focusBlock(nb,off);edited();return nb}
function replaceNode(b){const old=nodeOf(b);const tmp=document.createElement('div');tmp.innerHTML=blockHTML(b);const node=tmp.firstChild;old.replaceWith(node);renumber();return node}
function setType(b,t,keepCaret=0){const was=b.t;
  if(t==='code')b.h=esc(plain(b.h));

  focusBlock(b,keepCaret,'h');edited()}
function removeBlock(b){const i=idx(b);if(i<0)return;P.blocks.splice(i,1);nodeOf(b)?.remove();if(!P.blocks.length){const nb=B('p');P.blocks.push(nb);$('#blocks').innerHTML=blockHTML(nb)}renumber()}
function moveBlock(b,d){const i=idx(b),j=i+d;if(j<0||j>=P.blocks.length)return;flip($('#blocks'),()=>{P.blocks.splice(i,1);P.blocks.splice(j,0,b);const n=nodeOf(b),o=nodeOf(P.blocks[d<0?j+1:j-1]);d<0?o.before(n):o.after(n)});renumber();edited()}

  els.forEach(e=>{const f=first.get(e),l=e.getBoundingClientRect(),dy=f.top-l.top;if(dy)anim(e,[{transform:`translateY(${dy}px)`},{transform:'none'}],{duration:380,easing:OUT})})}

/* Markdown shortcuts */
const MD=[['# ','h1'],['## ','h2'],['### ','h3'],['- ','bullet'],['* ','bullet'],['• ','bullet'],['1. ','num'],['[] ','todo'],['[ ] ','todo'],['[x] ','todo'],['> ','quote'],['``` ','code'],['--- ','divider'],['!! ','callout'],[': ','kv']];

$('#view').addEventListener('input',e=>{

  const el=e.target.closest('.txt');if(!el)return;const node=el.closest('.blk'),b=blockOf(node.dataset.id),f=el.dataset.f;if(!b)return;
  if(normHTML(el.innerHTML)!==el.innerHTML)el.innerHTML='';
  b[f]=el.innerHTML;
  if(f==='h'&&!['code','kv'].includes(b.t)&&e.inputType==='insertText'&&e.data===' '){
    const off=caretOff(el),pre=el.textContent.slice(0,off);const hit=MD.find(([m])=>m===pre);
    if(hit&&(hit[1]!==b.t||hit[1]==='todo')){rangeAt(el,0,off).deleteContents();b.h=el.innerHTML;
      if(hit[0]==='[x] ')b.c=true;
      if(hit[1]==='divider'){b.t='divider';b.h='';replaceNode(b);insertAfter(b,B('p'));return}
      setType(b,hit[1]);return}
  }
  if(f==='h'&&b.t!=='code'&&b.t!=='kv'&&e.inputType==='insertText'&&e.data==='/'){const off=caretOff(el),before=el.textContent.slice(0,off-1);if(!before||/\s$/.test(before))openSlash(b,el,off-1)}

  if(tEl.classList.contains('pgb')){const b=blockOf(tEl.closest('.blk').dataset.id);if(!b)return;

    if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();const prev=P.blocks[idx(b)-1];removeBlock(b);edited();toast('Bağlantı kaldırıldı — sayfa “Alt sayfalar”da duruyor');prev?focusBlock(prev,null):focusBlock(P.blocks[0],0);renderKids();return}

    return}

    if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();const prev=P.blocks[idx(b)-1];removeBlock(b);edited();prev?focusBlock(prev,null):focusBlock(P.blocks[0],0)}
    else if(e.key==='Enter'){e.preventDefault();insertAfter(b,B('p'))}

  const el=tEl.closest?.('.txt');if(!el)return;const b=blockOf(el.closest('.blk').dataset.id);if(!b)return;const f=el.dataset.f;
  if(slash&&slashKey(e))return;

    e.preventDefault();if(prev)focusBlock(prev,null,prev.t==='kv'?'v':'h');else focusEnd($('.pg-title'));return}

});
function insertBeforeFirst(){const nb=B('p');P.blocks.unshift(nb);const tmp=document.createElement('div');tmp.innerHTML=blockHTML(nb);$('#blocks').prepend(tmp.firstChild);animIn(nodeOf(nb));focusBlock(nb,0);edited()}
function split(el,b){

/* Paste: plain text, multi-line → blocks */
$('#view').addEventListener('paste',e=>{

  const el=e.target.closest?.('.txt,.pg-title');if(!el)return;e.preventDefault();
  const text=(e.clipboardData.getData('text/plain')||'').replace(/\r/g,'');if(!text)return;
  if(el.classList.contains('pg-title')||!text.includes('\n')){document.execCommand('insertText',false,el.classList.contains('pg-title')?text.replace(/\n/g,' '):text);return}

    P.blocks.splice(idx(cur)+1,0,nb);const tmp=document.createElement('div');tmp.innerHTML=blockHTML(nb);nodeOf(cur).after(tmp.firstChild);cur=nb}
  renumber();focusBlock(cur,null);edited();

/* ── Slash menu ───────────────────────────────────────────── */
let slash=null;
function openSlash(b,el,start){slash={b,el,start,i:0,items:[]};updateSlash(true)}
function updateSlash(first){
  if(!slash)return;const{el,start}=slash;const off=caretOff(el);
  if(document.activeElement!==el||off<=start||el.textContent[start]!=='/'){closeSlash();return}
  const q=el.textContent.slice(start+1,off).toLocaleLowerCase('tr');
  if(q.length>14||/\s{2}/.test(q)){closeSlash();return}
  const all=[...TYPES,...ACTIONS];const items=q?all.filter(t=>(t.l.toLocaleLowerCase('tr')+' '+t.kw).includes(q)):all;
  if(!items.length&&q.length>3){closeSlash();return}
  slash.items=items;slash.i=Math.min(slash.i,Math.max(0,items.length-1));
  let pop=$('#slash');
  const html=items.length?`<div class="pop-h">${q?'Sonuçlar':'Bloklar'}</div>`+items.map((t,i)=>`<button class="mi${i===slash.i?' act':''}" data-si="${i}"><span class="bi">${t.b}</span><span class="tx">${esc(t.l)}<small>${esc(t.d)}</small></span></button>`).join(''):`<div class="pal-e" style="padding:14px">Sonuç yok</div>`;
  if(!pop){pop=document.createElement('div');pop.className='pop scroll-y';pop.id='slash';document.body.appendChild(pop);
    pop.addEventListener('pointerdown',e=>e.preventDefault());
    pop.addEventListener('click',e=>{const it=e.target.closest('[data-si]');if(it)applySlash(+it.dataset.si)});
    pop.addEventListener('pointermove',e=>{const it=e.target.closest('[data-si]');if(it&&+it.dataset.si!==slash?.i){slash.i=+it.dataset.si;markSlash()}})}
  pop.innerHTML=html;
  const r=caretRect()||el.getBoundingClientRect();const h=Math.min(380,innerHeight*.6);let top=r.bottom+6,ox='0px',oy='0px';
  if(top+h>innerHeight-10){top=Math.max(10,r.top-6-Math.min(pop.offsetHeight,h));oy='100%'}
  pop.style.left=Math.min(r.left-8,innerWidth-310)+'px';pop.style.top=top+'px';pop.style.setProperty('--ox',ox);pop.style.setProperty('--oy',oy);
  if(first)anim(pop,[{opacity:0,transform:'scale(.95) translateY(-4px)'},{opacity:1,transform:'none'}],{duration:240,easing:OUT});
}
function markSlash(){$$('#slash .mi').forEach((m,i)=>m.classList.toggle('act',i===slash.i));$(`#slash [data-si="${slash.i}"]`)?.scrollIntoView({block:'nearest'})}
function slashKey(e){
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=slash.items.length;if(!n)return true;slash.i=(slash.i+(e.key==='ArrowDown'?1:-1)+n)%n;markSlash();return true}
  if(e.key==='Enter'||e.key==='Tab'){if(!slash.items.length){closeSlash();return false}e.preventDefault();applySlash(slash.i);return true}
  if(e.key==='Escape'){e.preventDefault();closeSlash();return true}
  return false;
}
function closeSlash(){slash=null;const p=$('#slash');if(p){p.id='';anim(p,[{opacity:1},{opacity:0,transform:'scale(.97)'}],{duration:120,easing:EASE}).finished.then(()=>p.remove(),()=>p.remove())}}
function applySlash(i){
  const s=slash;if(!s)return;const t=s.items[i];if(!t)return;const{b,el,start}=s;closeSlash();
  rangeAt(el,start,caretOff(el)).deleteContents();b.h=normHTML(el.innerHTML);if(!b.h)el.innerHTML='';
  if(t.k==='@date'){setCaret(el,start);document.execCommand('insertText',false,fmtLong(today()));return}
  if(t.k==='@due'){datePop(nodeOf(b).querySelector('.txt'),b.d,d=>{setBlockDate(P,b,d);focusBlock(b,null)});return}
  if(t.k==='@today'){b.h=normHTML(el.innerHTML);moveToDay(P,b,today());return}
  if(t.k==='@move'){b.h=normHTML(el.innerHTML);datePop(nodeOf(b).querySelector('.txt'),null,d=>d&&moveToDay(P,b,d),{title:'Hangi günün notuna?',clear:false});return}
  if(t.k==='@page'){b.h=normHTML(el.innerHTML);addSubpage(b,{replaceEmpty:true});return}
  if(t.k==='divider'){if(!el.textContent){b.t='divider';b.h='';replaceNode(b);insertAfter(b,B('p'))}else insertAfter(b,B('divider')),insertAfter(P.blocks[idx(b)+1],B('p'));return}
  if(t.k==='kv'&&el.textContent){insertAfter(b,B('kv','',{v:''}));return}
  setType(b,t.k,start);
}

  draw();setTimeout(()=>inp.focus(),10);
}
function closePal(){if(!palEl)return;const bg=palEl;palEl=null;anim(bg.firstChild,[{opacity:1},{opacity:0,transform:'scale(.98)'}],{duration:140,easing:EASE});
  anim(bg,[{opacity:1},{opacity:0}],{duration:160,easing:EASE}).finished.then(()=>bg.remove(),()=>bg.remove())}

/* ── Global keys ──────────────────────────────────────────── */
addEventListener('keydown',e=>{
  if(!started||!$('#gate').hidden)return;
  const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
  if(mod&&k==='k'){e.preventDefault();palEl?closePal():palette()}
  else if(mod&&e.altKey&&k==='n'){e.preventDefault();go('#p/'+newPage().id)}
  else if(mod&&e.shiftKey&&k==='l'){e.preventDefault();toggleTheme()}
  else if(e.key==='Escape'){if(floatEl)hideFloat();else if($('#app').classList.contains('drawer'))closeDrawer()}
});

/* ── Theme & toast ────────────────────────────────────────── */
function applyTheme(){const t=ls.get('notlar:theme',null)||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}
function toggleTheme(){const cur=document.documentElement.dataset.theme==='dark'?'light':'dark';ls.set('notlar:theme',cur);document.documentElement.dataset.theme=cur;
  anim($('#themeBtn'),[{transform:'rotate(-180deg) scale(.7)'},{transform:'none'}],{duration:620,easing:SPRING})}
$('#themeBtn').onclick=toggleTheme;
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toasts').prepend(t);
  anim(t,[{opacity:0,transform:'translateY(10px) scale(.94)'},{opacity:1,transform:'none'}],{duration:420,easing:OUT});
  setTimeout(()=>anim(t,[{opacity:1},{opacity:0,transform:'translateY(4px)'}],{duration:220,easing:EASE,fill:'forwards'}).finished.then(()=>t.remove(),()=>t.remove()),2400)}
setInterval(()=>{if(view==='page'&&P){const e=$('#edited');if(e)e.textContent='düzenlendi '+rel(P.updated)}},30000);

/* ── Welcome ──────────────────────────────────────────────── */
function welcome(){
  if(pages.size||ls.get('notlar:welcomed',false))return;ls.set('notlar:welcomed',true);
  const p=norm({id:uid(),title:'Başlarken',icon:'👋',fav:true,blocks:[
    B('p','Burası senin defterin. Yazmaya başla; her şey otomatik kaydedilir ve tüm cihazlarında eşitlenir.'),
    B('h2','Birkaç ipucu'),
    B('todo',"Boş bir satıra <b>/</b> yaz, blok menüsü açılır"),
    B('todo','<code>#</code>, <code>-</code>, <code>[]</code>, <code>&gt;</code> ile yazarken biçimlendir'),
    B('todo',`<b>${MOD}K</b> ile her sayfaya ve komuta ulaş`),
    B('todo','Takvim’de bir güne tıkla, o güne plan ekle'),
    B('todo','Metni seç; kalın, italik, vurgu araçları çıkar'),
    B('callout','Notların yalnızca senin hesabında durur.',{e:'🔒'}),
  ]});pages.set(p.id,p);save(p,true);
}

/* ── Gate & boot ──────────────────────────────────────────── */
function gate(state,msg){const g=$('#gate');g.hidden=false;$('#gSpin').hidden=state!=='loading';$('#gBtn').hidden=!(state==='signin'||state==='error');$('#gOut').hidden=state!=='denied';
  $('#gMsg').innerHTML=msg??(state==='loading'?'Bağlanıyor…':'Devam etmek için giriş yap.')}
async function ungate(){const g=$('#gate');if(g.hidden)return;await anim(g,[{opacity:1},{opacity:0}],{duration:280,easing:EASE,fill:'forwards'}).finished.catch(()=>{});g.hidden=true;g.getAnimations().forEach(a=>a.cancel())}
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function loadFirebase(){if(window.firebase?.auth&&window.firebase?.firestore)return;const b='https://www.gstatic.com/firebasejs/10.12.2/';await loadScript(b+'firebase-app-compat.js');await Promise.all([loadScript(b+'firebase-auth-compat.js'),loadScript(b+'firebase-firestore-compat.js')])}
const authMsg=e=>({'auth/unauthorized-domain':'Bu adres Firebase’de izinli değil (Authorized domains).','auth/network-request-failed':'Bağlantı hatası.'}[e.code]||('Giriş başarısız: '+(e.code||e.message)));
$('#gBtn').onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  try{await firebase.auth().signInWithPopup(p)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code))return firebase.auth().signInWithRedirect(p);if(e.code!=='auth/popup-closed-by-user')gate('error',authMsg(e))}};
$('#gOut').onclick=()=>firebase.auth().signOut();
$('#me').onclick=e=>{const u=firebase.auth().currentUser;if(!u)return;const p=float($('#me'),`<div class="pop-h" style="text-transform:none;letter-spacing:0;font-family:var(--font);font-size:12px;line-height:1.4"><b style="display:block;color:var(--ink);font-weight:500">${esc(u.displayName||'Hesap')}</b>${esc(u.email)}</div><div class="sep"></div><button class="mi" data-out><span class="bi">${IC.out}</span><span class="tx">Çıkış yap</span></button>`,{w:240});
  p.addEventListener('click',ev=>{if(ev.target.closest('[data-out]')){hideFloat();flushAll();firebase.auth().signOut()}})};
function start(){applyTheme();welcome();if(!started){started=true}route()}
(async()=>{
  applyTheme();
  if(!CLOUD){S=Local;Local.load().forEach(p=>{const n=norm(p);pages.set(n.id,n)});$('#saved').title='Bu tarayıcıda kayıtlı';start();return}
  gate('loading');
  try{await loadFirebase()}catch{return gate('error','Firebase yüklenemedi. İnternet bağlantını kontrol et.')}
  if(!firebase.apps.length)firebase.initializeApp(FB);
  const fs=firebase.firestore();try{await fs.enablePersistence({synchronizeTabs:true})}catch{}
  firebase.auth().getRedirectResult().catch(e=>gate('error',authMsg(e)));
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){Cloud.stop();pages.clear();P=null;$('#view').innerHTML='';$('#nav').innerHTML='';$('#me').hidden=true;closePal();hideFloat(true);return gate('signin')}
    if((u.email||'').toLowerCase()!==OWNER){Cloud.stop();return gate('denied',`<b>${esc(u.email)}</b> bu deftere erişemez.`)}
    gate('loading','Notlar yükleniyor…');S=Cloud;pages.clear();await Cloud.start(fs);
    const me=$('#me');me.hidden=false;me.innerHTML=u.photoURL?`<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">`:esc((u.displayName||u.email)[0].toUpperCase());
    start();await ungate();
  });
})();
</script>
