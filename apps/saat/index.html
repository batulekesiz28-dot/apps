<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saat</title>
<style>
  :root{--bg:#FAFAFA;--card:#FFFFFF;--ink:#18181B;--ink2:#71717A;--ink3:#6E6E77;--line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.09);--font:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:light}
  [data-theme=dark]{--bg:#0E0E10;--card:#18181B;--ink:#EDEDEF;--ink2:#A1A1AA;--ink3:#8B8B94;--line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.1);color-scheme:dark}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);box-shadow:0 0 0 .5px var(--line2);border-radius:18px;overflow:hidden;width:min(760px,92vw)}
  .c{background:var(--card);padding:28px 24px}
  .city{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
  .t{font-size:44px;font-weight:200;letter-spacing:-.04em;margin-top:14px;font-variant-numeric:tabular-nums}
  .d{font-size:12px;color:var(--ink2);margin-top:6px}
  html[data-skin=neon] .t{text-shadow:0 0 18px rgba(255,79,179,.6)}html[data-skin=cyberpunk] .t{color:#FCEE0A;font-weight:500}html[data-skin=doga] .t{font-family:'Fraunces',Georgia,serif;font-weight:300}html[data-skin=evren] .t{font-weight:300}
</style>
<script>try{var f=JSON.parse(localStorage.getItem('notlar:theme'));if(f)document.documentElement.dataset.theme=f}catch(e){}</script>
<script src="../../shared/skin.js"></script>
</head>
<body>
<div class="wrap" id="w"></div>
<script>
  const zones=[['İstanbul','Europe/Istanbul'],['Milano','Europe/Rome'],['Londra','Europe/London'],['Los Angeles','America/Los_Angeles']];
  const w=document.getElementById('w');
  w.innerHTML=zones.map(([c])=>`<div class="c"><div class="city">${c}</div><div class="t">--:--</div><div class="d"></div></div>`).join('');
  const cells=[...w.children];
  function tick(){
    const now=new Date();
    zones.forEach(([,tz],i)=>{
      cells[i].querySelector('.t').textContent=now.toLocaleTimeString('tr-TR',{timeZone:tz,hour:'2-digit',minute:'2-digit'});
      cells[i].querySelector('.d').textContent=now.toLocaleDateString('tr-TR',{timeZone:tz,weekday:'long',day:'numeric',month:'long'});
    });
  }
  tick(); setInterval(tick,1000);
</script>
</body>
</html>
