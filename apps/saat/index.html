<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saat</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{display:grid;place-items:center;background:#FAFAFA;color:#18181B;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:rgba(0,0,0,.07);border:.5px solid rgba(0,0,0,.09);border-radius:18px;overflow:hidden;width:min(760px,92vw)}
  .c{background:#fff;padding:28px 24px}
  .city{font:500 11.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#6E6E77}
  .t{font-size:44px;font-weight:200;letter-spacing:-.04em;margin-top:14px;font-variant-numeric:tabular-nums}
  .d{font-size:12px;color:#71717A;margin-top:6px}
</style>
</head>
<body>
<div class="wrap" id="w"></div>
<script>
  const zones=[['İstanbul','Europe/Istanbul'],['Milano','Europe/Rome'],['Londra','Europe/London'],['Los Angeles','America/Los_Angeles']];
  const w=document.getElementById('w');
  w.innerHTML=zones.map(([c])=>`<div class="c"><div class="city">${c}</div><div class="t">--:--</div><div class="d"></div></div>`).join('');
  const cells=[...w.children];
  function tick(){
    const now=new Date();
    zones.forEach(([,tz],i)=>{
      cells[i].querySelector('.t').textContent=now.toLocaleTimeString('tr-TR',{timeZone:tz,hour:'2-digit',minute:'2-digit'});
      cells[i].querySelector('.d').textContent=now.toLocaleDateString('tr-TR',{timeZone:tz,weekday:'long',day:'numeric',month:'long'});
    });
  }
  tick(); setInterval(tick,1000);
</script>
</body>
</html>
