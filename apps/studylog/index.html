<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Study Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try{const t=JSON.parse(localStorage.getItem('notlar:theme'))||JSON.parse(localStorage.getItem('appshell:theme'));document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{document.documentElement.dataset.theme='light'}</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFFFFF;--bg2:#FAFAF9;--card:#FFFFFF;--ink:#18181B;--ink2:#52525B;--ink3:#A1A1AA;--ink4:#E4E4E7;
  --line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.1);--hover:rgba(0,0,0,.04);
  --font:'Geist',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --out:cubic-bezier(.16,1,.3,1);--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.4,.5,1);
  --shadow:0 0 0 .5px rgba(0,0,0,.08),0 16px 40px -14px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.03);
  --acc:#18181B;color-scheme:light;
}
[data-theme=dark]{
  --bg:#0E0E10;--bg2:#141416;--card:#18181B;--ink:#EDEDEF;--ink2:#A1A1AA;--ink3:#6B6B74;--ink4:#2A2A2F;
  --line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.1);--hover:rgba(255,255,255,.05);
  --shadow:0 0 0 .5px rgba(255,255,255,.1),0 18px 44px -14px rgba(0,0,0,.7);color-scheme:dark;
}
html,body{height:100%;background:var(--bg)}
body{font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .35s var(--ease),color .35s var(--ease)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ── Top ── */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 22px 14px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.02em;font-size:14px;margin-right:auto;user-select:none}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.brand i::after{content:'';width:8px;height:8px;border-radius:50%;border:1.5px solid var(--bg)}
body.running .brand i::after{background:var(--bg);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.6)}}
.tabs{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--bg2);box-shadow:inset 0 0 0 .5px var(--line2)}
.tabs button{position:relative;z-index:1;height:30px;padding:0 14px;border-radius:9px;font-size:13px;color:var(--ink2);transition:color .2s}
.tabs button.on{color:var(--ink)}
.tabs .ind{position:absolute;top:3px;bottom:3px;left:0;border-radius:9px;background:var(--card);box-shadow:0 0 0 .5px var(--line2),0 2px 6px -2px rgba(0,0,0,.12);transition:transform .45s var(--spring),width .45s var(--spring)}
.ib{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--ink2);transition:background .2s,color .2s}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.me{width:28px;height:28px;border-radius:50%;overflow:hidden;font-size:11px;font-weight:600;background:var(--bg2);box-shadow:0 0 0 .5px var(--line2)}.me img{width:100%;height:100%;object-fit:cover}
@media (max-width:680px){
  .top{padding:calc(12px + env(safe-area-inset-top)) 16px 10px;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  main{padding:6px 14px 60px}
  .tcard{padding:18px 16px 22px}
  .tabs{position:fixed;top:auto;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);border-radius:16px;padding:4px}
  .tabs button{height:38px;padding:0 15px;border-radius:12px}.tabs .ind{top:4px;bottom:4px;border-radius:12px}
  main{padding-bottom:110px!important}
}

main{max-width:980px;margin:0 auto;padding:10px 22px 60px}
.view{animation:vin .5s var(--out)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}
.h{font:500 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:8px}
.h .sp{margin-left:auto}
.card{background:var(--card);border-radius:20px;box-shadow:0 0 0 .5px var(--line2),0 10px 30px -22px rgba(0,0,0,.25)}
.tcard,.sess,.dayp,.gc,.dist,.today{grid-template-columns:minmax(0,1fr)}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:11px;font-size:13px;white-space:nowrap;box-shadow:inset 0 0 0 .5px var(--line2);background:var(--card);transition:background .2s,box-shadow .2s,color .2s,transform .45s var(--spring)}
.chip:hover{background:var(--hover)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.chip.add{color:var(--ink3);padding:0 12px}
.chip.ce{padding:0 0 0 12px;gap:6px;box-shadow:inset 0 0 0 1px var(--line2);animation:wig .5s var(--spring)}
.chip.ce .cen{height:100%;font-size:13px}
.chip.ce .cex{width:30px;height:100%;font-size:16px;color:var(--ink3);border-radius:0 11px 11px 0}.chip.ce .cex:hover{color:#fff;background:#DC2626}
@keyframes wig{30%{transform:rotate(-1.5deg)}60%{transform:rotate(1.5deg)}}
.btn{height:42px;padding:0 20px;border-radius:13px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .45s var(--spring),background .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sec{box-shadow:inset 0 0 0 .5px var(--line2);background:var(--card)}.btn.sec:hover{background:var(--hover)}
.btn.ghost{color:var(--ink2)}.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:#DC2626}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.in{width:100%;height:42px;border-radius:12px;border:0;outline:0;padding:0 14px;background:var(--bg2);box-shadow:inset 0 0 0 .5px var(--line2);font-size:14px;transition:box-shadow .2s}
.in:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}.scroll::-webkit-scrollbar{display:none}

/* ── Timer view ── */
.tgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.tgrid{grid-template-columns:minmax(0,1fr)}}
.tcard{padding:22px 22px 26px;display:grid;gap:18px}
.today{display:grid;gap:8px}
.today .t{display:flex;align-items:baseline;gap:8px}
.today b{font-size:22px;font-weight:500;letter-spacing:-.03em}
.today span{color:var(--ink3);font-size:13px}
.today .streak{margin-left:auto;font:500 11px/1 var(--mono);color:var(--ink2);padding:6px 9px;border-radius:8px;background:var(--bg2);box-shadow:inset 0 0 0 .5px var(--line2)}
.bar{height:6px;border-radius:6px;background:var(--ink4);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .8s var(--out)}
.topic{border:0;outline:0;background:none;font-size:15px;padding:10px 2px;border-bottom:.5px solid var(--line2);width:100%;transition:border-color .2s}
.topic:focus{border-color:var(--ink)}
.topic::placeholder{color:var(--ink3)}
.tps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}#eTP:empty{display:none}#tps{min-height:28px}
.tp{display:inline-flex;align-items:center;height:28px;border-radius:9px;box-shadow:inset 0 0 0 .5px var(--line2);background:var(--card);font-size:12.5px;color:var(--ink2);transition:background .15s}
.tp:hover{background:var(--hover)}.tp.on{background:var(--ink);color:var(--bg);box-shadow:none}
.tp [data-tp]{padding:0 4px 0 11px;height:100%;max-width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tp .tpx{width:24px;height:100%;opacity:.45;font-size:14px}.tp .tpx:hover{opacity:1}
.dial{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:4px auto 0}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none}
.dial .tr{stroke:var(--ink4);stroke-width:2}
.dial .pg{stroke:var(--acc);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .4s}
.dial .tick{stroke:var(--ink3);stroke-width:1}
.dial .mid{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;text-align:center}
.dial .tm{font-size:clamp(46px,13vw,66px);font-weight:200;letter-spacing:-.05em;line-height:1}
.dial .sub{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:6px;justify-content:center}
.dial .sub i{width:7px;height:7px;border-radius:50%}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--bg2);box-shadow:inset 0 0 0 .5px var(--line2);margin:0 auto}
.seg button{height:28px;padding:0 14px;border-radius:8px;font-size:12.5px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 .5px var(--line2),0 1px 4px rgba(0,0,0,.08)}
.presets{justify-content:center}
.presets .chip{height:30px;padding:0 12px;font:500 12px/1 var(--mono)}
.ctrl{display:flex;gap:10px;justify-content:center;align-items:center}
.go{height:56px;min-width:168px;border-radius:18px;font-size:15px}
.ctrl .btn.sec{height:56px;border-radius:18px;min-width:56px}
.sess{padding:18px 20px;display:grid;gap:4px}
.sl{display:grid;gap:2px;margin:6px -10px 0}
.si{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 10px;border-radius:12px;text-align:left;width:100%;transition:background .15s}
.si:hover{background:var(--hover)}
.si .c{width:4px;height:30px;border-radius:3px}
.si .n{font-size:13.5px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.si .m{font-size:12px;color:var(--ink3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.si .d{font:500 13px/1 var(--mono);color:var(--ink2)}
.empty{color:var(--ink3);font-size:13px;padding:14px 0 6px}
.add{margin-top:6px;justify-self:start}

/* ── Days view ── */
.dleft{display:grid;gap:22px;min-width:0}
@media (min-width:861px){.dayp{position:sticky;top:76px}}
.dgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.cal{padding:20px}
.calh{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.calh b{font-size:18px;font-weight:500;letter-spacing:-.02em;margin-right:auto}
.calh span{color:var(--ink3);font-size:13px;margin-right:8px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cg .wd{font:500 10px/1 var(--mono);color:var(--ink3);text-align:center;padding:4px 0 6px;letter-spacing:.06em}
.cd{position:relative;aspect-ratio:1/.92;border-radius:12px;padding:7px 8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg2);box-shadow:inset 0 0 0 .5px var(--line);transition:transform .4s var(--spring),box-shadow .2s;overflow:hidden}
.cd:hover{box-shadow:inset 0 0 0 .5px var(--line2)}
.cd:active{transform:scale(.95)}
.cd .dn{font-size:12px;color:var(--ink2);position:relative;z-index:1}
.cd .dv{font:500 10.5px/1 var(--mono);position:relative;z-index:1;color:var(--ink)}
.cd .fill{position:absolute;inset:0;background:var(--heat);opacity:var(--o,0);transition:opacity .4s}
.cd.o{opacity:.35}
.cd.t .dn{font-weight:700;color:var(--ink)}
.cd.sel{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cd.goal::after{content:'';position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--ink);z-index:1}
.cd.hot .dn,.cd.hot .dv{color:#fff}
[data-theme=dark] .cd.hot .dn,[data-theme=dark] .cd.hot .dv{color:#0E0E10}
.legend{display:flex;align-items:center;gap:4px;margin-top:12px;font-size:11px;color:var(--ink3);justify-content:flex-end}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--heat)}
.dayp{padding:20px;display:grid;gap:12px}
.dayp .big{font-size:34px;font-weight:300;letter-spacing:-.04em;line-height:1}
.mt{display:grid;gap:12px;padding:14px;border-radius:16px;background:var(--bg2);box-shadow:inset 0 0 0 .5px var(--line2)}
.mt:not(.idle){box-shadow:inset 0 0 0 1px var(--c);background:color-mix(in srgb,var(--c) 6%,var(--bg2))}
.mt-l{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink2)}.mt-l b{color:var(--ink);font-weight:500}.mt-l small{color:var(--ink3);font-size:11.5px}
.mt-l i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;animation:pulse 1.6s ease-in-out infinite}
.mt-t{font-size:40px;font-weight:200;letter-spacing:-.045em;line-height:1}
.mt-b{display:flex;gap:8px;align-items:center}.mt-b .btn{height:40px}.mt-b .btn.pri{flex:1}
.mt-hint{font-size:12px;color:var(--ink3);margin-right:auto}
.mt.idle .mt-b .btn.pri{flex:none}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.qrow .btn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.qrow>:only-child{justify-self:start}
.spark7{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:70px;margin-top:4px}
.spark7 i{display:block;border-radius:3px;background:var(--ink4);min-height:3px;transition:height .6s var(--out)}
.spark7 i.on{background:var(--ink)}

/* ── Goals ── */
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
@media (max-width:760px){.ggrid{grid-template-columns:minmax(0,1fr)}}
.gc{padding:22px;display:grid;gap:14px}
.gv{display:flex;align-items:center;gap:14px}
.gv b{font-size:40px;font-weight:300;letter-spacing:-.04em;line-height:1;flex:1}
.step{display:flex;gap:6px}
.step button{width:38px;height:38px;border-radius:12px;box-shadow:inset 0 0 0 .5px var(--line2);font-size:18px;color:var(--ink2);transition:background .2s,transform .4s var(--spring)}
.step button:hover{background:var(--hover)}.step button:active{transform:scale(.9)}
.ring{display:flex;align-items:center;gap:14px}
.ring svg{width:56px;height:56px;transform:rotate(-90deg);flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .a{stroke:var(--ink4)}.ring .b{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset .8s var(--out)}
.ring p{font-size:13px;color:var(--ink2)}.ring p b{color:var(--ink);font-weight:500}
.subs{grid-column:1/-1}
.sr{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 0;border-top:.5px solid var(--line)}
.sr:first-of-type{border-top:0}
.sr .dot{width:12px;height:12px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 3px var(--card),0 0 0 3.5px var(--line2)}
.sr .nm{min-width:0}
.sr .nm b{font-weight:500;font-size:14px;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sr .nm .bar{margin-top:7px;height:4px}
.sr .nm small{font-size:11.5px;color:var(--ink3)}
.sr .gw{font:500 12px/1 var(--mono);color:var(--ink2);display:flex;align-items:center;gap:6px}
.sr .gw button{width:26px;height:26px;border-radius:8px;box-shadow:inset 0 0 0 .5px var(--line2);color:var(--ink2)}
.sr .gw button:hover{background:var(--hover)}
.sr .x{color:var(--ink3);width:28px;height:28px;border-radius:8px}.sr .x:hover{color:#DC2626;background:var(--hover)}

/* ── Stats ── */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:16px 18px;display:grid;gap:8px}
.kpi b{font-size:26px;font-weight:400;letter-spacing:-.035em;line-height:1}
.kpi small{font-size:12px;color:var(--ink3)}
.sgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media (max-width:860px){.sgrid{grid-template-columns:minmax(0,1fr)}}
.chart{padding:20px}
.chart svg{width:100%;height:220px;display:block;margin-top:14px;overflow:visible}
.chart .gl{stroke:var(--ink3);stroke-dasharray:3 4;stroke-width:1}
.chart .ax{font:500 10px var(--mono);fill:var(--ink3)}
.chart rect{transition:height .6s var(--out),y .6s var(--out)}
.dist{padding:20px;display:grid;gap:12px;align-content:start}
.dr{display:grid;gap:6px}
.dr .t{display:flex;align-items:center;gap:8px;font-size:13px}
.dr .t i{width:8px;height:8px;border-radius:50%}
.dr .t span{margin-left:auto;font:500 12px/1 var(--mono);color:var(--ink2)}
.dr .bar{height:5px}

/* ── Sheet ── */
.scrim{position:fixed;inset:0;z-index:100;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px}
.sheet{width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px;display:grid;gap:16px}
.sheet h3{font-size:16px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center}
.sheet h3 .ib{margin-left:auto;margin-right:-8px}
.fl{font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;display:block}
.sf{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.sf .btn.danger{margin-right:auto}
.cols{display:flex;gap:8px;flex-wrap:wrap}
.cols button{width:28px;height:28px;border-radius:50%;transition:transform .4s var(--spring),box-shadow .2s}
.cols button.on{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink);transform:scale(1.05)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:680px){.scrim{align-items:end;padding:0}.sheet{border-radius:22px 22px 0 0;width:100%;padding-bottom:calc(20px + env(safe-area-inset-bottom))}}

/* ── Toast / gate ── */
.toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:300;display:grid;gap:6px;justify-items:center;pointer-events:none}
@media (max-width:680px){.toasts{bottom:calc(84px + env(safe-area-inset-bottom))}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;height:40px;padding:0 8px 0 16px;border-radius:13px;background:var(--ink);color:var(--bg);font-size:13px;box-shadow:0 14px 34px -12px rgba(0,0,0,.4)}
.toast:not(.u){padding-right:16px}
.toast button{height:28px;padding:0 10px;border-radius:8px;font-weight:600;background:color-mix(in srgb,var(--bg) 16%,transparent)}
.gate{position:fixed;inset:0;z-index:900;display:grid;place-items:center;padding:24px;background:var(--bg)}
.gate-c{width:min(320px,100%);display:grid;justify-items:center;gap:14px;text-align:center}
.gate-c .brand{margin:0;font-size:22px}.gate-c .brand i{width:34px;height:34px;border-radius:10px}
.gate p{color:var(--ink2);font-size:13px;min-height:20px}
.gbtn{display:flex;align-items:center;gap:10px;height:44px;padding:0 20px;border-radius:13px;background:var(--card);box-shadow:inset 0 0 0 .5px var(--line2),0 6px 18px -10px rgba(0,0,0,.2);font-weight:500}
.spin{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink4);border-top-color:var(--ink);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lnk{font-size:12.5px;color:var(--ink3);text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i></i>Study Log</div>
  <nav class="tabs" id="tabs">
    <span class="ind" id="ind"></span>
    <button data-v="days">Günler</button><button data-v="goals">Hedefler</button><button data-v="stats">Takip</button>
  </nav>
  <button class="ib" id="themeBtn" title="Tema" aria-label="Tema"><svg viewBox="0 0 16 16"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg></button>
  <button class="me" id="me" hidden title="Hesap"></button>
</header>
<main id="main"></main>
<div class="toasts" id="toasts"></div>
<div class="gate" id="gate" hidden>
  <div class="gate-c">
    <div class="brand"><i></i>Study Log</div>
    <p id="gMsg"></p>
    <button class="gbtn" id="gBtn" hidden><svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>Google ile giriş</button>
    <span class="spin" id="gSpin"></span>
    <button class="lnk" id="gOut" hidden>Başka hesapla dene</button>
  </div>
</div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════
   Study Log — sayaç · günler · hedefler · takip
   Veri: Firestore hub/studylog (ayarlar + çalışan sayaç) ve hub/studylog/sessions
   ════════════════════════════════════════════════════════════ */
const $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const OUT='cubic-bezier(.16,1,.3,1)',EASE='cubic-bezier(.2,.8,.2,1)',SPRING='cubic-bezier(.3,1.4,.5,1)';
const anim=(el,kf,o)=>(!el||REDUCED)?{finished:Promise.resolve()}:el.animate(kf,o);
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const PAL=['#2F6FEB','#1F9D55','#D97706','#E11D48','#7C3AED','#0D9488','#EA580C','#71717A'];
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return ymd(d)};
const weekStart=k=>{const d=parse(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const MON=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const WD=['Pt','Sa','Ça','Pe','Cu','Ct','Pz'];
// minutes → "1 sa 20 dk"
const fm=m=>{m=Math.round(m);if(m<60)return m+' dk';const h=Math.floor(m/60),r=m%60;return r?`${h} sa ${r} dk`:`${h} sa`};
const fs2=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?`${h}:${String(r).padStart(2,'0')}`:`${r}dk`};
const clock=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0')};
const hm=t=>new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const longDay=k=>parse(k).toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});

/* ── State ── */
const DEF={subjects:[{id:'s1',name:'Matematik',color:PAL[0],goalW:0},{id:'s2',name:'İngilizce',color:PAL[4],goalW:0},{id:'s3',name:'Fen',color:PAL[1],goalW:0},{id:'s4',name:'Okuma',color:PAL[2],goalW:0}],
  goalDay:180,goalWeek:1200,presets:[15,25,45,60,90],topics:{},lastTopic:{},run:null,sel:'s1',mode:'up',target:1500,updated:0};
let set=JSON.parse(JSON.stringify(DEF));
const sessions=new Map();            // id → {id,subj,topic,date,start,end,min,src,updated}
let view='days',calM=null,selDay=today(),statRange=7,distRange='week';

/* ── Storage ── */
const FB={apiKey:'AIzaSyDpJc9g4XDBq32T9Pf1UKbuhzRmnx__mak',authDomain:'apps-f1cfd.firebaseapp.com',projectId:'apps-f1cfd'};
const OWNER='batulekesiz28@gmail.com';
const CLOUD=/^https?:$/.test(location.protocol)&&!new URLSearchParams(location.search).has('local');
const Local={kind:'local',
  load(){const d=ls.get('studylog:v1',null);if(d){set={...structuredClone(DEF),...d.set};(d.sessions||[]).forEach(s=>sessions.set(s.id,s))}},
  save(){ls.set('studylog:v1',{set,sessions:[...sessions.values()]});return Promise.resolve()},
  putSet(){return this.save()},put(){return this.save()},del(){return this.save()}};
const Cloud={kind:'cloud',doc:null,col:null,unsubs:[],
  start(fs){this.doc=fs.collection('hub').doc('studylog');this.col=this.doc.collection('sessions');
    return new Promise(res=>{let need=2;const ok=()=>{if(--need===0)res()};let f1=true,f2=true;
      this.unsubs.push(this.doc.onSnapshot(s=>{const d=s.data();if(d&&!s.metadata.hasPendingWrites&&(d.updated||0)>=(set.updated||0)){set={...structuredClone(DEF),...d};if(!f1)render(true)}if(f1){f1=false;ok()}},()=>{if(f1){f1=false;ok()}}));
      this.unsubs.push(this.col.onSnapshot(s=>{let ch=false;s.docChanges().forEach(c=>{const v=c.doc.data();if(c.type==='removed'){ch=sessions.delete(c.doc.id)||ch}else{const cur=sessions.get(v.id);if(!cur||(v.updated||0)>=(cur.updated||0)){sessions.set(v.id,v);ch=true}}});
        if(!f2&&ch)render(true);if(f2){f2=false;ok()}},()=>{if(f2){f2=false;ok()}}));})},
  stop(){this.unsubs.forEach(u=>{try{u()}catch{}});this.unsubs=[]},
  putSet(){return this.doc.set(JSON.parse(JSON.stringify(set)))},
  put(s){return this.col.doc(s.id).set(s)},del(id){return this.col.doc(id).delete()}};
let S=Local;
let setT=0;function saveSet(now){set.updated=Date.now();clearTimeout(setT);const go=()=>S.putSet().catch(e=>toast('Kaydedilemedi: '+(e.code||e.message)));if(now)go();else setT=setTimeout(go,400);if(S.kind==='local')Local.save()}
function putSession(s){s.updated=Date.now();sessions.set(s.id,s);S.put(s).catch(e=>toast('Kaydedilemedi: '+(e.code||e.message)))}
function delSession(id){const s=sessions.get(id);if(!s)return;sessions.delete(id);S.del(id).catch(()=>{});render();
  toast(`${subjOf(s.subj).name} · ${fm(s.min)} silindi`,()=>{putSession(s);render()})}

/* ── Derived ── */
const subjOf=id=>set.subjects.find(s=>s.id===id)||{id,name:'Silinmiş ders',color:'#A1A1AA'};
const list=()=>[...sessions.values()];
const minsOn=k=>list().reduce((a,s)=>a+(s.date===k?s.min:0),0);
const liveMin=()=>{const r=set.run;if(!r)return 0;return elapsed()/60};
const elapsed=()=>{const r=set.run;if(!r)return 0;return r.acc+(r.on?(Date.now()-r.at)/1000:0)};
const todayMin=()=>minsOn(today())+(set.run&&set.run.date===today()?liveMin():0);
const rangeMin=(a,b)=>list().reduce((t,s)=>t+(s.date>=a&&s.date<=b?s.min:0),0);
function streak(){const by=new Set(list().filter(s=>s.min>0).map(s=>s.date));let k=today(),n=0;if(!by.has(k))k=addDays(k,-1);while(by.has(k)){n++;k=addDays(k,-1)}
  let best=0,cur=0,prev=null;[...by].sort().forEach(d=>{cur=prev&&addDays(prev,1)===d?cur+1:1;best=Math.max(best,cur);prev=d});return{n,best}}

/* ── Topic memory: once typed, a topic stays and becomes a one-tap chip for that subject ── */
function rememberTopic(subj,t){t=(t||'').trim();if(!subj)return;set.topics||={};set.lastTopic||={};set.lastTopic[subj]=t;if(!t)return;
  const a=(set.topics[subj]||[]).filter(x=>x.toLocaleLowerCase('tr')!==t.toLocaleLowerCase('tr'));a.unshift(t);set.topics[subj]=a.slice(0,8)}
const topicsOf=subj=>(set.topics&&set.topics[subj])||[];
const lastTopic=subj=>(set.lastTopic&&set.lastTopic[subj])||'';
const topicChips=(subj,cur)=>topicsOf(subj).map(t=>`<span class="tp${t===cur?' on':''}"><button data-tp="${esc(t)}">${esc(t)}</button><button class="tpx" data-tpx="${esc(t)}" aria-label="Unut">×</button></span>`).join('');
function forgetTopic(subj,t){set.topics[subj]=topicsOf(subj).filter(x=>x!==t);if(lastTopic(subj)===t)set.lastTopic[subj]='';saveSet()}

/* ── Timer engine ── */
function startRun(o={}){const subj=o.subj||set.sel||set.subjects[0]?.id;if(!subj){toast('Önce bir ders ekle');return}
  const mode=o.mode||set.mode,target=o.target||set.target;
  const topic=(o.topic??($('#topic')?.value||'')).trim();rememberTopic(subj,topic);
  set.run={subj,topic,mode,target:mode==='down'?target:0,acc:0,at:Date.now(),on:true,date:o.date||selDay,start:Date.now()};saveSet(true);render();beep(660,.06)}
function pauseRun(){const r=set.run;if(!r)return;if(r.on){r.acc+=(Date.now()-r.at)/1000;r.on=false}else{r.at=Date.now();r.on=true}saveSet(true);render()}
function finishRun(auto){const r=set.run;if(!r)return;rememberTopic(r.subj,r.topic);const sec=Math.min(elapsed(),r.mode==='down'?r.target:1e9),min=Math.round(sec/60);
  set.run=null;saveSet(true);
  if(min<1){toast('1 dakikadan kısa, kaydedilmedi');render();return}
  const s={id:uid(),subj:r.subj,topic:r.topic||'',date:r.date||today(),start:r.start,end:Date.now(),min,src:'timer'};putSession(s);render();
  toast(`${auto?'Süre doldu · ':''}${subjOf(r.subj).name} · ${fm(min)} kaydedildi`,()=>{sessions.delete(s.id);S.del(s.id).catch(()=>{});render()});
  if(auto){chime();navigator.vibrate?.([120,80,120])}}
function discardRun(){const r=set.run;if(!r)return;set.run=null;saveSet(true);render();toast('Sayaç iptal edildi',()=>{set.run=r;saveSet(true);render()})}
let ac=null;function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d+.15);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d+.2)}catch{}}
function chime(){[0,180,360].forEach((t,i)=>setTimeout(()=>beep([880,1108,1318][i],.35),t))}
function tick(){
  const r=set.run;document.body.classList.toggle('running',!!(r&&r.on));
  if(r&&r.mode==='down'&&elapsed()>=r.target){finishRun(true);return}
  if(view==='days')paintDial();
  const mt=$('#mtT');if(mt&&r)mt.textContent=clock(r.mode==='down'?r.target-elapsed():elapsed());
  const ts=$('#todayT');if(ts){ts.textContent=fm(dayTot(selDay));const b=$('#todayB');if(b)paintTodayBar(b)}
  document.title=r?`${clock(r.mode==='down'?r.target-elapsed():elapsed())} · ${subjOf(r.subj).name}`:'Study Log';
}
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

/* ── Router ── */
function go(v){if(v==='start'){v='days';selDay=today();if(!set.run&&set.subjects.length)setTimeout(()=>startRun({mode:'up',topic:lastTopic(set.sel)}),0)}
  if(!['days','goals','stats'].includes(v))v='days';if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);view=v;render();moveInd()}
addEventListener('hashchange',()=>go(location.hash.slice(1)));
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)go(b.dataset.v)});
function moveInd(){const b=$(`#tabs [data-v="${view}"]`),ind=$('#ind');$$('#tabs button').forEach(x=>x.classList.toggle('on',x===b));if(!b)return;
  ind.style.width=b.offsetWidth+'px';ind.style.transform=`translateX(${b.offsetLeft}px)`}
addEventListener('resize',moveInd);

/* ── Render ── */
let lastView='';
function render(soft){
  const m=$('#main'),sx=scrollY,same=lastView===view;
  if(soft&&view==='days'&&document.activeElement?.id==='topic'){paintToday();paintDial();return} // don't steal focus while typing
  m.onclick=null;
  m.innerHTML=({days:vDays,goals:vGoals,stats:vStats})[view]();
  if(same)m.firstElementChild?.classList.remove('view');lastView=view;if(same)scrollTo(0,sx);
  if(view==='days'){paintDial();wireTimer()}
  tick();
}
const chipSub=(s,on)=>`<button class="chip${on?' on':''}" data-sub="${s.id}"><i style="background:${s.color}"></i>${esc(s.name)}</button>`;
let editSubs=false;
const chipEdit=s=>`<span class="chip ce"><i style="background:${s.color}"></i><button class="cen" data-ren="${s.id}">${esc(s.name)}</button><button class="cex" data-del="${s.id}" aria-label="${esc(s.name)} sil">×</button></span>`;
const dayTot=k=>minsOn(k)+(set.run&&set.run.date===k?liveMin():0);
function paintTodayBar(b){const tot=dayTot(selDay),g=set.goalDay||1,by={};list().forEach(s=>{if(s.date===selDay)by[s.subj]=(by[s.subj]||0)+s.min});
  if(set.run&&set.run.date===selDay)by[set.run.subj]=(by[set.run.subj]||0)+liveMin();
  b.innerHTML=Object.entries(by).map(([k,v])=>`<i style="width:${Math.min(100,v/g*100)}%;background:${subjOf(k).color}"></i>`).join('');
  const p=$('#todayP');if(p)p.textContent=tot>=g?'hedef tamam ✓':`hedef ${fm(g)} · %${Math.round(tot/g*100)}`}
function paintToday(){const t=$('#todayT');if(t){t.textContent=fm(dayTot(selDay));paintTodayBar($('#todayB'))}}

function timerCard(){
  const r=set.run,st=streak();
  const subs=editSubs?set.subjects.map(chipEdit).join('')+`<button class="chip on" data-act="editsubs">Bitti</button>`
    :set.subjects.map(s=>chipSub(s,(r?r.subj:set.sel)===s.id)).join('')+`<button class="chip add" data-act="newsub">+ Ders</button><button class="chip add" data-act="editsubs" title="Dersleri düzenle / sil">Düzenle</button>`;
  const dl=selDay===today()?'bugün':parse(selDay).toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
  return`<section class="card tcard">
     <div class="today"><div class="t"><b class="num" id="todayT">${fm(dayTot(selDay))}</b><span>${esc(dl)}</span>${st.n?`<span class="streak">${st.n} gün seri</span>`:''}</div>
       <div class="bar" id="todayB"></div><div class="h"><span id="todayP"></span></div></div>
     <div><span class="fl">Ders</span><div class="scroll" id="subs">${subs}</div></div>
     <div><input class="topic" id="topic" placeholder="Ne çalışıyorsun? (konu, sayfa, test…)" value="${esc(r?r.topic:lastTopic(set.sel))}" autocomplete="off" maxlength="120">
       <div class="tps" id="tps">${topicChips(r?r.subj:set.sel,r?r.topic:lastTopic(set.sel))}</div></div>
     <div class="seg" id="mode" ${r?'hidden':''}><button data-m="up" class="${set.mode==='up'?'on':''}">Kronometre</button><button data-m="down" class="${set.mode==='down'?'on':''}">Süreli</button></div>
     <div class="row presets" id="pre" ${r||set.mode!=='down'?'hidden':''}>${set.presets.map(p=>`<button class="chip${set.target===p*60?' on':''}" data-p="${p}">${p} dk</button>`).join('')}<button class="chip" data-p="x">Özel</button></div>
     <div class="dial"><svg viewBox="0 0 300 300"><circle class="tr" cx="150" cy="150" r="138"/><circle class="pg" id="pg" cx="150" cy="150" r="138" stroke-dasharray="867.08" stroke-dashoffset="867.08"/></svg>
       <div class="mid"><div class="tm num" id="tm">00:00</div><div class="sub" id="dsub"></div></div></div>
     <div class="ctrl" id="ctrl">${r?`<button class="btn sec" data-act="discard" title="İptal" aria-label="İptal"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
        <button class="btn pri go" data-act="pause">${r.on?'<svg viewBox="0 0 16 16"><path d="M5.5 3.5v9M10.5 3.5v9"/></svg>Duraklat':'<svg viewBox="0 0 16 16"><path d="M5 3.5l8 4.5-8 4.5z"/></svg>Devam'}</button>
        <button class="btn sec" data-act="finish" title="Bitir ve kaydet" aria-label="Bitir"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></button>`
       :`<button class="btn pri go" data-act="start"><svg viewBox="0 0 16 16"><path d="M5 3.5l8 4.5-8 4.5z"/></svg>Başla</button>`}</div>
   </section>`}
function paintTopics(){const el=$('#tps');if(!el)return;const subj=set.run?set.run.subj:set.sel;el.innerHTML=topicChips(subj,$('#topic')?.value.trim())}
function paintDial(){const r=set.run,tm=$('#tm'),pg=$('#pg'),sub=$('#dsub');if(!tm)return;const C=867.08;
  let frac,txt,label;
  if(r){const e=elapsed(),s=subjOf(r.subj);if(r.mode==='down'){txt=clock(r.target-e);frac=e/r.target;label=`${s.name} · ${fm(r.target/60)}`}
    else{txt=clock(e);frac=(e%3600)/3600;label=`${s.name}${r.on?'':' · duraklatıldı'}`}
    pg.style.stroke=s.color;sub.innerHTML=`<i style="background:${s.color}"></i>${esc(label)}`}
  else{const s=subjOf(set.sel);txt=set.mode==='down'?clock(set.target):'00:00';frac=0;pg.style.stroke=s.color;sub.innerHTML=`<i style="background:${s.color}"></i>${esc(s.name)}`}
  tm.textContent=txt;pg.style.strokeDashoffset=(C*(1-clamp(frac,0,1))).toFixed(2)}
function sessRow(s){const sb=subjOf(s.subj);return`<button class="si" data-sid="${s.id}"><span class="c" style="background:${sb.color}"></span><span style="min-width:0"><div class="n">${esc(sb.name)}${s.topic?` <span style="color:var(--ink3);font-weight:400">· ${esc(s.topic)}</span>`:''}</div><div class="m">${s.start?hm(s.start)+(s.end?' – '+hm(s.end):''):'elle eklendi'}</div></span><span class="d num">${fs2(s.min)}</span></button>`}
function paintSessions(){const l=$('#sessL');if(!l)return;const arr=list().filter(s=>s.date===today()).sort((a,b)=>(b.start||b.updated)-(a.start||a.updated));
  $('#sessN').textContent=arr.length?arr.length+' oturum':'';l.innerHTML=arr.length?`<div class="sl">${arr.map(sessRow).join('')}</div>`:'<div class="empty">Henüz kayıt yok. Başla’ya bas ya da elle ekle.</div>'}
function wireTimer(){paintToday();
  const m=$('#main');
  m.onclick=e=>{const sub=e.target.closest('[data-sub]'),act=e.target.closest('[data-act]'),p=e.target.closest('[data-p]'),md=e.target.closest('[data-m]'),si=e.target.closest('[data-sid]');
    if(sub){if(set.run){set.run.subj=sub.dataset.sub;saveSet(true)}else{set.sel=sub.dataset.sub;saveSet();$('#topic').value=lastTopic(set.sel)}$$('#subs [data-sub]').forEach(x=>x.classList.toggle('on',x===sub));paintTopics();paintDial();return}
    const tp=e.target.closest('[data-tp]'),tpx=e.target.closest('[data-tpx]');
    if(tpx){forgetTopic(set.run?set.run.subj:set.sel,tpx.dataset.tpx);paintTopics();return}

function vStats(){
  const tk=today(),ws=weekStart(tk),st=streak(),all=list();
  const wk=rangeMin(ws,addDays(ws,6)),mo=rangeMin(tk.slice(0,8)+'01',tk),tot=all.reduce((a,s)=>a+s.min,0);
  const d30=[];for(let i=29;i>=0;i--)d30.push(minsOn(addDays(tk,-i)));const act=d30.filter(Boolean).length,avg=d30.reduce((a,b)=>a+b,0)/30;
  const byDay={};all.forEach(s=>byDay[s.date]=(byDay[s.date]||0)+s.min);const best=Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];
  // bar chart
  const N=statRange,days=[];for(let i=N-1;i>=0;i--)days.push(addDays(tk,-i));
  const stacks=days.map(k=>{const by={};all.forEach(s=>{if(s.date===k)by[s.subj]=(by[s.subj]||0)+s.min});return by});
  const mx=Math.max(set.goalDay||0,...stacks.map(b=>Object.values(b).reduce((a,c)=>a+c,0)),60);
  const W=600,H=200,bw=W/N,gap=N>14?2:N>7?6:14;let bars='',ax='';
  days.forEach((k,i)=>{let y=H;const x=i*bw+gap/2,w=bw-gap;
    set.subjects.concat(Object.keys(stacks[i]).filter(id=>!set.subjects.some(s=>s.id===id)).map(subjOf)).forEach(s=>{const m=stacks[i][s.id];if(!m)return;const h=m/mx*H;y-=h;bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="${Math.min(4,w/3)}" fill="${s.color}"><title>${esc(longDay(k))} · ${esc(s.name)} ${fm(m)}</title></rect>`});
    if(y===H)bars+=`<rect x="${x.toFixed(1)}" y="${H-2}" width="${w.toFixed(1)}" height="2" rx="1" fill="var(--ink4)"/>`;
    if(N<=14||i%5===0||i===N-1)ax+=`<text class="ax" x="${(x+w/2).toFixed(1)}" y="${H+16}" text-anchor="middle">${N<=7?WD[(parse(k).getDay()+6)%7]:parse(k).getDate()}</text>`});
  const gy=set.goalDay?H-set.goalDay/mx*H:null;
  // distribution
  const from=distRange==='week'?ws:distRange==='month'?tk.slice(0,8)+'01':'0000',dist={};all.forEach(s=>{if(s.date>=from)dist[s.subj]=(dist[s.subj]||0)+s.min});
  const dsum=Object.values(dist).reduce((a,b)=>a+b,0)||1,drows=Object.entries(dist).sort((a,b)=>b[1]-a[1]);
  return`<div class="view">
   <div class="kpis">
     <div class="card kpi"><div class="h">Bugün</div><b class="num">${fm(todayMin())}</b><small>${set.goalDay?`hedef %${Math.round(todayMin()/set.goalDay*100)}`:''}</small></div>
     <div class="card kpi"><div class="h">Bu hafta</div><b class="num">${fm(wk)}</b><small>${set.goalWeek?`hedef %${Math.round(wk/set.goalWeek*100)}`:''}</small></div>
     <div class="card kpi"><div class="h">Seri</div><b class="num">${st.n} gün</b><small>en iyi ${st.best} gün</small></div>
     <div class="card kpi"><div class="h">Ortalama</div><b class="num">${fm(avg)}</b><small>son 30 gün · ${act} aktif gün</small></div>
   </div>
   <div class="sgrid">
     <section class="card chart"><div class="h">Günlük çalışma<span class="sp"></span><span class="seg" id="sr"><button data-r="7" class="${N===7?'on':''}">7 gün</button><button data-r="30" class="${N===30?'on':''}">30 gün</button></span></div>
       <svg viewBox="0 -6 ${W} ${H+24}" preserveAspectRatio="none">${bars}${gy!=null?`<line class="gl" x1="0" x2="${W}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}"/><text class="ax" x="${W}" y="${(gy-5).toFixed(1)}" text-anchor="end">hedef ${fs2(set.goalDay)}</text>`:''}${ax}</svg></section>
     <section class="card dist"><div class="h">Derslere göre<span class="sp"></span><span class="seg" id="dr"><button data-d="week" class="${distRange==='week'?'on':''}">Hafta</button><button data-d="month" class="${distRange==='month'?'on':''}">Ay</button><button data-d="all" class="${distRange==='all'?'on':''}">Tümü</button></span></div>
       ${drows.length?drows.map(([id,m])=>{const s=subjOf(id);return`<div class="dr"><div class="t"><i style="background:${s.color}"></i>${esc(s.name)}<span class="num">${fs2(m)} · %${Math.round(m/dsum*100)}</span></div><div class="bar"><i style="width:${m/dsum*100}%;background:${s.color}"></i></div></div>`}).join(''):'<div class="empty">Bu aralıkta kayıt yok.</div>'}
       <div class="h" style="margin-top:6px">Toplam ${fm(tot)}${best?` · en iyi gün ${parse(best[0]).getDate()} ${MON[parse(best[0]).getMonth()]} (${fs2(best[1])})`:''}</div></section>
   </div></div>`}
document.addEventListener('click',e=>{if(view!=='stats')return;const r=e.target.closest('[data-r]'),d=e.target.closest('[data-d]');if(r){statRange=+r.dataset.r;render()}else if(d){distRange=d.dataset.d;render()}});

/* ── Sheet / toast ── */
let sheetEl=null;
function sheet(title,body,foot,mount){closeSheet(true);const s=document.createElement('div');s.className='scrim';
  s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><h3>${esc(title)}<button class="ib" data-x aria-label="Kapat"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></h3>${body}<div class="sf">${foot}</div></div>`;
  document.body.appendChild(s);sheetEl=s;anim(s,[{opacity:0},{opacity:1}],{duration:220,easing:EASE});
  anim(s.firstChild,[{opacity:0,transform:innerWidth<680?'translateY(40px)':'translateY(12px) scale(.97)'},{opacity:1,transform:'none'}],{duration:480,easing:OUT});
  s.addEventListener('pointerdown',e=>{if(e.target===s)closeSheet()});$$('[data-x]',s).forEach(b=>b.onclick=()=>closeSheet());mount?.(s)}
function closeSheet(now){if(!sheetEl)return;const s=sheetEl;sheetEl=null;if(now)return s.remove();anim(s,[{opacity:1},{opacity:0}],{duration:180,easing:EASE}).finished.then(()=>s.remove())}
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();
  if(e.target.closest?.('input,textarea')||sheetEl||e.metaKey||e.ctrlKey)return;
  if(e.key===' '&&view==='days'){e.preventDefault();set.run?pauseRun():startRun()}
  else if('123'.includes(e.key))go(['days','goals','stats'][+e.key-1])});
function toast(msg,undo){const t=document.createElement('div');t.className='toast'+(undo?' u':'');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button>Geri al</button>':''}`;$('#toasts').prepend(t);
  anim(t,[{opacity:0,transform:'translateY(10px) scale(.95)'},{opacity:1,transform:'none'}],{duration:380,easing:OUT});
  const kill=()=>anim(t,[{opacity:1},{opacity:0}],{duration:200,easing:EASE,fill:'forwards'}).finished.then(()=>t.remove());const tm=setTimeout(kill,undo?5500:2600);
  if(undo)t.querySelector('button').onclick=()=>{clearTimeout(tm);undo();kill()}}

/* ── Theme ── */
function setTheme(t){document.documentElement.dataset.theme=t;$('meta[name=theme-color]').content=t==='dark'?'#0E0E10':'#FFFFFF';if(view==='days')render()}
$('#themeBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';ls.set('notlar:theme',t);ls.set('appshell:theme',t);setTheme(t)};
addEventListener('storage',e=>{if(e.key==='notlar:theme'||e.key==='appshell:theme')setTheme(ls.get(e.key,'light'))});

/* ── Gate & boot ── */
function gate(state,msg){const g=$('#gate');g.hidden=false;$('#gSpin').hidden=state!=='loading';$('#gBtn').hidden=!(state==='signin'||state==='error');$('#gOut').hidden=state!=='denied';
  $('#gMsg').innerHTML=msg??(state==='loading'?'Bağlanıyor…':'Devam etmek için giriş yap.')}
async function ungate(){const g=$('#gate');if(g.hidden)return;await anim(g,[{opacity:1},{opacity:0}],{duration:260,easing:EASE,fill:'forwards'}).finished.catch(()=>{});g.hidden=true;g.getAnimations?.().forEach(a=>a.cancel())}
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function loadFirebase(){if(window.firebase?.auth&&window.firebase?.firestore)return;const b='https://www.gstatic.com/firebasejs/10.12.2/';await loadScript(b+'firebase-app-compat.js');await Promise.all([loadScript(b+'firebase-auth-compat.js'),loadScript(b+'firebase-firestore-compat.js')])}
const authMsg=e=>({'auth/unauthorized-domain':'Bu adres Firebase’de izinli değil (Authorized domains).','auth/network-request-failed':'Bağlantı hatası.'}[e.code]||('Giriş başarısız: '+(e.code||e.message)));
$('#gBtn').onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  try{await firebase.auth().signInWithPopup(p)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code))return firebase.auth().signInWithRedirect(p);if(e.code!=='auth/popup-closed-by-user')gate('error',authMsg(e))}};
$('#gOut').onclick=()=>firebase.auth().signOut();
$('#me').onclick=()=>{if(confirm('Çıkış yapılsın mı?'))firebase.auth().signOut()};
function boot(){go(location.hash.slice(1)||'days');requestAnimationFrame(moveInd)}
(async()=>{
  if(!CLOUD){S=Local;Local.load();boot();return}
  gate('loading');
  try{await loadFirebase()}catch{return gate('error','Firebase yüklenemedi. İnternet bağlantını kontrol et.')}
  if(!firebase.apps.length)firebase.initializeApp(FB);
  const fs=firebase.firestore();try{await fs.enablePersistence({synchronizeTabs:true})}catch{}
  firebase.auth().getRedirectResult().catch(e=>gate('error',authMsg(e)));
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){Cloud.stop();sessions.clear();$('#main').innerHTML='';$('#me').hidden=true;return gate('signin')}
    if((u.email||'').toLowerCase()!==OWNER){Cloud.stop();return gate('denied',`<b>${esc(u.email)}</b> bu alana erişemez.`)}
    gate('loading','Yükleniyor…');S=Cloud;sessions.clear();await Cloud.start(fs);
    const me=$('#me');me.hidden=false;me.innerHTML=u.photoURL?`<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">`:esc((u.displayName||u.email)[0].toUpperCase());
    boot();await ungate();
  });
})();
</script>
</body>
</html>
