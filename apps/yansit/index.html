<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yansıt</title>
<style>
  :root{--bg:#FAFAFA;--card:#FFFFFF;--ink:#18181B;--ink2:#52525B;--ink3:#6E6E77;--line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.14);--hover:rgba(0,0,0,.04);--acc:#2563EB;--ok:#15803D;--err:#C62828;
    --font:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--spring:cubic-bezier(.2,1.2,.3,1);color-scheme:light}
  [data-theme=dark]{--bg:#0E0E10;--card:#18181B;--ink:#EDEDEF;--ink2:#B4B4BC;--ink3:#8E8E98;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--hover:rgba(255,255,255,.05);--acc:#6EA8FF;--ok:#4ADE80;--err:#F87171;color-scheme:dark}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:12px}
  .wrap{max-width:760px;margin:0 auto;padding:56px 20px 48px}
  h1{font-size:40px;font-weight:650;letter-spacing:-.03em;line-height:1.1}
  .sub{margin-top:10px;font-size:16px;color:var(--ink2);max-width:540px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:32px}
  .opt{display:grid;gap:10px;align-content:start;text-align:left;padding:22px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:transform .25s var(--spring),box-shadow .2s}
  .opt:hover{box-shadow:inset 0 0 0 1px var(--line2),0 14px 34px -22px rgba(0,0,0,.35);transform:translateY(-2px)}.opt:active{transform:scale(.98)}
  .opt svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--acc)}
  .opt b{font-size:18px}.opt small{font-size:14px;color:var(--ink2)}
  .gd{margin-top:34px;border-top:1px solid var(--line);padding-top:22px}
  .gd h2{font-size:17px;font-weight:600}.gd>p{font-size:14px;color:var(--ink2);margin-top:4px}
  .gd>p{max-width:66ch}.ss-in{display:block;width:100%;margin-top:8px;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 17px/1 inherit;font-family:inherit}
  .ssb{display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:12px;background:var(--ink);color:var(--bg)!important;font-weight:600;text-decoration:none}.dg small{color:var(--ink3)}
  .dg.ss .go{margin-top:6px}.dg .seg{margin:12px 0 4px}.dg ol.nat li{margin:10px 0}.dg details{margin-top:12px}.dg summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
  .rx-nat{margin-top:22px;height:44px;padding:0 18px;border-radius:14px;background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:15px}.rx-nat:hover{background:rgba(255,255,255,.16)}
  .rx-nw ol{text-align:left;max-width:560px;margin:18px auto 0;color:rgba(255,255,255,.86);font-size:17px;line-height:1.55;padding-left:22px}.rx-nw li{margin:14px 0}.rx-nw small{display:block;margin-top:8px;color:rgba(255,255,255,.62);font-size:14px}.rx-nw .rx-open{display:inline-flex;align-items:center;margin:0;text-decoration:none}
  .rx-open{margin:18px auto 0;display:block;height:56px;padding:0 28px;border-radius:16px;background:#fff;color:#000;font-weight:700;font-size:20px}.dg{margin:14px 0 4px;padding:16px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:15px;line-height:1.5}.dg>b{font-size:16px}.dg p{margin:6px 0;color:var(--ink2)}.dg ol{margin:8px 0;padding-left:20px}.dg li{margin:6px 0}.dg a{color:inherit}
  .gd details{margin-top:12px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
  .gd summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px;min-height:48px}
  .gd summary::-webkit-details-marker{display:none}.gd summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:1.6px solid var(--ink3);border-bottom:1.6px solid var(--ink3);transform:rotate(45deg);transition:transform .2s}
  .gd details[open] summary::after{transform:rotate(-135deg)}
  .gd ol{padding:0 22px 16px 40px;font-size:14.5px;color:var(--ink2);display:grid;gap:6px}.gd ol b{color:var(--ink)}
  .gd a{color:var(--acc);display:inline-block;padding:10px 0;margin:-10px 0}
  .note{margin-top:26px;font-size:13px;color:var(--ink3);max-width:560px}
  /* gönderen */
  .pane{margin-top:28px;padding:24px;border-radius:24px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2);height:40px;padding:0 6px;margin-left:-6px}
  .lb{display:block;font-size:13px;font-weight:600;color:var(--ink3);margin:18px 0 8px}.lb:first-child{margin-top:0}
  .code-in{width:100%;height:64px;border:0;border-radius:16px;background:var(--hover);box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink);font:600 30px/1 var(--mono);letter-spacing:.32em;text-align:center;text-transform:uppercase;outline:0}
  .code-in:focus{box-shadow:inset 0 0 0 2px var(--acc)}
  .seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--hover);flex-wrap:wrap}
  .seg button{flex:1;min-width:96px;height:42px;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink2)}
  .seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12),inset 0 0 0 1px var(--line)}
  .seg.sm{flex-wrap:nowrap}.seg.sm button{min-width:0}
  .seg button:disabled{opacity:.45;cursor:not-allowed}
  .hint{font-size:13px;color:var(--ink3);margin-top:8px}
  .go{width:100%;height:52px;margin-top:22px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px;transition:transform .2s var(--spring),opacity .2s}
  .go:active{transform:scale(.98)}.go:disabled{opacity:.5}
  .msg{margin-top:12px;font-size:14px;min-height:21px}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
  .live{display:grid;gap:14px}.live video{width:100%;max-height:46vh;border-radius:16px;background:#000;object-fit:contain}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row .go{flex:1;margin:0}.ghost{background:none!important;color:var(--ink)!important;box-shadow:inset 0 0 0 1px var(--line2)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:1px;box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}
  /* alıcı (TV) */
  .rx{position:fixed;inset:0;z-index:10;background:#000;color:#fff;display:grid;place-items:center;text-align:center;cursor:default}
  .rx[hidden]{display:none}
  .rx-w{display:grid;gap:18px;justify-items:center;padding:24px}
  .rx-k{font-size:clamp(15px,2.2vw,22px);color:rgba(255,255,255,.72)}
  .rx-c{font:600 clamp(64px,15vw,168px)/1 var(--mono);letter-spacing:.14em;padding-left:.14em}
  .rx-u{font-size:clamp(14px,1.6vw,18px);color:rgba(255,255,255,.62);max-width:760px}
  .rx-u b{color:#fff;font-weight:600}
  .rx-s{font-size:15px;color:rgba(255,255,255,.7);min-height:22px}
  .rx video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  .rx-ui{position:absolute;left:50%;bottom:28px;translate:-50% 0;display:flex;align-items:center;gap:8px;padding:8px;border-radius:999px;background:rgba(20,20,22,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:opacity .4s,translate .4s var(--spring)}
  .rx-ui span{font-size:14px;padding:0 10px 0 8px;color:rgba(255,255,255,.85);white-space:nowrap}
  .rx-ui button{height:40px;padding:0 16px;border-radius:999px;color:#fff;font-size:14px;font-weight:500}.rx-ui button:hover{background:rgba(255,255,255,.12)}
  .rx.idle .rx-ui{opacity:0;translate:-50% 12px;pointer-events:none}.rx.idle{cursor:none}
  .rx-x{position:absolute;top:16px;right:16px;height:40px;padding:0 16px;border-radius:999px;color:rgba(255,255,255,.75);font-size:14px;background:rgba(255,255,255,.08)}
  @media (max-width:600px){.wrap{padding:36px 16px 40px}h1{font-size:32px}.opts{grid-template-columns:1fr}.pane{padding:18px}.code-in{font-size:26px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  html[data-motion=off] *{transition:none!important;animation:none!important}
</style>

<body>
<main class="wrap" id="app"></main>
<section class="rx" id="rx" hidden aria-label="Yansıtma alıcısı"></section>
<script>
/* Yansıt — bir ekranı (ya da kamerayı) başka bir cihazda gösterir.
   Görüntü WebRTC ile cihazdan cihaza DOĞRUDAN gider; eşleşme mesajları (bağlantı bilgisi) kısa kodla ntfy.sh üzerinden.
   Alıcı (TV/bilgisayar): #izle → büyük kod; gönderen kodu girer. Telefon tarayıcıları ekran paylaşamaz (sadece kamera) → telefon ekranı için rehber. */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsg=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},lss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches||document.documentElement.dataset.motion==='off';
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',NT='https://ntfy.sh/',TOP=c=>'appshell-yansit-v1-'+c.toLowerCase();
const me=Math.random().toString(36).slice(2,10);
const ICE=[{urls:['stun:stun.l.google.com:19302','stun:stun.cloudflare.com:3478']}];
const canScreen=!!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia),
  IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1),AND=/Android/i.test(navigator.userAgent),canCam=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
/* görüntü: kare hızı (FPS) ve çözünürlük ayrı seçilir; bit hızı ikisine göre (piksel × FPS), yansıtma sürerken de değişir */
const FPS=[15,30,60,90,120],RES=[[480,'480p'],[720,'720p'],[1080,'1080p'],[1440,'1440p'],[2160,'4K']];
const qOf=()=>{const fps=TX.fps,h=TX.res,px=Math.round(h*16/9)*h;return{fps,h,br:Math.round(Math.min(25e6,Math.max(1.2e6,px*fps*.07))),hint:fps>=50?'motion':'detail'}};
const qHint=()=>{const q=qOf();return`${q.h>=2160?'4K':q.h+'p'} · ${q.fps} kare/sn · yaklaşık ${(q.br/1e6).toFixed(q.br<1e7?1:0)} Mbit/sn${q.fps>60?' · 60 üstünü ekran ve tarayıcı destekliyorsa alır':''}${q.fps>=50?' · oyun/film için akıcı':' · yazı/sunum için net'}`};
const qRows=()=>`<span class="lb">Kare hızı (FPS)</span><div class="seg sm" role="group" aria-label="Kare hızı">${FPS.map(f=>`<button data-fps="${f}" aria-pressed="${TX.fps===f}">${f}</button>`).join('')}</div>
    <span class="lb">Çözünürlük</span><div class="seg sm" role="group" aria-label="Çözünürlük">${RES.map(([h,n])=>`<button data-res="${h}" aria-pressed="${TX.res===h}">${n}</button>`).join('')}</div><p class="hint" id="qH">${qHint()}</p>`;
const IC={scr:'<rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20"/>',tv:'<rect x="2.5" y="4.5" width="19" height="13" rx="2.5"/><path d="M7.5 20.5h9"/><path d="M9.5 9l5 2-5 2z"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;

/* ── sinyal: sıkıştır + parçala (ntfy mesajı ≤4 KB) ── */
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=s=>{const b=atob(s.replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function pack(o){const s=new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream('deflate-raw'));return b64u(await new Response(s).arrayBuffer())}
async function unpack(t){const s=new Blob([ub64(t)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(s).text())}
async function sig(code,o){const z=await pack({...o,from:me}),parts=z.match(/.{1,3200}/g)||[''],id=Math.random().toString(36).slice(2,8);
  for(let i=0;i<parts.length;i++){const r=await fetch(NT+TOP(code),{method:'POST',body:`${id}|${i}|${parts.length}|${parts[i]}`});if(!r.ok)throw new Error('eşleşme sunucusu '+r.status)}}
function subscribe(code,on){const buf={};const es=new EventSource(`${NT}${TOP(code)}/sse?since=${Math.floor(Date.now()/1000)-2}`);
  es.onmessage=async e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.event&&d.event!=='message')return;const[id,i,n,part]=String(d.message||'').split('|');if(!part)return;
    const b=buf[id]||(buf[id]={n:+n,p:[]});b.p[+i]=part;if(b.p.filter(Boolean).length<b.n)return;delete buf[id];
    try{const m=await unpack(b.p.join(''));if(m.from!==me)on(m)}catch(er){console.warn('yansıt sinyal',er)}};
  return new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('Eşleşme sunucusuna bağlanılamadı (internet?)')),9000);es.onopen=()=>{clearTimeout(t);res(es)};es.onerror=()=>{}})}
const iceDone=pc=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const t=setTimeout(r,3000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);r()}})});
const newCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>ALPH[x%ALPH.length]).join('');

/* ── ana ekran ── */
function home(){stopTx();$('#rx').hidden=true;
  $('#app').innerHTML=`<h1>Yansıt</h1><p class="sub">Bir ekranı başka bir cihazda göster: bilgisayarını televizyona, telefon kameranı bilgisayara. Görüntü cihazlar arasında doğrudan gider.</p>
  <div class="opts"><button class="opt" data-go="tx">${ic('scr')}<b>Bu ekranı göster</b><small>${canScreen?'Ekranını, bir pencereyi ya da sekmeyi':AND?'Bu cihazın ekranını ya da kamerasını':'Bu cihazın kamerasını'} başka bir cihaza yansıt.</small></button>
    <button class="opt" data-go="rx">${ic('tv')}<b>Burada izle</b><small>Bu cihaz alıcı olsun: TV'de ya da bilgisayarda aç, çıkan kodu öbür cihaza gir.</small></button></div>
  <section class="gd" id="gd"><h2>Telefon ya da tabletin ekranını yansıtmak</h2><p>Telefon ve tablet tarayıcıları (Android, iPad) ekranı paylaşamıyor — bu, tarayıcının sınırı. Cihazın kendi yansıtma özelliği hem çalışır hem en akıcısı:</p>
    <details><summary>Android telefon / tablet → televizyon</summary><ol><li>Ekranın üstünden iki kez aşağı kaydırıp hızlı ayarları aç.</li><li><b>Smart View</b>, <b>Ekran yansıtma</b> ya da <b>Yayınla</b>'ya dokun.</li><li>Listeden televizyonu seç (TV'nin Chromecast ya da Miracast desteklemesi gerekir; ikisi aynı Wi-Fi'de olmalı).</li></ol></details>
    <details><summary>Android telefon / tablet → Windows bilgisayar</summary><ol><li>Bilgisayarda <b>Ayarlar → Sistem → Bu bilgisayara yansıtma</b>'yı aç (ilk seferde “Kablosuz Ekran” isteğe bağlı özelliğini ekle).</li><li>Telefonda <b>Smart View / Ekran yansıtma</b>'dan bilgisayarı seç.</li><li>Kabloyla ve en akıcısı: ücretsiz <a href="https://github.com/Genymobile/scrcpy" target="_blank" rel="noopener">scrcpy</a> (telefonu USB ile bağla, telefondan da kontrol edersin).</li></ol></details>
    <details><summary>iPhone / iPad → televizyon / Mac</summary><ol><li>Denetim Merkezi'ni aç (sağ üst köşeden aşağı kaydır).</li><li><b>Ekran Yansıtma</b>'ya dokun.</li><li>Apple TV'yi, AirPlay destekli TV'yi ya da Mac'i seç.</li></ol></details>
    <details><summary>Bilgisayar → televizyon (bu uygulamasız)</summary><ol><li>Chrome'da sağ üst menü → <b>Yayınla…</b> → Chromecast'li TV'yi seç.</li><li>Windows'ta <b>Windows + K</b> → Miracast destekli TV'yi seç.</li></ol></details></section>
  <p class="note">Eşleşme için kısa bağlantı bilgisi ntfy.sh üzerinden geçer; görüntü hiçbir sunucuya gitmez. İki cihaz aynı Wi-Fi'deyse en iyi sonuç.</p>`}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(!g)return;if(g.dataset.go==='tx')txUI();else if(g.dataset.go==='rx')rxStart();else if(g.dataset.go==='home'){location.hash='';home()}});

/* ── gönderen ── */
const q0=lsg('yansit:q','');let TX={src:canScreen||AND?'screen':'front',fps:lsg('yansit:fps',q0==='sharp'?30:60),res:lsg('yansit:res',q0==='sharp'?1080:720),pc:null,es:null,stream:null,code:''};
function txUI(pref){if(location.hash!=='#gonder'&&!pref)history.replaceState(null,'','#gonder');
  const S=[['screen','Ekran',1],['front','Ön kamera',canCam],['back','Arka kamera',canCam]],noScr=TX.src==='screen'&&!canScreen;
  $('#app').innerHTML=`<button class="back" data-go="home">‹ Yansıt</button><h1>Bu ekranı göster</h1>
  <div class="pane"><label class="lb" for="code">Alıcıdaki kod</label><input class="code-in" id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="••••••" value="${esc(pref||'')}" aria-describedby="codeH">
    <p class="hint" id="codeH">Alıcı cihazda (TV ya da bilgisayar) Yansıt → <b>Burada izle</b>'yi aç; çıkan 6 harfli kodu buraya yaz.</p>
    <span class="lb">Ne gösterilsin?</span><div class="seg" role="group" aria-label="Kaynak">${S.map(([k,n,ok])=>`<button data-src="${k}" aria-pressed="${TX.src===k}" ${ok?'':'disabled title="Bu cihazda yok"'}>${n}</button>`).join('')}</div>
    ${noScr?(AND?ssPanel():devGuide()):`${qRows()}
    <button class="go" id="txGo">Yansıtmayı başlat</button>`}<p class="msg" id="txMsg" role="status" aria-live="polite"></p></div>`;
  const ci=$('#code');ci.addEventListener('input',()=>{ci.value=ci.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)});if(!pref)setTimeout(()=>ci.focus(),60);
  ci.addEventListener('keydown',e=>{if(e.key==='Enter')$('#txGo').click()});
  $('#app').querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{TX.src=b.dataset.src;txUI(ci.value||' ')});
  qWire();
  const go=$('#txGo');if(go)go.onclick=()=>txStart(ci.value.trim());
  $('#app').querySelectorAll('[data-tt]').forEach(b=>b.onclick=()=>{lss('yansit:tt',b.dataset.tt);txUI(ci.value||' ')});
  const sg=$('#ssGo');if(sg){const ui=$('#ssUrl');ui.addEventListener('keydown',e=>{if(e.key==='Enter')sg.click()});sg.onclick=()=>ssSend(ci.value.trim(),ui.value)}}
/* ── Android tablet/telefondan doğrudan yayın ──
   Android tarayıcıları ekranı veremediği için ekranı ücretsiz, açık kaynak ScreenStream uygulaması yayınlar (aynı Wi-Fi'de http://IP:8080).
   Tablet adresi alıcının koduyla ntfy üzerinden yollar ({type:'url'}); alıcı kendiliğinden açar. Sadece yerel ağ adresi kabul edilir (başkası TV'ye site açtıramasın). */
const SS_PLAY='https://play.google.com/store/apps/details?id=info.dvkr.screenstream',SS_FD='https://f-droid.org/packages/info.dvkr.screenstream/';
function lanUrl(v){v=String(v||'').trim();if(!v)return'';if(!/^https?:\/\//i.test(v))v='http://'+v;try{const u=new URL(v),h=u.hostname;
  return/^(10\.\d+|192\.168|172\.(1[6-9]|2\d|3[01])|169\.254)\.\d+\.\d+$/.test(h)||/\.local$/i.test(h)?u.origin+u.pathname:''}catch{return''}}
/* Android tablet/telefon: tarayıcı ekranı veremez (Chrome/Samsung Internet'in sınırı). Uygulama YÜKLEMEDEN yol: cihazın kendi
   yansıtması (Smart View / Ekran yansıtma — Miracast/Chromecast) → TV'ye ya da Windows'un kendi alıcısına (Bu bilgisayara yansıtma).
   Tarayıcıda izlemek isteyene ikinci yol ScreenStream (uygulama gerekir). Hedef seçimi yansit:tt */
const NATIVE_TV=['Tabletin ekranının en üstünden <b>iki kez aşağı kaydır</b> (hızlı ayarlar).','<b>Smart View</b>\'e dokun (Samsung) — başka markalarda <b>Ekran yansıtma</b>, <b>Yayınla</b> ya da <b>Cast</b>.','Listeden <b>televizyonu</b> seç. Görüntü ve ses TV\'de.'];
const NATIVE_PC=['Bilgisayarda Yansıt → <b>Burada izle</b> → <b>Tabletten al</b>\'a bas (ya da Ayarlar → Sistem → <b>Bu bilgisayara yansıtma</b>).','Tablette üstten iki kez aşağı kaydır → <b>Smart View</b> / <b>Ekran yansıtma</b>.','Listeden <b>bilgisayarın adını</b> seç; bilgisayarda “Bağlan”a izin ver.'];
function ssPanel(){const tt=lsg('yansit:tt','tv');return`<div class="dg ss"><b>Tabletin ekranını yayınla — hiçbir şey yüklemeden</b><p>Tarayıcı tabletin ekranını alamıyor; tabletin <b>kendi yansıtması</b> bunu zaten yapıyor ve en akıcısı (ses de gider).</p>
    <div class="seg sm" role="group" aria-label="Nereye"><button data-tt="tv" aria-pressed="${tt==='tv'}">Televizyona</button><button data-tt="pc" aria-pressed="${tt==='pc'}">Bilgisayara</button></div>
    <ol class="nat">${(tt==='pc'?NATIVE_PC:NATIVE_TV).map(x=>`<li>${x}</li>`).join('')}</ol>
    <p class="hint">${tt==='pc'?'Bilgisayar Windows 10/11 olmalı ve aynı Wi-Fi\'de bulunmalı. Listede çıkmazsa bilgisayarda “Kablosuz Ekran” Windows özelliği bir kez eklenir (Ayarlar → İsteğe bağlı özellikler; Microsoft\'un kendi parçası).':'TV ve tablet aynı Wi-Fi\'de olmalı. Akıllı TV\'lerin çoğu bunu destekler (Samsung, LG, Android TV, Chromecast).'}</p>
    <details><summary>Tarayıcıda izlemek istersen (uygulama gerekir)</summary>
    <ol><li><a class="ssb" href="${SS_PLAY}" target="_blank" rel="noopener">ScreenStream'i kur</a> <small>(ücretsiz, açık kaynak · <a href="${SS_FD}" target="_blank" rel="noopener">F-Droid</a>)</small></li>
      <li>Uygulamada <b>Yerel (Local)</b> modunda <b>Başlat</b>'a bas, izin ver.</li>
      <li>Uygulamada yazan adresi buraya yaz:<input class="ss-in" id="ssUrl" inputmode="url" autocomplete="off" spellcheck="false" placeholder="192.168.1.20:8080" value="${esc(lsg('yansit:ss',''))}" aria-label="ScreenStream adresi"></li></ol>
    <button class="go" id="ssGo">Yayınla</button><p class="msg" id="txMsg" role="status" aria-live="polite"></p></details></div>`}
async function ssSend(code,v){if(!/^[A-Z0-9]{6}$/.test(code)){txMsg('Önce alıcıdaki 6 harfli kodu yaz.','err');$('#code')?.focus();return}
  const url=lanUrl(v);if(!url){txMsg('Adres ScreenStream\'de yazan yerel adres olmalı (ör. 192.168.1.20:8080).','err');$('#ssUrl')?.focus();return}
  lss('yansit:ss',v.trim());const b=$('#ssGo');b.disabled=true;txMsg('Alıcıya gönderiliyor…');
  try{await sig(code,{type:'url',url});txMsg('Gönderildi ✓ Alıcıda tabletin ekranı açılıyor.','ok')}catch(e){txMsg('Gönderilemedi: '+e.message,'err')}b.disabled=false}
/* tablet/telefon: tarayıcı ekranı veremez → bu cihazın kendi yansıtma yolu (kamera seçenekleri bu uygulamayla çalışır) */
const devList=()=>`<ol>${devSteps().map(x=>`<li>${x}</li>`).join('')}</ol>`;
function devSteps(){return IOS?['<b>Televizyona / Mac\'e:</b> Denetim Merkezi\'ni aç (sağ üst köşeden aşağı kaydır) → <b>Ekran Yansıtma</b> → Apple TV, AirPlay destekli TV ya da Mac.','<b>Windows bilgisayara:</b> bilgisayara bir AirPlay alıcı programı gerekir (Windows bunu kendisi yapmıyor); sonra yine <b>Ekran Yansıtma</b>.']
    :['<b>Televizyona:</b> üstten iki kez aşağı kaydır → <b>Smart View</b> / <b>Ekran yansıtma</b> / <b>Yayınla</b> → televizyonu seç.','<b>Windows bilgisayara:</b> bilgisayarda <b>Ayarlar → Sistem → Bu bilgisayara yansıtma</b>\'yı aç; sonra tablette <b>Smart View</b>\'dan bilgisayarı seç. Kabloyla en akıcısı: <a href="https://github.com/Genymobile/scrcpy" target="_blank" rel="noopener">scrcpy</a>.']}
function devGuide(){const os=IOS?'ios':AND?'and':'';
  const L=devSteps();
  return`<div class="dg" role="note"><b>Bu ${IOS?'iPad':AND?'tablet':'cihaz'} ekranını tarayıcıdan paylaşamıyor</b><p>${IOS?'Safari ve iPad\'deki bütün tarayıcılar':'Android\'deki tarayıcılar (Chrome, Samsung Internet)'} ekran paylaşmaya izin vermiyor. Cihazın kendi yansıtması daha akıcı:</p>
    <ol>${L.map(x=>`<li>${x}</li>`).join('')}</ol><p class="hint">Kamerayı bu uygulamayla yansıtabilirsin (Ön / Arka kamera). Bu cihaz <b>alıcı</b> da olabilir: ana sayfada <b>Burada izle</b>.</p></div>`}
const txMsg=(t,c='')=>{const m=$('#txMsg');if(m){m.textContent=t;m.className='msg '+c}};
async function txStart(code){if(!/^[A-Z0-9]{6}$/.test(code)){txMsg('Kod 6 harf/rakam olmalı.','err');$('#code')?.focus();return}
  const q=qOf(),b=$('#txGo');b.disabled=true;txMsg('Hazırlanıyor…');
  try{TX.stream=TX.src==='screen'?await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:q.fps,max:q.fps},height:{ideal:q.h},width:{ideal:Math.round(q.h*16/9)}},audio:true,surfaceSwitching:'include',selfBrowserSurface:'exclude'})
      :await navigator.mediaDevices.getUserMedia({video:{facingMode:TX.src==='back'?'environment':'user',height:{ideal:q.h},frameRate:{ideal:q.fps}},audio:false})}
  catch(e){b.disabled=false;txMsg(e.name==='NotAllowedError'?'İzin verilmedi. Paylaşmak için tarayıcının sorusuna “İzin ver” de.':'Görüntü alınamadı: '+e.message,'err');return}
  const v=TX.stream.getVideoTracks()[0];if(v&&'contentHint' in v)v.contentHint=q.hint;
  v?.addEventListener('ended',()=>{stopTx(true);txUI(code);txMsg('Paylaşım durduruldu.')});
  TX.code=code;txMsg('Alıcı aranıyor…');
  try{const pc=TX.pc=new RTCPeerConnection({iceServers:ICE});TX.stream.getTracks().forEach(t=>pc.addTrack(t,TX.stream));
    qSend(pc,q);codecPref(pc,q);
    let answered=false;
    TX.es=await subscribe(code,async m=>{if(m.type==='answer'&&m.to===me&&!answered){answered=true;await pc.setRemoteDescription({type:m.data.type,sdp:fastStart(m.data.sdp,qOf())})}else if(m.type==='bye')txMsg('Alıcı kapandı.','err')});
    pc.onconnectionstatechange=()=>{const s=pc.connectionState;if(s==='connected')txLive();else if(s==='failed'){txMsg('Bağlantı kurulamadı. İki cihaz aynı Wi-Fi\'de mi?','err');stopTx()}else if(s==='disconnected')txMsg('Bağlantı zayıfladı…')};
    await pc.setLocalDescription(await pc.createOffer());await iceDone(pc);await sig(code,{type:'offer',data:pc.localDescription,src:TX.src});
    setTimeout(()=>{if(!answered&&TX.pc===pc){txMsg('Alıcı bulunamadı: kodu kontrol et, alıcıda Yansıt açık mı?','err');stopTx();b.disabled=false}},15000)}
  catch(e){txMsg(e.message,'err');stopTx();b.disabled=false}}
/* akıcılık: 50+ FPS'te donanım kodlayıcısı olan H.264 önce (yazılım VP8 yüksek FPS'te işlemciyi boğar, “kasma” buradan);
   karşı taraf desteklemezse tarayıcı kendisi sıradakine geçer. Yazı/sunumda VP9 (daha net). */
function codecPref(pc,q){try{const caps=RTCRtpSender.getCapabilities?.('video')?.codecs;if(!caps)return;const first=q.fps>=50?/h264/i:/vp9/i;
  const sorted=[...caps.filter(c=>first.test(c.mimeType)),...caps.filter(c=>!first.test(c.mimeType))];
  pc.getTransceivers().forEach(t=>{if(t.sender.track?.kind==='video'&&t.setCodecPreferences)t.setCodecPreferences(sorted)})}catch{}}
/* WebRTC bağlantıyı ~300 kbit/sn'den başlatıp yavaşça artırır → ilk saniyeler bulanık ve takılır. Chrome'a başlangıç/en düşük bit hızını söyle. */
function fastStart(sdp,q){const k=Math.round(q.br/1000),st=Math.min(k,8000),mn=Math.min(1500,Math.round(k/3));
  return sdp.replace(/a=fmtp:(\d+) (.*)\r\n/g,(l,pt,p)=>/x-google-/.test(p)||!new RegExp(`a=rtpmap:${pt} (H264|VP8|VP9|AV1)/`,'i').test(sdp)?l:`a=fmtp:${pt} ${p};x-google-start-bitrate=${st};x-google-min-bitrate=${mn};x-google-max-bitrate=${k}\r\n`)}
function qSend(pc,q){pc.getSenders().forEach(s=>{if(s.track?.kind!=='video')return;const p=s.getParameters();p.encodings=p.encodings?.length?p.encodings:[{}];p.encodings[0].maxBitrate=q.br;p.encodings[0].maxFramerate=q.fps;p.degradationPreference=q.hint==='motion'?'maintain-framerate':'maintain-resolution';s.setParameters(p).catch(()=>{})})}
/* FPS/çözünürlük düğmeleri: başlamadan önce sadece kaydeder; yansıtma sürerken anında uygular */
function qWire(){$('#app').querySelectorAll('[data-fps],[data-res]').forEach(b=>b.onclick=async()=>{if(b.dataset.fps){TX.fps=+b.dataset.fps;lss('yansit:fps',TX.fps)}else{TX.res=+b.dataset.res;lss('yansit:res',TX.res)}
    $('#app').querySelectorAll('[data-fps]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.fps===TX.fps));$('#app').querySelectorAll('[data-res]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.res===TX.res));
    const h=$('#qH');if(h)h.textContent=qHint();const v=TX.stream?.getVideoTracks()[0];if(!v||!TX.pc)return;const q=qOf();
    try{await v.applyConstraints({frameRate:{ideal:q.fps},height:{ideal:q.h}});if('contentHint' in v)v.contentHint=q.hint}catch{}qSend(TX.pc,q)})}
function txLive(){const S={screen:'Ekranın',front:'Ön kameran',back:'Arka kameran'}[TX.src];
  $('#app').innerHTML=`<button class="back" data-go="home">‹ Yansıt</button><h1>Yansıtılıyor</h1><div class="pane live"><p><span class="dot"></span>${S} <b>${esc(TX.code)}</b> kodlu cihazda görünüyor.</p>
    <video id="pv" muted playsinline autoplay aria-label="Önizleme"></video><p class="hint" id="qNow" aria-live="polite">Ölçülüyor…</p>${qRows()}<div class="row"><button class="go" id="txStop">Durdur</button></div></div>`;
  const pv=$('#pv');pv.srcObject=TX.stream;$('#txStop').onclick=()=>{stopTx(true);home()};qWire();
  /* gerçekte giden görüntü: çözünürlük + kare hızı (WebRTC istatistiği; bağlantı ya da ekran isteneni karşılamıyorsa burada görünür) */
  const pc=TX.pc;const tick=async()=>{if(TX.pc!==pc||!$('#qNow'))return;try{const st=await pc.getStats();st.forEach(r=>{if(r.type==='outbound-rtp'&&r.kind==='video'&&r.frameWidth){const e=$('#qNow'),cf=Math.round(TX.stream?.getVideoTracks()[0]?.getSettings().frameRate||0),want=qOf().fps,lim=r.qualityLimitationReason&&r.qualityLimitationReason!=='none'?r.qualityLimitationReason:'';
          const cd=(st.get(r.codecId)?.mimeType||'').split('/')[1]||'',hw=r.encoderImplementation&&!/libvpx|openh264|libaom|fallback/i.test(r.encoderImplementation);
          if(e)e.textContent=`Şu an giden: ${r.frameWidth}×${r.frameHeight} · ${Math.round(r.framesPerSecond||0)} kare/sn${cd?` · ${cd}${hw?' (donanım)':''}`:''}${lim?` · ${({bandwidth:'bağlantı yetmiyor — çözünürlüğü düşür ya da kablo/5 GHz Wi-Fi',cpu:'işlemci yetmiyor — çözünürlüğü düşür'})[lim]||lim}`:''}${cf&&cf<want-5&&!lim?TX.src==='screen'?` · ekran ${cf} kare/sn veriyor (${want} için “Tüm ekran”ı seç ve ekranın ${want} Hz olsun)`:` · kamera en çok ${cf} kare/sn veriyor`:''}`}})}catch{}setTimeout(tick,1000)};tick()}
function stopTx(bye){if(bye&&TX.code&&TX.pc)sig(TX.code,{type:'bye'}).catch(()=>{});try{TX.es?.close()}catch{}try{TX.pc?.close()}catch{}TX.stream?.getTracks().forEach(t=>t.stop());TX.pc=TX.es=TX.stream=null}

/* ── alıcı (TV / bilgisayar) ── */
let RX={code:'',pc:null,es:null,lock:null,idleT:0};
async function rxStart(){history.replaceState(null,'','#izle');stopTx();const R=$('#rx');R.hidden=false;R.classList.remove('idle');
  RX.code=RX.code||newCode();rxWait('Bağlanıyor…');
  try{RX.es?.close();RX.es=await subscribe(RX.code,rxSig);rxWait('')}catch(e){rxWait(e.message+' — yeniden deneniyor');setTimeout(rxStart,5000)}
  try{RX.lock=await navigator.wakeLock?.request('screen')}catch{}}
function rxWait(st){const R=$('#rx');const u=location.origin+location.pathname.replace(/index\.html$/,'');
  R.innerHTML=`<div class="rx-w"><p class="rx-k">Bu ekranda göstermek için öbür cihaza bu kodu gir</p><p class="rx-c" aria-label="Kod ${[...RX.code].join(' ')}">${RX.code}</p>
    <p class="rx-u">Öbür cihazda AppShell → <b>Yansıt</b> → <b>Bu ekranı göster</b><br>ya da: <b>${esc(u.replace(/^https?:\/\//,''))}#k=${RX.code}</b></p><p class="rx-s" role="status">${esc(st)}</p><button class="rx-nat" id="rxNat">Tabletten / telefondan al — uygulamasız</button></div><button class="rx-x" data-go="home">Kapat</button>`;
  $('#rxNat').onclick=rxNative}
/* uygulamasız alma: Windows'un kendi yansıtma alıcısı (Miracast). Tablette Smart View → bu bilgisayar. */
function rxNative(){const R=$('#rx'),W=/Windows/.test(navigator.userAgent);
  R.innerHTML=`<div class="rx-w rx-nw"><p class="rx-k">Tabletin ekranını bu ${W?'bilgisayarda':'cihazda'} göster</p>
    ${W?`<ol><li><a class="rx-open" href="ms-settings:project">Bu bilgisayarı yansıtmaya aç</a><small>Açılan ayarda “Her yerde kullanılabilir” seç. Seçenek yoksa önce “Kablosuz Ekran” özelliğini ekle (aynı sayfada bağlantı var; Windows'un kendi parçası).</small></li>
      <li>Tablette ekranın üstünden iki kez aşağı kaydır → <b>Smart View</b> / <b>Ekran yansıtma</b>.</li><li>Listeden <b>bu bilgisayarı</b> seç, burada “Bağlan”a izin ver. Görüntü Windows'un kendi penceresinde açılır.</li></ol>`
    :`<ol><li>Bu cihaz Windows değil; tabletten doğrudan almak için <b>televizyonu</b> kullan: tablette üstten aşağı kaydır → <b>Smart View</b> → TV.</li><li>Ya da tablette Yansıt → Bu ekranı göster → <b>Tarayıcıda izlemek istersen</b>.</li></ol>`}
    </div><button class="rx-x" id="rxBack">Geri</button>`;$('#rxBack').onclick=()=>rxWait('')}
async function rxSig(m){if(m.type==='bye'){rxEnd('Yansıtma bitti. Yeniden göstermek için aynı kodu gir.');return}
  if(m.type==='url'){const url=lanUrl(m.url);if(!url)return;let top=true;try{top=window.top===window}catch{top=false}
    /* TV'de (Yansıt tek başına açık) doğrudan geçer; AppShell içindeyse http adresi çerçevede açılamaz → tek dokunuşla yeni pencere */
    if(top){rxWait('Tabletin ekranı açılıyor…');setTimeout(()=>location.href=url,600);return}
    const R=$('#rx');R.innerHTML=`<div class="rx-w"><p class="rx-k">Tablet yayına hazır</p><button class="rx-open" id="rxOpen">Tabletin ekranını aç</button><p class="rx-u">${esc(url.replace(/^https?:\/\//,''))} · aynı Wi-Fi'de olmalı</p></div><button class="rx-x" data-go="home">Kapat</button>`;
    $('#rxOpen').onclick=()=>window.open(url,'_blank');$('#rxOpen').focus();return}if(m.type!=='offer')return;
  try{RX.pc?.close()}catch{}const pc=RX.pc=new RTCPeerConnection({iceServers:ICE});
  pc.ontrack=e=>rxShow(e.streams[0]||new MediaStream([e.track]),m.src);
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')rxEnd('Bağlantı kurulamadı. İki cihaz aynı Wi-Fi\'de mi?');else if(pc.connectionState==='closed')rxEnd('')};
  await pc.setRemoteDescription(m.data);await pc.setLocalDescription(await pc.createAnswer());await iceDone(pc);
  await sig(RX.code,{type:'answer',to:m.from,data:pc.localDescription})}
function rxShow(stream,src){const R=$('#rx');if(R.querySelector('video')?.srcObject===stream)return;
  const hasA=stream.getAudioTracks().length>0;
  R.innerHTML=`<video autoplay playsinline muted></video><div class="rx-ui" role="toolbar" aria-label="Yansıtma"><span>${{screen:'Ekran',front:'Kamera',back:'Kamera'}[src]||'Görüntü'} · ${RX.code}</span>${hasA?'<button data-rx="snd">Sesi aç</button>':''}<button data-rx="fs">Tam ekran</button><button data-rx="end">Bitir</button></div>`;
  const v=R.querySelector('video');v.srcObject=stream;v.play().catch(()=>{});
  if(!RM())v.animate([{opacity:0,scale:'.97'},{opacity:1,scale:'1'}],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)'});
  R.onclick=e=>{const b=e.target.closest('[data-rx]');if(!b)return;const k=b.dataset.rx;
    if(k==='fs')(document.fullscreenElement?document.exitFullscreen():R.requestFullscreen?.()).catch?.(()=>{});
    else if(k==='snd'){v.muted=!v.muted;b.textContent=v.muted?'Sesi aç':'Sesi kapat'}else if(k==='end'){rxEnd('')}};
  R.ondblclick=()=>{(document.fullscreenElement?document.exitFullscreen():R.requestFullscreen?.())?.catch?.(()=>{})};
  rxIdle()}
function rxIdle(){const R=$('#rx');R.classList.remove('idle');clearTimeout(RX.idleT);if(R.querySelector('video'))RX.idleT=setTimeout(()=>R.classList.add('idle'),3000)}
['pointermove','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{if(!$('#rx').hidden)rxIdle()},{passive:true}));
function rxEnd(msg){try{RX.pc?.close()}catch{}RX.pc=null;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});rxWait(msg)}
addEventListener('keydown',e=>{if($('#rx').hidden)return;if(e.key==='f'||e.key==='F'){$('#rx [data-rx=fs]')?.click()}else if(e.key==='Escape'&&!document.fullscreenElement&&!$('#rx video')){home();location.hash=''}});

/* ── başlangıç: #izle → alıcı (TV'de yer imi), #k=KOD → gönderen (kod hazır), #gonder ── */
function route(){const h=location.hash;if(h==='#izle')rxStart();else if(/^#k=[A-Z0-9]{6}$/i.test(h))txUI(h.slice(3).toUpperCase());else if(h==='#gonder')txUI();else home()}
addEventListener('hashchange',()=>{if(location.hash==='')home()});
route();
</script>
