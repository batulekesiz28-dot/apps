<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface2:#FAFAFA;--ink:#18181B;--ink2:#52525B;--ink3:#6E6E77;--ink4:#D4D4D8;
  --line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.09);--line3:rgba(0,0,0,.14);--hover:rgba(0,0,0,.05);
  --glass:rgba(255,255,255,.74);--menu:rgba(255,255,255,.84);--scrim:rgba(255,255,255,.45);--labelbg:rgba(255,255,255,.9);
  --font:'Geist',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.3,1.45,.5,1);
  --shadow:0 0 0 .5px rgba(0,0,0,.1),0 12px 32px -8px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.04);
  --se:none;color-scheme:light;
}
[data-family=dark]{
  --bg:#0D0D0F;--surface:#18181B;--surface2:#1F1F23;--ink:#EDEDEF;--ink2:#A1A1AA;--ink3:#8B8B94;--ink4:#3F3F46;
  --line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.1);--line3:rgba(255,255,255,.16);--hover:rgba(255,255,255,.07);
  --glass:rgba(26,26,29,.74);--menu:rgba(30,30,34,.88);--scrim:rgba(8,8,10,.55);--labelbg:rgba(13,13,15,.86);
  --shadow:0 0 0 .5px rgba(255,255,255,.1),0 16px 40px -10px rgba(0,0,0,.6);color-scheme:dark;
}
/* ── Themes ─────────────────────────────────── */
[data-theme=cyberpunk]{--bg:#0B0614;--surface:#150C24;--surface2:#1C1030;--ink:#F4EDFF;--ink2:#CDBBEB;--ink3:#A18CC9;--ink4:#3A2A55;
  --line:rgba(255,43,214,.10);--line2:rgba(255,43,214,.2);--line3:rgba(0,240,255,.32);--hover:rgba(0,240,255,.08);
  --glass:rgba(21,12,36,.8);--menu:rgba(24,13,40,.92);--scrim:rgba(6,3,12,.6);--labelbg:rgba(11,6,20,.85);
  --shadow:0 0 0 .5px rgba(0,240,255,.35),0 0 24px -6px rgba(255,43,214,.45),0 18px 40px -12px rgba(0,0,0,.7)}
[data-theme=cyberpunk] .wg{box-shadow:0 0 0 .5px rgba(0,240,255,.35),0 0 28px -10px rgba(255,43,214,.55),0 20px 44px -18px rgba(0,0,0,.8)}
[data-theme=cyberpunk] .ib.solid{background:#FF2BD6;color:#0B0614;box-shadow:0 0 18px -2px rgba(255,43,214,.7)}
[data-theme=cyberpunk] .nlabel{color:#00F0FF;text-shadow:0 0 8px rgba(0,240,255,.55)}
[data-theme=evren]{--bg:#05060F;--surface:#0E1022;--surface2:#14172D;--ink:#EEF0FF;--ink2:#B4BAE0;--ink3:#8D94C2;--ink4:#2A2E50;
  --line:rgba(170,180,255,.08);--line2:rgba(170,180,255,.14);--line3:rgba(170,180,255,.24);--hover:rgba(170,180,255,.08);
  --glass:rgba(14,16,34,.78);--menu:rgba(16,18,38,.92);--scrim:rgba(3,4,10,.6);--labelbg:rgba(5,6,15,.82)}
[data-theme=aurora]{--bg:#04121A;--surface:#0A1D27;--surface2:#0F2631;--ink:#E8FFF8;--ink2:#A9D8CC;--ink3:#7FB3A7;--ink4:#1D3C46;
  --line:rgba(120,255,210,.08);--line2:rgba(120,255,210,.15);--line3:rgba(120,255,210,.26);--hover:rgba(120,255,210,.08);
  --glass:rgba(10,29,39,.78);--menu:rgba(11,31,41,.92);--scrim:rgba(2,9,13,.6);--labelbg:rgba(4,18,26,.82)}
[data-theme=gunbatimi]{--bg:#FFF3EC;--surface:#FFFAF6;--surface2:#FFF0E8;--ink:#2B1A22;--ink2:#5E4450;--ink3:#7A5D69;--ink4:#EBD3CF;
  --line:rgba(120,40,60,.07);--line2:rgba(120,40,60,.12);--line3:rgba(120,40,60,.2);--hover:rgba(120,40,60,.06);
  --glass:rgba(255,248,243,.8);--menu:rgba(255,249,245,.94);--scrim:rgba(255,240,232,.5);--labelbg:rgba(255,248,243,.9)}
[data-theme=kagit]{--bg:#F4EFE4;--surface:#FBF8F1;--surface2:#F1EBDD;--ink:#2A2620;--ink2:#575045;--ink3:#6E665A;--ink4:#DCD3C1;
  --line:rgba(60,50,30,.08);--line2:rgba(60,50,30,.13);--line3:rgba(60,50,30,.2);--hover:rgba(60,50,30,.05);
  --glass:rgba(251,248,241,.82);--menu:rgba(251,248,241,.95);--scrim:rgba(244,239,228,.5);--labelbg:rgba(251,248,241,.9)}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#sky i{position:absolute;inset:-50%;display:none;will-change:transform}
[data-theme=cyberpunk] #sky{background:radial-gradient(60% 50% at 88% 0%,rgba(255,43,214,.22),transparent 70%),radial-gradient(55% 50% at 0% 100%,rgba(0,240,255,.16),transparent 70%),linear-gradient(#0B0614,#110826)}
[data-theme=cyberpunk] #sky::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
[data-theme=evren] #sky{background:radial-gradient(45% 40% at 78% 22%,rgba(120,80,255,.20),transparent 70%),radial-gradient(40% 35% at 18% 78%,rgba(40,140,255,.16),transparent 70%),radial-gradient(30% 25% at 55% 60%,rgba(255,90,170,.08),transparent 70%),#05060F}
[data-theme=evren] #sky i{display:block}
[data-theme=evren] #sky i.s1{background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 140px 80px,rgba(255,255,255,.8),transparent),radial-gradient(1.5px 1.5px at 260px 160px,#fff,transparent),radial-gradient(1px 1px at 330px 40px,rgba(200,210,255,.9),transparent),radial-gradient(1px 1px at 90px 250px,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 380px 300px,#fff,transparent),radial-gradient(1px 1px at 200px 360px,rgba(255,230,200,.8),transparent),radial-gradient(1.5px 1.5px at 310px 230px,rgba(255,255,255,.9),transparent);background-size:400px 400px}
[data-theme=evren] #sky i.s2{background-image:radial-gradient(1px 1px at 60px 120px,rgba(255,255,255,.55),transparent),radial-gradient(1px 1px at 180px 20px,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 240px 260px,rgba(190,200,255,.6),transparent),radial-gradient(1px 1px at 10px 200px,rgba(255,255,255,.45),transparent);background-size:270px 270px;animation:tw 4.5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:1}}
[data-theme=aurora] #sky{background:linear-gradient(#04121A,#061A24)}
[data-theme=aurora] #sky i{display:block;inset:-30%}
[data-theme=aurora] #sky i.s1{background:radial-gradient(40% 22% at 40% 30%,rgba(60,255,170,.2),transparent 70%),radial-gradient(35% 18% at 65% 40%,rgba(80,200,255,.14),transparent 70%);animation:au1 18s ease-in-out infinite alternate}
[data-theme=aurora] #sky i.s2{background:radial-gradient(38% 20% at 55% 25%,rgba(170,90,255,.16),transparent 70%),radial-gradient(30% 16% at 30% 45%,rgba(60,255,200,.12),transparent 70%);animation:au2 23s ease-in-out infinite alternate}
@keyframes au1{from{transform:translate3d(-6%,0,0) scale(1)}to{transform:translate3d(6%,4%,0) scale(1.12)}}
@keyframes au2{from{transform:translate3d(5%,3%,0) scale(1.08)}to{transform:translate3d(-5%,-2%,0) scale(.96)}}
[data-theme=gunbatimi] #sky{background:radial-gradient(50% 40% at 50% -5%,rgba(255,170,90,.35),transparent 70%),linear-gradient(#FFF3EC,#FFE6DC 55%,#FBDDE8)}
[data-theme=kagit] #sky{background:radial-gradient(ellipse at center,transparent 60%,rgba(120,100,60,.08)),#F4EFE4}
@media (prefers-reduced-motion:reduce){#sky i{animation:none!important}}
html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.45;touch-action:none;transition:background .5s var(--ease),color .5s var(--ease)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
::selection{background:rgba(127,127,127,.22)}
[hidden]{display:none!important}

/* ── Layers ───────────────────────────────────── */
canvas{position:fixed;inset:0;pointer-events:none}
#field{z-index:0}#fx{z-index:1}
#stage{position:fixed;inset:0;z-index:2}
#widgets{position:fixed;inset:0;z-index:3;pointer-events:none}
.node.bhole .tile,.node.bhole .shadow,.node.bhole .port{opacity:0!important}.node.bhole .nlabel{top:82px}
#widgets.moving .wg,.wg.drag{will-change:transform}
#nodes{position:fixed;inset:0;z-index:3;pointer-events:none}
body.panning,body.panning #stage,body.panning .node,body.panning .wg{cursor:grabbing!important}
body.far .nlabel{opacity:0}
body.far .port{display:none}
/* far away, apps shrink to coloured dots so the galaxy reads as clusters */
body.dots .tile{clip-path:none;border-radius:50%;background:var(--fg-t,#71717A);transform:scale(.3)!important;box-shadow:0 0 0 6px color-mix(in srgb,var(--fg-t,#71717A) 18%,transparent)}
body.dots .tile>*{opacity:0}
.tile>*{transition:opacity .3s}

/* ── Widgets ──────────────────────────────────── */
.wg{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:auto;border-radius:20px;background:var(--surface);box-shadow:0 0 0 .5px var(--line2),0 18px 40px -22px rgba(0,0,0,.22),0 2px 6px -2px rgba(0,0,0,.05);user-select:none;-webkit-user-select:none;touch-action:none;contain:layout style;cursor:grab;color:var(--ink)}
[data-family=dark] .wg{box-shadow:0 0 0 .5px var(--line3),0 20px 44px -18px rgba(0,0,0,.7)}
.wg.drag{cursor:grabbing;z-index:5;box-shadow:0 0 0 .5px var(--line3),0 30px 60px -24px rgba(0,0,0,.32)}
.wg-in{padding:14px 16px 16px;position:relative}
.wg-h{display:flex;align-items:center;gap:6px;height:18px;margin-bottom:10px;font:500 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.wg-h .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left}
.wg-h button{font:inherit;color:var(--ink3);letter-spacing:inherit;text-transform:inherit;min-height:26px;min-width:28px;padding:4px 7px;margin:-4px -7px;border-radius:7px}
.wg-h button:hover{color:var(--ink);background:var(--hover)}
.wg-x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 .5px var(--line3),0 4px 10px -4px rgba(0,0,0,.3);display:grid;place-items:center;opacity:0;transform:scale(.5);transition:opacity .2s var(--ease),transform .4s var(--spring);color:var(--ink2);z-index:2}
.wg-x svg{width:9px;height:9px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}
.wg:hover .wg-x{opacity:1;transform:none}.wg-x:hover{color:#DC2626}
@media (hover:none){.wg-x{opacity:.9;transform:none}}
.wg button,.wg input,.wg textarea,.wg a{cursor:pointer}
.wg input,.wg textarea{cursor:text}
.wg .big{font-size:40px;font-weight:300;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.wg .sub{color:var(--ink2);font-size:12px;margin-top:6px}
.wg .muted{color:var(--ink3)}
.wc-t{display:flex;align-items:baseline;gap:6px}
.wc-t .ss{font:500 12px/1 var(--mono);color:var(--ink3);width:18px}
.wc-bar{height:2px;border-radius:2px;background:var(--line2);margin-top:12px;overflow:hidden}.wc-bar i{display:block;height:100%;background:var(--ink);transform-origin:left;transition:transform 1s linear}
.ww-top{display:flex;align-items:center;gap:12px}
.ww-ic{width:38px;height:38px;flex:none;color:var(--ink2)}
.ww-ic svg,.wx-ic{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.ww-days{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px;padding-top:12px;border-top:.5px solid var(--line2);text-align:center;font-size:11px;color:var(--ink2)}
.ww-days b{display:block;font:500 9.5px/1 var(--mono);color:var(--ink3);letter-spacing:.06em;margin-bottom:5px}
.ww-days svg{width:18px;height:18px;margin:0 auto 4px;display:block;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.wg-city{width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--surface2);border:0;border-radius:8px;padding:6px 8px;outline:0;box-shadow:inset 0 0 0 .5px var(--line3)}
.wf-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 0}
.wf-row+.wf-row{border-top:.5px solid var(--line2)}
.wf-row .p{font:500 10.5px/1 var(--mono);color:var(--ink2);letter-spacing:.03em}
.wf-row .v{font-size:19px;font-weight:400;letter-spacing:-.03em;text-align:right;font-variant-numeric:tabular-nums}
.wf-row .c{display:block;font:500 9.5px/1 var(--mono);text-align:right;margin-top:3px}
.up{color:#16A34A}.dn{color:#DC2626}
.wf-row svg{width:100%;height:24px;overflow:visible}
.wf-row svg path{fill:none;stroke:var(--ink3);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.wn-ta{display:block;width:100%;height:132px;resize:none;border:0;outline:0;background:none;font:inherit;font-size:13.5px;line-height:1.55;color:var(--ink)}
.wn-ta::placeholder{color:var(--ink3)}
.wn-f{font:500 9.5px/1 var(--mono);color:var(--ink3);text-align:right;margin-top:4px;letter-spacing:.04em}
.wt-l{display:grid;gap:2px;margin:0 -8px}
.wt-l button{display:flex;align-items:center;gap:9px;text-align:left;padding:6px 8px;border-radius:8px;font-size:13px;min-width:0}
.wt-l button:hover{background:var(--hover)}
.wt-l .e{width:16px;text-align:center;flex:none}
.wt-l .tx{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wt-l .bx{width:13px;height:13px;border-radius:4px;box-shadow:inset 0 0 0 1.2px var(--ink3);flex:none;margin:0 1.5px}
.wt-s{display:grid;gap:7px;width:100%;text-align:left;padding:10px 12px;margin:0 0 10px;border-radius:12px;background:var(--surface2);box-shadow:inset 0 0 0 .5px var(--line2);font-size:12.5px;color:var(--ink2);transition:background .15s}
.wt-s:hover{background:var(--hover)}.wt-s b{color:var(--ink);font-weight:600}
.wt-b{height:4px;border-radius:4px;background:var(--line2);overflow:hidden}.wt-b i{display:block;height:100%;background:#1F9D55;border-radius:4px}
.wt-e{color:var(--ink3);font-size:12.5px;padding:6px 0 2px}
.wt-e button{display:inline-block;margin-top:8px;font-size:12px;color:var(--ink);padding:5px 10px;border-radius:8px;box-shadow:inset 0 0 0 .5px var(--line3)}
.wt-e button:hover{background:var(--hover)}
.wo{display:flex;align-items:center;gap:16px}
.wo-ring{width:76px;height:76px;flex:none;position:relative}
.wo-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.wo-ring circle{fill:none;stroke-width:3}
.wo-ring .bg{stroke:var(--line2)}.wo-ring .fg{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.wo-ring span{position:absolute;inset:0;display:grid;place-items:center;font:500 15px/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wo-b{display:grid;gap:6px;flex:1}
.wo-b button{height:28px;border-radius:9px;font-size:12px;box-shadow:inset 0 0 0 .5px var(--line3)}
.wo-b button:hover{background:var(--hover)}
.wo-b button.pri{background:var(--ink);color:var(--bg);box-shadow:none}
.wo-m{display:flex;gap:2px;margin-top:12px;padding:2px;border-radius:9px;background:var(--surface2);box-shadow:inset 0 0 0 .5px var(--line2)}
.wo-m button{flex:1;height:22px;border-radius:7px;font-size:11px;color:var(--ink3)}
.wo-m button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 .5px var(--line3),0 1px 3px rgba(0,0,0,.08)}
.wg-h [data-act=prev],.wg-h [data-act=next]{font:400 15px/1 var(--font);padding:0 6px;height:20px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.wk b{font:500 9px/1 var(--mono);color:var(--ink3);padding:4px 0 6px}
.wk button{position:relative;height:26px;border-radius:7px;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.wk button:hover{background:var(--hover)}
.wk button.o{color:var(--ink4)}
.wk button.t{background:var(--ink);color:var(--bg);font-weight:600}
.wk button.h::after{content:'';position:absolute;left:50%;bottom:3px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:currentColor;opacity:.7}
.wg-sk{height:10px;border-radius:5px;background:var(--line2);margin:8px 0;animation:sk 1.2s ease-in-out infinite alternate}
@keyframes sk{to{opacity:.4}}
.thsw{width:16px;height:16px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 .5px rgba(127,127,127,.4)}
.scl{display:grid;gap:4px;max-height:46vh;overflow:auto}
.sc-r{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;font-size:13.5px;cursor:pointer;box-shadow:inset 0 0 0 .5px var(--line2)}.sc-r:hover{background:var(--hover)}.sc-r input{width:18px;height:18px;accent-color:var(--ink);flex:none}
.gpre{display:flex;flex-wrap:wrap;gap:6px}
.gpre button{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 10px;border-radius:9px;font-size:12.5px;box-shadow:inset 0 0 0 .5px var(--line3);transition:background .15s,transform .4s var(--spring)}
.gpre button:hover{background:var(--hover)}.gpre button:active{transform:scale(.95)}.gpre button.on{box-shadow:inset 0 0 0 1.2px var(--ink)}
.gpre i{width:8px;height:8px;border-radius:50%}
.fl-w{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:2px 0}
.flame{width:60px;height:74px;flex:none;transform:scale(var(--s));transform-origin:50% 90%;transition:transform .6s var(--spring)}
.flame svg{width:100%;height:100%;overflow:visible}
.flame .f1{fill:#FF7A1A;transform-origin:50% 100%;animation:fl1 1.6s ease-in-out infinite alternate}
.flame .f2{fill:#FFD23F;transform-origin:50% 100%;animation:fl2 1.1s ease-in-out infinite alternate}
.flame.big .f1{fill:#FF5A1F;filter:drop-shadow(0 0 8px rgba(255,110,30,.55))}
.flame.blue .f1{fill:#3B82F6;filter:drop-shadow(0 0 10px rgba(59,130,246,.6))}.flame.blue .f2{fill:#BFE3FF}
.flame.risk .f1,.flame.risk .f2{animation-duration:.5s,.4s;opacity:.75}
.flame.out .f1{fill:var(--ink4);animation:none}.flame.out .f2{fill:var(--line3);animation:none}
@keyframes fl1{from{transform:scale(1,1) skewX(0)}to{transform:scale(.96,1.05) skewX(-3deg)}}

/* ── Menu / palette ───────────────────────────── */
.menu{position:fixed;z-index:200;min-width:196px;padding:5px;border-radius:12px;background:var(--menu);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);box-shadow:var(--shadow);transform-origin:var(--ox,0) var(--oy,0)}

.pal-e{padding:30px;text-align:center;color:var(--ink3)}

/* ── Sheet ────────────────────────────────────── */
.sheet-scrim{position:fixed;inset:0;z-index:100;background:var(--scrim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;padding:20px}
.sheet{width:min(520px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow),0 30px 80px -20px rgba(0,0,0,.22)}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 14px 22px;border-bottom:.5px solid var(--line2)}
.sh-t{font-size:14px;font-weight:600;letter-spacing:-.015em}
.sh-b{padding:18px 22px 20px;overflow-y:auto;scrollbar-width:none}
.sh-b::-webkit-scrollbar{display:none}
.sh-f{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:.5px solid var(--line2)}
.sh-f .grow{flex:1;font-size:11.5px;color:var(--ink3)}
.x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}
.x:hover{background:var(--hover);color:var(--ink)}
.x svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.f{margin-bottom:18px}.f:last-child{margin-bottom:0}
.fl{display:block;font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:8px}
.in{width:100%;height:36px;padding:0 12px;border-radius:9px;border:.5px solid var(--line3);background:var(--surface);font:inherit;font-size:13.5px;color:var(--ink);outline:0;transition:border-color .2s,box-shadow .3s}
.in:focus{border-color:var(--ink3);box-shadow:0 0 0 4px var(--line)}
textarea.in{height:200px;padding:10px 12px;resize:vertical;font:11.5px/1.6 var(--mono);color:var(--ink2)}
.pick{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.pick button{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;color:var(--ink2);border:.5px solid transparent;transition:background .15s,border-color .15s,transform .3s var(--spring)}
.pick button:hover{background:var(--hover)}
.pick button.on{border-color:var(--ink);background:var(--surface2)}
.pick button:active{transform:scale(.9)}
.pick svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.pick .mono-o{font-size:12px;font-weight:500}
.sw{display:flex;gap:8px}
.sw button{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(127,127,127,.4);transition:transform .35s var(--spring),box-shadow .2s}
.sw button:hover{transform:scale(1.12)}
.sw button.on{box-shadow:inset 0 0 0 .5px rgba(127,127,127,.4),0 0 0 2px var(--surface),0 0 0 2.5px var(--ink)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:9px;background:var(--hover);margin-bottom:12px}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:7px;background:var(--surface);box-shadow:0 0 0 .5px var(--line2),0 1px 2px rgba(0,0,0,.05);transition:transform .45s var(--out)}
.seg.r i{transform:translateX(100%)}
.seg button{position:relative;height:28px;font-size:12.5px;font-weight:500;color:var(--ink3);transition:color .2s}
.seg button.on{color:var(--ink)}
.drop{display:grid;place-items:center;gap:6px;padding:30px 20px;border-radius:12px;border:.5px dashed var(--line3);text-align:center;cursor:pointer;transition:background .2s,border-color .2s}
.drop:hover,.drop.over{background:var(--hover);border-color:var(--ink3)}
.drop svg{width:22px;height:22px;fill:none;stroke:var(--ink3);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.drop b{font-weight:500;font-size:12.5px;color:var(--ink2)}
.drop span{font-size:11.5px;color:var(--ink3)}
.drop.ok b{color:#16A34A}
.btn{height:32px;padding:0 14px;border-radius:9px;font-size:12.5px;font-weight:500;transition:background .15s,transform .3s var(--spring)}
.btn:active{transform:scale(.96)}
.btn.ghost{color:var(--ink2)}.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.line{border:.5px solid var(--line3)}.btn.line:hover{background:var(--hover)}
.steps{display:grid;gap:10px;font-size:12.5px;color:var(--ink2);line-height:1.55;counter-reset:s}
.steps li{list-style:none;display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px}
.steps li::before{counter-increment:s;content:counter(s);font:500 10px/18px var(--mono);text-align:center;width:18px;height:18px;border-radius:50%;border:.5px solid var(--line3);color:var(--ink3)}
.steps code,.codebox{font:11.5px/1.6 var(--mono)}
.codebox{display:block;padding:12px 14px;border-radius:10px;background:var(--surface2);border:.5px solid var(--line2);color:var(--ink2);white-space:pre-wrap;word-break:break-word;margin-top:6px}
.note{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--hover);font-size:12px;color:var(--ink2);line-height:1.55}
.keys{display:grid;grid-template-columns:1fr auto;gap:10px 18px;font-size:13px;color:var(--ink2);align-items:center}
.keys span:nth-child(even){display:flex;gap:4px;justify-content:flex-end}

/* ── Drop / toast / gate ──────────────────────── */
.pdrop{position:fixed;inset:14px;z-index:300;border-radius:22px;border:1px dashed var(--ink3);background:var(--scrim);display:grid;place-items:center;pointer-events:none;opacity:0;transform:scale(.985);transition:opacity .25s var(--ease),transform .5s var(--out)}
.pdrop.on{opacity:1;transform:none}
.pdrop div{display:grid;justify-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--ink2)}
.pdrop svg{width:28px;height:28px;fill:none;stroke:var(--ink3);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.pdrop span{font:500 10.5px var(--mono);color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.toasts{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:400;display:grid;gap:6px;justify-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;height:36px;padding:0 14px 0 12px;border-radius:11px;background:rgba(24,24,27,.94);color:#fff;font-size:12.5px;font-weight:500;box-shadow:0 10px 30px -8px rgba(0,0,0,.3);white-space:nowrap}
.toast.has-undo{padding-right:5px}
[data-family=dark] .toast{background:rgba(244,244,245,.96);color:#18181B}
.toast i{width:5px;height:5px;border-radius:50%;background:#4ADE80}
.toast button{pointer-events:auto;height:26px;padding:0 10px;border-radius:7px;font-weight:600;background:rgba(255,255,255,.14);transition:background .15s}
.toast button:hover{background:rgba(255,255,255,.24)}
[data-family=dark] .toast button{background:rgba(0,0,0,.08)}
body.locked .top,body.locked #nodes,body.locked .status,body.locked .hint,body.locked .dock{visibility:hidden}
.gate{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:24px;pointer-events:none}
.gate-card{pointer-events:auto;width:min(340px,100%);display:grid;justify-items:center;text-align:center;gap:14px;padding:34px 28px 26px;border-radius:22px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:var(--shadow),0 30px 80px -24px rgba(0,0,0,.18)}
.gate .mark-glyph{width:34px;height:34px;gap:3px;padding:4px}
.gate .mark-glyph i{border-radius:3px}
.gate h1{font-size:17px;font-weight:600;letter-spacing:-.02em}
.gate p{font-size:12.5px;color:var(--ink2);line-height:1.55;min-height:19px}
.gate p b{font-weight:500;color:var(--ink)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:40px;border-radius:11px;background:var(--surface);font-size:13px;font-weight:500;box-shadow:0 0 0 .5px var(--line3),0 1px 2px rgba(0,0,0,.05);transition:transform .35s var(--spring),box-shadow .2s}
.gbtn:hover{box-shadow:0 0 0 .5px var(--ink3),0 4px 12px -4px rgba(0,0,0,.14)}
.gbtn:active{transform:scale(.97)}.gbtn[disabled]{opacity:.5;pointer-events:none}
.spin{width:16px;height:16px;border-radius:50%;border:1px solid var(--line3);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gate small{font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}

@media (max-width:640px){
  .top{padding-left:14px;padding-right:14px;gap:6px}
  .kbd,.mark-name,.status .help{display:none}
  .search{width:auto;flex:0 1 150px}
  .status{padding-left:14px;padding-right:14px}
  .nlabel{font-size:11px}
  .pill .pname{max-width:34vw}
}
@media (hover:none){.hot{display:none}}
@media (hover:hover){.grab{display:none}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
/* Denetçi: telefonda dokunma alanları ve okunur yazı */
@media (max-width:700px){.status,.zbar #zPct{font-size:11.5px}.node .nlabel{font-size:12px}.ib{width:40px;height:40px}.search{height:40px}}

/* focus / rss / calendar widgets */
.fc-t{font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.3;color:var(--ink)}
.fc-t.done{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 40%,transparent);color:var(--ink2)}
.fc-q{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}.fc-q .sub{margin-right:4px}
.fc-b{height:30px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:550;color:var(--ink);box-shadow:inset 0 0 0 .5px var(--line3);background:var(--surface)}
.fc-b.ok{background:var(--ink);color:var(--bg);box-shadow:none}
.fc-b:hover{filter:brightness(1.08)}
.fc-h{display:flex;gap:4px;margin-top:12px}.fc-h i{width:8px;height:8px;border-radius:50%;background:var(--line3)}.fc-h i.ok{background:#16A34A}.fc-h i.no{background:#DC2626;opacity:.7}
.wg-h button{min-width:28px;min-height:28px;border-radius:7px;color:var(--ink3);font-size:13px}.wg-h button:hover{background:var(--hover);color:var(--ink)}
.rs-l,.gc-l{display:grid;gap:2px;margin:0 -6px}
.rs-i,.gc-e{display:grid;gap:3px;padding:7px 6px;border-radius:9px;color:var(--ink);text-decoration:none}
.rs-i:hover,.gc-e:hover{background:var(--hover)}
.rs-i b{font-size:13px;font-weight:550;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rs-i span{font-size:12px;color:var(--ink3)}
.rs-ta{resize:none;font-size:12.5px;line-height:1.5}
.rs-p{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.rs-p button{height:26px;padding:0 9px;border-radius:8px;font-size:12px;color:var(--ink2);box-shadow:inset 0 0 0 .5px var(--line3)}.rs-p button:hover{background:var(--hover)}
.gc-d{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:10px 6px 4px}
.gc-e{grid-template-columns:62px minmax(0,1fr);align-items:baseline}.gc-e span{font-size:12px;color:var(--ink3)}.gc-e b{font-size:13px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wg a{color:inherit}
.focusbar{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;max-width:min(560px,calc(100vw - 24px));height:36px;padding:0 6px 0 14px;border-radius:12px;background:var(--menu);box-shadow:var(--shadow);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);cursor:pointer;font-size:13px;color:var(--ink)}
.focusbar .fb-l{font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#92400E;flex-shrink:0}[data-family=dark] .focusbar .fb-l{color:#FCD34D}
.focusbar .fb-t{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.focusbar.done .fb-t{text-decoration:line-through;color:var(--ink2)}
.focusbar .fb-ok{color:#16A34A;font-weight:700;padding-right:8px}
.focusbar .fb-q{color:var(--ink3);flex-shrink:0}
.focusbar button{height:26px;min-width:26px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:550;color:var(--ink2);flex-shrink:0;box-shadow:inset 0 0 0 .5px var(--line3)}
.focusbar button:hover{background:var(--hover);color:var(--ink)}
body.locked .focusbar{display:none}
.focusbar .sm{display:none}.focusbar .fb-t{flex:1}
@media (max-width:600px){.focusbar .fb-q,.focusbar .lg{display:none}.focusbar .sm{display:inline}.focusbar{top:calc(66px + env(safe-area-inset-top))}}
@media (hover:none){.focusbar{height:42px}.focusbar button{height:36px;min-width:36px}.wg-h button{min-width:44px;min-height:44px}.fc-b{height:44px}.rs-p button{height:36px}}
/* canlı ada */
.island{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;min-width:180px;max-width:min(420px,calc(100vw - 24px));border-radius:22px;background:#0B0B0D;color:#F4F4F5;box-shadow:0 10px 30px -10px rgba(0,0,0,.45),0 0 0 .5px rgba(255,255,255,.08);cursor:pointer;overflow:hidden;transition:border-radius .45s var(--out),width .45s var(--out)}
.island .is-c{display:flex;align-items:center;gap:9px;height:40px;padding:0 14px 0 13px;font-size:13px}
.island .is-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550;flex:1}
.island .is-t.done,.island .is-rt.done b{text-decoration:line-through;opacity:.6}
.island .is-v{font:600 14px var(--mono);letter-spacing:-.02em;color:#fff}
.island .is-n{font:500 12px var(--mono);color:#A1A1AA}
.island .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex-shrink:0}
.island .dot.live{animation:islp 1.6s ease-in-out infinite;box-shadow:0 0 0 0 var(--c)}
@keyframes islp{50%{box-shadow:0 0 0 5px transparent;opacity:.6}}
.island .ico{font-style:normal;width:16px;text-align:center;color:#FCD34D;flex-shrink:0}
.island .is-l{display:none;padding:2px 8px 10px}
.island.open{border-radius:24px}.island.open .is-c{display:none}.island.open .is-l{display:grid;gap:2px}
.island .is-r{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 6px 4px 8px;border-radius:14px}
.island .is-r:hover{background:rgba(255,255,255,.06)}
.island .is-rt{flex:1;min-width:0;display:grid}.island .is-rt b{font-size:13.5px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.island .is-rt small{font-size:12px;color:#A1A1AA}
.island .is-rv{font:600 15px var(--mono);margin-right:4px}
.island button{min-width:34px;height:32px;padding:0 10px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;font-size:12.5px;font-weight:550}
.island button:hover{background:rgba(255,255,255,.18)}
.island.live{box-shadow:0 10px 30px -10px rgba(0,0,0,.45),0 0 0 1px rgba(225,29,72,.35)}
body.locked .island{display:none}
@media (max-width:600px){.island{top:calc(64px + env(safe-area-inset-top))}.island button{min-width:40px;height:40px}}
/* radyal menü */
.radial{position:fixed;z-index:160;width:0;height:0}
.rd-c{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;background:var(--menu);box-shadow:var(--shadow);transform:scale(.3);opacity:0;transition:transform .4s var(--spring),opacity .2s}
.rd-b{position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;align-content:center;gap:2px;background:var(--menu);color:var(--ink);box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);transform:translate(0,0) scale(.2);opacity:0;transition:transform .5s var(--spring) var(--d),opacity .25s var(--d),background .15s}
.rd-b svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.rd-b span{font-size:12px;font-weight:550;line-height:1;white-space:nowrap;max-width:58px;overflow:hidden;text-overflow:ellipsis}
.radial.on .rd-c{transform:none;opacity:1}
.radial.on .rd-b{transform:translate(var(--dx),var(--dy)) scale(1);opacity:1}
.rd-b:hover,.rd-b:focus-visible{background:var(--ink);color:var(--bg);outline:0}
/* sakin mod */
.calm{position:fixed;inset:0;z-index:150;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(30px) saturate(1.2);-webkit-backdrop-filter:blur(30px) saturate(1.2);cursor:pointer;padding:24px}
.calm .cm-t{font-size:clamp(72px,16vw,180px);font-weight:200;letter-spacing:-.06em;line-height:1;color:var(--ink)}
.calm .cm-d{font-size:16px;color:var(--ink2);text-transform:capitalize}
.calm .cm-l{display:grid;gap:8px;margin-top:22px;min-width:min(380px,86vw)}
.calm .cm-r{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 .5px var(--line2);font-size:15px;text-align:left}
.calm .cm-r span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calm .cm-r b{font:600 16px var(--mono)}
.calm .cm-r .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}.calm .cm-r .ico{font-style:normal;color:var(--ink2)}
.calm .cm-h{margin-top:26px;font:500 12px var(--mono);letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}
/* ── tabs: several apps open at once ── */
.pill{max-width:calc(100vw - 16px);padding:0 4px}
.pill .tabs{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:min(62vw,720px);padding:0 1px}
.pill .tabs::-webkit-scrollbar{display:none}
.tb{position:relative;display:flex;align-items:center;flex-shrink:0;border-radius:9px;transition:background .15s}
.tb:hover{background:var(--hover)}
.tb.on{background:var(--hover2,var(--hover));box-shadow:inset 0 0 0 .5px var(--line3)}
.pill .tb-o{width:auto;height:30px;display:flex;align-items:center;gap:6px;padding:0 6px;border-radius:9px;color:var(--ink2);font-size:12.5px;font-weight:550}
.tb.on .tb-o{color:var(--ink)}
.tb .tn{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb:not(.on) .tn{max-width:72px}
.tb.zz .mini{opacity:.5;filter:grayscale(.6)}

.tb:not(.on):not(:hover):not(:focus-within) .tb-x{display:none}
.tb:hover .tb-x,.tb.on .tb-x,.tb-x:focus-visible{opacity:1}
.pill .tb-x:hover{color:#DC2626;background:transparent}
.tb-x svg,.dk-x svg,.as-x svg{width:9px;height:9px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}
.dock{gap:4px;padding:0 5px;max-width:calc(100vw - 24px);height:44px}
.dock .dk-l{font:500 12px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);padding:0 6px 0 4px}
.dk{display:flex;align-items:center;border-radius:10px;flex-shrink:1;min-width:0}
.dk:hover{background:var(--hover)}
.dock .dk-o{display:flex;align-items:center;gap:7px;height:34px;padding:0 4px 0 6px;min-width:0;color:var(--ink);font-size:12px;font-weight:500}
.dock .dk-o:hover{background:transparent}
.dk .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.dk.zz .mini{opacity:.5;filter:grayscale(.6)}
.dock .dk-x,.dock .dk-sw{width:28px;height:28px;padding:0;display:grid;place-items:center;border-radius:8px;color:var(--ink3)}
.dock .dk-x:hover{color:#DC2626}
.dk-sw svg,.pill [data-w=sw] svg{fill:none;stroke:currentColor;stroke-width:1.3}
.dk-sw svg{width:15px;height:15px}
.as-bg{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:var(--scrim);padding:20px}

<script>
'use strict';
/* ════════════════════════════════════════════════════════════
   AppShell v4 — manyetik ağ · yüzen & bağlanabilen uygulamalar
   Yayındaki uygulamalar: apps.json + apps/<slug>/index.html
   Taslaklar, yerleşim, bağlantılar: Firestore hub/meta (yalnızca sahibi)
   ════════════════════════════════════════════════════════════ */
const $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hash=s=>{let h=0;for(const c of s)h=(Math.imul(31,h)+c.charCodeAt(0))|0;return Math.abs(h)};
let REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE=matchMedia('(pointer:fine)').matches;
const EASE='cubic-bezier(.2,.8,.2,1)',OUT='cubic-bezier(.16,1,.3,1)',SPRING='cubic-bezier(.3,1.35,.5,1)';
const anim=(el,kf,o)=>(!el||REDUCED)?{finished:Promise.resolve(),cancel(){}}:el.animate(kf,o);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const typing=e=>{const t=e.target;return t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))};

/* ── Theme ────────────────────────────────────────────────── */
const THEMES={
  light:    {n:'Aydınlık',  bg:'#FFFFFF',dot:[194,194,201],hot:[90,90,95],   l:'24,24,27',   la:[.085,.17,.28],ring:'#FFFFFF',dark:0,sw:['#FFFFFF','#18181B']},
  dark:     {n:'Gece',      bg:'#0D0D0F',dot:[62,62,70],   hot:[200,200,210],l:'255,255,255',la:[.05,.12,.24], ring:'#0D0D0F',dark:1,sw:['#0D0D0F','#EDEDEF']},
  cyberpunk:{n:'Cyberpunk', bg:'#0B0614',dot:[120,50,150], hot:[0,240,255],  l:'0,240,255',  la:[.07,.2,.42],  ring:'#0B0614',dark:1,sw:['#0B0614','#FF2BD6','#00F0FF'],bh:[255,43,214],neon:1},
  evren:    {n:'Evren',     bg:'#05060F',dot:[70,78,120],  hot:[200,210,255],l:'170,180,255',la:[.045,.11,.24],ring:'#05060F',dark:1,sw:['#05060F','#7A50FF','#2A8CFF'],bh:[255,190,110]},
  aurora:   {n:'Aurora',    bg:'#04121A',dot:[40,96,94],   hot:[150,255,220],l:'120,255,210',la:[.05,.12,.26], ring:'#04121A',dark:1,sw:['#04121A','#3CFFAA','#AA5AFF'],bh:[120,255,210]},
  gunbatimi:{n:'Gün batımı',bg:'#FFF3EC',dot:[226,178,170],hot:[190,70,90],  l:'120,40,60',  la:[.09,.18,.3],  ring:'#FFF3EC',dark:0,sw:['#FFE6DC','#FF9A5A','#C2416B']},
  neon:     {n:'Neon',      bg:'#0E0320',dot:[110,40,140], hot:[61,245,242], l:'255,79,179', la:[.08,.22,.45], ring:'#0E0320',dark:1,sw:['#0E0320','#FF4FB3','#3DF5F2'],bh:[255,79,179],neon:1},
  doga:     {n:'Doğa',      bg:'#EEF0E4',dot:[176,190,160],hot:[47,107,63],  l:'47,90,50',   la:[.08,.16,.28], ring:'#EEF0E4',dark:0,sw:['#EEF0E4','#2F6B3F','#B5652F'],bh:[214,170,70]},
  kagit:    {n:'Kağıt',     bg:'#F4EFE4',dot:[196,186,165],hot:[110,90,60],  l:'60,50,30',   la:[.085,.16,.28],ring:'#F4EFE4',dark:0,sw:['#F4EFE4','#2A2620']}};
const THEME_KEYS=Object.keys(THEMES);
// preview backgrounds for the theme studio cards
Object.assign(THEMES.light,{pv:'linear-gradient(#FFFFFF,#F4F4F5)'});Object.assign(THEMES.dark,{pv:'linear-gradient(#0D0D0F,#18181B)'});
Object.assign(THEMES.evren,{pv:'radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),radial-gradient(60% 50% at 75% 25%,rgba(123,97,255,.4),transparent 70%),radial-gradient(50% 40% at 15% 85%,rgba(40,140,255,.3),transparent 70%),#05060F'});
Object.assign(THEMES.cyberpunk,{pv:'repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),radial-gradient(60% 50% at 95% 0%,rgba(252,238,10,.2),transparent 70%),radial-gradient(60% 50% at 0% 100%,rgba(0,240,255,.2),transparent 70%),#0A0A10'});
Object.assign(THEMES.neon,{pv:'radial-gradient(30% 32% at 50% 58%,#FF8A3D,#FF2E97 70%,transparent 72%),repeating-linear-gradient(90deg,rgba(61,245,242,.35) 0 1px,transparent 1px 22px) 0 70%/100% 40% no-repeat,linear-gradient(#0E0320,#3A0B52 66%,#0E0320 66%)'});
Object.assign(THEMES.doga,{pv:'radial-gradient(120% 60% at 20% 105%,rgba(122,154,104,.45) 0 45%,transparent 46%),radial-gradient(110% 55% at 90% 105%,rgba(96,132,86,.4) 0 45%,transparent 46%),radial-gradient(70% 60% at 10% -10%,rgba(255,226,150,.7),transparent 65%),#EEF0E4'});
Object.assign(THEMES.aurora,{pv:'radial-gradient(60% 30% at 40% 30%,rgba(60,255,170,.35),transparent 70%),radial-gradient(50% 25% at 70% 45%,rgba(170,90,255,.3),transparent 70%),#04121A'});
Object.assign(THEMES.gunbatimi,{pv:'radial-gradient(60% 50% at 50% -5%,rgba(255,170,90,.6),transparent 70%),linear-gradient(#FFF3EC,#FBDDE8)'});
Object.assign(THEMES.kagit,{pv:'radial-gradient(ellipse at center,transparent 55%,rgba(120,100,60,.12)),#F4EFE4'});
let TH=THEMES[document.documentElement.dataset.theme]||THEMES.light;
function applyTheme(t){if(!THEMES[t])t='light';loadFont(t);const r=document.documentElement;r.dataset.theme=t;r.dataset.family=THEMES[t].dark?'dark':'light';TH=THEMES[t];$('#themeColor').content=TH.bg;mKey='';skyParallax();
  $('#themeIcon').setAttribute('d',TH.dark?'M8 2.5v1.2M8 12.3v1.2M2.5 8h1.2M12.3 8h1.2M4.1 4.1l.85.85M11.05 11.05l.85.85M11.9 4.1l-.85.85M4.95 11.05l-.85.85M10.6 8A2.6 2.6 0 1 1 5.4 8a2.6 2.6 0 0 1 5.2 0z':'M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z');
  meshDirty=true;wakeMesh()}
function setTheme(t){setThemeQuiet(t);
  const b=$('#themeBtn').getBoundingClientRect();ripple(b.left+b.width/2,b.top+b.height/2,2.4);anim($('#themeBtn'),[{transform:'rotate(-120deg) scale(.7)'},{transform:'none'}],{duration:640,easing:SPRING})}
function toggleTheme(){const i=THEME_KEYS.indexOf(document.documentElement.dataset.theme);setTheme(THEME_KEYS[(i+1)%THEME_KEYS.length])}
function themeMenu(){const b=$('#themeBtn').getBoundingClientRect(),cur=document.documentElement.dataset.theme;
  popMenu(b.right-230,b.bottom+8,`<div class="who"><b>Tema</b>bu cihaz için</div><div class="msep"></div>`+THEME_KEYS.map(k=>{const T=THEMES[k],g=T.sw.length>2?`${T.sw[0]} 0 50%,${T.sw[1]} 50% 75%,${T.sw[2]} 75%`:`${T.sw[0]} 0 50%,${T.sw[1]} 50%`;
    return`<button class="mi" data-th="${k}" role="menuitemradio" aria-checked="${k===cur}"><span class="thsw" style="background:linear-gradient(135deg,${g})"></span>${T.n}${k===cur?'<span class="k">✓</span>':''}</button>`}).join(''),
    e=>{const x=e.target.closest('[data-th]');if(!x)return;hideMenu();setTheme(x.dataset.th)})}
/* ── Tema evrenleri: yazı tipleri, stüdyo, hareket ayarı ── */
const FONTS={evren:'Sora:wght@300..700',cyberpunk:'Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono',neon:'Space+Grotesk:wght@300..700&family=Audiowide',doga:'Nunito:wght@400..800&family=Fraunces:opsz,wght@9..144,400..700'};
const fontLoaded=new Set();
function loadFont(t){if(!FONTS[t]||fontLoaded.has(t))return;fontLoaded.add(t);const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+FONTS[t]+'&display=swap';document.head.appendChild(l)}
const MAIN_THEMES=[['evren','Evren','Derin uzay, cam paneller, kayan yıldızlar'],['cyberpunk','Cyberpunk','Gece şehri: sarı ışık, köşe parantezleri, tarama çizgisi'],['neon','Neon','Synthwave güneşi, kayan ızgara, pembe parıltı'],['doga','Doğa','Sabah ışığı, yumuşak tepeler, kâğıt dokusu'],['light','Minimal','Sade, ferah, dikkat dağıtmayan'],['dark','Minimal Gece','Sade ve karanlık']];
const MORE_THEMES=[['aurora','Aurora','Kuzey ışıkları'],['gunbatimi','Gün batımı','Sıcak pastel'],['kagit','Kâğıt','Mürekkep ve kâğıt']];
let MOTION=store.get('appshell:motion','full');
function applyMotion(m){MOTION=m;document.documentElement.dataset.motion=m;store.set('appshell:motion',m);try{localStorage.setItem('appshell:motion',JSON.stringify(m))}catch{}}
applyMotion(MOTION);
// theme change with a soft circular reveal from where you clicked (View Transitions, when available)
function switchTheme(t,x,y,commit=true){const go=()=>{commit?setThemeQuiet(t):applyTheme(t)};
  if(!document.startViewTransition||MOTION!=='full'||REDUCED){go();return}
  const r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));const vt=document.startViewTransition(go);
  vt.ready.then(()=>document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:620,easing:'cubic-bezier(.4,0,.1,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{})}
function setThemeQuiet(t){store.set('appshell:theme',t);store.set('notlar:theme',THEMES[t].dark?'dark':'light');try{localStorage.setItem('appshell:skin',t)}catch{}applyTheme(t)}
let tsEl=null;
function themeStudio(){if(tsEl)return;const saved=document.documentElement.dataset.theme;Object.keys(FONTS).forEach(loadFont);
  const card=([k,n,d])=>{const T=THEMES[k];return`<button class="tp${k===saved?' on':''}" data-theme="${k}" data-family="${T.dark?'dark':'light'}" data-tk="${k}" aria-pressed="${k===saved}" aria-label="${n} teması"><div class="tp-v"><div class="tp-sky" style="background:${T.pv}"></div>
      <div class="tp-ui"><div class="tp-top"><i></i><span></span></div><div class="tp-w"><b>09:41</b><small>Günün odağı</small></div><div class="tp-tiles"><i></i><i></i><i></i></div></div></div>
      <div class="tp-n"><b>${n}</b><small>${d}</small></div></button>`};
  tsEl=document.createElement('div');tsEl.className='ts-bg';tsEl.setAttribute('role','dialog');tsEl.setAttribute('aria-label','Tema stüdyosu');
  tsEl.innerHTML=`<div class="ts"><div class="ts-h"><h2>Tema evrenleri</h2><button class="ts-x" data-tsx aria-label="Kapat">${XI}</button><p>${FINE?'Üstüne gel, anında önizle; tıkla, seç.':'Dokun, seç.'} Seçimin bu cihazda saklanır ve bütün uygulamalara geçer.</p></div>
    <div class="ts-g">${MAIN_THEMES.map(card).join('')}</div><div class="ts-sec">Diğer</div><div class="ts-g">${MORE_THEMES.map(card).join('')}</div>
    <div class="ts-mo"><b>Animasyonlar</b><div class="ts-seg" role="radiogroup" aria-label="Animasyonlar">${[['full','Tam'],['reduced','Sade'],['off','Kapalı']].map(([k,l])=>`<button data-mo="${k}" role="radio" aria-checked="${MOTION===k}" class="${MOTION===k?'on':''}">${l}</button>`).join('')}</div>
      <small>Sade: arka plan hareketleri durur. Kapalı: hiçbir animasyon oynamaz, galaksi de durur — eski cihazlarda en hızlısı.</small></div></div>`;
  document.body.appendChild(tsEl);anim(tsEl,[{opacity:0},{opacity:1}],{duration:200,easing:EASE});anim(tsEl.firstChild,[{opacity:0,transform:'translateY(16px) scale(.98)'},{opacity:1,transform:'none'}],{duration:420,easing:OUT});
  let cur=saved;
  tsEl.addEventListener('pointerover',e=>{if(!FINE)return;const c=e.target.closest('[data-tk]');if(c&&c.dataset.tk!==document.documentElement.dataset.theme)applyTheme(c.dataset.tk)});
  tsEl.querySelector('.ts').addEventListener('pointerleave',()=>{if(FINE&&document.documentElement.dataset.theme!==cur)applyTheme(cur)});
  tsEl.addEventListener('click',e=>{const c=e.target.closest('[data-tk]');
    if(c){cur=c.dataset.tk;const r=c.getBoundingClientRect();switchTheme(cur,r.left+r.width/2,r.top+r.height/2);tsEl.querySelectorAll('.tp').forEach(x=>{x.classList.toggle('on',x===c);x.setAttribute('aria-pressed',x===c)});toast(`${(MAIN_THEMES.concat(MORE_THEMES).find(x=>x[0]===cur)||[,cur])[1]} teması`);return}
    const m=e.target.closest('[data-mo]');if(m){applyMotion(m.dataset.mo);tsEl.querySelectorAll('[data-mo]').forEach(x=>{x.classList.toggle('on',x===m);x.setAttribute('aria-checked',x===m)});return}
    if(e.target===tsEl||e.target.closest('[data-tsx]'))closeStudio()});
  tsEl.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();closeStudio()}});setTimeout(()=>tsEl.querySelector('.tp.on')?.focus(),60)}
function closeStudio(){if(!tsEl)return;const el=tsEl;tsEl=null;const want=store.get('appshell:theme',null);if(want&&document.documentElement.dataset.theme!==want)applyTheme(want);anim(el,[{opacity:1},{opacity:0}],{duration:160,easing:EASE}).finished.then(()=>el.remove(),()=>el.remove())}

// star field drifts with the camera (parallax), compositor-only
function skyParallax(){if(document.documentElement.dataset.theme!=='evren'||typeof cam==='undefined')return;const a=$('#sky .s1'),b=$('#sky .s2'),x=-cam.x*cam.z,y=-cam.y*cam.z;
  a.style.transform=`translate3d(${(x*.06%400).toFixed(1)}px,${(y*.06%400).toFixed(1)}px,0)`;b.style.transform=`translate3d(${(x*.03%270).toFixed(1)}px,${(y*.03%270).toFixed(1)}px,0)`}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{if(!store.get('appshell:theme',null))applyTheme(e.matches?'dark':'light')});

/* ── Squircle ─────────────────────────────────────────────── */
const SE=(()=>{const n=5,s=32,p=[];for(let i=0;i<96;i++){const t=i/96*Math.PI*2,c=Math.cos(t),si=Math.sin(t);
  p.push((s+s*Math.sign(c)*Math.abs(c)**(2/n)).toFixed(2)+' '+(s+s*Math.sign(si)*Math.abs(si)**(2/n)).toFixed(2))}return'M'+p.join('L')+'Z'})();
const SE_OK=CSS.supports('clip-path',`path('${SE}')`);
if(SE_OK)document.documentElement.style.setProperty('--se',`path('${SE}')`);

  async one(url){const host=(()=>{try{return new URL(url).hostname.replace(/^www\./,'')}catch{return url}})();
    const parse=txt=>{const x=new DOMParser().parseFromString(txt,'text/xml'),nodes=[...x.querySelectorAll('item,entry')];const src=x.querySelector('channel>title,feed>title')?.textContent.trim()||host;
      return nodes.slice(0,12).map(n=>{const g=s=>n.querySelector(s)?.textContent?.trim()||'';const l=n.querySelector('link');const link=l?.getAttribute('href')||l?.textContent?.trim()||'';

    drop.ondrop=e=>{e.preventDefault();e.stopPropagation();drop.classList.remove('over');const f=e.dataTransfer.files[0];f&&take(f)};
    const save=async()=>{const name=N.value.trim();if(!name){N.focus();return toast('Bir ad gir')}
      const src=mode==='code'?s.querySelector('#sTx').value.trim():html;if(!src)return toast('HTML boş');
      if(tooBig(src))return toast('Dosya çok büyük (900 KB üstü)');
      let d;if(edit){Object.assign(a,{name,icon,color,html:src});d=a}else{d=toDraft({id:uid(),name,icon,color,html:src,order:drafts.length});drafts.push(d)}
      closeSheet();syncNodes();
      S.put(rawDraft(d)).then(()=>toast(edit?'Kaydedildi':'Taslak eklendi'),e=>toast('Kaydedilemedi: '+(e.code||e.message)))};
    s.querySelector('#sSave').onclick=save;N.onkeydown=e=>{if(e.key==='Enter')save()};
   });
}

async function removeDraft(a){
  const raw=rawDraft(a),p0=pos[a.key],lks=links.filter(l=>l[0]===a.key||l[1]===a.key);
  drafts=drafts.filter(d=>d.key!==a.key);removeNode(a.key);saveMeta();hintText();statusText();
  S.del(a.id).catch(e=>toast('Silinemedi: '+(e.code||e.message)));
  toast(`${a.name} silindi`,async()=>{const d=toDraft(raw);drafts.push(d);if(p0)pos[d.key]=p0;lks.forEach(l=>{if(!hasLink(l[0],l[1]))links.push(l)});
    syncNodes();saveMeta();await S.put(rawDraft(d)).catch(()=>{})});

/* ── Utilities ────────────────────────────────────────────── */
const nameFrom=f=>{const n=f.replace(/\.html?$/i,'').replace(/[-_]+/g,' ').trim();return n.charAt(0).toLocaleUpperCase('tr')+n.slice(1)};
function download(text,name){const u=URL.createObjectURL(new Blob([text],{type:'text/html'})),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function copy(t,msg){try{await navigator.clipboard.writeText(t)}catch{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}toast(msg)}
function toast(msg,undo){
  const t=document.createElement('div');t.className='toast'+(undo?' has-undo':'');t.setAttribute('role','status');t.innerHTML=`<i></i><span>${esc(msg)}</span>${undo?'<button>Geri al</button>':''}`;$('#toasts').prepend(t);
  anim(t,[{opacity:0,transform:'translateY(10px) scale(.94)'},{opacity:1,transform:'none'}],{duration:420,easing:OUT});
  const kill=()=>anim(t,[{opacity:1},{opacity:0,transform:'translateY(4px) scale(.97)'}],{duration:220,easing:EASE,fill:'forwards'}).finished.then(()=>t.remove(),()=>t.remove());
  const timer=setTimeout(kill,undo?5500:2300);
  if(undo)t.querySelector('button').onclick=()=>{clearTimeout(timer);undo();kill()};
}

/* ── Page drop → drafts at drop point ─────────────────────── */
let dragDepth=0;
const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes('Files');
addEventListener('dragenter',e=>{if(!hasFiles(e)||sheetEl)return;dragDepth++;$('#pdrop').classList.add('on')});
addEventListener('dragleave',e=>{if(!hasFiles(e)||sheetEl)return;if(--dragDepth<=0){dragDepth=0;$('#pdrop').classList.remove('on')}});
addEventListener('dragover',e=>{if(hasFiles(e)){e.preventDefault();ptr.x=e.clientX;ptr.y=e.clientY;ptr.tAmp=1;wakeMesh()}});
addEventListener('drop',async e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth=0;$('#pdrop').classList.remove('on');if(sheetEl)return;
  const files=[...e.dataTransfer.files].filter(f=>/\.html?$/i.test(f.name));if(!files.length)return toast('Sadece .html dosyaları');
  const added=[];let big=0;
  for(const f of files){const html=await f.text();if(tooBig(html)){big++;continue}const d=toDraft({id:uid(),name:nameFrom(f.name),icon:'',html,order:drafts.length});
    d.color=colorKeys[hash(d.name)%colorKeys.length];drafts.push(d);added.push(d)}
  added.forEach((d,i)=>{spawnHint=[s2wx(e.clientX+i*40),s2wy(e.clientY+LIFT*cam.z)];createNode(d,i*120)});spawnHint=null;
  for(const d of added){const n=nodes.get(d.key);if(n)rememberLayout(n,false)}saveMeta();
  hintText();statusText();wake();
  await Promise.all(added.map(d=>S.put(rawDraft(d)))).catch(e=>toast('Kaydedilemedi: '+(e.code||e.message)));
  if(added.length)toast(added.length>1?`${added.length} taslak eklendi`:'Taslak eklendi');if(big)toast(`${big} dosya 900 KB'tan büyük, eklenmedi`)});

/* ── Keyboard ─────────────────────────────────────────────── */
$('#addBtn').onclick=e=>{e.stopPropagation();const b=$('#addBtn').getBoundingClientRect();
  popMenu(b.right-210,b.bottom+8,`<button class="mi" data-a="draft">${si(UI.plus)}Yeni taslak<span class="k">⌘N</span></button><button class="mi" data-a="widget">${si(UI.widget)}Widget ekle<span class="k">W</span></button>`,

$('#themeBtn').onclick=e=>{e.stopPropagation();themeMenu()};
addEventListener('keydown',e=>{
  if(document.body.classList.contains('locked'))return;if(osKeys(e))return;const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
  if(mod&&k==='k'){e.preventDefault();palEl?closePal():palette();return}
  if(mod&&k==='n'&&!e.shiftKey){e.preventDefault();openSheet();return}
  if(mod&&e.shiftKey&&k==='l'){e.preventDefault();toggleTheme();return}
  if(e.key==='Escape'){if(palEl)closePal();else if(linkDrag)cancelLink();else if(menuEl)hideMenu();else if(sheetEl)closeSheet();else if(W.app&&!W.min)goHome();return}
  if(typing(e)||mod||e.altKey||sheetEl||palEl)return;
  if(e.key==='?'){e.preventDefault();shortcuts()}
  else if(k==='/'){e.preventDefault();palette()}
  else if(k==='g'&&!(W.app&&!W.min)){fitAll()}
  else if(k==='k'&&!(W.app&&!W.min)){smartSheet()}
  else if(k==='f'){toggleFS()}
  else if(W.app&&!W.min){}
  else if(e.key==='+'||e.key==='='){zoomTo(cam.tz*1.25)}
  else if(e.key==='-'||e.key==='_'){zoomTo(cam.tz/1.25)}
  else if(e.key==='0'){zoomTo(1)}
  else if(e.key==='1'){fitAll()}
  else if(k==='w'){widgetGallery()}
  else if(e.key.startsWith('Arrow')){e.preventDefault();const d=e.shiftKey?320:110;cam.go=null;cam.vx=e.key==='ArrowLeft'?d/9:e.key==='ArrowRight'?-d/9:0;cam.vy=e.key==='ArrowUp'?d/9:e.key==='ArrowDown'?-d/9:0;wake()}
});

/* ── Gate ─────────────────────────────────────────────────── */
function gate(state,msg){const g=$('#gate'),was=g.hidden;document.body.classList.add('locked');g.hidden=false;
  $('#gSpin').hidden=state!=='loading';$('#gBtn').hidden=state!=='signin'&&state!=='error';$('#gBtn').disabled=false;$('#gOut').hidden=state!=='denied';
  $('#gMsg').innerHTML=msg??(state==='loading'?'Bağlanıyor…':'Devam etmek için giriş yap.');
  if(was)anim(g.firstElementChild,[{opacity:0,transform:'translateY(12px) scale(.97)'},{opacity:1,transform:'none'}],{duration:620,easing:OUT})}
async function ungate(){const g=$('#gate');if(g.hidden){document.body.classList.remove('locked');return}
  await anim(g.firstElementChild,[{opacity:1},{opacity:0,transform:'scale(.97)'}],{duration:240,easing:EASE,fill:'forwards'}).finished.catch(()=>{});
  g.hidden=true;g.firstElementChild.getAnimations().forEach(a=>a.cancel());document.body.classList.remove('locked')}
const authMsg=e=>({'auth/unauthorized-domain':'Bu adres Firebase\'de izinli değil. <b>Authentication → Settings → Authorized domains</b> listesine ekle.',
  'auth/network-request-failed':'Bağlantı hatası. İnternetini kontrol et.','auth/too-many-requests':'Çok fazla deneme. Biraz sonra tekrar dene.'}[e.code]||('Giriş başarısız: '+(e.code||e.message)));
$('#gBtn').onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});$('#gBtn').disabled=true;
  try{await firebase.auth().signInWithPopup(p)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code))return firebase.auth().signInWithRedirect(p);
    if(e.code==='auth/popup-closed-by-user'){$('#gBtn').disabled=false;return}gate('error',authMsg(e))}};
$('#gOut').onclick=()=>firebase.auth().signOut();
$('#me').onclick=e=>{e.stopPropagation();const u=firebase.auth().currentUser;if(!u)return;const b=$('#me').getBoundingClientRect();

async function migrateLocal(){
