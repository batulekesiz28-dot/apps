<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>AppShell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFFFFF;--ink:#18181B;--ink2:#52525B;--ink3:#A1A1AA;--ink4:#D4D4D8;
  --line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.09);--line3:rgba(0,0,0,.14);
  --glass:rgba(255,255,255,.72);
  --font:'Geist',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.3,1.45,.5,1);
  --se:none;
}
html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.45;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:rgba(24,24,27,.1)}
[hidden]{display:none!important}

/* ── Field ─────────────────────────────────────── */
#field{position:fixed;inset:0;z-index:0;pointer-events:none}
#stage{position:fixed;inset:0;z-index:1}
#nodes{position:fixed;inset:0;z-index:2;pointer-events:none}

/* ── Floating chrome ───────────────────────────── */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;padding:18px 24px;pointer-events:none}
.top>*{pointer-events:auto}
.mark{display:flex;align-items:center;gap:10px;margin-right:auto;user-select:none}
.mark-glyph{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px}
.mark-glyph i{border-radius:2px;background:var(--ink)}
.mark-glyph i:nth-child(2),.mark-glyph i:nth-child(3){opacity:.45}
.mark-glyph i:nth-child(4){opacity:.18}
.mark-name{font-weight:600;letter-spacing:-.02em;font-size:13.5px}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;width:210px;border-radius:11px;background:var(--glass);box-shadow:0 0 0 .5px var(--line2),0 6px 20px -12px rgba(0,0,0,.12);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);transition:width .5s var(--out),box-shadow .3s}
.search:focus-within{width:270px;box-shadow:0 0 0 .5px var(--line3),0 0 0 4px rgba(0,0,0,.03),0 10px 30px -12px rgba(0,0,0,.16)}
.search svg{flex-shrink:0;color:var(--ink3)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:13px;color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
.kbd{font:500 10px/1 var(--mono);color:var(--ink3);padding:3px 5px;border-radius:4px;box-shadow:inset 0 0 0 .5px var(--line3)}
.ib{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--ink2);background:var(--glass);box-shadow:0 0 0 .5px var(--line2),0 6px 20px -12px rgba(0,0,0,.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:transform .45s var(--spring),box-shadow .2s,color .2s}
.ib:hover{color:var(--ink);box-shadow:0 0 0 .5px var(--line3),0 8px 24px -12px rgba(0,0,0,.18)}
.ib:active{transform:scale(.9);transition-duration:.08s}
.ib.solid{background:var(--ink);color:#fff;box-shadow:0 8px 20px -8px rgba(0,0,0,.35)}
.ib.solid:hover{background:#27272A}
.ib.solid svg{transition:transform .5s var(--spring)}
.ib.solid:hover svg{transform:rotate(90deg)}
.me{overflow:hidden;font-size:12px;font-weight:600}
.me img{width:100%;height:100%;object-fit:cover}

.status{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 24px 16px;font:500 10.5px/1 var(--mono);color:var(--ink3);letter-spacing:.04em;pointer-events:none;user-select:none}
.status .dot{width:5px;height:5px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.12)}
.status .dot.warn{background:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.12)}
.status .dot.err{background:#EF4444;box-shadow:0 0 0 3px rgba(239,68,68,.12)}
.status .sp{margin-left:auto}
.hint{position:fixed;left:50%;top:50%;z-index:3;transform:translate(-50%,-50%);text-align:center;color:var(--ink3);font-size:13px;line-height:1.6;pointer-events:none;user-select:none}
.hint b{display:block;font-weight:500;color:var(--ink2);font-size:14px;margin-bottom:4px}
.hint code{font:11.5px var(--mono);color:var(--ink2)}

/* ── App node (floating buoy) ──────────────────── */
.node{position:absolute;left:0;top:0;width:64px;height:64px;pointer-events:auto;outline:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;will-change:transform;transition:opacity .45s var(--ease),filter .45s var(--ease)}
.node.dragging{z-index:10;cursor:grabbing}
.node.dim{opacity:.12;filter:blur(1px);pointer-events:none}
.bob{position:absolute;inset:0;transition:transform .55s var(--spring)}
.node:hover .bob,.node:focus-visible .bob{transform:scale(1.08)}
.node.dragging .bob{transform:scale(1.14)}
.node:active:not(.dragging) .bob{transform:scale(.94);transition-duration:.12s}
.shadow{position:absolute;left:10px;right:10px;bottom:-8px;height:14px;border-radius:50%;background:rgba(0,0,0,.24);filter:blur(10px);opacity:.25;transition:opacity .45s var(--ease),transform .55s var(--spring);z-index:-1}
.node:hover .shadow{opacity:.38;transform:translateY(6px) scale(1.06)}
.node.dragging .shadow{opacity:.45;transform:translateY(18px) scale(1.2)}
.tile{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg-t,#F4F4F5);color:var(--fg-t,#3F3F46);clip-path:var(--se);border-radius:16px;transform:perspective(420px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s var(--out)}
.node.tilting .tile{transition:transform .12s linear}
.tile::before{content:'';position:absolute;inset:0;background:radial-gradient(90px circle at var(--hx,50%) var(--hy,0%),rgba(255,255,255,.6),transparent 60%);opacity:0;transition:opacity .35s var(--ease);pointer-events:none}
.node:hover .tile::before{opacity:1}
.tile::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 48%);pointer-events:none}
.tile.dark::before{background:radial-gradient(90px circle at var(--hx,50%) var(--hy,0%),rgba(255,255,255,.18),transparent 60%)}
.tile.dark::after{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0) 48%)}
.glyph{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
.mono{position:relative;z-index:1;font-size:20px;font-weight:300;letter-spacing:-.04em}
.rim{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:rgba(0,0,0,.1);stroke-width:1;pointer-events:none;z-index:2}
.tile.dark .rim{stroke:rgba(255,255,255,.12)}
.node.draft .rim{stroke:rgba(0,0,0,.22);stroke-dasharray:3 3}
.port{position:absolute;right:-9px;top:23px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 2px 6px -2px rgba(0,0,0,.2);display:grid;place-items:center;opacity:0;transform:scale(.3);transition:opacity .25s var(--ease),transform .45s var(--spring);cursor:crosshair;z-index:3;pointer-events:auto}
.port::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--ink);transition:transform .35s var(--spring)}
.node:hover .port{opacity:1;transform:none}
.port:hover::after{transform:scale(1.5)}
body.linking .port,.node.dragging .port{opacity:0!important;pointer-events:none}
.node.faded{opacity:.28}
.node.target .bob{transform:scale(1.16)}
.node.target .tile{box-shadow:inset 0 0 0 1.5px var(--ink)}
body.linking,body.linking .node,body.linking #stage{cursor:crosshair}
#stage.onlink{cursor:pointer}
.nlabel{position:absolute;left:50%;top:74px;transform:translateX(-50%);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;font-weight:450;letter-spacing:-.005em;color:var(--ink2);padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:color .2s,opacity .3s}
.node:hover .nlabel{color:var(--ink)}
.nlabel i{font-style:normal;font:500 9px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-left:5px}

/* ── Dock (minimized) ──────────────────────────── */
.dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 8px;border-radius:13px;background:var(--glass);box-shadow:0 0 0 .5px var(--line2),0 12px 32px -12px rgba(0,0,0,.18);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5)}
.dock .t{font-size:12px;font-weight:500;padding-right:4px}
.mini{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex-shrink:0}
.mini svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dock button{height:26px;padding:0 9px;border-radius:8px;font-size:11.5px;color:var(--ink2)}
.dock button:hover{background:rgba(0,0,0,.05);color:var(--ink)}

/* ── Window ────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(255,255,255,.45);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}
.win{position:fixed;z-index:50;display:flex;flex-direction:column;background:#fff;border-radius:18px;overflow:hidden;transform-origin:0 0;
  box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 2px 4px rgba(0,0,0,.02),0 24px 48px -12px rgba(0,0,0,.12),0 60px 120px -20px rgba(0,0,0,.16)}
.win.max{border-radius:0}
.wbar{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:42px;padding:0 10px 0 14px;border-bottom:.5px solid var(--line2);background:rgba(252,252,252,.92);flex-shrink:0;cursor:grab;user-select:none;touch-action:none}
.wbar:active{cursor:grabbing}
.lights{display:flex;gap:7px}
.lights button{width:11px;height:11px;border-radius:50%;background:#E4E4E7;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1);transition:background .2s,transform .3s var(--spring)}
.lights:hover button[data-w=close]{background:#FF5F57}
.lights:hover button[data-w=min]{background:#FEBC2E}
.lights:hover button[data-w=max]{background:#28C840}
.lights button:active{transform:scale(.85)}
.wtitle{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:550;color:var(--ink2);white-space:nowrap;overflow:hidden;max-width:46vw}
.wtitle .src{font:500 10px/1 var(--mono);color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.wtools{display:flex;justify-content:flex-end;gap:2px}
.wtools button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink3);transition:background .15s,color .15s,transform .3s var(--spring)}
.wtools button:hover{background:rgba(0,0,0,.045);color:var(--ink)}
.wtools button:active{transform:scale(.9)}
.wtools svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.prog{position:absolute;left:0;right:0;bottom:-.5px;height:1px;background:var(--ink);transform-origin:left;transform:scaleX(0);opacity:0}
.frame{flex:1;width:100%;border:0;background:#fff;display:block}
.win.dragging .frame{pointer-events:none}

/* ── Menu ──────────────────────────────────────── */
.menu{position:fixed;z-index:200;min-width:188px;padding:5px;border-radius:12px;background:rgba(255,255,255,.82);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 12px 32px -8px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.04);transform-origin:var(--ox,0) var(--oy,0)}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:30px;padding:0 10px;border-radius:7px;font-size:12.5px;text-align:left;color:var(--ink);transition:background .1s}
.mi:hover{background:rgba(0,0,0,.05)}
.mi svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;color:var(--ink3);flex-shrink:0}
.mi .k{margin-left:auto;font:10px var(--mono);color:var(--ink3)}
.mi.danger,.mi.danger svg{color:#DC2626}
.mi.danger:hover{background:rgba(220,38,38,.07)}
.mi.confirm{background:#DC2626;color:#fff}.mi.confirm svg{color:#fff}
.msep{height:.5px;background:var(--line2);margin:4px 6px}
.who{padding:8px 10px 7px;font-size:11.5px;color:var(--ink3);line-height:1.4}
.who b{display:block;font-weight:500;color:var(--ink);font-size:12.5px}

/* ── Sheet ─────────────────────────────────────── */
.sheet-scrim{position:fixed;inset:0;z-index:100;background:rgba(255,255,255,.4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center;padding:20px}
.sheet{width:min(520px,100%);max-height:88vh;display:flex;flex-direction:column;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 30px 80px -20px rgba(0,0,0,.2)}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 14px 22px;border-bottom:.5px solid var(--line2)}
.sh-t{font-size:14px;font-weight:600;letter-spacing:-.015em}
.sh-b{padding:18px 22px 20px;overflow-y:auto;scrollbar-width:none}
.sh-b::-webkit-scrollbar{display:none}
.sh-f{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:.5px solid var(--line2)}
.sh-f .grow{flex:1;font-size:11.5px;color:var(--ink3)}
.x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}
.x:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.x svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.f{margin-bottom:18px}.f:last-child{margin-bottom:0}
.fl{display:block;font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:8px}
.in{width:100%;height:36px;padding:0 12px;border-radius:9px;border:.5px solid var(--line3);background:#fff;font:inherit;font-size:13.5px;color:var(--ink);outline:0;transition:border-color .2s,box-shadow .3s}
.in:focus{border-color:rgba(0,0,0,.28);box-shadow:0 0 0 4px rgba(0,0,0,.03)}
textarea.in{height:200px;padding:10px 12px;resize:vertical;font:11.5px/1.6 var(--mono);color:var(--ink2)}
.pick{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.pick button{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;color:var(--ink2);border:.5px solid transparent;transition:background .15s,border-color .15s,transform .3s var(--spring)}
.pick button:hover{background:rgba(0,0,0,.04)}
.pick button.on{border-color:var(--ink);background:#fff}
.pick button:active{transform:scale(.9)}
.pick svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.pick .mono-o{font-size:12px;font-weight:500}
.sw{display:flex;gap:8px}
.sw button{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14);transition:transform .35s var(--spring),box-shadow .2s}
.sw button:hover{transform:scale(1.12)}
.sw button.on{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14),0 0 0 2px #fff,0 0 0 2.5px var(--ink)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:9px;background:rgba(0,0,0,.04);margin-bottom:12px}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:7px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.05);transition:transform .45s var(--out)}
.seg.r i{transform:translateX(100%)}
.seg button{position:relative;height:28px;font-size:12.5px;font-weight:500;color:var(--ink3);transition:color .2s}
.seg button.on{color:var(--ink)}
.drop{display:grid;place-items:center;gap:6px;padding:30px 20px;border-radius:12px;border:.5px dashed var(--line3);text-align:center;cursor:pointer;transition:background .2s,border-color .2s}
.drop:hover,.drop.over{background:rgba(0,0,0,.018);border-color:rgba(0,0,0,.3)}
.drop svg{width:22px;height:22px;fill:none;stroke:var(--ink3);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.drop b{font-weight:500;font-size:12.5px;color:var(--ink2)}
.drop span{font-size:11.5px;color:var(--ink3)}
.drop.ok b{color:#15803D}
.btn{height:32px;padding:0 14px;border-radius:9px;font-size:12.5px;font-weight:500;transition:background .15s,transform .3s var(--spring)}
.btn:active{transform:scale(.96)}
.btn.ghost{color:var(--ink2)}.btn.ghost:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.btn.solid{background:var(--ink);color:#fff}.btn.solid:hover{background:#27272A}
.btn.line{border:.5px solid var(--line3)}.btn.line:hover{background:rgba(0,0,0,.03)}
.steps{display:grid;gap:10px;font-size:12.5px;color:var(--ink2);line-height:1.55;counter-reset:s}
.steps li{list-style:none;display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px}
.steps li::before{counter-increment:s;content:counter(s);font:500 10px/18px var(--mono);text-align:center;width:18px;height:18px;border-radius:50%;border:.5px solid var(--line3);color:var(--ink3)}
.steps code,.codebox{font:11.5px/1.6 var(--mono)}
.codebox{display:block;padding:12px 14px;border-radius:10px;background:#FAFAFA;border:.5px solid var(--line2);color:var(--ink2);white-space:pre-wrap;word-break:break-word;margin-top:6px}
.note{margin-top:16px;padding:12px 14px;border-radius:10px;background:rgba(0,0,0,.025);font-size:12px;color:var(--ink2);line-height:1.55}

/* ── Page drop / toast / gate ──────────────────── */
.pdrop{position:fixed;inset:14px;z-index:300;border-radius:22px;border:1px dashed rgba(0,0,0,.22);background:rgba(255,255,255,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;pointer-events:none;opacity:0;transform:scale(.985);transition:opacity .25s var(--ease),transform .5s var(--out)}
.pdrop.on{opacity:1;transform:none}
.pdrop div{display:grid;justify-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--ink2)}
.pdrop svg{width:28px;height:28px;fill:none;stroke:var(--ink3);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.pdrop span{font:500 10.5px var(--mono);color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:400;display:grid;gap:6px;justify-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 12px;border-radius:11px;background:rgba(24,24,27,.92);color:#fff;font-size:12.5px;font-weight:500;backdrop-filter:blur(20px);box-shadow:0 10px 30px -8px rgba(0,0,0,.3)}
.toast i{width:5px;height:5px;border-radius:50%;background:#4ADE80}
body.locked .top,body.locked #nodes,body.locked .status,body.locked .hint,body.locked .dock{visibility:hidden}
.gate{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:24px;pointer-events:none}
.gate-card{pointer-events:auto;width:min(340px,100%);display:grid;justify-items:center;text-align:center;gap:14px;padding:34px 28px 26px;border-radius:22px;background:rgba(255,255,255,.72);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 0 0 .5px rgba(0,0,0,.09),0 30px 80px -24px rgba(0,0,0,.18)}
.gate .mark-glyph{width:34px;height:34px;gap:3px;padding:4px}
.gate .mark-glyph i{border-radius:3px}
.gate h1{font-size:17px;font-weight:600;letter-spacing:-.02em}
.gate p{font-size:12.5px;color:var(--ink2);line-height:1.55;min-height:19px}
.gate p b{font-weight:500;color:var(--ink)}

<script>
'use strict';
/* ════════════════════════════════════════════════════════════
   AppShell v3 — manyetik ağ + yüzen uygulamalar
   Yayındaki uygulamalar: apps.json + apps/<slug>/index.html
   Taslaklar ve yerleşim: Firestore hub/meta (yalnızca sahibi)
   ════════════════════════════════════════════════════════════ */
const $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const FINE=matchMedia('(pointer:fine)').matches;
const EASE='cubic-bezier(.2,.8,.2,1)',OUT='cubic-bezier(.16,1,.3,1)',SPRING='cubic-bezier(.3,1.35,.5,1)';

const SE_OK=CSS.supports('clip-path',`path('${SE}')`);
if(SE_OK)document.documentElement.style.setProperty('--se',`path('${SE}')`);

  map:'<path d="M9 4.5l-5.5 2v13l5.5-2 6 2 5.5-2v-13l-5.5 2zM9 4.5v13M15 6.5v13"/>',
  spark:'<path d="M12 3.5v4M12 16.5v4M3.5 12h4M16.5 12h4M6 6l2.6 2.6M15.4 15.4L18 18M18 6l-2.6 2.6M8.6 15.4L6 18"/>',
};
const COLORS={ink:['#18181B','#FAFAFA'],gray:['#F4F4F5','#3F3F46'],blue:['#EAF1FF','#2453C4'],green:['#E8F6EE','#1D7447'],
  amber:['#FDF4E3','#9A5A08'],rose:['#FDEEF1','#B1264C'],violet:['#F2EEFF','#5A3DC2'],teal:['#E4F5F3','#116C66']};
const colorKeys=Object.keys(COLORS);
const mono=n=>{const w=(n||'?').trim().split(/\s+/);return((w[0]?.[0]||'?')+(w[1]?.[0]||'')).toLocaleUpperCase('tr')};
const slugify=s=>(s||'app').toLocaleLowerCase('tr').replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c')

/* ── Storage: IndexedDB (local) / Firestore (cloud) ───────── */
const DB=(()=>{let db;const ST='drafts';
  const open=()=>new Promise((ok,no)=>{const r=indexedDB.open('appshell',2);
    r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(ST))d.createObjectStore(ST,{keyPath:'id'})};
    r.onsuccess=e=>{db=e.target.result;ok()};r.onerror=()=>no(r.error)});
  const req=(m,f)=>new Promise((ok,no)=>{const r=f(db.transaction(ST,m).objectStore(ST));r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
  return{open,all:()=>req('readonly',s=>s.getAll()),put:v=>req('readwrite',s=>s.put(v)),del:id=>req('readwrite',s=>s.delete(id))}})();
const FB={apiKey:'AIzaSyDpJc9g4XDBq32T9Pf1UKbuhzRmnx__mak',authDomain:'apps-f1cfd.firebaseapp.com',projectId:'apps-f1cfd'};
const OWNER='batulekesiz28@gmail.com';
const CLOUD=/^https?:$/.test(location.protocol)&&!new URLSearchParams(location.search).has('local');
const MAX_BYTES=900000;
let sync='ok';
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function loadFirebase(){if(window.firebase?.auth&&window.firebase?.firestore)return;const b='https://www.gstatic.com/firebasejs/10.12.2/';
  await loadScript(b+'firebase-app-compat.js');await Promise.all([loadScript(b+'firebase-auth-compat.js'),loadScript(b+'firebase-firestore-compat.js')])}
const sig=list=>list.map(d=>[d.id,d.name,d.icon,d.color,d.html?.length]).join('|');
const Local={kind:'local',
  async load(){try{await DB.open();return(await DB.all()).map(toDraft)}catch{return[]}},
  put:d=>DB.put(d),del:id=>DB.del(id),saveLayout:l=>{store.set('appshell:layout',l);store.set('appshell:links',links)}};
const Cloud={kind:'cloud',meta:null,col:null,unsubs:[],
  start(fs){this.meta=fs.collection('hub').doc('meta');this.col=this.meta.collection('drafts');
    return new Promise(res=>{let first=true;
      this.unsubs.push(this.col.onSnapshot({includeMetadataChanges:true},snap=>{
        const list=snap.docs.map(d=>toDraft(d.data()));setSync(snap.metadata.hasPendingWrites?'pending':'ok');
        if(sig(list)!==sig(drafts)){drafts=list;if(!first&&booted)syncNodes()}
        if(first){first=false;res()}
      },err=>{setSync('error');toast('Senkron hatası: '+(err.code||err.message));if(first){first=false;res()}}));
      this.unsubs.push(this.meta.onSnapshot(s=>{const d=s.data()||{};if(d.layout)applyRemoteLayout(d.layout);if(Array.isArray(d.links))applyRemoteLinks(d.links)},()=>{}));
    })},
  stop(){this.unsubs.forEach(u=>{try{u()}catch{}});this.unsubs=[]},
  put(d){return this.col.doc(d.id).set(d)},del(id){return this.col.doc(id).delete()},
  saveLayout(l){store.set('appshell:layout',l);store.set('appshell:links',links);return this.meta.set({layout:l,links:links.map(([a,b])=>a+'|'+b)},{merge:true})}};
let S=Local;
function setSync(s){sync=s;const d=$('#sDot');d.classList.toggle('warn',s==='pending');d.classList.toggle('err',s==='error');statusText()}

/* ── App state ────────────────────────────────────────────── */
let pub=[],drafts=[],query='',manifest={ok:false,why:''},booted=false,justDragged=false;
let layout=store.get('appshell:layout',{});
let links=store.get('appshell:links',[]);           // [[keyA,keyB], …] (sorted pair)
let linkDrag=null,hoverLink=-1,hoverNode=null;
const pairKey=(a,b)=>a<b?[a,b]:[b,a];
const hasLink=(a,b)=>{const[x,y]=pairKey(a,b);return links.some(l=>l[0]===x&&l[1]===y)};
const degree=k=>links.reduce((n,l)=>n+(l[0]===k||l[1]===k?1:0),0);
const neighbors=k=>new Set(links.filter(l=>l[0]===k||l[1]===k).map(l=>l[0]===k?l[1]:l[0]));
const saveMeta=()=>Promise.resolve(S.saveLayout({...layout})).catch(()=>{});
function applyRemoteLinks(arr){const next=arr.map(s=>String(s).split('|')).filter(p=>p.length===2);
  if(JSON.stringify(next)===JSON.stringify(links))return;links=next;store.set('appshell:links',links);statusText();wake()}
const toPub=a=>({key:'p:'+a.slug,kind:'pub',slug:a.slug,name:a.name||a.slug,icon:a.icon||'',color:a.color||'gray',desc:a.desc||'',url:a.url||a.file||`apps/${a.slug}/`});
const toDraft=d=>({key:'d:'+d.id,kind:'draft',id:d.id,name:d.name,icon:d.icon||'',color:d.color||colorKeys[hash(d.id)%colorKeys.length],html:d.html,order:d.order??0});
const rawDraft=d=>({id:d.id,name:d.name,icon:d.icon||'',color:d.color,html:d.html,order:d.order??0,ts:Date.now()});
const find=k=>pub.find(a=>a.key===k)||drafts.find(a=>a.key===k);
const tooBig=html=>S.kind==='cloud'&&new Blob([html]).size>MAX_BYTES;

async function loadManifest(){
  if(location.protocol==='file:'){manifest={ok:false,why:'file'};return}
  try{const r=await fetch('apps.json',{cache:'no-cache'});if(!r.ok)throw new Error(r.status);const j=await r.json();
    if(j.title){$('#brand').textContent=j.title;document.title=j.title}
    pub=(j.apps||[]).filter(a=>a&&a.slug).map(toPub);manifest={ok:true,why:''};
  }catch{manifest={ok:false,why:'missing'};pub=[]}
}

/* ════════════════════════════════════════════════════════════
   FIELD — elastik nokta ağı (spring mesh)
   ════════════════════════════════════════════════════════════ */
const cv=$('#field'),cx=cv.getContext('2d');
const M={W:0,H:0,dpr:1,gap:30,cols:0,rows:0,ox:0,oy:0,n:0,rx:null,ry:null,dx:null,dy:null,vx:null,vy:null,en:null,tx:null,ty:null};
const ptr={x:-1e4,y:-1e4,sx:-1e4,sy:-1e4,amp:0,tAmp:0,down:false};
let ripples=[],introT=0,introStart=0,last=0,raf=0,paused=false;
function buildMesh(){
  M.dpr=Math.min(devicePixelRatio||1,2);M.W=innerWidth;M.H=innerHeight;
  cv.width=M.W*M.dpr|0;cv.height=M.H*M.dpr|0;cv.style.width=M.W+'px';cv.style.height=M.H+'px';cx.setTransform(M.dpr,0,0,M.dpr,0,0);
  M.gap=M.W<700?26:30;M.cols=Math.floor(M.W/M.gap)+2;M.rows=Math.floor(M.H/M.gap)+2;
  M.ox=(M.W-(M.cols-1)*M.gap)/2;M.oy=(M.H-(M.rows-1)*M.gap)/2;M.n=M.cols*M.rows;
  for(const k of['rx','ry','dx','dy','vx','vy','en','tx','ty'])M[k]=new Float32Array(M.n);
  for(let r=0;r<M.rows;r++)for(let c=0;c<M.cols;c++){const i=r*M.cols+c;M.rx[i]=M.ox+c*M.gap;M.ry[i]=M.oy+r*M.gap}
}
const nx=i=>M.rx[i]+M.dx[i],ny=i=>M.ry[i]+M.dy[i];
function nearest(x,y){const c=clamp(Math.round((x-M.ox)/M.gap),0,M.cols-1),r=clamp(Math.round((y-M.oy)/M.gap),0,M.rows-1);return r*M.cols+c}
function ripple(x,y,s=1){if(REDUCED)return;ripples.push({x,y,t:performance.now(),s});if(ripples.length>6)ripples.shift();wake()}

function stepMesh(k,now){
  const{n,rx,ry,dx,dy,vx,vy,en,tx,ty}=M,K=.055,damp=Math.pow(.8,k);
  const att=[];
  if(ptr.amp>.002)att.push([ptr.sx,ptr.sy,175,.03*ptr.amp]);
  for(const nd of nodes.values())if(nd.drag)att.push([nd.x,nd.y,150,.035]);
  const rps=[];ripples=ripples.filter(r=>{const age=now-r.t;if(age>1500)return false;rps.push([r.x,r.y,age*.55,(1-age/1500)*r.s]);return true});
  for(let i=0;i<n;i++){
    const px=rx[i]+dx[i],py=ry[i]+dy[i];let ax=-K*dx[i]+tx[i],ay=-K*dy[i]+ty[i];
    for(let a=0;a<att.length;a++){const A=att[a],ddx=A[0]-px,ddy=A[1]-py;if(ddx>A[2]||ddx<-A[2]||ddy>A[2]||ddy<-A[2])continue;
      const d2=ddx*ddx+ddy*ddy,R2=A[2]*A[2];if(d2>R2)continue;const f=1-Math.sqrt(d2)/A[2];const s=f*f*A[3];ax+=ddx*s;ay+=ddy*s}
    for(let q=0;q<rps.length;q++){const Q=rps[q],ex=rx[i]-Q[0],ey=ry[i]-Q[1],dd=Math.sqrt(ex*ex+ey*ey)||1,w=Math.abs(dd-Q[2]);
      if(w<34){const imp=(1-w/34)*Q[3]*.9;ax+=ex/dd*imp;ay+=ey/dd*imp}}
    let v=(vx[i]+ax*k)*damp,u=(vy[i]+ay*k)*damp;vx[i]=v;vy[i]=u;dx[i]+=v*k;dy[i]+=u*k;
    const m=Math.abs(dx[i])+Math.abs(dy[i]);en[i]=m>14?1:m/14;
  }
  tx.fill(0);ty.fill(0);
}
function drawMesh(now){
  const{W,H,cols,rows,n,en}=M;cx.clearRect(0,0,W,H);
  let reveal=1;if(introT<1){introT=clamp((now-introStart)/1500,0,1);reveal=1-Math.pow(1-introT,3)}
  const cxm=W/2,cym=H/2,maxR=Math.hypot(W,H)*.6*reveal;
  const vis=i=>{if(reveal>=1)return 1;const d=Math.hypot(M.rx[i]-cxm,M.ry[i]-cym);return clamp((maxR-d)/140,0,1)};
  // lines (3 alpha buckets)
  const L=[new Path2D(),new Path2D(),new Path2D()];

let spawnHint=null;
function createNode(a,delay=0){

function updateNode(n,a){const changed=n.a.name!==a.name||n.a.icon!==a.icon||n.a.color!==a.color;n.a=a;if(changed){n.el.innerHTML=nodeHTML(a);n.el.setAttribute('aria-label',a.name);

function syncNodes(){
  const list=[...pub,...drafts],keys=new Set(list.map(a=>a.key));

/* Interactions on nodes */
function wireNode(n){

      n.gx=ev.clientX-ox;n.gy=ev.clientY-oy;wake()};
    const up=()=>{clearTimeout(timer);removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);

      const i=nearestFree(n.x,n.y+LIFT,n);n.ai=i;rememberLayout(n);ripple(nx(i),ny(i),1.6);

  });

  el.addEventListener('contextmenu',e=>{e.preventDefault();showMenu(e.clientX,e.clientY,n.a)});
}

/* ════════════════════════════════════════════════════════════
   LOOP
   ════════════════════════════════════════════════════════════ */
function frame(t){
  raf=0;const dt=Math.min(40,t-(last||t));last=t;const k=dt/16.667,time=t/1000;
  // nodes
  const list=[...nodes.values()];
  for(const n of list){
    const ax0=nx(n.ai),ay0=ny(n.ai);n.hover+=((n.hov||n.drag?1:0)-n.hover)*(1-Math.pow(.85,k));
    let tx,ty;
    if(n.drag){tx=n.gx;ty=n.gy}
    else{const calm=1-n.hover*.75,sw=REDUCED?0:1;
      tx=ax0+(Math.sin(time*.52+n.ph[0])*8+Math.sin(time*1.21+n.ph[1])*2.8)*calm*sw;
      ty=ay0-LIFT-n.hover*6+(Math.sin(time*.71+n.ph[2])*6.5+Math.sin(time*1.53+n.ph[3])*2.2)*calm*sw;
      if(ptr.amp>.01&&!n.hov){const ddx=ptr.sx-n.x,ddy=ptr.sy-n.y,d=Math.hypot(ddx,ddy);if(d<200){const f=(1-d/200);tx+=ddx*.16*f*f*ptr.amp;ty+=ddy*.16*f*f*ptr.amp}}}
    n.tx=tx;n.ty=ty;
  }
  // link springs: linked buoys lean toward each other; dragging one tugs its neighbours
  for(const[ka,kb]of links){const a=nodes.get(ka),b=nodes.get(kb);if(!a||!b)continue;
    const ddx=b.tx-a.tx,ddy=b.ty-a.ty,d=Math.hypot(ddx,ddy)||1,ux=ddx/d,uy=ddy/d;
    const pa=b.drag?Math.min(90,Math.max(0,d-150)*.22):Math.min(26,Math.max(0,d-130)*.06);
    const pb=a.drag?Math.min(90,Math.max(0,d-150)*.22):Math.min(26,Math.max(0,d-130)*.06);
    if(!a.drag){a.tx+=ux*pa;a.ty+=uy*pa}if(!b.drag){b.tx-=ux*pb;b.ty-=uy*pb}}
  highlight();
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){const a=list[i],b=list[j];const ddx=b.tx-a.tx,ddy=b.ty-a.ty,d=Math.hypot(ddx,ddy)||1;
    if(d<96){const p=(96-d)*.5,ux=ddx/d,uy=ddy/d;if(!a.drag){a.tx-=ux*p;a.ty-=uy*p}if(!b.drag){b.tx+=ux*p;b.ty+=uy*p}}}

    const tr=clamp(n.vx*(n.drag?1.4:.9),-16,16)+swRot;n.rot+=(tr-n.rot)*(1-Math.pow(.8,k));

  }
  ptr.sx+=(ptr.x-ptr.sx)*(1-Math.pow(1-.22,k));ptr.sy+=(ptr.y-ptr.sy)*(1-Math.pow(1-.22,k));ptr.amp+=(ptr.tAmp-ptr.amp)*(1-Math.pow(1-.07,k));
  stepMesh(k,t);drawMesh(t);drawLinks(time);drawTethers(time);drawRubber(time);
  if(!paused)raf=requestAnimationFrame(frame);
}
function drawTethers(time){
  for(const n of nodes.values()){
    const ax0=nx(n.ai),ay0=ny(n.ai),bx=n.x,by=n.y+TAIL,a=n.dim?.04:.16+n.hover*.3;
    const mx=(ax0+bx)/2-n.vx*5,my=(ay0+by)/2+10+Math.abs(n.vx)*1.5;
    cx.beginPath();cx.moveTo(ax0,ay0);cx.quadraticCurveTo(mx,my,bx,by);
    cx.setLineDash(n.a.kind==='draft'?[2.5,3]:[]);cx.lineWidth=n.drag?1.1:.8;cx.strokeStyle=`rgba(24,24,27,${a})`;cx.stroke();cx.setLineDash([]);
    cx.beginPath();cx.arc(ax0,ay0,2.6+n.hover*1.2,0,6.2832);cx.fillStyle='#fff';cx.fill();cx.lineWidth=.9;cx.strokeStyle=`rgba(24,24,27,${n.dim?.08:.35+n.hover*.4})`;cx.stroke();
    if(n.drag){const i=nearestFree(n.x,n.y+LIFT,n),px=nx(i),py=ny(i),pulse=4.5+Math.sin(time*7)*1.5;
      cx.beginPath();cx.arc(px,py,pulse,0,6.2832);cx.strokeStyle='rgba(24,24,27,.45)';cx.lineWidth=.8;cx.stroke();
      cx.beginPath();cx.arc(px,py,pulse+7,0,6.2832);cx.strokeStyle='rgba(24,24,27,.12)';cx.stroke()}
  }
}
/* ════════════════════════════════════════════════════════════
   LINKS — Obsidian tarzı uygulama bağlantıları
   ════════════════════════════════════════════════════════════ */
const linkGeo=[];
function curve(a,b,i){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,bend=Math.min(60,d*.16)*((i%2)?1:-1)*.6;
  return[a.x,a.y,mx-dy/d*bend,my+dx/d*bend+Math.min(24,d*.05),b.x,b.y]}
const qAt=(g,t)=>{const u=1-t;return[u*u*g[0]+2*u*t*g[2]+t*t*g[4],u*u*g[1]+2*u*t*g[3]+t*t*g[5]]};
function drawLinks(time){
  linkGeo.length=0;const hk=hoverNode?.a.key;
  links.forEach(([ka,kb],i)=>{const a=nodes.get(ka),b=nodes.get(kb);if(!a||!b){linkGeo.push(null);return}
    const g=curve(a,b,i);linkGeo.push(g);
    const hot=hk&&(hk===ka||hk===kb),dim=a.dim||b.dim||(hk&&!hot),over=hoverLink===i;
    cx.beginPath();cx.moveTo(g[0],g[1]);cx.quadraticCurveTo(g[2],g[3],g[4],g[5]);
    cx.lineWidth=over?2:hot?1.4:1;cx.strokeStyle=over?'rgba(220,38,38,.6)':`rgba(24,24,27,${dim?.07:hot?.62:.3})`;cx.stroke();
    if(!dim&&!REDUCED){const cnt=hot?3:1;for(let p=0;p<cnt;p++){const t=((time*(hot?.32:.18)+p/cnt+i*.37)%1),[px,py]=qAt(g,t),fade=Math.sin(t*Math.PI);
      cx.beginPath();cx.arc(px,py,hot?1.9:1.5,0,6.2832);cx.fillStyle=`rgba(24,24,27,${(hot?.75:.45)*fade})`;cx.fill()}}
  });
}
function drawRubber(time){
  if(!linkDrag)return;const a=nodes.get(linkDrag.from);if(!a)return;const t=linkDrag.target?nodes.get(linkDrag.target):null;
  const bx=t?t.x:linkDrag.x,by=t?t.y:linkDrag.y,g=curve(a,{x:bx,y:by},0);
  cx.beginPath();cx.moveTo(g[0],g[1]);cx.quadraticCurveTo(g[2],g[3],g[4],g[5]);cx.setLineDash([4,4]);cx.lineDashOffset=-time*30;
  cx.lineWidth=1.2;cx.strokeStyle=t?'rgba(24,24,27,.8)':'rgba(24,24,27,.45)';cx.stroke();cx.setLineDash([]);
  cx.beginPath();cx.arc(bx,by,t?5:3.5,0,6.2832);cx.fillStyle='#fff';cx.fill();cx.lineWidth=1.2;cx.strokeStyle='rgba(24,24,27,.8)';cx.stroke();
}
let hlState='';
function highlight(){
  const hk=linkDrag?null:hoverNode?.a.key,nb=hk&&degree(hk)?neighbors(hk):null,sig=hk&&nb?hk+[...nb].join():'';
  if(sig===hlState)return;hlState=sig;
  for(const n of nodes.values())n.el.classList.toggle('faded',!!nb&&n.a.key!==hk&&!nb.has(n.a.key));
}
function nodeAt(x,y,skip){let best=null,bd=56;for(const n of nodes.values()){if(n.a.key===skip||n.dim)continue;const d=Math.hypot(n.x-x,n.y-y);if(d<bd){bd=d;best=n}}return best}
function startLink(n,e,mode){
  hideMenu();linkDrag={from:n.a.key,x:e.clientX??n.x,y:e.clientY??n.y,mode,target:null};document.body.classList.add('linking');n.hov=false;
  anim(n.el.querySelector('.bob'),[{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:500,easing:SPRING});
  if(mode==='drag'){
    const mv=ev=>{linkDrag&&updateLink(ev.clientX,ev.clientY)};
    const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      if(!linkDrag)return;const t=linkDrag.target&&nodes.get(linkDrag.target);if(t)finishLink(t);else cancelLink()};
    addEventListener('pointermove',mv,{passive:true});addEventListener('pointerup',up);addEventListener('pointercancel',up);
  }else toast('Bağlanacak uygulamaya tıkla · Esc iptal');

}
function updateLink(x,y){linkDrag.x=x;linkDrag.y=y;const t=nodeAt(x,y,linkDrag.from),tk=t?.a.key||null;
  if(tk!==linkDrag.target){if(linkDrag.target)nodes.get(linkDrag.target)?.el.classList.remove('target');if(t)t.el.classList.add('target');linkDrag.target=tk}wake()}
function finishLink(t){
  const from=linkDrag.from;cancelLink(true);if(t.a.key===from)return;
  if(hasLink(from,t.a.key)){toast('Zaten bağlı');return}
  links.push(pairKey(from,t.a.key));saveMeta();statusText();
  const a=nodes.get(from);ripple(t.x,t.y+TAIL,1.4);if(a)ripple(a.x,a.y+TAIL,1);
  [a,t].forEach(n=>n&&anim(n.el.querySelector('.bob'),[{transform:'scale(1)'},{transform:'scale(1.18)',offset:.4},{transform:'none'}],{duration:640,easing:EASE}));
  toast(`${a?.a.name||''} ↔ ${t.a.name} bağlandı`);
}
function cancelLink(silent){if(!linkDrag)return;if(linkDrag.target)nodes.get(linkDrag.target)?.el.classList.remove('target');linkDrag=null;document.body.classList.remove('linking');hlState='x';wake()}
function removeLink(i){const l=links[i];if(!l)return;const g=linkGeo[i];links.splice(i,1);hoverLink=-1;saveMeta();statusText();
  if(g){const[mx,my]=qAt(g,.5);ripple(mx,my,1.2)}toast('Bağlantı kaldırıldı');wake()}
function linkHit(x,y){let best=-1,bd=9;linkGeo.forEach((g,i)=>{if(!g)return;for(let s=1;s<20;s++){const[px,py]=qAt(g,s/20),d=Math.hypot(px-x,py-y);if(d<bd){bd=d;best=i}}});return best}

/* Auto-arrange as a force-directed graph, then re-anchor on the mesh */
function autoLayout(){
  const list=[...nodes.values()];if(list.length<2)return toast('Düzenlenecek kadar uygulama yok');
  const P=list.map(n=>({n,x:n.x,y:n.y+LIFT,vx:0,vy:0})),idx=new Map(P.map((p,i)=>[p.n.a.key,i]));
  const cxm=M.W/2,cym=M.H/2+50,sm=M.W<700;
  for(let it=0;it<500;it++){

    const N=s.querySelector('#sN');setTimeout(()=>N.focus(),60);s.querySelector('[data-x2]').onclick=()=>closeSheet();
    s.querySelector('#sI').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;icon=b.dataset.i;$$('#sI button',s).forEach(x=>x.classList.toggle('on',x===b))};
    s.querySelector('#sC').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;color=b.dataset.c;$$('#sC button',s).forEach(x=>x.classList.toggle('on',x===b))};
    s.querySelector('#sSeg').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;mode=b.dataset.s;s.querySelector('#sSeg').classList.toggle('r',mode==='code');
      $$('#sSeg button',s).forEach(x=>x.classList.toggle('on',x===b));s.querySelector('#sFile').hidden=mode!=='file';s.querySelector('#sCode').hidden=mode!=='code';
      if(mode==='code'&&html&&!s.querySelector('#sTx').value)s.querySelector('#sTx').value=html};
    const drop=s.querySelector('#sDrop'),fi=s.querySelector('#sF');
    const take=async f=>{if(!/\.html?$/i.test(f.name))return toast('Sadece .html');html=await f.text();if(!N.value.trim())N.value=nameFrom(f.name);
      drop.classList.add('ok');drop.querySelector('b').textContent='✓ '+f.name;drop.querySelector('span').textContent=(html.length/1024).toFixed(1)+' KB'};
    drop.onclick=()=>fi.click();fi.onchange=()=>fi.files[0]&&take(fi.files[0]);
    drop.ondragover=e=>{e.preventDefault();e.stopPropagation();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');
    drop.ondrop=e=>{e.preventDefault();e.stopPropagation();drop.classList.remove('over');const f=e.dataTransfer.files[0];f&&take(f)};
    const save=async()=>{const name=N.value.trim();if(!name){N.focus();return toast('Bir ad gir')}
      const src=mode==='code'?s.querySelector('#sTx').value.trim():html;if(!src)return toast('HTML boş');
      if(tooBig(src))return toast('Dosya çok büyük (900 KB üstü)');
      let d;if(edit){Object.assign(a,{name,icon,color,html:src});d=a}else{d=toDraft({id:uid(),name,icon,color,html:src,order:drafts.length});drafts.push(d)}
      closeSheet();syncNodes();
      S.put(rawDraft(d)).then(()=>toast(edit?'Kaydedildi':'Taslak eklendi'),e=>toast('Kaydedilemedi: '+(e.code||e.message)))};
    s.querySelector('#sSave').onclick=save;N.onkeydown=e=>{if(e.key==='Enter')save()};
   });
}
function shipSheet(a){
  const slug=slugify(a.name);
  const entry=JSON.stringify({slug,name:a.name,icon:a.icon||undefined,color:a.color}).replace(/,"/g,', "').replace(/^\{/,'{ ').replace(/\}$/,' }');
  sheet('Yayına hazırla',`<ol class="steps">
     <li><span>HTML'i indir ve repo'da <code>apps/${esc(slug)}/index.html</code> olarak koy.</span></li>
     <li><span><code>apps.json</code> içindeki <code>"apps"</code> listesine bu satırı ekle:<code class="codebox">${esc(entry)}</code></span></li>
     <li><span>Commit & push. GitHub Pages bir dakika içinde günceller.</span></li></ol>
    <div class="note">Benimle çalışıyorsan bu adımları atla: uygulamayı bana anlat ya da HTML'i gönder, ben eklerim.</div>`,
   `<span class="grow"></span><button class="btn line" id="cJ">JSON kopyala</button><button class="btn solid" id="dH">HTML indir</button>`,
   s=>{s.querySelector('#cJ').onclick=()=>copy(entry,'JSON kopyalandı');s.querySelector('#dH').onclick=()=>download(a.html,'index.html')});
}
async function removeDraft(a){drafts=drafts.filter(d=>d.key!==a.key);removeNode(a.key);Promise.resolve(S.saveLayout({...layout})).catch(()=>{});
  hintText();statusText();await S.del(a.id).catch(e=>toast('Silinemedi: '+(e.code||e.message)));toast('Silindi')}

/* ── Utilities ────────────────────────────────────────────── */
const nameFrom=f=>{const n=f.replace(/\.html?$/i,'').replace(/[-_]+/g,' ').trim();return n.charAt(0).toLocaleUpperCase('tr')+n.slice(1)};
function download(text,name){const u=URL.createObjectURL(new Blob([text],{type:'text/html'})),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function copy(t,msg){try{await navigator.clipboard.writeText(t)}catch{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}toast(msg)}
function toast(msg){const t=document.createElement('div');t.className='toast';t.innerHTML=`<i></i>${esc(msg)}`;$('#toasts').prepend(t);
  anim(t,[{opacity:0,transform:'translateY(10px) scale(.94)'},{opacity:1,transform:'none'}],{duration:420,easing:OUT});
  setTimeout(()=>anim(t,[{opacity:1},{opacity:0,transform:'translateY(4px) scale(.97)'}],{duration:220,easing:EASE,fill:'forwards'}).finished.then(()=>t.remove(),()=>t.remove()),2300)}

/* ── Page drop → drafts at drop point ─────────────────────── */
let dragDepth=0;
const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes('Files');
addEventListener('dragenter',e=>{if(!hasFiles(e)||sheetEl)return;dragDepth++;$('#pdrop').classList.add('on')});
addEventListener('dragleave',e=>{if(!hasFiles(e)||sheetEl)return;if(--dragDepth<=0){dragDepth=0;$('#pdrop').classList.remove('on')}});
addEventListener('dragover',e=>{if(hasFiles(e)){e.preventDefault();ptr.x=e.clientX;ptr.y=e.clientY;ptr.tAmp=1;wake()}});
addEventListener('drop',async e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth=0;$('#pdrop').classList.remove('on');if(sheetEl)return;
  const files=[...e.dataTransfer.files].filter(f=>/\.html?$/i.test(f.name));if(!files.length)return toast('Sadece .html dosyaları');
  const added=[];let big=0;
  for(const f of files){const html=await f.text();if(tooBig(html)){big++;continue}const d=toDraft({id:uid(),name:nameFrom(f.name),icon:'',html,order:drafts.length});
    d.color=colorKeys[hash(d.name)%colorKeys.length];drafts.push(d);added.push(d)}
  added.forEach((d,i)=>{spawnHint=[e.clientX+i*40,e.clientY+LIFT];createNode(d,i*120)});spawnHint=null;
  for(const d of added){const n=nodes.get(d.key);if(n)rememberLayout(n,false)}Promise.resolve(S.saveLayout({...layout})).catch(()=>{});
  hintText();statusText();wake();
  await Promise.all(added.map(d=>S.put(rawDraft(d)))).catch(e=>toast('Kaydedilemedi: '+(e.code||e.message)));
  if(added.length)toast(added.length>1?`${added.length} taslak eklendi`:'Taslak eklendi');if(big)toast(`${big} dosya 900 KB'tan büyük, eklenmedi`)});

/* ── Search & keys ────────────────────────────────────────── */
$('#q').addEventListener('input',e=>{query=e.target.value;applyFilter();wake()});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const n=[...nodes.values()].find(n=>!n.dim);if(n){const q=e.target;q.blur();openApp(n.a,n.el)}}
  if(e.key==='Escape'){e.target.value='';query='';applyFilter();e.target.blur()}});
$('#addBtn').onclick=()=>{spawnHint=null;openSheet()};
addEventListener('keydown',e=>{
  if(document.body.classList.contains('locked'))return;const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus();$('#q').select()}
  else if(mod&&e.key.toLowerCase()==='n'&&!e.shiftKey){e.preventDefault();openSheet()}
  else if(e.key==='Escape'){if(linkDrag)cancelLink();else if(menuEl)hideMenu();else if(sheetEl)closeSheet();else if(W.app&&!W.min)closeWin()}
});
const clk=()=>{$('#clock').textContent=new Date().toLocaleString('tr-TR',{weekday:'short',hour:'2-digit',minute:'2-digit'})};clk();setInterval(clk,15000);

/* ── Gate ─────────────────────────────────────────────────── */
function gate(state,msg){const g=$('#gate'),was=g.hidden;document.body.classList.add('locked');g.hidden=false;
  $('#gSpin').hidden=state!=='loading';$('#gBtn').hidden=state!=='signin'&&state!=='error';$('#gBtn').disabled=false;$('#gOut').hidden=state!=='denied';
  $('#gMsg').innerHTML=msg??(state==='loading'?'Bağlanıyor…':'Devam etmek için giriş yap.');
  if(was)anim(g.firstElementChild,[{opacity:0,transform:'translateY(12px) scale(.97)'},{opacity:1,transform:'none'}],{duration:620,easing:OUT})}
async function ungate(){const g=$('#gate');if(g.hidden){document.body.classList.remove('locked');return}
  await anim(g.firstElementChild,[{opacity:1},{opacity:0,transform:'scale(.97)'}],{duration:240,easing:EASE,fill:'forwards'}).finished.catch(()=>{});
  g.hidden=true;g.firstElementChild.getAnimations().forEach(a=>a.cancel());document.body.classList.remove('locked')}
const authMsg=e=>({'auth/unauthorized-domain':'Bu adres Firebase\'de izinli değil. <b>Authentication → Settings → Authorized domains</b> listesine ekle.',
  'auth/network-request-failed':'Bağlantı hatası. İnternetini kontrol et.','auth/too-many-requests':'Çok fazla deneme. Biraz sonra tekrar dene.'}[e.code]||('Giriş başarısız: '+(e.code||e.message)));
$('#gBtn').onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});$('#gBtn').disabled=true;
  try{await firebase.auth().signInWithPopup(p)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code))return firebase.auth().signInWithRedirect(p);
    if(e.code==='auth/popup-closed-by-user'){$('#gBtn').disabled=false;return}gate('error',authMsg(e))}};
$('#gOut').onclick=()=>firebase.auth().signOut();
$('#me').onclick=e=>{e.stopPropagation();const u=firebase.auth().currentUser;if(!u)return;const b=$('#me').getBoundingClientRect();
  popMenu(b.right-200,b.bottom+8,`<div class="who"><b>${esc(u.displayName||'Hesap')}</b>${esc(u.email)}</div><div class="msep"></div><button class="mi" data-m="out"><svg viewBox="0 0 16 16">${I.out}</svg>Çıkış yap</button>`,
    ev=>{if(ev.target.closest('[data-m=out]')){hideMenu();firebase.auth().signOut()}})};
async function migrateLocal(){
  if(store.get('appshell:migrated',false))return;
  const local=await Local.load(),have=new Set(drafts.map(d=>d.id)),todo=local.filter(d=>!have.has(d.id)&&!tooBig(d.html));
  if(todo.length){todo.forEach(d=>drafts.push(d));syncNodes();try{await Promise.all(todo.map(d=>Cloud.put(rawDraft(d))));toast(`${todo.length} yerel taslak buluta taşındı`)}catch(e){toast('Taşıma başarısız: '+(e.code||e.message));return}}
  store.set('appshell:migrated',true);
}
function clearNodes(){for(const k of[...nodes.keys()]){const n=nodes.get(k);n.el.remove();nodes.delete(k)}}

/* ── Boot ─────────────────────────────────────────────────── */
buildMesh();introStart=performance.now();wake();
(async()=>{
  const mp=loadManifest();
  if(!CLOUD){S=Local;drafts=await Local.load();await mp;syncNodes();booted=true;return}
  gate('loading');
  try{await loadFirebase()}catch{return gate('error','Firebase yüklenemedi. İnternet bağlantını kontrol et.')}
  if(!firebase.apps.length)firebase.initializeApp(FB);
  const fs=firebase.firestore();try{await fs.enablePersistence({synchronizeTabs:true})}catch{}
  firebase.auth().getRedirectResult().catch(e=>gate('error',authMsg(e)));
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){Cloud.stop();S=Local;drafts=[];if(W.app)hideWin(false);closeSheet(true);hideMenu();clearNodes();booted=false;$('#me').hidden=true;return gate('signin')}
    if((u.email||'').toLowerCase()!==OWNER){Cloud.stop();return gate('denied',`<b>${esc(u.email)}</b> bu alana erişemez.`)}
    gate('loading','Yükleniyor…');await mp;S=Cloud;await Cloud.start(fs);
    const me=$('#me');me.hidden=false;me.innerHTML=u.photoURL?`<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">`:esc(mono(u.displayName||u.email));
    await ungate();introStart=performance.now();introT=0;
    syncNodes();booted=true;migrateLocal();
  });
})();
</script>
</body>
