<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AppShell">
<title>AppShell</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>/* theme before first paint — no flash */try{const t=JSON.parse(localStorage.getItem('appshell:theme'));document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{document.documentElement.dataset.theme='light'}</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface2:#FAFAFA;--ink:#18181B;--ink2:#52525B;--ink3:#A1A1AA;--ink4:#D4D4D8;
  --line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.09);--line3:rgba(0,0,0,.14);--hover:rgba(0,0,0,.05);
  --glass:rgba(255,255,255,.74);--menu:rgba(255,255,255,.84);--scrim:rgba(255,255,255,.45);--labelbg:rgba(255,255,255,.9);
  --font:'Geist',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.3,1.45,.5,1);
  --shadow:0 0 0 .5px rgba(0,0,0,.1),0 12px 32px -8px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.04);
  --se:none;color-scheme:light;
}
[data-theme=dark]{
  --bg:#0D0D0F;--surface:#18181B;--surface2:#1F1F23;--ink:#EDEDEF;--ink2:#A1A1AA;--ink3:#6B6B74;--ink4:#3F3F46;
  --line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.1);--line3:rgba(255,255,255,.16);--hover:rgba(255,255,255,.07);
  --glass:rgba(26,26,29,.74);--menu:rgba(30,30,34,.88);--scrim:rgba(8,8,10,.55);--labelbg:rgba(13,13,15,.86);
  --shadow:0 0 0 .5px rgba(255,255,255,.1),0 16px 40px -10px rgba(0,0,0,.6);color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.45;touch-action:none;transition:background .5s var(--ease),color .5s var(--ease)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
::selection{background:rgba(127,127,127,.22)}
[hidden]{display:none!important}

/* ── Layers ───────────────────────────────────── */
canvas{position:fixed;inset:0;pointer-events:none}
#field{z-index:0}#fx{z-index:1}
#stage{position:fixed;inset:0;z-index:2}
#nodes{position:fixed;inset:0;z-index:3;pointer-events:none}

/* ── Floating chrome ──────────────────────────── */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(16px + env(safe-area-inset-top)) 22px 16px;pointer-events:none}
.top>*{pointer-events:auto}
.mark{display:flex;align-items:center;gap:10px;margin-right:auto;user-select:none}
.mark-glyph{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px}
.mark-glyph i{border-radius:2px;background:var(--ink)}
.mark-glyph i:nth-child(2),.mark-glyph i:nth-child(3){opacity:.45}
.mark-glyph i:nth-child(4){opacity:.18}
.mark-name{font-weight:600;letter-spacing:-.02em;font-size:13.5px}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 12px;width:230px;border-radius:11px;color:var(--ink3);font-size:13px;background:var(--glass);box-shadow:0 0 0 .5px var(--line2),0 6px 20px -12px rgba(0,0,0,.14);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);transition:box-shadow .3s,transform .45s var(--spring)}
.search:hover{box-shadow:0 0 0 .5px var(--line3),0 8px 24px -12px rgba(0,0,0,.18);color:var(--ink2)}
.search:active{transform:scale(.98)}
.search span:first-of-type{flex:1;text-align:left}
.kbd{font:500 10px/1 var(--mono);color:var(--ink3);padding:3px 5px;border-radius:4px;box-shadow:inset 0 0 0 .5px var(--line3)}
.ib{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--ink2);background:var(--glass);box-shadow:0 0 0 .5px var(--line2),0 6px 20px -12px rgba(0,0,0,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:transform .45s var(--spring),box-shadow .2s,color .2s}
.ib:hover{color:var(--ink);box-shadow:0 0 0 .5px var(--line3),0 8px 24px -12px rgba(0,0,0,.2)}
.ib:active{transform:scale(.9);transition-duration:.08s}
.ib svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.ib.solid{background:var(--ink);color:var(--bg);box-shadow:0 8px 20px -8px rgba(0,0,0,.35)}
.ib.solid svg{transition:transform .5s var(--spring)}.ib.solid:hover svg{transform:rotate(90deg)}
.me{overflow:hidden;font-size:12px;font-weight:600}.me img{width:100%;height:100%;object-fit:cover}
.status{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 22px calc(16px + env(safe-area-inset-bottom));font:500 10.5px/1 var(--mono);color:var(--ink3);letter-spacing:.04em;pointer-events:none;user-select:none}
.status .dot{width:5px;height:5px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.14)}
.status .dot.warn{background:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.14)}
.status .dot.err{background:#EF4444;box-shadow:0 0 0 3px rgba(239,68,68,.14)}
.status .sp{margin-left:auto}
.status .help{pointer-events:auto;cursor:pointer;color:var(--ink3)}.status .help:hover{color:var(--ink)}
.hint{position:fixed;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);text-align:center;color:var(--ink3);font-size:13px;line-height:1.6;pointer-events:none;user-select:none}
.hint b{display:block;font-weight:500;color:var(--ink2);font-size:14px;margin-bottom:4px}
.hint code{font:11.5px var(--mono);color:var(--ink2)}

/* ── App node ─────────────────────────────────── */
.node{position:absolute;left:0;top:0;width:64px;height:64px;pointer-events:auto;outline:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;will-change:transform;contain:layout style;transition:opacity .45s var(--ease)}
.node:focus-visible .tile{outline:2px solid var(--ink);outline-offset:3px}
.node.dragging{z-index:10;cursor:grabbing}
.node.dim{opacity:.1;pointer-events:none}
.node.faded{opacity:.28}
.bob{position:absolute;inset:0;transition:transform .55s var(--spring)}
.node:hover .bob{transform:scale(1.08)}
.node.dragging .bob{transform:scale(1.14)}
.node:active:not(.dragging) .bob{transform:scale(.94);transition-duration:.12s}
.node.target .bob{transform:scale(1.16)}
.shadow{position:absolute;left:10px;right:10px;bottom:-8px;height:14px;border-radius:50%;background:rgba(0,0,0,.24);filter:blur(10px);opacity:.25;transition:opacity .45s var(--ease),transform .55s var(--spring);z-index:-1}
[data-theme=dark] .shadow{background:rgba(0,0,0,.8);opacity:.5}
.node:hover .shadow{opacity:.38;transform:translateY(6px) scale(1.06)}
.node.dragging .shadow{opacity:.45;transform:translateY(18px) scale(1.2)}
.tile{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg-t,#F4F4F5);color:var(--fg-t,#3F3F46);clip-path:var(--se);border-radius:16px;transform:perspective(420px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s var(--out)}
.node.tilting .tile{transition:transform .12s linear}
.tile::before{content:'';position:absolute;inset:0;background:radial-gradient(90px circle at var(--hx,50%) var(--hy,0%),rgba(255,255,255,.6),transparent 60%);opacity:0;transition:opacity .35s var(--ease);pointer-events:none}
.node:hover .tile::before{opacity:1}
.tile::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 48%);pointer-events:none}
.tile.dark::before{background:radial-gradient(90px circle at var(--hx,50%) var(--hy,0%),rgba(255,255,255,.18),transparent 60%)}
.tile.dark::after{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0) 48%)}
[data-theme=dark] .tile.dark{--bg-t:#27272B!important}
.node.target .tile{box-shadow:inset 0 0 0 1.5px var(--ink)}
.glyph{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
.mono{position:relative;z-index:1;font-size:20px;font-weight:300;letter-spacing:-.04em}
.rim{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:rgba(0,0,0,.1);stroke-width:1;pointer-events:none;z-index:2}
.tile.dark .rim,[data-theme=dark] .rim{stroke:rgba(255,255,255,.12)}
.node.draft .rim{stroke:rgba(127,127,127,.5);stroke-dasharray:3 3}
.port{position:absolute;right:-9px;top:23px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 .5px var(--line3),0 2px 6px -2px rgba(0,0,0,.25);display:grid;place-items:center;opacity:0;transform:scale(.3);transition:opacity .25s var(--ease),transform .45s var(--spring);cursor:crosshair;z-index:3}
.port::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--ink);transition:transform .35s var(--spring)}
.node:hover .port{opacity:1;transform:none}.port:hover::after{transform:scale(1.5)}
body.linking .port,.node.dragging .port{opacity:0!important;pointer-events:none}
body.linking,body.linking .node,body.linking #stage{cursor:crosshair}
#stage.onlink{cursor:pointer}
.nlabel{position:absolute;left:50%;top:74px;transform:translateX(-50%);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;font-weight:450;letter-spacing:-.005em;color:var(--ink2);padding:2px 7px;border-radius:6px;background:var(--labelbg);transition:color .2s}
.node:hover .nlabel{color:var(--ink)}
.nlabel i{font-style:normal;font:500 9px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-left:5px}

/* ── Fullscreen app ───────────────────────────── */
.scrim{position:fixed;inset:0;z-index:40;background:var(--bg)}
.win{position:fixed;inset:0;z-index:50;background:var(--surface);overflow:hidden;transform-origin:0 0;contain:strict}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--surface);display:block}
.prog{position:absolute;left:0;right:0;top:0;height:2px;z-index:2;background:var(--ink);transform-origin:left;transform:scaleX(0);opacity:0}
.hot{position:fixed;left:25%;right:25%;top:0;height:10px;z-index:56}
.pill{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;z-index:57;display:flex;align-items:center;gap:2px;height:38px;padding:0 4px 0 9px;border-radius:13px;background:var(--menu);box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);transform:translateX(-50%);transition:transform .55s var(--out),opacity .3s var(--ease)}
.pill.hide{transform:translateX(-50%) translateY(calc(-100% - 20px));opacity:0;pointer-events:none}
.pill .pname{font-size:12.5px;font-weight:550;color:var(--ink);max-width:28vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 4px 0 7px}
.pill .src{font:500 9.5px/1 var(--mono);color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-right:2px}
.pill .psep{width:.5px;height:18px;background:var(--line3);margin:0 4px}
.pill button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);transition:background .15s,color .15s,transform .3s var(--spring)}
.pill button:hover{background:var(--hover);color:var(--ink)}.pill button:active{transform:scale(.88)}
.pill svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.grab{position:fixed;top:calc(4px + env(safe-area-inset-top));left:50%;z-index:56;width:44px;height:16px;transform:translateX(-50%);display:grid;place-items:center}
.grab::after{content:'';width:36px;height:4px;border-radius:2px;background:var(--ink3);opacity:.5}
.mini{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex-shrink:0}
.mini svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dock{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 8px;border-radius:13px;background:var(--menu);box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5)}
.dock .t{font-size:12px;font-weight:500;padding-right:4px}
.dock button{height:26px;padding:0 9px;border-radius:8px;font-size:11.5px;color:var(--ink2)}
.dock button:hover{background:var(--hover);color:var(--ink)}

/* ── Menu / palette ───────────────────────────── */
.menu{position:fixed;z-index:200;min-width:196px;padding:5px;border-radius:12px;background:var(--menu);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);box-shadow:var(--shadow);transform-origin:var(--ox,0) var(--oy,0)}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:30px;padding:0 10px;border-radius:7px;font-size:12.5px;text-align:left;color:var(--ink);transition:background .08s}
.mi:hover,.mi.act{background:var(--hover)}
.mi svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;color:var(--ink3);flex-shrink:0}
.mi .k{margin-left:auto;font:10px var(--mono);color:var(--ink3)}
.mi.danger,.mi.danger svg{color:#DC2626}
.mi.confirm{background:#DC2626;color:#fff}.mi.confirm svg{color:#fff}
.msep{height:.5px;background:var(--line2);margin:4px 6px}
.who{padding:8px 10px 7px;font-size:11.5px;color:var(--ink3);line-height:1.4}
.who b{display:block;font-weight:500;color:var(--ink);font-size:12.5px}
.pal-bg{position:fixed;inset:0;z-index:300;display:flex;justify-content:center;align-items:flex-start;padding:14vh 16px 16px;background:rgba(0,0,0,.06)}
[data-theme=dark] .pal-bg{background:rgba(0,0,0,.4)}
.pal{width:min(600px,100%);max-height:62vh;display:flex;flex-direction:column;border-radius:16px;background:var(--surface);box-shadow:var(--shadow),0 40px 100px -30px rgba(0,0,0,.3);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;border-bottom:.5px solid var(--line2)}
.pal-in svg{width:16px;height:16px;color:var(--ink3);fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;flex-shrink:0}
.pal-in input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink)}
.pal-in input::placeholder{color:var(--ink3)}
.pal-l{overflow-y:auto;padding:6px;scrollbar-width:thin}
.pal-h{padding:8px 10px 5px;font:500 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.pal-l .mi{min-height:40px}
.pal-l .mi .mini{width:24px;height:24px;border-radius:7px}
.pal-l .mi .mini svg{width:13px;height:13px}
.pal-l .mi .ic{width:24px;height:24px;display:grid;place-items:center}
.pal-f{display:flex;gap:16px;padding:9px 16px;border-top:.5px solid var(--line2);font-size:11.5px;color:var(--ink3)}
.pal-e{padding:30px;text-align:center;color:var(--ink3)}

/* ── Sheet ────────────────────────────────────── */
.sheet-scrim{position:fixed;inset:0;z-index:100;background:var(--scrim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;padding:20px}
.sheet{width:min(520px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow),0 30px 80px -20px rgba(0,0,0,.22)}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 14px 22px;border-bottom:.5px solid var(--line2)}
.sh-t{font-size:14px;font-weight:600;letter-spacing:-.015em}
.sh-b{padding:18px 22px 20px;overflow-y:auto;scrollbar-width:none}
.sh-b::-webkit-scrollbar{display:none}
.sh-f{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:.5px solid var(--line2)}
.sh-f .grow{flex:1;font-size:11.5px;color:var(--ink3)}
.x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}
.x:hover{background:var(--hover);color:var(--ink)}
.x svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.f{margin-bottom:18px}.f:last-child{margin-bottom:0}
.fl{display:block;font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:8px}
.in{width:100%;height:36px;padding:0 12px;border-radius:9px;border:.5px solid var(--line3);background:var(--surface);font:inherit;font-size:13.5px;color:var(--ink);outline:0;transition:border-color .2s,box-shadow .3s}
.in:focus{border-color:var(--ink3);box-shadow:0 0 0 4px var(--line)}
textarea.in{height:200px;padding:10px 12px;resize:vertical;font:11.5px/1.6 var(--mono);color:var(--ink2)}
.pick{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.pick button{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;color:var(--ink2);border:.5px solid transparent;transition:background .15s,border-color .15s,transform .3s var(--spring)}
.pick button:hover{background:var(--hover)}
.pick button.on{border-color:var(--ink);background:var(--surface2)}
.pick button:active{transform:scale(.9)}
.pick svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.pick .mono-o{font-size:12px;font-weight:500}
.sw{display:flex;gap:8px}
.sw button{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(127,127,127,.4);transition:transform .35s var(--spring),box-shadow .2s}
.sw button:hover{transform:scale(1.12)}
.sw button.on{box-shadow:inset 0 0 0 .5px rgba(127,127,127,.4),0 0 0 2px var(--surface),0 0 0 2.5px var(--ink)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:9px;background:var(--hover);margin-bottom:12px}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:7px;background:var(--surface);box-shadow:0 0 0 .5px var(--line2),0 1px 2px rgba(0,0,0,.05);transition:transform .45s var(--out)}
.seg.r i{transform:translateX(100%)}
.seg button{position:relative;height:28px;font-size:12.5px;font-weight:500;color:var(--ink3);transition:color .2s}
.seg button.on{color:var(--ink)}
.drop{display:grid;place-items:center;gap:6px;padding:30px 20px;border-radius:12px;border:.5px dashed var(--line3);text-align:center;cursor:pointer;transition:background .2s,border-color .2s}
.drop:hover,.drop.over{background:var(--hover);border-color:var(--ink3)}
.drop svg{width:22px;height:22px;fill:none;stroke:var(--ink3);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.drop b{font-weight:500;font-size:12.5px;color:var(--ink2)}
.drop span{font-size:11.5px;color:var(--ink3)}
.drop.ok b{color:#16A34A}
.btn{height:32px;padding:0 14px;border-radius:9px;font-size:12.5px;font-weight:500;transition:background .15s,transform .3s var(--spring)}
.btn:active{transform:scale(.96)}
.btn.ghost{color:var(--ink2)}.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.line{border:.5px solid var(--line3)}.btn.line:hover{background:var(--hover)}

/* ════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════ */
const cv=$('#field'),cx=cv.getContext('2d'),fv=$('#fx'),fx=fv.getContext('2d');

function buildMesh(){

const nx=i=>M.rx[i]+M.dx[i],ny=i=>M.ry[i]+M.dy[i];
function nearest(x,y){const c=clamp(Math.round((x-M.ox)/M.gap),0,M.cols-1),r=clamp(Math.round((y-M.oy)/M.gap),0,M.rows-1);return r*M.cols+c}

function ripple(x,y,s=1){if(REDUCED)return;ripples.push({x,y,t:performance.now(),s});if(ripples.length>6)ripples.shift();wakeMesh()}

function stepMesh(k,now){
  const{n,rx,ry,dx,dy,vx,vy,en}=M,K=.055,damp=Math.pow(.8,k);
  const att=[];
  if(ptr.amp>.002)att.push([ptr.sx,ptr.sy,175,.03*ptr.amp]);
  let drag=null;for(const nd of nodes.values())if(nd.drag){att.push([nd.x,nd.y,150,.035]);drag=nd}
  if(linkDrag)att.push([linkDrag.x,linkDrag.y,120,.02]);
  const rps=[];ripples=ripples.filter(r=>{const age=now-r.t;if(age>1500)return false;rps.push([r.x,r.y,age*.55,(1-age/1500)*r.s]);return true});
  const tI=drag?drag.ai:-1,tX=drag?(drag.x-nx(tI))*.004:0,tY=drag?(drag.y+TAIL-ny(tI))*.004:0;
  let maxV=0;
  for(let i=0;i<n;i++){
    const px=rx[i]+dx[i],py=ry[i]+dy[i];let ax=-K*dx[i],ay=-K*dy[i];

    for(let a=0;a<att.length;a++){const A=att[a],ddx=A[0]-px,ddy=A[1]-py;if(ddx>A[2]||ddx<-A[2]||ddy>A[2]||ddy<-A[2])continue;
      const d2=ddx*ddx+ddy*ddy;if(d2>A[2]*A[2])continue;const f=1-Math.sqrt(d2)/A[2],s=f*f*A[3];ax+=ddx*s;ay+=ddy*s}

function drawMesh(now){

    cx.fillStyle=`rgba(${Math.round(D[0]+(Hh[0]-D[0])*e)},${Math.round(D[1]+(Hh[1]-D[1])*e)},${Math.round(D[2]+(Hh[2]-D[2])*e)},${v})`;cx.beginPath();cx.arc(x,y,r0+e*.9,0,6.2832);cx.fill()}
  cx.fillStyle=`rgb(${D})`;cx.fill(base);meshDirty=false;

/* ════════════════════════════════════════════════════════════
   NODES — ağa bağlı, yüzen uygulamalar
   ════════════════════════════════════════════════════════════ */
const nodes=new Map();

    for(let r=r0-ring;r<=r0+ring;r++)for(let c=c0-ring;c<=c0+ring;c++){if(r<0||c<0||r>=M.rows||c>=M.cols)continue;if(Math.max(Math.abs(r-r0),Math.abs(c-c0))!==ring)continue;

  const c=[M.W/2,M.H/2+50];

function rememberLayout(n,save=true){layout[n.a.key]=[+(M.rx[n.ai]/M.W).toFixed(4),+(M.ry[n.ai]/M.H).toFixed(4)];if(save)saveMeta()}
let spawnHint=null;
function createNode(a,delay=0){

  anim(el.querySelector('.nlabel'),[{opacity:0,transform:'translateX(-50%) translateY(-6px)'},{opacity:1,transform:'translateX(-50%)'}],{duration:600,delay:delay+250,easing:OUT,fill:'backwards'});

function updateNode(n,a){const changed=n.a.name!==a.name||n.a.icon!==a.icon||n.a.color!==a.color;n.a=a;if(changed){n.el.innerHTML=nodeHTML(a);n.el.setAttribute('aria-label',a.name);wirePort(n);

function removeNode(key,quiet){const n=nodes.get(key);if(!n)return;nodes.delete(key);if(hoverNode===n)hoverNode=null;

function wirePort(n){n.el.querySelector('.port').addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();e.stopPropagation();startLink(n,e,'drag')})}

    const mv=ev=>{if(!started){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>5){clearTimeout(timer);begin(ev)}else return}

      const i=nearestFree(n.x,n.y+LIFT,n);n.ai=i;rememberLayout(n);ripple(nx(i),ny(i),1.6);

}

/* ════════════════════════════════════════════════════════════
   LINKS — Obsidian tarzı bağlantılar
   ════════════════════════════════════════════════════════════ */
const linkGeo=[];
function curve(a,b,i){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,bend=Math.min(60,d*.16)*((i%2)?1:-1)*.6;
  return[a.x,a.y,mx-dy/d*bend,my+dx/d*bend+Math.min(24,d*.05),b.x,b.y]}

function drawLinks(time){
  linkGeo.length=0;const hk=hoverNode?.a.key,L=TH.l;
  links.forEach(([ka,kb],i)=>{const a=nodes.get(ka),b=nodes.get(kb);if(!a||!b){linkGeo.push(null);return}
    const g=curve(a,b,i);linkGeo.push(g);

    fx.beginPath();fx.moveTo(g[0],g[1]);fx.quadraticCurveTo(g[2],g[3],g[4],g[5]);
    fx.lineWidth=over?2:hot?1.4:1;fx.strokeStyle=over?'rgba(220,38,38,.7)':`rgba(${L},${dim?.07:hot?.62:.3})`;fx.stroke();
    if(!dim&&!REDUCED){const cnt=hot?3:1;for(let p=0;p<cnt;p++){const t=((time*(hot?.32:.18)+p/cnt+i*.37)%1),[px,py]=qAt(g,t),fade=Math.sin(t*Math.PI);
      fx.beginPath();fx.arc(px,py,hot?1.9:1.5,0,6.2832);fx.fillStyle=`rgba(${L},${(hot?.75:.45)*fade})`;fx.fill()}}
  });
}
function drawTethers(time){
  const L=TH.l;

    if(n.drag){n.tx=n.gx;n.ty=n.gy;continue}

    let tx=ax0+(Math.sin(time*.52+n.ph[0])*8+Math.sin(time*1.21+n.ph[1])*2.8)*calm*sw;

    const ddx=b.tx-a.tx,ddy=b.ty-a.ty,d=Math.hypot(ddx,ddy)||1,ux=ddx/d,uy=ddy/d;
    const pa=b.drag?Math.min(90,Math.max(0,d-150)*.22):Math.min(26,Math.max(0,d-130)*.06);
    const pb=a.drag?Math.min(90,Math.max(0,d-150)*.22):Math.min(26,Math.max(0,d-130)*.06);
    if(!a.drag){a.tx+=ux*pa;a.ty+=uy*pa}if(!b.drag){b.tx-=ux*pb;b.ty-=uy*pb}}

  $('#gMsg').innerHTML=msg??(state==='loading'?'Bağlanıyor…':'Devam etmek için giriş yap.');
  if(was)anim(g.firstElementChild,[{opacity:0,transform:'translateY(12px) scale(.97)'},{opacity:1,transform:'none'}],{duration:620,easing:OUT})}
async function ungate(){const g=$('#gate');if(g.hidden){document.body.classList.remove('locked');return}
  await anim(g.firstElementChild,[{opacity:1},{opacity:0,transform:'scale(.97)'}],{duration:240,easing:EASE,fill:'forwards'}).finished.catch(()=>{});
  g.hidden=true;g.firstElementChild.getAnimations().forEach(a=>a.cancel());document.body.classList.remove('locked')}
const authMsg=e=>({'auth/unauthorized-domain':'Bu adres Firebase\'de izinli değil. <b>Authentication → Settings → Authorized domains</b> listesine ekle.',
  'auth/network-request-failed':'Bağlantı hatası. İnternetini kontrol et.','auth/too-many-requests':'Çok fazla deneme. Biraz sonra tekrar dene.'}[e.code]||('Giriş başarısız: '+(e.code||e.message)));
$('#gBtn').onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});$('#gBtn').disabled=true;
  try{await firebase.auth().signInWithPopup(p)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code))return firebase.auth().signInWithRedirect(p);
    if(e.code==='auth/popup-closed-by-user'){$('#gBtn').disabled=false;return}gate('error',authMsg(e))}};
$('#gOut').onclick=()=>firebase.auth().signOut();
$('#me').onclick=e=>{e.stopPropagation();const u=firebase.auth().currentUser;if(!u)return;const b=$('#me').getBoundingClientRect();
  popMenu(b.right-200,b.bottom+8,`<div class="who"><b>${esc(u.displayName||'Hesap')}</b>${esc(u.email)}</div><div class="msep"></div><button class="mi" data-m="out">${si(UI.out)}Çıkış yap</button>`,
    ev=>{if(ev.target.closest('[data-m=out]')){hideMenu();firebase.auth().signOut()}})};
async function migrateLocal(){
  if(store.get('appshell:migrated',false))return;
  const local=await Local.load(),have=new Set(drafts.map(d=>d.id)),todo=local.filter(d=>!have.has(d.id)&&!tooBig(d.html));
  if(todo.length){todo.forEach(d=>drafts.push(d));syncNodes();try{await Promise.all(todo.map(d=>Cloud.put(rawDraft(d))));toast(`${todo.length} yerel taslak buluta taşındı`)}catch(e){toast('Taşıma başarısız: '+(e.code||e.message));return}}
  store.set('appshell:migrated',true);
}
function clearNodes(){for(const k of[...nodes.keys()]){nodes.get(k).el.remove();nodes.delete(k)}hoverNode=null}

/* ── Boot ─────────────────────────────────────────────────── */
applyTheme(document.documentElement.dataset.theme==='dark'?'dark':'light');
buildMesh();introStart=performance.now();wake();
(async()=>{
  const mp=loadManifest();
  if(!CLOUD){S=Local;drafts=await Local.load();await mp;syncNodes();booted=true;return}
  gate('loading');
  try{await loadFirebase()}catch{return gate('error','Firebase yüklenemedi. İnternet bağlantını kontrol et.')}
  if(!firebase.apps.length)firebase.initializeApp(FB);
  const fs=firebase.firestore();try{await fs.enablePersistence({synchronizeTabs:true})}catch{}
  firebase.auth().getRedirectResult().catch(e=>gate('error',authMsg(e)));
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){Cloud.stop();S=Local;drafts=[];if(W.app)hideWin(false);closeSheet(true);closePal();hideMenu();clearNodes();booted=false;$('#me').hidden=true;return gate('signin')}
    if((u.email||'').toLowerCase()!==OWNER){Cloud.stop();return gate('denied',`<b>${esc(u.email)}</b> bu alana erişemez.`)}
    gate('loading','Yükleniyor…');await mp;S=Cloud;await Cloud.start(fs);
    const me=$('#me');me.hidden=false;me.innerHTML=u.photoURL?`<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">`:esc(mono(u.displayName||u.email));
    await ungate();introStart=performance.now();introT=0;wakeMesh();
    syncNodes();booted=true;migrateLocal();
  });
})();
</script>
